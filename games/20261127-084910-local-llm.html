<script type="application/json" id="meta">{"id": "20261127-084910-local-llm", "title": "森のしっぽスター", "summary": "パステルカラーの絵本風世界で、動物たちを撃ち抜いて森を守る正統派シューティング。自機は自動移動だが、攻撃はプレイヤーの手で行う。", "rules": ["自機は画面左側に位置し、ドラッグ（または矢印キー）で上下に動きます。", "画面をタップ（またはクリック、スペースキー）すると、自機が前方にショットを発射します。", "敵動物を撃墜すると「ハート」型のアイテムが落ちてきます。", "「ハート」を自機で受け取ると、ボスの弱点（しっぽ）が1つ破壊されます。", "1分以内にボスの「しっぽ」をすべて破壊して撃破しましょう。"], "controls": {"スマホ": "画面をドラッグして上下移動。画面をタップすると前方にショットを発射。", "PC": "矢印キーで上下移動、スペースキーまたはクリックで前方にショットを発射。"}, "cfg": {"mode": "2d", "w": 640, "h": 360, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>

              r: 5
            });
          }
          api.sound.tone(420, 0.08, 'square', 0.08, 240);
        }

        B.t2 -= dt;
        if (B.t2 <= 0) {
          B.t2 = 4.2;
          const n = 12;
          const off = api.util.rand(0, 6.28);
          for (let i = 0; i < n; i++) {
            if (this.ebullets.length > 110) break;
            const a = off + (i / n) * Math.PI * 2;
            this.ebullets.push({
              x: B.x - 10,
              y: B.y,
              vx: Math.cos(a) * 115,
              vy: Math.sin(a) * 115,
              r: 5
            });
          }
          api.sound.tone(320, 0.12, 'sine', 0.1, 180);
        }
      } else if (B.state === 'dying') {
        B.death += dt;
        B.y += Math.sin(B.t * 14) * 14 * dt;
        B.expT -= dt;
        if (B.expT <= 0) {
          B.expT = 0.18;
          this.burst(
            B.x + api.util.rand(-40, 40),
            B.y + api.util.rand(-45, 45),
            api.util.choice(['#f7b6c9', '#f9e8c8', '#c9b6f0', '#ffffff']),
            10,
            140,
            0.5,
            4
          );
          api.sound.tone(200 + api.util.rand(0, 200), 0.1, 'sine', 0.15, 80);
          this.shake = Math.max(this.shake, 3);
        }
        if (B.death > 1.5) {
          this.burst(B.x, B.y, '#ffffff', 30, 220, 0.9, 5);
          this.burst(B.x, B.y, '#f7b6c9', 20, 180, 0.9, 4);
          this.clearGame();
          return;
        }
      }

      for (let i = 0; i < this.tails.length; i++) {
        const tl = this.tails[i];
        if (!tl || tl.dead) continue;
        tl.a0 += tl.sp * dt;
        tl.x = B.x + Math.cos(tl.a0) * tl.r;
        tl.y = B.y + Math.sin(tl.a0) * tl.r * 0.85;
        if (tl.flash > 0) tl.flash -= dt;
      }
    }

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!e) continue;

      e.t += dt;
      e.x += e.vx * dt;
      e.y = e.baseY + Math.sin(e.t * e.freq + e.ph0) * e.amp;
      e.y = api.util.clamp(e.y, 56, this.H - 44);
      if (e.flash > 0) e.flash -= dt;
      e.cd -= dt;

      if (e.cd <= 0 && e.x < this.W - 30 && e.x > P.x + 40) {
        e.cd = this.phase() === 1 ? api.util.rand(1.6, 2.4) : api.util.rand(1.1, 1.7);
        const spd = this.phase() === 1 ? 100 : 175;
        if (this.phase() === 1 || api.util.rand(0, 1) < 0.5) {
          this.eShoot(e, true, 1, spd);
        } else {
          this.eShoot(e, true, 3, spd);
        }
      }

      if (api.util.dist(P.x, P.y, e.x, e.y) < P.r + e.r) {
        this.killEnemy(e, i, true);
        this.hitPlayer();
        if (this.over) return;
        continue;
      }

      if (e.x < -40) this.enemies.splice(i, 1);
    }

    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      if (!b) continue;

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      let hit = false;

      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (!e) continue;
        if (api.util.dist(b.x, b.y, e.x, e.y) < b.r + e.r) {
          e.hp--;
          e.flash = 0.1;
          hit = true;
          this.spark(b.x, b.y, '#ffffff', 4);
          if (e.hp <= 0) this.killEnemy(e, j, true);
          break;
        }
      }

      if (!hit && B.state !== 'none') {
        for (let k = 0; k < this.tails.length; k++) {
          const tl = this.tails[k];
          if (!tl || tl.dead) continue;
          if (api.util.dist(b.x, b.y, tl.x, tl.y) < b.r + 12) {
            tl.hp--;
            tl.flash = 0.12;
            hit = true;
            this.spark(b.x, b.y, '#f29cb4', 5);
            if (tl.hp <= 0) this.destroyTail(k);
            break;
          }
        }

        if (!hit && api.util.dist(b.x, b.y, B.x, B.y) < b.r + 40) {
          hit = true;
          this.spark(b.x, b.y, '#f9e8c8', 4);
          if (B.state === 'fight') api.sound.tone(1200, 0.04, 'square', 0.05, 1200);
        }
      }

      if (hit || b.x > this.W + 20) this.bullets.splice(i, 1);
    }

    for (let i = this.ebullets.length - 1; i >= 0; i--) {
      const b = this.ebullets[i];
      if (!b) continue;

      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (!Number.isFinite(b.x) || !Number.isFinite(b.y)) {
        this.ebullets.splice(i, 1);
        continue;
      }

      if (api.util.dist(P.x, P.y, b.x, b.y) < P.r + b.r) {
        this.ebullets.splice(i, 1);
        this.hitPlayer();
        if (this.over) return;
        continue;
      }

      if (b.x < -20 || b.x > this.W + 20 || b.y < -20 || b.y > this.H + 20) {
        this.ebullets.splice(i, 1);
      }
    }

    for (let i = this.drops.length - 1; i >= 0; i--) {
      const d = this.drops[i];
      if (!d) continue;

      d.t += dt;
      d.x += d.vx * dt;
      d.y += (d.vy + Math.sin(d.t * 4) * 12) * dt;

      if (!Number.isFinite(d.x) || !Number.isFinite(d.y)) {
        this.drops.splice(i, 1);
        continue;
      }

      if (api.util.dist(P.x, P.y, d.x, d.y) < P.r + 13) {
        this.drops.splice(i, 1);
        this.collectDrop(d);
        continue;
      }

      if (d.x < -20 || d.y > this.H + 20 || d.y < -30) {
        this.drops.splice(i, 1);
      }
    }

    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      if (!p) continue;

      p.life -= dt;
      if (p.life <= 0) {
        this.parts.splice(i, 1);
        continue;
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.g || 0) * dt;
      p.vx *= Math.pow(0.4, dt);
    }
  },

  heart(ctx, x, y, s, rot, fill, stroke) {
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(s) || s <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.95);
    ctx.bezierCurveTo(-s * 1.1, s * 0.15, -s * 0.85, -s * 0.85, 0, -s * 0.3);
    ctx.bezierCurveTo(s * 0.85, -s * 0.85, s * 1.1, s * 0.15, 0, s * 0.95);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    if (stroke) {
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  },

  drawBg(ctx) {
    const W = Number.isFinite(this.W) ? this.W : 640;
    const H = Number.isFinite(this.H) ? this.H : 360;

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#d9f2f7');
    g.addColorStop(0.6, '#e3f4ea');
    g.addColorStop(1, '#eef8e2');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < this.clouds.length; i++) {
      const c = this.clouds[i];
      if (!c) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, 34 * c.s, 13 * c.s, 0, 0, 7);
      ctx.ellipse(c.x - 22 * c.s, c.y + 4 * c.s, 20 * c.s, 10 * c.s, 0, 0, 7);
      ctx.ellipse(c.x + 24 * c.s, c.y + 3 * c.s, 22 * c.s, 11 * c.s, 0, 0, 7);
      ctx.fill();
    }

    ctx.fillStyle = '#dcefd6';
    ctx.beginPath();
    ctx.moveTo(0, H);
    const hillStep = 40;
    for (let x = 0; x <= W + hillStep; x += hillStep) {
      const xx = Math.min(x, W);
      ctx.lineTo(xx, H - 64 - Math.sin(xx * 0.012 + this.scroll * 0.004) * 18);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    for (let i = 0; i < this.farTrees.length; i++) {
      const tr = this.farTrees[i];
      if (!tr) continue;
      const s = tr.s;
      const yb = H - 40;
      ctx.fillStyle = tr.c;
      ctx.beginPath();
      ctx.arc(tr.x, yb - 34 * s, 26 * s, 0, 7);
      ctx.arc(tr.x - 16 * s, yb - 20 * s, 18 * s, 0, 7);
      ctx.arc(tr.x + 16 * s, yb - 20 * s, 18 * s, 0, 7);
      ctx.fill();
    }

    ctx.fillStyle = '#cfe9c8';
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + hillStep; x += hillStep) {
      const xx = Math.min(x, W);
      ctx.lineTo(xx, H - 26 - Math.sin(xx * 0.02 + 2 + this.scroll * 0.008) * 10);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    for (let i = 0; i < this.nearTrees.length; i++) {
      const tr = this.nearTrees[i];
      if (!tr) continue;
      const s = tr.s;
      const yb = H - 12;
      ctx.fillStyle = '#d9b98f';
      ctx.fillRect(tr.x - 5 * s, yb - 30 * s, 10 * s, 30 * s);
      ctx.fillStyle = tr.c;
      ctx.beginPath();
      ctx.arc(tr.x, yb - 46 * s, 30 * s, 0, 7);
      ctx.arc(tr.x - 22 * s, yb - 30 * s, 20 * s, 0, 7);
      ctx.arc(tr.x + 22 * s, yb - 30 * s, 20 * s, 0, 7);
      ctx.fill();
    }

    for (let i = 0; i < this.flowers.length; i++) {
      const f = this.flowers[i];
      if (!f) continue;
      const y = H - 8;
      ctx.fillStyle = f.c;
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * 6.283;
        ctx.beginPath();
        ctx.arc(f.x + Math.cos(a) * 4 * f.s, y + Math.sin(a) * 4 * f.s, 2.6 * f.s, 0, 7);
        ctx.fill();
      }
      ctx.fillStyle = '#f9e8c8';
      ctx.beginPath();
      ctx.arc(f.x, y, 2.4 * f.s, 0, 7);
      ctx.fill();
    }

    for (let i = 0; i < this.motes.length; i++) {
      const m = this.motes[i];
      if (!m) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(m.x, m.y + Math.sin(m.ph) * 6, m.s, 0, 7);
      ctx.fill();
    }
  },

  drawSquirrel(ctx, P, t) {
    if (!Number.isFinite(P.x) || !Number.isFinite(P.y)) return;
    if (P.inv > 0 && Math.floor(t * 16) % 2 === 0) ctx.globalAlpha = 0.35;
    const flap = Math.sin(t * 9) * 0.25;

    ctx.fillStyle = '#f6b8c8';
    ctx.beginPath();
    ctx.ellipse(P.x - 16, P.y - 4, 15, 10, -0.5 + flap, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(P.x - 13, P.y + 7, 13, 9, 0.5 - flap, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#fbd3dd';
    ctx.beginPath();
    ctx.ellipse(P.x - 16, P.y - 4, 8, 5, -0.5 + flap, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#f9e3bd';
    ctx.beginPath();
    ctx.ellipse(P.x, P.y, 14, 12, 0, 0, 7);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(P.x + 2, P.y - 8);
    ctx.lineTo(P.x + 7, P.y - 18);
    ctx.lineTo(P.x + 11, P.y - 8);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(P.x + 11, P.y - 8);
    ctx.lineTo(P.x + 15, P.y - 17);
    ctx.lineTo(P.x + 19, P.y - 7);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(P.x + 9, P.y - 2, 10, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#7a6a7a';
    ctx.beginPath();
    ctx.arc(P.x + 13, P.y - 4, 1.8, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#f29cb4';
    ctx.beginPath();
    ctx.arc(P.x + 18, P.y - 1, 1.6, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(P.x + 12, P.y + 1, 3, 2, 0, 0, 7);
    ctx.fill();

    ctx.globalAlpha = 1;
  },

  drawEnemy(ctx, e) {
    if (!e || !Number.isFinite(e.x) || !Number.isFinite(e.y)) return;
    const c = e.type === 'zig' ? '#c9b6f0' : '#bfe8d2';
    const sq = 1 + Math.sin(e.t * 6) * 0.06;

    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.scale(1 / sq, sq);

    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(-8, -e.r * 0.85, 5.5, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(8, -e.r * 0.85, 5.5, 0, 7);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#f29cb4';
    ctx.beginPath();
    ctx.arc(-e.r * 0.55, 0, 2.4, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#7a6a7a';
    ctx.beginPath();
    ctx.arc(-e.r * 0.25, -3, 2, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e.r * 0.35, -3, 2, 0, 7);
    ctx.fill();

    ctx.fillStyle = 'rgba(242,156,180,0.5)';
    ctx.beginPath();
    ctx.ellipse(-e.r * 0.45, 3, 3.5, 2.2, 0, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(e.r * 0.5, 3, 3.5, 2.2, 0, 0, 7);
    ctx.fill();

    if (e.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(0, 0, e.r, 0, 7);
      ctx.fill();
    }

    ctx.restore();
  },

  drawBoss(ctx, B, t) {
    if (!B || !Number.isFinite(B.x) || !Number.isFinite(B.y)) return;
    const x = B.x;
    const y = B.y;
    const dying = B.state === 'dying';
    const wob = dying ? Math.sin(t * 30) * 3 : 0;

    ctx.save();
    ctx.translate(x + wob, y);

    const earF = Math.sin(t * 3) * 0.08;
    for (let s = -1; s <= 1; s += 2) {
      ctx.save();
      ctx.translate(s * 16, -34);
      ctx.rotate(s * (0.25 + earF));
      ctx.fillStyle = '#f7f0e3';
      ctx.beginPath();
      ctx.ellipse(0, -24, 13, 30, 0, 0, 7);
      ctx.fill();
      ctx.fillStyle = '#d9c8f0';
      ctx.beginPath();
      ctx.ellipse(0, -22, 7, 22, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = '#f7f0e3';
    ctx.beginPath();
    ctx.ellipse(0, 0, 42, 48, 0, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#fdf8ee';
    ctx.beginPath();
    ctx.ellipse(-6, 10, 24, 28, 0, 0, 7);
    ctx.fill();

    ctx.fillStyle = '#7a6a7a';
    if (dying) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#7a6a7a';
      for (let s = -1; s <= 1; s += 2) {
        ctx.beginPath();
        ctx.moveTo(s * 14 - 4, -14);
        ctx.lineTo(s * 14 + 4, -6);
        ctx.moveTo(s * 14 + 4, -14);
        ctx.lineTo(s * 14 - 4, -6);
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.arc(-14, -10, 3, 0, 7);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(4, -10, 3, 0, 7);
      ctx.fill();
    }

    ctx.fillStyle = '#f29cb4';
    ctx.beginPath();
    ctx.ellipse(-5, -2, 3.5, 2.8, 0, 0, 7);
    ctx.fill();

    ctx.strokeStyle = '#7a6a7a';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-5, 2);
    ctx.lineTo(-5, 6);
    ctx.moveTo(-5, 6);
    ctx.quadraticCurveTo(-10, 10, -14, 7);
    ctx.moveTo(-5, 6);
    ctx.quadraticCurveTo(0, 10, 4, 7);
    ctx.stroke();

    ctx.fillStyle = 'rgba(242,156,180,0.55)';
    ctx.beginPath();
    ctx.ellipse(-22, -2, 5, 3.4, 0, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(12, -2, 5, 3.4, 0, 0, 7);
    ctx.fill();

    ctx.restore();

    for (let i = 0; i < this.tails.length; i++) {
      const tl = this.tails[i];
      if (!tl || tl.dead) continue;
      const pulse = 1 + Math.sin(t * 5 + i) * 0.1;
      this.heart(
        ctx,
        tl.x,
        tl.y,
        11 * pulse,
        Math.sin(t * 2 + i) * 0.2,
        tl.hp < tl.maxHp ? '#e27d9c' : '#f29cb4',
        '#ffffff'
      );
      if (tl.flash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(tl.x, tl.y, 13, 0, 7);
        ctx.fill();
      }
    }
  },

  drawHud(ctx) {
    const api = this.api;
    const t = Number.isFinite(api.time) ? api.time : 0;
    const W = Number.isFinite(this.W) ? this.W : 640;

    ctx.textBaseline = 'middle';

    const frac = api.util.clamp(1 - t / 60, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = frac > 0.33 ? '#a8dcc0' : '#f7b6c9';
    ctx.fillRect(0, 0, W * frac, 6);

    ctx.font = 'bold 17px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.fillText('スコア ' + api.score, 13, 22);
    ctx.fillStyle = '#6f8f7c';
    ctx.fillText('スコア ' + api.score, 12, 21);

    const P = this.P;
    for (let i = 0; i < P.maxHp; i++) {
      const hx = W / 2 - 26 + i * 22;
      this.heart(ctx, hx, 18, 8, 0, i < P.hp ? '#f29cb4' : 'rgba(255,255,255,0.55)');
    }

    const alive = this.aliveTails();
    for (let i = 0; i < 5; i++) {
      const tx = W - 116 + i * 20;
      this.heart(ctx, tx, 18, 7, 0, i < 5 - alive ? 'rgba(255,255,255,0.55)' : '#f29cb4');
    }

    if (t >= 38 && t < 40.5) {
      const a = 0.55 + Math.sin(t * 10) * 0.45;
      ctx.globalAlpha = api.util.clamp(a, 0.15, 1);
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('大きなウサギがやってきた!', W / 2, 64);
      ctx.fillStyle = '#e27d9c';
      ctx.fillText('大きなウサギがやってきた!', W / 2, 62);
      ctx.globalAlpha = 1;
    }

    if (this.boss.state === 'enter') {
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('しっぽを全部壊そう!', W / 2, 92);
      ctx.fillStyle = '#8f7fb0';
      ctx.fillText('しっぽを全部壊そう!', W / 2, 91);
    }

    ctx.textAlign = 'left';
  },

  draw(ctx) {
    const api = this.api;
    const t = Number.isFinite(api.time) ? api.time : 0;

    ctx.save();
    if (this.shake > 0) {
      ctx.translate(api.util.rand(-this.shake, this.shake) * 0.5, api.util.rand(-this.shake, this.shake) * 0.5);
    }

    this.drawBg(ctx);

    for (let i = 0; i < this.drops.length; i++) {
      const d = this.drops[i];
      if (!d) continue;
      const pulse = 1 + Math.sin(d.t * 6) * 0.12;
      this.heart(ctx, d.x, d.y, 10 * pulse, Math.sin(d.t * 3) * 0.25, '#f29cb4', '#ffffff');
      ctx.strokeStyle = '#a8dcc0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y + 8);
      ctx.quadraticCurveTo(d.x + 3, d.y + 12, d.x + 1, d.y + 15);
      ctx.stroke();
    }

    for (let i = 0; i < this.enemies.length; i++) {
      this.drawEnemy(ctx, this.enemies[i]);
    }

    if (this.boss.state !== 'none') this.drawBoss(ctx, this.boss, t);

    for (let i = 0; i < this.bullets.length; i++) {
      const b = this.bullets[i];
      if (!b) continue;
      ctx.fillStyle = 'rgba(249,232,200,0.4)';
      ctx.beginPath();
      ctx.ellipse(b.x - 8, b.y, 9, 4, 0, 0, 7);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 7);
      ctx.fill();
      ctx.fillStyle = '#f9e8c8';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.55, 0, 7);
      ctx.fill();
    }

    for (let i = 0; i < this.ebullets.length; i++) {
      const b = this.ebullets[i];
      if (!b) continue;
      ctx.fillStyle = '#f29cb4';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 7);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.5, 0, 7);
      ctx.fill();
    }

    if (!this.over && !this.cleared) this.drawSquirrel(ctx, this.P, t);

    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      if (!p) continue;
      ctx.globalAlpha = api.util.clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    this.drawHud(ctx);
  }
};
