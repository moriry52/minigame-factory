<script type="application/json" id="meta">{"id": "20261125-170020-local-llm", "title": "黒霧ギア", "summary": "暗闇の中で光る敵だけを狙い撃ちする、ワンボタン縦スクロールシューティング。タップで発射し、長押しで自機を左右に微調整する。", "rules": ["画面下部の自機は、タップで前方に弾を発射する。", "タップを長押し（0.2秒以上）すると、指の位置（またはキーの方向）に応じて自機が左右に移動する。離すと元の自動移動に戻る。", "視界は自機周囲の半径120pxのみ。暗闇の中の敵は光って見える。", "敵を撃墜すると光が広がり、一瞬だけ周囲の敵が視界に入る。", "ボス戦ではボスの弱点が光るタイミングで撃破する。", "自機が敵やボスの攻撃に触れたら即ゲームオーバー。"], "controls": {"スマホ": "タップで発射。長押しで指の移動方向に自機を移動。", "PC": "スペースキーまたはマウスクリックで発射。長押し（または矢印キー/ADキー）で自機を左右移動。"}, "cfg": {"mode": "2d", "w": 360, "h": 640, "scheme": "ワンボタン", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>

    <div><button class="btn" id="retryBtn" type="button">もう一度</button>

  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    const u = api.util;
    this.W = api.W; this.H = api.H;
    this.state = 'play';
    this.t = 0;
    this.kills = 0;
    api.setScore(0);

    this.player = {
      x: this.W / 2, y: this.H * 0.8,
      autoPhase: 0, manual: false,
      blendT: 1, blendFrom: this.W / 2,
      fireCd: 0, trail: 0
    };
    this.holdStart = -1;

    this.bullets = [];
    this.enemies = [];
    this.lasers = [];
    this.particles = [];
    this.flashes = [];
    this.rings = [];

    this.spawnCd = 1.1;
    this.boss = null;
    this.endTimer = -1;
    this.shake = 0;
    this.flashWhite = 0;

    this.gears = [];
    for (let i = 0; i < 9; i++) {
      this.gears.push({
        x: u.rand(0, this.W), y: u.rand(0, this.H),
        r: u.rand(16, 52), teeth: u.randInt(6, 10),
        rot: u.rand(0, 6.28), spin: u.rand(-0.35, 0.35),
        a: u.rand(0.05, 0.11)
      });
    }
    this.pipes = [
      { x: 6, w: 12, off: u.rand(0, 120) },
      { x: this.W - 18, w: 12, off: u.rand(0, 120) }
    ];
  },

  update(dt) {
    const api = this.api, u = api.util, inp = api.input;
    this.t += dt;
    this.shake = Math.max(0, this.shake - dt * 3);
    this.flashWhite = Math.max(0, this.flashWhite - dt * 2.2);

    for (let i = this.gears.length - 1; i >= 0; i--) {
      const g = this.gears[i];
      g.y += 32 * dt;
      g.rot += g.spin * dt;
      if (g.y - g.r > this.H) { g.y = -g.r - 10; g.x = u.rand(0, this.W); }
    }

    const p = this.player;
    p.autoPhase += dt * 1.35;

    // 入力: 押下 / 長押し / 離下
    if (inp.aPressed) { this.holdStart = this.t; this.fire(); }
    const held = inp.a;
    if (held && this.holdStart >= 0 && this.t - this.holdStart >= 0.2) p.manual = true;
    if (!held && p.manual) { p.manual = false; p.blendT = 0; p.blendFrom = p.x; }
    if (!held) this.holdStart = -1;

    // 長押し中の連射
    p.fireCd -= dt;
    if (held && p.manual && p.fireCd <= 0 && this.state !== 'dead' && this.state !== 'dying') this.fire();

    // 移動
    const autoX = this.W / 2 + Math.sin(p.autoPhase) * 95;
    if (p.manual) {
      if (api.isTouch) {
        if (inp.pointer.down) p.x += inp.pointer.dx * 1.7;
      } else {
        if (inp.pointer.down && inp.pointer.x > 0) {
          const d = inp.pointer.x - p.x;
          p.x += u.clamp(d, -300 * dt, 300 * dt);
        } else {
          if (inp.left) p.x -= 300 * dt;
          if (inp.right) p.x += 300 * dt;
        }
      }
      p.x = u.clamp(p.x, 18, this.W - 18);
    } else if (p.blendT < 1) {
      p.blendT = Math.min(1, p.blendT + dt / 0.45);
      const k = p.blendT * p.blendT * (3 - 2 * p.blendT);
      p.x = u.lerp(p.blendFrom, autoX, k);
    } else {
      p.x = autoX;
    }

    // 弾
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.y -= 560 * dt;
      if (b.y < -14) this.bullets.splice(i, 1);
    }

    // 敵スポーン
    if (this.state === 'play') {
      this.spawnCd -= dt;
      if (this.spawnCd <= 0) {
        const k = u.clamp(this.t / 45, 0, 1);
        this.spawnCd = u.lerp(1.25, 0.6, k) * u.rand(0.85, 1.15);
        this.enemies.push({
          x: u.rand(26, this.W - 26), y: -14,
          vy: u.lerp(80, 150, k) * u.rand(0.9, 1.15),
          baseX: 0, amp: u.rand(0, 34), freq: u.rand(1.0, 2.2), ph: u.rand(0, 6.28),
          hue: u.choice([0, 18, 38]), born: this.t
        });
        const e = this.enemies[this.enemies.length - 1];
        e.baseX = e.x;
      }
      if (this.t >= 45) this.startBoss();
    }

    // 敵更新
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin((this.t - e.born) * e.freq + e.ph) * e.amp;
      if (e.y > this.H + 20) this.enemies.splice(i, 1);
    }

    // 弾 vs 敵
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      let hit = false;
      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (u.circleHit({ x: b.x, y: b.y, r: 4 }, { x: e.x, y: e.y, r: 9 })) {
          this.killEnemy(j);
          hit = true;
          break;
        }
      }
      if (hit) this.bullets.splice(i, 1);
    }

    // ボス
    if (this.boss) this.updateBoss(dt);

    // レーザー
    for (let i = this.lasers.length - 1; i >= 0; i--) {
      const l = this.lasers[i];
      l.x += l.vx * dt;
      l.y += l.vy * dt;
      if (l.y > this.H + 20 || l.y < -20 || l.x < -20 || l.x > this.W + 20) this.lasers.splice(i, 1);
    }

    // 光(撃墜フラッシュ)
    for (let i = this.flashes.length - 1; i >= 0; i--) {
      this.flashes[i].age += dt;
      if (this.flashes[i].age > 0.5) this.flashes.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      this.rings[i].age += dt;
      if (this.rings[i].age > 0.45) this.rings.splice(i, 1);
    }

    // パーティクル
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const q = this.particles[i];
      q.life -= dt;
      if (q.life <= 0) { this.particles.splice(i, 1); continue; }
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vx *= (1 - 2.5 * dt);
      q.vy *= (1 - 2.5 * dt);
    }
    if (this.particles.length > 320) this.particles.splice(0, this.particles.length - 320);

    // 被弾判定(開始3秒は無敵)
    if (this.state !== 'dead' && this.state !== 'dying' && this.t > 3) {
      const pc = { x: p.x, y: p.y, r: 9 };
      for (const e of this.enemies) {
        if (u.circleHit(pc, { x: e.x, y: e.y, r: 8 })) { this.die(); break; }
      }
      if (this.state !== 'dead') {
        for (const l of this.lasers) {
          if (u.circleHit(pc, { x: l.x, y: l.y, r: 5 })) { this.die(); break; }
        }
      }
      if (this.state !== 'dead' && this.boss && this.boss.y > 0) {
        if (u.circleHit(pc, { x: this.boss.x, y: this.boss.y, r: 56 })) this.die();
      }
    }

    // 終了処理
    if (this.endTimer >= 0) {
      this.endTimer -= dt;
      if (this.endTimer <= 0) {
        this.endTimer = -1;
        if (this.state === 'dead') api.gameOver();
        else if (this.state === 'dying') api.clear();
      }
    }
  },

  fire() {
    const p = this.player;
    this.bullets.push({ x: p.x, y: p.y - 14 });
    this.spawnParticles(p.x, p.y - 14, 2, 45, 50, 190, 0.18, 2);
    this.api.sound.tone(900, 0.06, 'square', 0.1, 1500);
  },

  killEnemy(j) {
    const e = this.enemies[j];
    this.enemies.splice(j, 1);
    this.kills++;
    this.api.addScore(10);
    this.flashes.push({ x: e.x, y: e.y, age: 0 });
    this.rings.push({ x: e.x, y: e.y, age: 0 });
    this.spawnParticles(e.x, e.y, 14, 170, e.hue, 62, 0.5, 2.5);
    this.shake = Math.min(1, this.shake + 0.25);
    this.api.sound.play('hit');
  },

  startBoss() {
    this.state = 'boss';
    this.boss = {
      x: this.W / 2, y: -80, ty: 168,
      rot: 0, hp: 12, maxHp: 12,
      weakT: 2.2, fireCd: 2.0, telegraph: 0, hitFlash: 0
    };
    for (const e of this.enemies) this.flashes.push({ x: e.x, y: e.y, age: 0.2 });
    this.enemies.length = 0;
    this.api.sound.tone(140, 0.5, 'sawtooth', 0.25, 70);
  },

  updateBoss(dt) {
    const api = this.api, u = api.util, b = this.boss, p = this.player;
    if (b.y < b.ty) b.y = Math.min(b.ty, b.y + 90 * dt);
    const bt = Math.max(0, this.t - 45);
    const mvSpd = Math.min(1.7, 0.8 + bt * 0.04);
    b.x = this.W / 2 + Math.sin(bt * mvSpd) * 100;
    b.rot += dt * 1.25;
    b.hitFlash = Math.max(0, b.hitFlash - dt * 4);

    // 弱点: 3秒周期(1.8秒発光 / 1.2秒消灯)
    b.weakT -= dt;
    if (b.weakT <= 0) b.weakT += 3;
    const wasGlowing = b.weakT > 1.2;
    if (wasGlowing && b.weakT <= 1.2) {
      api.sound.tone(1300, 0.25, 'sine', 0.22, 1900);
    }

    // 攻撃
    if (b.y >= b.ty - 2) {
      b.fireCd -= dt;
      if (b.fireCd <= 0) {
        const n = bt > 8 ? 3 : 2;
        const sp = 235 + bt * 3;
        for (let k = 0; k < n; k++) {
          const a = u.angle(b.x, b.y, p.x, p.y) + (k - (n - 1) / 2) * 0.22;
          this.lasers.push({
            x: b.x + Math.cos(a) * 58, y: b.y + Math.sin(a) * 58,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp
          });
        }
        api.sound.tone(320, 0.12, 'square', 0.15, 160);
        b.fireCd = Math.max(1.0, 1.75 - bt * 0.04);
      }
    }

    // 弾判定
    const wx = b.x + Math.cos(b.rot) * 34;
    const wy = b.y + Math.sin(b.rot) * 34;
    const glowing = b.weakT > 1.2;
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const bl = this.bullets[i];
      if (glowing && u.circleHit({ x: bl.x, y: bl.y, r: 4 }, { x: wx, y: wy, r: 13 })) {
        b.hp--;
        b.hitFlash = 1;
        this.spawnParticles(wx, wy, 10, 160, 10, 60, 0.4, 2.5);
        this.shake = Math.min(1, this.shake + 0.3);
        this.api.sound.play('hit');
        this.bullets.splice(i, 1);
        if (b.hp <= 0) { this.killBoss(); return; }
      } else if (u.circleHit({ x: bl.x, y: bl.y, r: 4 }, { x: b.x, y: b.y, r: 58 })) {
        this.spawnParticles(bl.x, bl.y, 4, 90, 45, 70, 0.25, 1.5);
        this.api.sound.tone(200, 0.05, 'square', 0.08, 120);
        this.bullets.splice(i, 1);
      }
    }
  },

  killBoss() {
    const b = this.boss;
    this.state = 'dying';
    this.endTimer = 1.2;
    this.api.addScore(100);
    this.flashes.push({ x: b.x, y: b.y, age: 0 });
    this.rings.push({ x: b.x, y: b.y, age: 0 });
    this.spawnParticles(b.x, b.y, 46, 260, 30, 65, 0.9, 3);
    this.spawnParticles(b.x, b.y, 20, 140, 0, 60, 0.7, 2.5);
    this.shake = 1;
    this.flashWhite = 0.8;
    this.lasers.length = 0;
    this.api.sound.play('explode');
    this.boss = null;
  },

  die() {
    if (this.state === 'dead' || this.state === 'dying') return;
    this.state = 'dead';
    this.endTimer = 0.8;
    const p = this.player;
    this.spawnParticles(p.x, p.y, 30, 240, 20, 65, 0.8, 2.8);
    this.flashes.push({ x: p.x, y: p.y, age: 0 });
    this.shake = 1;
    this.flashWhite = 0.5;
    this.api.sound.play('hurt');
    this.api.sound.play('explode');
  },

  spawnParticles(x, y, n, speed, hue, light, life, size) {
    const u = this.api.util;
    for (let i = 0; i < n; i++) {
      const a = u.rand(0, Math.PI * 2);
      const s = u.rand(speed * 0.25, speed);
      this.particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: u.rand(life * 0.5, life), max: life,
        hue, light, size: u.rand(size * 0.6, size * 1.4)
      });
    }
  },

  draw(ctx) {
    const api = this.api, u = api.util, p = this.player;
    const W = this.W, H = this.H;
    ctx.save();
    if (this.shake > 0) {
      ctx.translate(u.rand(-1, 1) * this.shake * 5, u.rand(-1, 1) * this.shake * 5);
    }

    // 背景(光の中)
    ctx.fillStyle = '#000000';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    this.drawFactory(ctx, 1);

    // 自機周囲の暖色ライト
    ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 130);
    g.addColorStop(0, 'rgba(255,200,130,0.16)');
    g.addColorStop(1, 'rgba(255,200,130,0)');
    ctx.fillStyle = g;
    ctx.fillRect(p.x - 130, p.y - 130, 260, 260);
    ctx.globalCompositeOperation = 'source-over';

    // 通常オブジェクト(暗闇の下)
    for (const b of this.bullets) {
      ctx.globalCompositeOperation = 'lighter';
      g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 9);
      g.addColorStop(0, 'rgba(255,245,220,0.9)');
      g.addColorStop(1, 'rgba(255,245,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(b.x - 9, b.y - 9, 18, 18);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, 3.2, 0, 6.283); ctx.fill();
    }
    for (const e of this.enemies) this.drawEnemy(ctx, e.x, e.y, e.hue, 1);
    if (this.state !== 'dead') this.drawPlayer(ctx);
    this.drawParticles(ctx);

    // 暗闇オーバーレイ
    const R = 120 + Math.sin(this.t * 2.2) * 3;
    g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.55, 'rgba(0,0,0,0)');
    g.addColorStop(0.85, 'rgba(0,0,0,0.55)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = g;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // 視界リング
    ctx.strokeStyle = 'rgba(255,210,150,0.12)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 6.283); ctx.stroke();

    // 撃墜の光
    ctx.globalCompositeOperation = 'lighter';
    for (const f of this.flashes) {
      const k = f.age / 0.5;
      const fr = 30 + 170 * (1 - (1 - k) * (1 - k));
      const a = (1 - k) * 0.5;
      g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, fr);
      g.addColorStop(0, 'rgba(255,235,200,' + a.toFixed(3) + ')');
      g.addColorStop(0.7, 'rgba(255,190,120,' + (a * 0.35).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,190,120,0)');
      ctx.fillStyle = g;
      ctx.fillRect(f.x - fr, f.y - fr, fr * 2, fr * 2);
    }
    for (const r of this.rings) {
      const k = r.age / 0.45;
      ctx.strokeStyle = 'rgba(255,230,180,' + ((1 - k) * 0.6).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 20 + 190 * k, 0, 6.283); ctx.stroke();
    }
    // 光で現れた敵
    for (const f of this.flashes) {
      const k = f.age / 0.5;
      const fr = 30 + 170 * (1 - (1 - k) * (1 - k));
      for (const e of this.enemies) {
        if (u.dist(f.x, f.y, e.x, e.y) < fr) {
          this.drawEnemy(ctx, e.x, e.y, e.hue, 0.35 + 0.65 * (1 - k));
        }
      }
    }
    // レーザー(光なので常時見える)
    for (const l of this.lasers) {
      g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, 14);
      g.addColorStop(0, 'rgba(255,120,60,0.85)');
      g.addColorStop(1, 'rgba(255,120,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(l.x - 14, l.y - 14, 28, 28);
      ctx.strokeStyle = 'rgba(255,160,90,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(l.x - l.vx * 0.05, l.y - l.vy * 0.05);
      ctx.lineTo(l.x, l.y);
      ctx.stroke();
      ctx.fillStyle = '#ffd9b0';
      ctx.beginPath(); ctx.arc(l.x, l.y, 3, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // ボス(常時見える)
    if (this.boss) this.drawBoss(ctx);

    // 暗闇の奥に薄い工場シルエット
    this.drawFactory(ctx, 0.35);

    // 被弾/撃破の白フラッシュ
    if (this.flashWhite > 0) {
      ctx.fillStyle = 'rgba(255,240,220,' + (this.flashWhite * 0.55).toFixed(3) + ')';
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }

    this.drawHUD(ctx);
    ctx.restore();
  },

  drawFactory(ctx, mul) {
    const a = 0.05 * mul;
    ctx.fillStyle = 'rgba(150,170,190,' + a.toFixed(3) + ')';
    for (const gp of this.pipes) {
      ctx.fillRect(gp.x, -10, gp.w, this.H + 20);
      const off = (gp.off + this.t * 32) % 120;
      for (let y = -120 + off; y < this.H + 120; y += 120) {
        ctx.fillRect(gp.x - 3, y, gp.w + 6, 8);
      }
    }
    for (const gr of this.gears) {
      this.gearPath(ctx, gr.x, gr.y, gr.r, gr.teeth, gr.rot);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,' + (a * 1.6).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(gr.x, gr.y, gr.r * 0.32, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(150,170,190,' + a.toFixed(3) + ')';
    }
  },

  gearPath(ctx, x, y, r, teeth, rot) {
    const inner = r * 0.78;
    ctx.beginPath();
    for (let i = 0; i < teeth; i++) {
      const a0 = rot + (i / teeth) * Math.PI * 2;
      const a1 = rot + ((i + 0.35) / teeth) * Math.PI * 2;
      const a2 = rot + ((i + 0.5) / teeth) * Math.PI * 2;
      const a3 = rot + ((i + 0.85) / teeth) * Math.PI * 2;
      if (i === 0) ctx.moveTo(x + Math.cos(a0) * inner, y + Math.sin(a0) * inner);
      else ctx.lineTo(x + Math.cos(a0) * inner, y + Math.sin(a0) * inner);
      ctx.lineTo(x + Math.cos(a1) * r, y + Math.sin(a1) * r);
      ctx.lineTo(x + Math.cos(a2) * r, y + Math.sin(a2) * r);
      ctx.lineTo(x + Math.cos(a3) * inner, y + Math.sin(a3) * inner);
    }
    ctx.closePath();
  },

  drawEnemy(ctx, x, y, hue, alpha) {
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, 16);
    g.addColorStop(0, u2(hue, 100, 60, 0.9));
    g.addColorStop(1, u2(hue, 100, 60, 0));
    ctx.fillStyle = g;
    ctx.fillRect(x - 16, y - 16, 32, 32);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = u2(hue, 95, 62, 1);
    ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.283); ctx.fill();
    ctx.strokeStyle = u2(hue, 90, 75, 0.8);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, 8.5, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  },

  drawPlayer(ctx) {
    const p = this.player;
    // 無敵シールド
    if (this.t < 3) {
      const k = 1 - this.t / 3;
      ctx.strokeStyle = 'rgba(120,220,255,' + (0.25 + 0.4 * k).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 20 + Math.sin(this.t * 6) * 2, 0, 6.283); ctx.stroke();
      ctx.setLineDash([]);
    }
    // エンジン炎
    ctx.globalCompositeOperation = 'lighter';
    const fl = 8 + Math.sin(this.t * 40) * 3;
    const g = ctx.createRadialGradient(p.x, p.y + 12, 0, p.x, p.y + 12, 14);
    g.addColorStop(0, 'rgba(255,180,80,0.8)');
    g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g;
    ctx.fillRect(p.x - 14, p.y + 2, 28, fl + 12);
    ctx.globalCompositeOperation = 'source-over';
    // 機体
    ctx.fillStyle = '#c9d2da';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - 14);
    ctx.lineTo(p.x + 10, p.y + 10);
    ctx.lineTo(p.x, p.y + 5);
    ctx.lineTo(p.x - 10, p.y + 10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8f9aa5';
    ctx.fillRect(p.x - 12, p.y + 2, 4, 7);
    ctx.fillRect(p.x + 8, p.y + 2, 4, 7);
    // 心臓部
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 3.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(p.x, p.y - 2, 1.5, 0, 6.283); ctx.fill();
  },

  drawBoss(ctx) {
    const b = this.boss;
    const u = this.api.util;
    // 外側グロー
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(b.x, b.y, 20, b.x, b.y, 90);
    g.addColorStop(0, 'rgba(255,110,50,0.14)');
    g.addColorStop(1, 'rgba(255,110,50,0)');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 90, b.y - 90, 180, 180);
    ctx.globalCompositeOperation = 'source-over';
    // 歯車本体
    this.gearPath(ctx, b.x, b.y, 60, 10, b.rot);
    ctx.fillStyle = b.hitFlash > 0 ? 'rgba(255,200,170,0.9)' : '#23272e';
    ctx.fill();
    ctx.strokeStyle = '#4a525c';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 内輪
    ctx.strokeStyle = '#39414b';
    ctx.beginPath(); ctx.arc(b.x, b.y, 44, 0, 6.283); ctx.stroke();
    // 回転するリブ
    for (let i = 0; i < 4; i++) {
      const a = b.rot + (i / 4) * Math.PI * 2;
      ctx.strokeStyle = '#333b45';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(b.x + Math.cos(a) * 14, b.y + Math.sin(a) * 14);
      ctx.lineTo(b.x + Math.cos(a) * 42, b.y + Math.sin(a) * 42);
      ctx.stroke();
    }
    // 中心ハブ
    ctx.fillStyle = '#171b21';
    ctx.beginPath(); ctx.arc(b.x, b.y, 13, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#5a6470';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 弱点
    const wx = b.x + Math.cos(b.rot) * 34;
    const wy = b.y + Math.sin(b.rot) * 34;
    const glowing = b.weakT > 1.2;
    if (glowing) {
      const pulse = 0.7 + 0.3 * Math.sin(this.t * 14);
      ctx.globalCompositeOperation = 'lighter';
      g = ctx.createRadialGradient(wx, wy, 0, wx, wy, 26);
      g.addColorStop(0, 'rgba(255,60,40,' + (0.85 * pulse).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,60,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(wx - 26, wy - 26, 52, 52);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ff4433';
      ctx.beginPath(); ctx.arc(wx, wy, 10, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ffd0c8';
      ctx.beginPath(); ctx.arc(wx, wy, 4.5, 0, 6.283); ctx.fill();
    } else {
      ctx.fillStyle = '#5c2622';
      ctx.beginPath(); ctx.arc(wx, wy, 8, 0, 6.283); ctx.fill();
      ctx.strokeStyle = '#7a3530';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  },

  drawParticles(ctx) {
    ctx.globalCompositeOperation = 'lighter';
    for (const q of this.particles) {
      const k = Math.max(0, q.life / q.max);
      ctx.fillStyle = u2(q.hue, 95, q.light, k * 0.9);
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.size * k + 0.4, 0, 6.283);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  },

  drawHUD(ctx) {
    const api = this.api;
    ctx.textBaseline = 'top';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(230,235,240,0.9)';
    ctx.textAlign = 'left';
    ctx.fillText('KILL ' + this.kills, 10, 10);
    ctx.textAlign = 'right';
    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(200,205,210,0.6)';
    ctx.fillText('SCORE ' + api.score, this.W - 10, 11);
    ctx.textAlign = 'center';

    if (this.t < 3 && this.state === 'play') {
      const n = Math.ceil(3 - this.t);
      ctx.font = 'bold 26px monospace';
      ctx.fillStyle = 'rgba(255,210,140,' + (0.4 + 0.4 * Math.sin(this.t * 8)).toFixed(3) + ')';
      ctx.fillText('READY ' + n, this.W / 2, 40);
      ctx.font = '10px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('TAP: FIRE / HOLD: MOVE', this.W / 2, 70);
    }

    if (this.boss) {
      const b = this.boss;
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = 'rgba(255,150,120,0.9)';
      ctx.fillText('GEAR BOSS', this.W / 2, 34);
      const bw = 200, bx = this.W / 2 - bw / 2, by = 48;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(bx, by, bw, 6);
      const hpk = Math.max(0, b.hp / b.maxHp);
      ctx.fillStyle = hpk > 0.4 ? '#ff5533' : '#ff2211';
      ctx.fillRect(bx, by, bw * hpk, 6);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx - 0.5, by - 0.5, bw + 1, 7);
      const glowing = b.weakT > 1.2;
      ctx.font = '10px monospace';
      ctx.fillStyle = glowing ? 'rgba(255,90,70,0.95)' : 'rgba(255,255,255,0.35)';
      ctx.fillText(glowing ? 'WEAK POINT OPEN!' : '...ARMORED...', this.W / 2, 60);
    }
    ctx.textAlign = 'left';
  }
};

function u2(h, s, l, a) {
  return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
}
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
</body>
