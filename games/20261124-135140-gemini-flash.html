<!DOCTYPE html>
<html lang="ja">
<head>

<title>スターソーター</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d14;color:#eef;overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#screen{display:block;background:#000;touch-action:none;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,6,12,.72);backdrop-filter:blur(2px);touch-action:none}
#overlay.hidden{display:none}
.panel{width:min(92%,420px);max-height:92%;overflow:auto;background:#151a2b;border:1px solid #2c3554;
  border-radius:16px;padding:20px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h1{font-size:24px;margin-bottom:8px;letter-spacing:.02em}
.panel h2{font-size:20px;margin-bottom:8px}
.panel p{font-size:14px;line-height:1.6;color:#c9d0ea}
.panel .box{margin:12px 0;padding:10px 12px;background:#0e1220;border-radius:10px;text-align:left}
.panel .box b{display:block;font-size:12px;color:#8fa0d8;margin-bottom:4px}
.panel ul{padding-left:1.2em;font-size:13px;line-height:1.6;color:#c9d0ea}
.panel .score{font-size:40px;font-weight:800;margin:6px 0}
.panel .best{font-size:13px;color:#8fa0d8}
.btn{display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:999px;border:0;
  background:#5b7cff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sub{background:#2c3554}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#pad{display:none;height:190px;flex:none;position:relative;touch-action:none}
#pad.show{display:block}
.pbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(120,140,220,.18);border:2px solid rgba(160,180,255,.35);color:#dfe6ff;
  font-weight:800;font-size:18px;touch-action:none}
.pbtn.on{background:rgba(120,150,255,.55)}
.pbtn.dir{border-radius:14px;width:58px;height:58px;font-size:20px}

  padding:6px 10px;border-radius:999px;text-decoration:none;cursor:pointer}

<body>
<div id="app">
<div id="topbar">
    <button id="muteBtn" type="button" aria-label="音のオン・オフ">🔊</button>
    <button id="pauseBtn" type="button" aria-label="一時停止">⏸</button>
    <a href="../index.html">一覧</a>
  </div>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="hud"></div>
    <div id="overlay"></div>
  </div>
  <div id="pad"></div>
</div>
<script type="application/json" id="meta">{"id": "20261124-135140-gemini-flash", "title": "スターソーター", "summary": "宇宙艇を操り、漂うエネルギークオーツを同色で3つ並べて消去する王道全方向パズルアクション。", "rules": ["仮想十字キーで宇宙艇を全方向に動かし、Aボタンで目の前のクオーツを牽引・運搬します。", "同じ色のクオーツを縦または横に3つ以上一直線に接触させると消滅し、スコアを獲得します。", "制限時間は3分間。連続で素早く消すとコンボボーナスが発生します。"], "controls": {"スマホ": "画面下の十字キーで宇宙艇の移動。Aボタンでクオーツの牽引／解放を切り替えます。", "PC": "矢印キーで宇宙艇の移動。Zキー（Aボタン）でクオーツの牽引／解放を切り替えます。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "仮想パッド", "buttons": [{"key": "A", "label": "けんいん"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;
    overlay.classList.remove("hidden");
    Input._clear();
  } else {
    overlay.classList.add("hidden");
    __last = performance.now();
  }
}

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.worldW = 960;
    this.worldH = 960;
    this.cellSize = 32;
    this.gridCols = 26; // 26 * 32 = 832, offset 64
    this.gridRows = 26;
    this.offsetX = (this.worldW - this.gridCols * this.cellSize) / 2;
    this.offsetY = (this.worldH - this.gridRows * this.cellSize) / 2;

    this.colors = [
      { name: 'ruby', main: '#ff3366', light: '#ff88aa', dark: '#991133' },
      { name: 'sapphire', main: '#00ccff', light: '#88eeff', dark: '#0066aa' },
      { name: 'topaz', main: '#ffcc00', light: '#ffee66', dark: '#aa8800' },
      { name: 'emerald', main: '#00ff88', light: '#88ffcc', dark: '#009944' },
    ];

    this.ship = {
      x: this.worldW / 2,
      y: this.worldH / 2,
      vx: 0,
      vy: 0,
      angle: -Math.PI / 2,
      radius: 12,
      carrying: null,
      thrust: false,
    };

    this.camera = { x: this.ship.x - 240, y: this.ship.y - 240 };
    this.grid = Array(this.gridCols * this.gridRows).fill(null);

    this.timeLeft = 180;
    this.combo = 0;
    this.comboTimer = 0;
    this.fever = false;
    this.particles = [];
    this.warpSpawns = [];
    this.stars = [];

    // 背景の星々
    for (let i = 0; i < 120; i++) {
      this.stars.push({
        x: api.util.rand(0, this.worldW),
        y: api.util.rand(0, this.worldH),
        size: api.util.rand(1, 2.5),
        alpha: api.util.rand(0.3, 0.9),
        speed: api.util.rand(0.2, 0.6),
      });
    }

    // 初期クオーツの配置（連続ができないようにランダム配置）
    let initialCount = 36;
    while (initialCount > 0) {
      const gx = api.util.randInt(2, this.gridCols - 3);
      const gy = api.util.randInt(2, this.gridRows - 3);
      const idx = gy * this.gridCols + gx;
      if (!this.grid[idx]) {
        const colorId = api.util.randInt(0, 2);
        this.grid[idx] = { color: colorId, scale: 1, clearing: 0 };
        initialCount--;
      }
    }
    this.checkMatches(false); // 初期盤面の万が一のマッチを消去
    this.clearingMatches = [];
  },

  getGridIndex(gx, gy) {
    if (gx < 0 || gx >= this.gridCols || gy < 0 || gy >= this.gridRows) return -1;
    return gy * this.gridCols + gx;
  },

  worldToGrid(wx, wy) {
    return {
      gx: Math.floor((wx - this.offsetX) / this.cellSize),
      gy: Math.floor((wy - this.offsetY) / this.cellSize),
    };
  },

  gridToWorld(gx, gy) {
    return {
      x: this.offsetX + gx * this.cellSize + this.cellSize / 2,
      y: this.offsetY + gy * this.cellSize + this.cellSize / 2,
    };
  },

  update(dt) {
    const { input, util, sound } = this.api;

    // 時間制限管理
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      sound.play('clear');
      this.api.clear();
      return;
    }

    // フィーバー状態判定（残り60秒以内）
    const prevFever = this.fever;
    this.fever = this.timeLeft <= 60;
    if (this.fever && !prevFever) {
      sound.play('powerup');
    }

    // コンボタイマー
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.combo = 0;
      }
    }

    // 自機移動入力
    let moveX = 0;
    let moveY = 0;
    if (input.left) moveX -= 1;
    if (input.right) moveX += 1;
    if (input.up) moveY -= 1;
    if (input.down) moveY += 1;

    const len = Math.hypot(moveX, moveY);
    this.ship.thrust = len > 0;
    if (len > 0) {
      const speed = 220;
      this.ship.vx = util.lerp(this.ship.vx, (moveX / len) * speed, dt * 10);
      this.ship.vy = util.lerp(this.ship.vy, (moveY / len) * speed, dt * 10);
      this.ship.angle = Math.atan2(moveY, moveX);

      // スラスターパーティクル
      if (Math.random() < 0.4) {
        const backAngle = this.ship.angle + Math.PI + util.rand(-0.4, 0.4);
        this.particles.push({
          x: this.ship.x - Math.cos(this.ship.angle) * 12,
          y: this.ship.y - Math.sin(this.ship.angle) * 12,
          vx: Math.cos(backAngle) * util.rand(30, 80),
          vy: Math.sin(backAngle) * util.rand(30, 80),
          life: 0.3,
          maxLife: 0.3,
          color: '#44aaff',
          size: util.rand(2, 4),
        });
      }
    } else {
      this.ship.vx = util.lerp(this.ship.vx, 0, dt * 8);
      this.ship.vy = util.lerp(this.ship.vy, 0, dt * 8);
    }

    this.ship.x += this.ship.vx * dt;
    this.ship.y += this.ship.vy * dt;

    // ワールド端の壁判定
    const margin = 20;
    this.ship.x = util.clamp(this.ship.x, margin, this.worldW - margin);
    this.ship.y = util.clamp(this.ship.y, margin, this.worldH - margin);

    // カメラ追従
    this.camera.x = util.lerp(this.camera.x, this.ship.x - this.api.W / 2, dt * 6);
    this.camera.y = util.lerp(this.camera.y, this.ship.y - this.api.H / 2, dt * 6);
    this.camera.x = util.clamp(this.camera.x, 0, this.worldW - this.api.W);
    this.camera.y = util.clamp(this.camera.y, 0, this.worldH - this.api.H);

    // アクションボタン（Aボタンで掴む／置く）
    if (input.aPressed) {
      if (!this.ship.carrying) {
        // 前方のクオーツを探す
        const lookDist = 40;
        const targetX = this.ship.x + Math.cos(this.ship.angle) * lookDist;
        const targetY = this.ship.y + Math.sin(this.ship.angle) * lookDist;
        const { gx, gy } = this.worldToGrid(targetX, targetY);
        const idx = this.getGridIndex(gx, gy);

        if (idx !== -1 && this.grid[idx] && !this.grid[idx].clearing) {
          this.ship.carrying = { color: this.grid[idx].color };
          this.grid[idx] = null;
          sound.tone(280, 0.08, 'sine', 0.25, 450);
          for (let i = 0; i < 6; i++) {
            this.particles.push({
              x: targetX,
              y: targetY,
              vx: util.rand(-50, 50),
              vy: util.rand(-50, 50),
              life: 0.25,
              maxLife: 0.25,
              color: '#ffffff',
              size: 3,
            });
          }
        } else {
          // 前方にない場合、至近距離（周囲8マス）で最も近いものを拾う
          let nearestIdx = -1;
          let minDist = 44;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const currentG = this.worldToGrid(this.ship.x, this.ship.y);
              const gCheckX = currentG.gx + dx;
              const gCheckY = currentG.gy + dy;
              const checkIdx = this.getGridIndex(gCheckX, gCheckY);
              if (checkIdx !== -1 && this.grid[checkIdx] && !this.grid[checkIdx].clearing) {
                const worldPos = this.gridToWorld(gCheckX, gCheckY);
                const d = util.dist(this.ship.x, this.ship.y, worldPos.x, worldPos.y);
                if (d < minDist) {
                  minDist = d;
                  nearestIdx = checkIdx;
                }
              }
            }
          }
          if (nearestIdx !== -1) {
            this.ship.carrying = { color: this.grid[nearestIdx].color };
            this.grid[nearestIdx] = null;
            sound.tone(280, 0.08, 'sine', 0.25, 450);
          }
        }
      } else {
        // 持っているクオーツを前方の空きグリッドへ置く
        const placeDist = 36;
        const placeX = this.ship.x + Math.cos(this.ship.angle) * placeDist;
        const placeY = this.ship.y + Math.sin(this.ship.angle) * placeDist;
        let { gx, gy } = this.worldToGrid(placeX, placeY);
        let idx = this.getGridIndex(gx, gy);

        // 前方が埋まっているなら、自機位置のグリッドか一番近い空きグリッドを探す
        if (idx === -1 || this.grid[idx]) {
          const selfG = this.worldToGrid(this.ship.x, this.ship.y);
          const selfIdx = this.getGridIndex(selfG.gx, selfG.gy);
          if (selfIdx !== -1 && !this.grid[selfIdx]) {
            idx = selfIdx;
            gx = selfG.gx;
            gy = selfG.gy;
          } else {
            // 最寄りの空きマスを探索
            let bestDist = 999;
            let bestG = null;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                const tgx = selfG.gx + dx;
                const tgy = selfG.gy + dy;
                const tidx = this.getGridIndex(tgx, tgy);
                if (tidx !== -1 && !this.grid[tidx]) {
                  const pos = this.gridToWorld(tgx, tgy);
                  const d = util.dist(placeX, placeY, pos.x, pos.y);
                  if (d < bestDist) {
                    bestDist = d;
                    bestG = { gx: tgx, gy: tgy, idx: tidx };
                  }
                }
              }
            }
            if (bestG) {
              idx = bestG.idx;
              gx = bestG.gx;
              gy = bestG.gy;
            }
          }
        }

        if (idx !== -1 && !this.grid[idx]) {
          this.grid[idx] = {
            color: this.ship.carrying.color,
            scale: 1.3,
            clearing: 0,
          };
          this.ship.carrying = null;
          sound.tone(650, 0.06, 'triangle', 0.2, 350);

          // マッチ判定
          this.checkMatches(true);
        }
      }
    }

    // クオーツ消滅演出更新
    for (let i = 0; i < this.grid.length; i++) {
      const q = this.grid[i];
      if (q) {
        if (q.scale > 1) {
          q.scale = util.lerp(q.scale, 1, dt * 10);
        }
        if (q.clearing > 0) {
          q.clearing += dt * 3.5;
          if (q.clearing >= 1) {
            // 消滅完了・パーティクル追加
            const gx = i % this.gridCols;
            const gy = Math.floor(i / this.gridCols);
            const pos = this.gridToWorld(gx, gy);
            const col = this.colors[q.color].main;
            for (let p = 0; p < 12; p++) {
              this.particles.push({
                x: pos.x,
                y: pos.y,
                vx: util.rand(-120, 120),
                vy: util.rand(-120, 120),
                life: util.rand(0.3, 0.6),
                maxLife: 0.6,
                color: col,
                size: util.rand(3, 6),
              });
            }
            this.grid[i] = null;
            // 補充を予約
            this.scheduleSpawn();
          }
        }
      }
    }

    // スポーン演出の更新
    for (let i = this.warpSpawns.length - 1; i >= 0; i--) {
      const ws = this.warpSpawns[i];
      ws.timer -= dt;
      if (ws.timer <= 0) {
        const idx = this.getGridIndex(ws.gx, ws.gy);
        if (!this.grid[idx]) {
          this.grid[idx] = { color: ws.color, scale: 0.1, clearing: 0 };
        }
        this.warpSpawns.splice(i, 1);
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  },

  scheduleSpawn() {
    // 盤面上の空きセルを探して予約
    const emptyCells = [];
    for (let i = 0; i < this.grid.length; i++) {
      if (!this.grid[i]) {
        const isSpawning = this.warpSpawns.some((ws) => this.getGridIndex(ws.gx, ws.gy) === i);
        if (!isSpawning) {
          emptyCells.push({ gx: i % this.gridCols, gy: Math.floor(i / this.gridCols) });
        }
      }
    }
    if (emptyCells.length > 0) {
      const cell = this.api.util.choice(emptyCells);
      // 1分以上経過（残り120秒以下）なら緑を含む4色
      const maxColorIndex = this.timeLeft <= 120 ? 3 : 2;
      const color = this.api.util.randInt(0, maxColorIndex);
      this.warpSpawns.push({
        gx: cell.gx,
        gy: cell.gy,
        color,
        timer: this.api.util.rand(0.8, 1.8),
      });
    }
  },

  checkMatches(giveScore) {
    const matched = new Set();

    // 横方向チェック
    for (let gy = 0; gy < this.gridRows; gy++) {
      let count = 1;
      for (let gx = 1; gx < this.gridCols; gx++) {
        const prevIdx = this.getGridIndex(gx - 1, gy);
        const currIdx = this.getGridIndex(gx, gy);
        const pQ = this.grid[prevIdx];
        const cQ = this.grid[currIdx];

        if (pQ && cQ && !pQ.clearing && !cQ.clearing && pQ.color === cQ.color) {
          count++;
        } else {
          if (count >= 3) {
            for (let k = 0; k < count; k++) {
              matched.add(this.getGridIndex(gx - 1 - k, gy));
            }
          }
          count = 1;
        }
      }
      if (count >= 3) {
        for (let k = 0; k < count; k++) {
          matched.add(this.getGridIndex(this.gridCols - 1 - k, gy));
        }
      }
    }

    // 縦方向チェック
    for (let gx = 0; gx < this.gridCols; gx++) {
      let count = 1;
      for (let gy = 1; gy < this.gridRows; gy++) {
        const prevIdx = this.getGridIndex(gx, gy - 1);
        const currIdx = this.getGridIndex(gx, gy);
        const pQ = this.grid[prevIdx];
        const cQ = this.grid[currIdx];

        if (pQ && cQ && !pQ.clearing && !cQ.clearing && pQ.color === cQ.color) {
          count++;
        } else {
          if (count >= 3) {
            for (let k = 0; k < count; k++) {
              matched.add(this.getGridIndex(gx, gy - 1 - k));
            }
          }
          count = 1;
        }
      }
      if (count >= 3) {
        for (let k = 0; k < count; k++) {
          matched.add(this.getGridIndex(gx, this.gridRows - 1 - k));
        }
      }
    }

    if (matched.size > 0) {
      matched.forEach((idx) => {
        if (this.grid[idx]) {
          this.grid[idx].clearing = 0.01;
        }
      });

      if (giveScore) {
        this.combo++;
        this.comboTimer = 3.5;

        const baseMultiplier = this.fever ? 2 : 1;
        const points = matched.size * 100 * this.combo * baseMultiplier;
        this.api.addScore(points);

        // サウンド演出
        const toneFreq = 440 + Math.min(this.combo, 8) * 80;
        this.api.sound.tone(toneFreq, 0.15, 'sine', 0.3, toneFreq * 1.3);
        if (this.combo >= 3) {
          this.api.sound.play('coin');
        }
      }
    }
  },

  draw(ctx) {
    const { W, H } = this.api;
    const camX = this.camera.x;
    const camY = this.camera.y;

    // 宇宙背景
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, W, H);

    // 遠景の星々（カメラ視差スクロール）
    ctx.save();
    for (const star of this.stars) {
      const sx = (star.x - camX * star.speed + this.worldW * 2) % this.worldW;
      const sy = (star.y - camY * star.speed + this.worldH * 2) % this.worldH;
      if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
        ctx.fillRect(sx, sy, star.size, star.size);
      }
    }
    ctx.restore();

    // ワールド座標系開始
    ctx.save();
    ctx.translate(-camX, -camY);

    // フィールド外枠境界
    ctx.strokeStyle = '#1a2644';
    ctx.lineWidth = 4;
    ctx.strokeRect(10, 10, this.worldW - 20, this.worldH - 20);

    // クオーツグリッド枠線
    ctx.strokeStyle = 'rgba(50, 80, 140, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= this.gridCols; c++) {
      const x = this.offsetX + c * this.cellSize;
      ctx.moveTo(x, this.offsetY);
      ctx.lineTo(x, this.offsetY + this.gridRows * this.cellSize);
    }
    for (let r = 0; r <= this.gridRows; r++) {
      const y = this.offsetY + r * this.cellSize;
      ctx.moveTo(this.offsetX, y);
      ctx.lineTo(this.offsetX + this.gridCols * this.cellSize, y);
    }
    ctx.stroke();

    // スポーンワープ演出（召喚エフェクト）
    for (const ws of this.warpSpawns) {
      const pos = this.gridToWorld(ws.gx, ws.gy);
      const col = this.colors[ws.color];
      const radius = (1 - ws.timer / 1.8) * 14;
      ctx.strokeStyle = col.light;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    // クオーツ描画
    for (let i = 0; i < this.grid.length; i++) {
      const q = this.grid[i];
      if (!q) continue;

      const gx = i % this.gridCols;
      const gy = Math.floor(i / this.gridCols);
      const pos = this.gridToWorld(gx, gy);

      // 画面外カリング
      if (pos.x + 20 < camX || pos.x - 20 > camX + W || pos.y + 20 < camY || pos.y - 20 > camY + H) {
        continue;
      }

      const col = this.colors[q.color];
      const scale = q.scale * (1 - q.clearing);
      const size = (this.cellSize - 4) * scale;

      ctx.save();
      ctx.translate(pos.x, pos.y);

      if (q.clearing > 0) {
        ctx.globalAlpha = 1 - q.clearing;
        ctx.shadowBlur = 15;
        ctx.shadowColor = col.light;
      }

      // クオーツ外枠・宝石形状
      ctx.fillStyle = col.dark;
      ctx.fillRect(-size / 2, -size / 2, size, size);

      ctx.fillStyle = col.main;
      ctx.fillRect(-size / 2 + 2, -size / 2 + 2, size - 4, size - 4);

      // ハイライト
      ctx.fillStyle = col.light;
      ctx.beginPath();
      ctx.moveTo(-size / 2 + 2, -size / 2 + 2);
      ctx.lineTo(size / 2 - 2, -size / 2 + 2);
      ctx.lineTo(-size / 2 + 2, size / 2 - 2);
      ctx.fill();

      // コアの輝き
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2, -2, 4, 4);

      ctx.restore();
    }

    // パーティクル描画
    for (const p of this.particles) {
      ctx.save();
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 自機の牽引ビーム演出（保持中）
    if (this.ship.carrying) {
      const backDist = 26;
      const holdX = this.ship.x - Math.cos(this.ship.angle) * backDist;
      const holdY = this.ship.y - Math.sin(this.ship.angle) * backDist;

      // ビーム光線
      ctx.save();
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2 + Math.sin(this.api.time * 20);
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ffff';
      ctx.beginPath();
      ctx.moveTo(this.ship.x, this.ship.y);
      ctx.lineTo(holdX, holdY);
      ctx.stroke();

      // 保持クオーツ
      const col = this.colors[this.ship.carrying.color];
      const sz = this.cellSize - 6;
      ctx.translate(holdX, holdY);
      ctx.fillStyle = col.dark;
      ctx.fillRect(-sz / 2, -sz / 2, sz, sz);
      ctx.fillStyle = col.main;
      ctx.fillRect(-sz / 2 + 2, -sz / 2 + 2, sz - 4, sz - 4);
      ctx.fillStyle = col.light;
      ctx.fillRect(-sz / 2 + 2, -sz / 2 + 2, (sz - 4) / 2, (sz - 4) / 2);
      ctx.restore();
    }

    // 自機（宇宙艇）の描画
    ctx.save();
    ctx.translate(this.ship.x, this.ship.y);
    ctx.rotate(this.ship.angle);

    // 宇宙艇の船体
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-10, -10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // コックピット窓
    ctx.fillStyle = '#67e8f9';
    ctx.beginPath();
    ctx.arc(2, 0, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // 牽引エミッター（機首）
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(12, -1.5, 3, 3);

    ctx.restore();

    ctx.restore(); // ワールド座標系終了

    // HUD描画（論理座標）
    this.drawHUD(ctx);
  },

  drawHUD(ctx) {
    const { W, H, score } = this.api;

    // 上部ステータスバー背景
    ctx.fillStyle = 'rgba(10, 14, 26, 0.85)';
    ctx.fillRect(0, 0, W, 46);
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 45, W, 1);

    // スコア表示
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 16, 28);

    // 制限時間表示
    const minutes = Math.floor(this.timeLeft / 60);
    const seconds = Math.floor(this.timeLeft % 60);
    const timeStr = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

    ctx.textAlign = 'center';
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = this.timeLeft <= 30 ? '#ff3366' : '#38bdf8';
    ctx.fillText(`TIME ${timeStr}`, W / 2, 28);

    // フィーバー表示
    if (this.fever) {
      const pulse = 1 + Math.sin(this.api.time * 8) * 0.15;
      ctx.save();
      ctx.translate(W / 2, 42);
      ctx.scale(pulse, pulse);
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText('★ FEVER x2 ★', 0, 0);
      ctx.restore();
    }

    // コンボ表示
    if (this.combo > 1) {
      ctx.textAlign = 'right';
      ctx.font = 'italic bold 16px sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText(`${this.combo} COMBO!`, W - 16, 28);
    }

    // ミニマップレーダー（右上端）
    const mapSize = 64;
    const mapX = W - mapSize - 12;
    const mapY = 56;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;
    ctx.fillRect(mapX, mapY, mapSize, mapSize);
    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

    // ミニマップ上のクオーツ
    const ratio = mapSize / this.worldW;
    for (let i = 0; i < this.grid.length; i++) {
      const q = this.grid[i];
      if (q && !q.clearing) {
        const gx = i % this.gridCols;
        const gy = Math.floor(i / this.gridCols);
        const pos = this.gridToWorld(gx, gy);
        ctx.fillStyle = this.colors[q.color].main;
        ctx.fillRect(mapX + pos.x * ratio, mapY + pos.y * ratio, 2, 2);
      }
    }

    // ミニマップ上の自機
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(mapX + this.ship.x * ratio - 1, mapY + this.ship.y * ratio - 1, 3, 3);
  },
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
