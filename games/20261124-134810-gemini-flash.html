<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d14;color:#eef;overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#screen{display:block;background:#000;touch-action:none;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,6,12,.72);backdrop-filter:blur(2px);touch-action:none}
#overlay.hidden{display:none}
.panel{width:min(92%,420px);max-height:92%;overflow:auto;background:#151a2b;border:1px solid #2c3554;
  border-radius:16px;padding:20px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h1{font-size:24px;margin-bottom:8px;letter-spacing:.02em}
.panel h2{font-size:20px;margin-bottom:8px}
.panel p{font-size:14px;line-height:1.6;color:#c9d0ea}
.panel .box{margin:12px 0;padding:10px 12px;background:#0e1220;border-radius:10px;text-align:left}
.panel .box b{display:block;font-size:12px;color:#8fa0d8;margin-bottom:4px}
.panel ul{padding-left:1.2em;font-size:13px;line-height:1.6;color:#c9d0ea}
.panel .score{font-size:40px;font-weight:800;margin:6px 0}
.panel .best{font-size:13px;color:#8fa0d8}
.btn{display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:999px;border:0;
  background:#5b7cff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sub{background:#2c3554}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#pad{display:none;height:190px;flex:none;position:relative;touch-action:none}

.pbtn.dir{border-radius:14px;width:58px;height:58px;font-size:20px}

<body>
<div id="app">
<div id="topbar">
    <button id="muteBtn" type="button" aria-label="音のオン・オフ">🔊</button>
    <button id="pauseBtn" type="button" aria-label="一時停止">⏸</button>

  </div>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="hud"></div>

  </div>

</div>
<script type="application/json" id="meta">{"id": "20261124-134810-gemini-flash", "title": "あまやみダイブ", "summary": "暗闇に包まれた巨大スイーツの底へダイブ！光る金平糖を操作し、一瞬の視界を頼りに障害物を避けて3分間生き延びよう。", "rules": ["周囲しか見えない暗闇の中を落下し続ける縦スクロールアクション。", "左右スワイプで障害物を回避し、危険な仕掛けを避ける。", "タップで発動する『シュガースパーク』で一瞬だけ画面全体を照らし、ルートを確認できる。", "障害物にぶつからずに3分間（180秒）生き延びればゲームクリア。"], "controls": {"スマホ": "左右スワイプで金平糖を横移動。タップで光を放ち、一瞬だけ視界を全開にする。", "PC": "左右矢印キー（またはA/D）で移動。マウスクリックまたはスペースキーで全画面フラッシュ。"}, "cfg": {"mode": "2d", "w": 360, "h": 640, "scheme": "タップ/スワイプ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;
    overlay.classList.remove("hidden");
    Input._clear();
  } else {
    overlay.classList.add("hidden");
    __last = performance.now();
  }
}
$("pauseBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
$("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); Sound.toggle(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) togglePause(true); });

// ---------------- 進行 ----------------
let GAME = null, __last = 0;
function __fail(where, e) {
  console.error(e);
  __G.errors.push(`${where}: ${e && e.message ? e.message : e}`);
  __G.state = "error";
  overlay.innerHTML = `<div class="panel"><h2>エラーが発生しました</h2><p>${esc(e && e.message ? e.message : e)}</p></div>`;
  overlay.classList.remove("hidden");
}
function __init3D() {
  if (R3) return;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(DPR);
  R3 = { renderer };
  api.THREE = THREE; api.renderer = renderer;
}
function startGame() {
  if (!GAME) return;
  Input._clear();
  __G.score = 0; __G.frame = 0; __G.paused = false; __G.plays++;
  api.time = 0; api.hud("");
  if (CFG.mode === "3d") {
    api.scene = new THREE.Scene();
    api.camera = new THREE.PerspectiveCamera(60, CFG.w / CFG.h, 0.1, 1000);
    api.camera.position.set(0, 5, 10); api.camera.lookAt(0, 0, 0);
  }
  try { GAME.init(api); } catch (e) { return __fail("init", e); }
  __layout();
  overlay.classList.add("hidden");
  __G.state = "playing"; __G.startedAt = performance.now();
  __last = performance.now();
}
function __endGame(kind) {
  if (__G.state !== "playing") return;
  __G.state = kind; __G.endedAt = performance.now();
  __saveBest(__G.score);
  Sound.play(kind === "clear" ? "clear" : "over");
  setTimeout(() => __showResult(kind), 500);
}
function __frame(now) {
  requestAnimationFrame(__frame);
  if (__G.state !== "playing" || __G.paused) {
    if (CFG.mode === "3d" && R3 && api.scene && api.camera) R3.renderer.render(api.scene, api.camera);
    return;
  }
  const dt = Math.min(0.05, Math.max(0, (now - __last) / 1000));
  __last = now;
  api.time += dt;
  try {
    Input._begin();
    GAME.update(dt);
    if (__G.state === "error") return;
    if (CFG.mode === "3d") R3.renderer.render(api.scene, api.camera);
    else if (GAME.draw) { ctx2d.save(); GAME.draw(ctx2d); ctx2d.restore(); }
    __G.frame++;
    if (!Number.isFinite(__G.score)) throw new Error("score が数値ではありません");
  } catch (e) { __fail("update/draw", e); }
}
function __boot(game) {
  GAME = game;
  if (!GAME || typeof GAME.init !== "function" || typeof GAME.update !== "function") {
    return __fail("boot", new Error("Game オブジェクト（init / update）が定義されていません"));
  }
  try {
    if (CFG.mode === "3d") { __init3D(); }
    else { ctx2d = canvas.getContext("2d"); api.ctx = ctx2d; }
  } catch (e) { return __fail("boot", e); }
  __buildPad();
  __layout();
  if (CFG.mode !== "3d") { ctx2d.fillStyle = "#000"; ctx2d.fillRect(0, 0, CFG.w, CFG.h); }
  __showTitle();
  requestAnimationFrame(__frame);
}

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.player = {
      x: api.W / 2,
      y: 180,
      r: 16,
      targetX: api.W / 2,
      vx: 0,
      lightBoost: 0,
      angle: 0
    };
    this.sparkCooldown = 0;
    this.sparkDuration = 0;
    this.sparkMax = 3.0; // リチャージ3秒
    this.obstacles = [];
    this.items = [];
    this.particles = [];
    this.bgStars = [];
    for (let i = 0; i < 35; i++) {
      this.bgStars.push({
        x: api.util.rand(10, api.W - 10),
        y: api.util.rand(0, api.H),
        r: api.util.rand(1.5, 3.5),
        color: api.util.choice(['#FFF', '#FFD1DC', '#FFE4B5', '#E0FFFF']),
        speed: api.util.rand(40, 90)
      });
    }
    this.spawnTimer = 2.0;
    this.itemTimer = 4.0;
    this.speed = 170;
    this.distPassed = 0;
    this.isDead = false;
    this.clearTime = 180;
    api.setScore(0);
  },

  update(dt) {
    if (this.isDead) return;

    const t = this.api.time;
    if (t >= this.clearTime) {
      this.api.sound.play('clear');
      this.api.clear();
      return;
    }

    // 落下速度の上昇
    this.speed = 180 + Math.min(t, 180) * 1.0;
    this.distPassed += this.speed * dt;
    this.api.setScore(Math.floor(t * 10) * 10);

    // プレイヤー左右移動（スワイプ、矢印キー、タッチドラッグにも対応）
    const moveStep = 80;
    if (this.api.input.leftPressed || this.api.input.swipe === 'left') {
      this.player.targetX = Math.max(30, this.player.targetX - moveStep);
    } else if (this.api.input.rightPressed || this.api.input.swipe === 'right') {
      this.player.targetX = Math.min(this.api.W - 30, this.player.targetX + moveStep);
    } else if (this.api.input.left) {
      this.player.targetX = Math.max(30, this.player.targetX - 240 * dt);
    } else if (this.api.input.right) {
      this.player.targetX = Math.min(this.api.W - 30, this.player.targetX + 240 * dt);
    }

    // タッチ/クリック操作：画面左右タップで移動、短タップでスパーク
    if (this.api.input.pointer.pressed) {
      this.touchStartX = this.api.input.pointer.x;
      this.touchStartY = this.api.input.pointer.y;
    }

    // シュガースパーク
    if (this.sparkCooldown > 0) {
      this.sparkCooldown = Math.max(0, this.sparkCooldown - dt);
    }
    if (this.sparkDuration > 0) {
      this.sparkDuration = Math.max(0, this.sparkDuration - dt);
    }

    // スパーク発動（tap、または Aボタン / スペース）
    if ((this.api.input.tap || this.api.input.aPressed) && this.sparkCooldown <= 0) {
      this.sparkDuration = 0.45;
      this.sparkCooldown = this.sparkMax;
      this.api.sound.tone(600, 0.05, 'triangle', 0.3, 1200);
      this.api.sound.tone(900, 0.08, 'sawtooth', 0.2, 1600);
      for (let i = 0; i < 20; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = this.api.util.rand(80, 260);
        this.particles.push({
          x: this.player.x,
          y: this.player.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 0.4,
          maxLife: 0.4,
          color: '#FFF8B0',
          r: this.api.util.rand(2, 4)
        });
      }
    }

    // スムーズ移動
    this.player.x = this.api.util.lerp(this.player.x, this.player.targetX, 0.22);
    this.player.angle += dt * 3.5;
    if (this.player.lightBoost > 0) {
      this.player.lightBoost = Math.max(0, this.player.lightBoost - dt);
    }

    // 背景星スクロール
    for (const s of this.bgStars) {
      s.y -= (this.speed * 0.4 + s.speed) * dt;
      if (s.y < -10) {
        s.y = this.api.H + 10;
        s.x = this.api.util.rand(10, this.api.W - 10);
      }
    }

    // 障害物スポーン（開始3秒は出さない）
    if (t > 3.0) {
      this.spawnTimer -= dt;
      const interval = Math.max(0.7, 1.9 - (t / 180) * 1.0);
      if (this.spawnTimer <= 0) {
        this.spawnTimer = interval;
        this.spawnObstacle(t);
      }

      this.itemTimer -= dt;
      if (this.itemTimer <= 0) {
        this.itemTimer = this.api.util.rand(4.0, 7.0);
        this.items.push({
          x: this.api.util.rand(40, this.api.W - 40),
          y: this.api.H + 20,
          r: 12,
          rot: 0
        });
      }
    }

    // 障害物更新
    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const o = this.obstacles[i];
      o.y -= this.speed * dt;
      if (o.type === 'candy') {
        o.rot += dt * 3;
      }
      if (t > 100 && o.wiggle) {
        o.x += Math.sin(t * 5 + o.wiggleSeed) * 40 * dt;
      }

      // 接近警告音（暗闇スリル演出）
      if (!o.warned && o.y < this.player.y + 160 && o.y > this.player.y) {
        o.warned = true;
        this.api.sound.tone(200, 0.04, 'square', 0.05, 150);
      }

      // 当たり判定
      let hit = false;
      if (o.type === 'wafer') {
        // 壁（隙間 holeX, holeW）
        if (Math.abs(this.player.y - o.y) < (o.h / 2 + this.player.r - 2)) {
          if (this.player.x - this.player.r < o.holeX - o.holeW / 2 ||
              this.player.x + this.player.r > o.holeX + o.holeW / 2) {
            hit = true;
          }
        }
      } else if (o.type === 'fork') {
        const d = this.api.util.dist(this.player.x, this.player.y, o.x, o.y);
        if (d < this.player.r + o.r - 3) hit = true;
      } else if (o.type === 'candy') {
        const d = this.api.util.dist(this.player.x, this.player.y, o.x, o.y);
        if (d < this.player.r + o.r - 3) hit = true;
      }

      if (hit) {
        this.isDead = true;
        this.api.sound.tone(140, 0.4, 'sawtooth', 0.4, 40);
        this.api.sound.play('explode');
        for (let k = 0; k < 25; k++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = this.api.util.rand(40, 200);
          this.particles.push({
            x: this.player.x,
            y: this.player.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 0.6,
            maxLife: 0.6,
            color: this.api.util.choice(['#FFF5A5', '#FFD1DC', '#FFA07A', '#FFFFFF']),
            r: this.api.util.rand(2, 6)
          });
        }
        setTimeout(() => this.api.gameOver(), 600);
        return;
      }

      if (o.y < -80) {
        this.obstacles.splice(i, 1);
      }
    }

    // アイテム更新
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.y -= this.speed * dt;
      it.rot += dt * 4;

      if (this.api.util.dist(this.player.x, this.player.y, it.x, it.y) < this.player.r + it.r) {
        this.player.lightBoost = 4.5;
        this.api.sound.play('powerup');
        this.api.addScore(200);
        for (let k = 0; k < 12; k++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = this.api.util.rand(50, 150);
          this.particles.push({
            x: it.x,
            y: it.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 0.35,
            maxLife: 0.35,
            color: '#FFE600',
            r: 3
          });
        }
        this.items.splice(i, 1);
        continue;
      }
      if (it.y < -30) {
        this.items.splice(i, 1);
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  },

  spawnObstacle(t) {
    const types = ['candy', 'fork'];
    if (t > 15) types.push('wafer');
    const pick = this.api.util.choice(types);

    if (pick === 'wafer') {
      const holeW = Math.max(68, 95 - (t / 180) * 22);
      this.obstacles.push({
        type: 'wafer',
        x: this.api.W / 2,
        y: this.api.H + 40,
        h: 22,
        holeX: this.api.util.rand(holeW / 2 + 20, this.api.W - holeW / 2 - 20),
        holeW: holeW,
        wiggle: t > 110,
        wiggleSeed: Math.random() * 10
      });
    } else if (pick === 'candy') {
      const r = this.api.util.rand(24, 32);
      this.obstacles.push({
        type: 'candy',
        x: this.api.util.rand(40, this.api.W - 40),
        y: this.api.H + 30,
        r: r,
        rot: 0,
        c1: this.api.util.choice(['#FF4B6E', '#800020', '#FF85A2']),
        c2: '#FFFFFF',
        wiggle: t > 90,
        wiggleSeed: Math.random() * 10
      });
    } else {
      // fork
      this.obstacles.push({
        type: 'fork',
        x: this.api.util.rand(40, this.api.W - 40),
        y: this.api.H + 30,
        r: 18,
        wiggle: t > 70,
        wiggleSeed: Math.random() * 10
      });
    }
  },

  draw(ctx) {
    const W = this.api.W;
    const H = this.api.H;

    // 1. 深いビターチョコ色の背景
    ctx.fillStyle = '#1A1110';
    ctx.fillRect(0, 0, W, H);

    // 背景の砂糖ダスト
    for (const s of this.bgStars) {
      ctx.fillStyle = s.color;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // 2. オブジェクト描画（暗闇の前）
    // アイテム（ミニスターシュガー）
    for (const it of this.items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(it.rot);
      ctx.fillStyle = '#FFE57F';
      ctx.shadowColor = '#FFE57F';
      ctx.shadowBlur = 10;
      this.drawStar(ctx, 0, 0, 5, it.r, it.r * 0.45);
      ctx.restore();
    }

    // 障害物
    for (const o of this.obstacles) {
      if (o.type === 'wafer') {
        ctx.fillStyle = '#C88A58';
        // 左側
        const leftW = o.holeX - o.holeW / 2;
        if (leftW > 0) {
          ctx.fillRect(0, o.y - o.h / 2, leftW, o.h);
          ctx.fillStyle = '#E8B98A';
          ctx.fillRect(0, o.y - 3, leftW, 6);
        }
        // 右側
        const rightX = o.holeX + o.holeW / 2;
        ctx.fillStyle = '#C88A58';
        ctx.fillRect(rightX, o.y - o.h / 2, W - rightX, o.h);
        ctx.fillStyle = '#E8B98A';
        ctx.fillRect(rightX, o.y - 3, W - rightX, 6);
      } else if (o.type === 'candy') {
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rot);
        ctx.beginPath();
        ctx.arc(0, 0, o.r, 0, Math.PI * 2);
        ctx.fillStyle = o.c1;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = o.c2;
        for (let a = 0; a < 4; a++) {
          ctx.beginPath();
          ctx.arc(0, 0, o.r * 0.7, a * Math.PI / 2, a * Math.PI / 2 + Math.PI / 4);
          ctx.stroke();
        }
        ctx.restore();
      } else if (o.type === 'fork') {
        // フォーク（金属感）
        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.fillStyle = '#DDE4EA';
        ctx.fillRect(-3, -16, 6, 36);
        // 先端
        for (let fx = -12; fx <= 12; fx += 8) {
          ctx.fillRect(fx - 1.5, -28, 3, 16);
        }
        ctx.fillRect(-12, -14, 24, 4);
        ctx.restore();
      }
    }

    // プレイヤー（金平糖）
    if (!this.isDead) {
      ctx.save();
      ctx.translate(this.player.x, this.player.y);
      ctx.rotate(this.player.angle);
      ctx.fillStyle = '#FFF5A5';
      ctx.shadowColor = '#FFF5A5';
      ctx.shadowBlur = 12;
      this.drawStar(ctx, 0, 0, 7, this.player.r, this.player.r * 0.55);
      ctx.restore();
    }

    // パーティクル
    for (const p of this.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. 暗闇レイヤー（シュガースパークで消える、または穴が空く）
    if (this.sparkDuration <= 0) {
      ctx.save();
      // 周囲のみくり抜き
      const baseR = 75;
      const radius = this.player.lightBoost > 0 ? baseR * 1.5 : baseR;
      const grad = ctx.createRadialGradient(
        this.player.x, this.player.y, radius * 0.3,
        this.player.x, this.player.y, radius
      );
      grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      grad.addColorStop(0.7, 'rgba(15, 8, 7, 0.75)');
      grad.addColorStop(1, 'rgba(12, 6, 5, 0.98)');

      // マスク描画: プレイヤー中心に穴を開けた巨大矩形
      ctx.fillStyle = 'rgba(12, 6, 5, 0.98)';
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.arc(this.player.x, this.player.y, radius, 0, Math.PI * 2, true);
      ctx.fill();

      // 円のフチのグラデーション
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.player.x, this.player.y, radius, 0, Math.PI * 2);
      ctx.fill();

      // 各自発光アイテムの周りもほんのり照らす
      for (const it of this.items) {
        const itemGrad = ctx.createRadialGradient(it.x, it.y, 4, it.x, it.y, 35);
        itemGrad.addColorStop(0, 'rgba(255, 230, 100, 0.25)');
        itemGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = itemGrad;
        ctx.beginPath();
        ctx.arc(it.x, it.y, 35, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    } else {
      // スパークフラッシュ演出
      ctx.save();
      ctx.fillStyle = `rgba(255, 255, 230, ${Math.min(0.35, this.sparkDuration)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 4. HUD
    this.drawHUD(ctx, W, H);
  },

  drawHUD(ctx, W, H) {
    ctx.save();
    // 経過時間＆残り時間
    const remain = Math.max(0, this.clearTime - this.api.time);
    const m = Math.floor(remain / 60);
    const s = Math.floor(remain % 60);
    const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`TIME: ${timeStr}`, 16, 32);

    ctx.textAlign = 'right';
    ctx.fillText(`SCORE: ${this.api.score}`, W - 16, 32);

    // スパークゲージ（画面下部）
    const gaugeW = 140;
    const gaugeH = 8;
    const gx = (W - gaugeW) / 2;
    const gy = H - 28;
    const ready = this.sparkCooldown <= 0;
    const ratio = ready ? 1 : 1 - (this.sparkCooldown / this.sparkMax);

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(gx - 2, gy - 2, gaugeW + 4, gaugeH + 4);

    ctx.fillStyle = ready ? '#FFF47D' : '#8B7D50';
    ctx.fillRect(gx, gy, gaugeW * ratio, gaugeH);

    ctx.fillStyle = '#FFF';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ready ? 'TAP: SPARK READY!' : 'SPARK CHARGING...', W / 2, gy - 6);

    ctx.restore();
  },

  drawStar(ctx, cx, cy, spikes, outerR, innerR) {
    let rot = Math.PI / 2 * 3;
    let x = cx;
    let y = cy;
    const step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerR;
      y = cy + Math.sin(rot) * outerR;
      ctx.lineTo(x, y);
      rot += step;

      x = cx + Math.cos(rot) * innerR;
      y = cy + Math.sin(rot) * innerR;
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerR);
    ctx.closePath();
    ctx.fill();
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
