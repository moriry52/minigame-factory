<script type="application/json" id="meta">{"id": "20261127-170403-local-llm", "title": "森のリズム・オービット", "summary": "森の動物を中心に、全方向から迫る葉っぱをリズムに合わせてスワイプで受け止め、動物のオービット（軌道）を安定させる落ちモノパズル。", "rules": ["中央の動物を中心に、全方向から葉っぱが降ってきます。", "葉っぱが動物の「オービットリング」に触れるタイミングで、その方向へスワイプして受け止めます。", "葉っぱの色（長さ）とスワイプの長さを一致させると「フルヒット」となり、より多くのスコアとハートゲージを得られます。", "BGMのリズムに合わせてスワイプすると「ハート」が発生し、オービットリングが拡大します。", "オービットリングが拡大すると、受ける範囲が広がり、次の葉っぱを受けやすくなります。", "リズムを外すとオービットリングが縮小し、受ける範囲が狭くなります。", "動物のハートゲージを満タンにしてステージクリアを目指します。"], "controls": {"スマホ": "葉っぱがオービットリングに触れた瞬間に、葉っぱの色（青=短め、赤=中、黄=長め）に合わせた長さで、その方向へ指をスワイプします。", "PC": "マウスを葉っぱの方向へ、葉っぱの色（青=短め、赤=中、黄=長め）に合わせた距離でドラッグ（スワイプ）します。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "タップ/スワイプ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}

const Game = {
  init(api) {
    this.api = api;
    const U = api.util;
    this.W = api.W; this.H = api.H;

    this.rings = []; this.trails = []; this.shake = 0;

    // 背景
    this.pollen = [];

      this.pollen.push({ x: U.rand(0, this.W), y: U.rand(0, this.H), r: U.rand(1, 2.4), s: U.rand(6, 16), ph: U.rand(0, 6.28) });
    }
    this.clouds = [];
    for (let i = 0; i < 4; i++) {
      this.clouds.push({ x: U.rand(0, this.W), y: U.rand(26, 110), s: U.rand(7, 14), w: U.rand(60, 110) });
    }
    this.bgTrees = [
      { x: 34, s: 0.95, ph: 0.4 }, { x: 108, s: 0.72, ph: 2.1 },
      { x: 214, s: 0.6, ph: 4.0 }, { x: 366, s: 0.66, ph: 1.2 },

  floater(x, y, text, color, size) {

  ring(x, y, maxR, color) {

      const len = this.api.util.dist(this.sw.sx, this.sw.sy, this.sw.cx, this.sw.cy);
      if (len >= 20) {
        const ang = this.api.util.angle(this.sw.sx, this.sw.sy, this.sw.cx, this.sw.cy);
        this.registerSwipe(ang, len, this.sw.sx, this.sw.sy, this.sw.cx, this.sw.cy);
      } else {
        this.ring(this.sw.cx, this.sw.cy, 20, 'rgba(255,255,255,0.5)');
      }
    }
    if (this.sw.active && !input.pointer.down) this.sw.active = false;

    // キーボード（中スワイプ扱い）
    const key = (ang) => this.registerSwipe(ang, 100, this.CX + Math.cos(ang) * 60, this.CY + Math.sin(ang) * 60, this.CX + Math.cos(ang) * 160, this.CY + Math.sin(ang) * 160);
    if (input.upPressed) key(-Math.PI / 2);
    if (input.downPressed) key(Math.PI / 2);
    if (input.leftPressed) key(Math.PI);
    if (input.rightPressed) key(0);

    this.updateFx(dt);
  },

  updateFx(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.g || 0) * dt;
      p.vx *= (1 - dt * 1.5);
    }
    for (let i = this.hearts.length - 1; i >= 0; i--) {
      const h = this.hearts[i];
      h.t += dt;
      if (h.t >= h.max) this.hearts.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.life -= dt; f.y -= 26 * dt;
      if (f.life <= 0) this.floats.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.trails.length - 1; i >= 0; i--) {
      const tr = this.trails[i];
      tr.life -= dt;
      if (tr.life <= 0) this.trails.splice(i, 1);
    }
  },

  drawHeartShape(ctx, x, y, s, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, 0.35);
    ctx.bezierCurveTo(-0.5, -0.05, -0.35, -0.5, 0, -0.18);
    ctx.bezierCurveTo(0.35, -0.5, 0.5, -0.05, 0, 0.35);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.08; ctx.stroke(); }
    ctx.restore();
  },

  drawLeaf(ctx, x, y, rot, type, ph) {
    const cols = [
      { body: '#7fc9ec', edge: '#5aa8d0', vein: '#d8f0fb' },
      { body: '#ff9d9d', edge: '#e07070', vein: '#ffe0e0' },
      { body: '#ffd977', edge: '#e0b44e', vein: '#fff3cd' }
    ][type];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot + Math.sin(ph) * 0.15);
    const s = 1 + Math.sin(ph * 2) * 0.06;
    ctx.scale(s, s);
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.bezierCurveTo(11, -8, 11, 8, 0, 14);
    ctx.bezierCurveTo(-11, 8, -11, -8, 0, -14);
    ctx.closePath();
    ctx.fillStyle = cols.body; ctx.fill();
    ctx.strokeStyle = cols.edge; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -11); ctx.lineTo(0, 11);
    ctx.moveTo(0, -4); ctx.lineTo(5, -8);
    ctx.moveTo(0, 2); ctx.lineTo(-5, -2);
    ctx.strokeStyle = cols.vein; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, 14); ctx.quadraticCurveTo(2, 18, 0, 21);
    ctx.strokeStyle = cols.edge; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  },

  drawAnimal(ctx, x, y, idx, squash, hurtShake, blink, t) {
    ctx.save();
    const shx = Math.sin(t * 40) * 3 * hurtShake;
    ctx.translate(x + shx, y + Math.sin(t * 2.2) * 3);
    const sq = 1 + squash * 0.12;
    ctx.scale(1 / sq, sq);
    const blinkK = Math.max(0.1, 1 - blink);

    if (idx === 0) { // リス
      ctx.fillStyle = '#c98d5a';
      ctx.beginPath();
      ctx.moveTo(14, 6);
      ctx.quadraticCurveTo(40, -2, 30, -30);
      ctx.quadraticCurveTo(24, -44, 12, -34);
      ctx.quadraticCurveTo(20, -16, 8, 2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e8c39a';
      ctx.beginPath();
      ctx.moveTo(26, -8);
      ctx.quadraticCurveTo(32, -22, 24, -32);
      ctx.quadraticCurveTo(18, -26, 20, -12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#d9a06b';
      ctx.beginPath(); ctx.ellipse(0, 6, 17, 15, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f5e3c8';
      ctx.beginPath(); ctx.ellipse(0, 10, 11, 9, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#d9a06b';
      ctx.beginPath(); ctx.ellipse(-9, -14, 5, 7, -0.3, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(9, -14, 5, 7, 0.3, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f5e3c8';
      ctx.beginPath(); ctx.ellipse(-9, -13, 2.5, 4, -0.3, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(9, -13, 2.5, 4, 0.3, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#d9a06b';
      ctx.beginPath(); ctx.arc(0, -6, 13, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#5b4636';
      ctx.beginPath(); ctx.ellipse(-5, -7, 2.2, 2.2 * blinkK, 0, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5, -7, 2.2, 2.2 * blinkK, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#e88fa0';
      ctx.beginPath(); ctx.arc(0, -3.5, 1.8, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#5b4636'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -2, 3, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = '#f5e3c8';
      ctx.beginPath(); ctx.ellipse(-6, 14, 3, 2.4, 0, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6, 14, 3, 2.4, 0, 0, 6.29); ctx.fill();
    } else if (idx === 1) { // うさぎ
      ctx.fillStyle = '#f2f0f7';
      ctx.beginPath(); ctx.ellipse(0, 8, 18, 16, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#fbfafd';
      ctx.beginPath(); ctx.ellipse(0, 12, 12, 10, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f2f0f7';
      ctx.beginPath(); ctx.ellipse(-7, -18, 5, 15, -0.15, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, -18, 5, 15, 0.15, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f7c9d9';
      ctx.beginPath(); ctx.ellipse(-7, -17, 2.4, 10, -0.15, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, -17, 2.4, 10, 0.15, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f2f0f7';
      ctx.beginPath(); ctx.arc(0, -4, 14, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#5b5666';
      ctx.beginPath(); ctx.ellipse(-5, -5, 2.2, 2.2 * blinkK, 0, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5, -5, 2.2, 2.2 * blinkK, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f2a9c0';
      ctx.beginPath(); ctx.arc(0, -1.5, 1.8, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#5b5666'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0.5, 3, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-2.5, 2, 2, 3.4); ctx.fillRect(0.5, 2, 2, 3.4);
      ctx.fillStyle = '#f2f0f7';
      ctx.beginPath(); ctx.arc(0, 22, 5, 0, 6.29); ctx.fill();
    } else { // きつね
      ctx.fillStyle = '#f0a35e';
      ctx.beginPath();
      ctx.moveTo(12, 4);
      ctx.quadraticCurveTo(36, 0, 32, -22);
      ctx.quadraticCurveTo(26, -30, 16, -20);
      ctx.quadraticCurveTo(20, -6, 6, 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff6ea';
      ctx.beginPath();
      ctx.moveTo(28, -20);
      ctx.quadraticCurveTo(32, -22, 31, -16);
      ctx.quadraticCurveTo(26, -14, 24, -18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f0a35e';
      ctx.beginPath(); ctx.ellipse(0, 8, 18, 15, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#fff6ea';
      ctx.beginPath(); ctx.ellipse(0, 12, 11, 8, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#f0a35e';
      ctx.beginPath();
      ctx.moveTo(-13, -8); ctx.lineTo(-16, -24); ctx.lineTo(-4, -13); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(13, -8); ctx.lineTo(16, -24); ctx.lineTo(4, -13); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7a5236';
      ctx.beginPath();
      ctx.moveTo(-13.5, -12); ctx.lineTo(-15.5, -22); ctx.lineTo(-9, -14); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(13.5, -12); ctx.lineTo(15.5, -22); ctx.lineTo(9, -14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f0a35e';
      ctx.beginPath(); ctx.arc(0, -6, 13, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#fff6ea';
      ctx.beginPath(); ctx.ellipse(0, -1, 8, 6, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#5b4636';
      ctx.beginPath(); ctx.ellipse(-5, -7, 2.2, 2.2 * blinkK, 0, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5, -7, 2.2, 2.2 * blinkK, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = '#5b4636';
      ctx.beginPath(); ctx.arc(0, -3, 2, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#5b4636'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, -1, 3, 0.2, Math.PI - 0.2); ctx.stroke();
    }
    ctx.restore();
  },

  drawBg(ctx, t) {
    const U = this.api.util;
    const g = ctx.createLinearGradient(0, 0, 0, this.H);
    g.addColorStop(0, '#eef8e6');
    g.addColorStop(0.5, '#d8efcf');
    g.addColorStop(1, '#c2e5b2');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.W, this.H);

    // 太陽
    ctx.fillStyle = 'rgba(255,244,200,0.8)';
    ctx.beginPath(); ctx.arc(396, 74, 34, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,250,225,0.9)';
    ctx.beginPath(); ctx.arc(396, 74, 22, 0, 6.29); ctx.fill();

    // 雲
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (const c of this.clouds) {
      const cx = ((c.x + t * c.s) % (this.W + 160)) - 80;
      ctx.beginPath();
      ctx.ellipse(cx, c.y, c.w * 0.5, 14, 0, 0, 6.29);
      ctx.ellipse(cx + c.w * 0.28, c.y - 8, c.w * 0.3, 12, 0, 0, 6.29);
      ctx.ellipse(cx - c.w * 0.28, c.y - 5, c.w * 0.26, 10, 0, 0, 6.29);
      ctx.fill();
    }

    // 丘
    ctx.fillStyle = '#bfe3ad';
    ctx.beginPath();
    ctx.ellipse(90, this.H + 60, 260, 150, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#b2dca2';
    ctx.beginPath();
    ctx.ellipse(this.W - 60, this.H + 70, 280, 160, 0, 0, 6.29); ctx.fill();

    // 木
    for (const tr of this.bgTrees) {
      const sway = Math.sin(t * 0.8 + tr.ph) * 3;
      const s = tr.s;
      ctx.fillStyle = '#c9a27e';
      ctx.fillRect(tr.x - 5 * s, this.H - 60 * s, 10 * s, 60 * s);
      ctx.fillStyle = '#9fd39a';
      ctx.beginPath();
      ctx.arc(tr.x + sway, this.H - 66 * s, 34 * s, 0, 6.29);
      ctx.arc(tr.x - 22 * s + sway, this.H - 48 * s, 26 * s, 0, 6.29);
      ctx.arc(tr.x + 22 * s + sway, this.H - 48 * s, 26 * s, 0, 6.29);
      ctx.fill();
      ctx.fillStyle = '#b7e0ae';
      ctx.beginPath();
      ctx.arc(tr.x - 8 * s + sway, this.H - 74 * s, 18 * s, 0, 6.29);
      ctx.fill();
    }

    // 花
    const flowers = [[60, 430], [150, 452], [330, 446], [420, 428], [250, 462]];
    for (const f of flowers) {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let k = 0; k < 5; k++) {
        const a = k * 1.257 + t * 0.2;
        ctx.beginPath(); ctx.arc(f[0] + Math.cos(a) * 4, f[1] + Math.sin(a) * 4, 2.6, 0, 6.29); ctx.fill();
      }
      ctx.fillStyle = '#ffd977';
      ctx.beginPath(); ctx.arc(f[0], f[1], 2.4, 0, 6.29); ctx.fill();
    }

    // 花粉
    for (const p of this.pollen) {
      const py = (p.y - t * p.s) % this.H;
      const yy = py < 0 ? py + this.H : py;
      const px = p.x + Math.sin(t * 0.7 + p.ph) * 12;
      ctx.fillStyle = 'rgba(255,255,240,' + (0.35 + 0.3 * Math.sin(t * 2 + p.ph)).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(px, yy, p.r, 0, 6.29); ctx.fill();
    }
  },

  draw(ctx) {
    const U = this.api.util;
    const t = this.t;
    ctx.save();
    if (this.shake > 0) ctx.translate(U.rand(-this.shake, this.shake) * 0.5, U.rand(-this.shake, this.shake) * 0.5);

    this.drawBg(ctx, t);

    // 中央の草地
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(this.CX, this.CY + 46, 120, 34, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.ellipse(this.CX, this.CY + 46, 80, 22, 0, 0, 6.29); ctx.fill();

    // オービットリング
    const R = this.orbit;
    const pulse = this.beatPulse;
    ctx.save();
    ctx.translate(this.CX, this.CY);
    ctx.rotate(t * 0.1);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 3 + pulse * 3;
    ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.arc(0, 0, R + 6 + pulse * 4, 0, 6.29); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,190,215,' + (0.55 + this.orbitFlash * 0.4).toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, R - 5, 0, 6.29); ctx.stroke();
    ctx.restore();

    // 拍子ドット
    for (let k = 0; k < 8; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 4;
      const dx = this.CX + Math.cos(a) * (R + 22);
      const dy = this.CY + Math.sin(a) * (R + 22);
      const active = ((this.beatIdx % 8) + 8) % 8 === k;
      const near = active && pulse > 0.4;
      ctx.fillStyle = active ? (near ? '#ff9ec4' : 'rgba(255,158,196,0.7)') : 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(dx, dy, active ? 4.5 + pulse * 2 : 3, 0, 6.29); ctx.fill();
      if (active) {
        ctx.strokeStyle = 'rgba(255,158,196,0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(dx, dy, 7 + pulse * 5, 0, 6.29); ctx.stroke();
      }
    }

    // 葉っぱ
    for (const L of this.leaves) {
      const d = U.dist(L.x, L.y, this.CX, this.CY);
      const inWin = Math.abs(d - R) < this.catchWindow();
      if (inWin) {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(L.x, L.y, 19 + Math.sin(t * 10) * 2, 0, 6.29); ctx.stroke();
      }
      this.drawLeaf(ctx, L.x, L.y, L.rot, L.type, L.ph + t * 3);
    }

    // 動物
    const swapScale = 1 - this.swapT * 0.3;
    ctx.save();
    ctx.translate(this.CX, this.CY);
    ctx.scale(swapScale, swapScale);
    ctx.translate(-this.CX, -this.CY);
    this.drawAnimal(ctx, this.CX, this.CY, this.animalIdx, this.squash, this.hurtShake, this.blink, t);
    ctx.restore();

    // スワイプ軌跡
    for (const tr of this.trails) {
      const k = tr.life / tr.max;
      ctx.strokeStyle = 'rgba(255,255,255,' + (k * 0.8).toFixed(2) + ')';
      ctx.lineWidth = 5 * k + 1;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tr.sx, tr.sy); ctx.lineTo(tr.ex, tr.ey); ctx.stroke();
    }

    // リングFX
    for (const r of this.rings) {
      const k = 1 - r.life / r.max;
      ctx.strokeStyle = r.c;
      ctx.globalAlpha = r.life / r.max;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, U.lerp(r.r, r.maxR, k), 0, 6.29); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // ハート
    for (const h of this.hearts) {
      const k = h.t / h.max;
      const hx = U.lerp(h.x, this.CX, k * k);
      const hy = U.lerp(h.y, this.CY - 60, k) - Math.sin(k * Math.PI) * 30;
      this.drawHeartShape(ctx, hx, hy, 14 * (1 - k * 0.4), 'rgba(255,120,160,' + (1 - k).toFixed(2) + ')');
    }

    // パーティクル
    for (const p of this.parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // フロートテキスト
    for (const f of this.floats) {
      ctx.globalAlpha = Math.min(1, f.life / f.max * 1.5);
      ctx.font = 'bold ' + f.size + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.c;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // ダメージフラッシュ
    if (this.hurtFlash > 0) {
      ctx.fillStyle = 'rgba(255,110,130,' + (this.hurtFlash * 0.18).toFixed(2) + ')';
      ctx.fillRect(0, 0, this.W, this.H);
    }

    this.drawHud(ctx, t);
    ctx.restore();
  },

  drawHud(ctx, t) {
    const U = this.api.util;
    // パネル
    ctx.fillStyle = 'rgba(255,252,240,0.78)';
    ctx.strokeStyle = 'rgba(120,170,120,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(12, 10, 456, 44, 12); else ctx.rect(12, 10, 456, 44);
    ctx.fill(); ctx.stroke();

    // スコア
    ctx.textAlign = 'left';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillStyle = '#4a7c59';
    ctx.fillText('スコア ' + Math.floor(this.api.score || 0), 26, 38);

    // ハートゲージ
    const bx = 190, by = 24, bw = 220, bh = 16;
    this.drawHeartShape(ctx, bx - 14, by + bh / 2, 13, '#ff8fb3', '#e06a92');
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8); else ctx.rect(bx, by, bw, bh);
    ctx.fill();
    const gw = bw * U.clamp(this.gauge / this.gaugeMax, 0, 1);
    if (gw > 2) {
      const gg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      gg.addColorStop(0, '#ffb3cf');
      gg.addColorStop(1, '#ff7fae');
      ctx.fillStyle = gg;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, gw, bh, 8); else ctx.rect(bx, by, gw, bh);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx + 3, by + 2, Math.max(2, gw - 6), 5, 4); else ctx.rect(bx + 3, by + 2, Math.max(2, gw - 6), 5);
      ctx.fill();
    }
    ctx.strokeStyle = this.gauge < 25 ? 'rgba(230,100,120,' + (0.6 + 0.4 * Math.sin(t * 8)).toFixed(2) + ')' : 'rgba(224,106,146,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8); else ctx.rect(bx, by, bw, bh);
    ctx.stroke();
    ctx.textAlign = 'right';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = '#c25a7c';
    ctx.fillText(Math.floor(this.gauge) + '%', bx + bw + 22, by + bh - 2);

    // コンボ
    if (this.combo >= 3) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillStyle = '#e0789e';
      ctx.fillText('コンボ ×' + this.combo, this.CX, 72);
    }

    // 進行度
    ctx.fillStyle = 'rgba(120,170,120,0.35)';
    ctx.fillRect(12, 58, 456, 4);
    ctx.fillStyle = 'rgba(120,170,120,0.7)';
    ctx.fillRect(12, 58, 456 * U.clamp(t / this.TOTAL, 0, 1), 4);

    // 長さヒント
    ctx.textAlign = 'center';
    ctx.font = '12px sans-serif';
    ctx.fillStyle = 'rgba(74,124,89,0.85)';
    ctx.fillText('スワイプ: 青=短め / 赤=中 / 黄=長め ・ 拍子に合わせるとオービット拡大!', this.CX, this.H - 14);
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
