<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.time = 0;
    this.maxTime = 180; // 3分

    // プレイヤー設定
    this.player = {
      x: api.W / 2,
      y: api.H / 2,
      r: 13,
      hp: 3,
      invTimer: 3.0, // 開始3秒無敵
      speed: 220,
      angle: -Math.PI / 2,
      shootTimer: 0
    };

    // クリーム安全エリア (円形)
    this.creamR = 225;
    this.minCreamR = 30;
    this.maxCreamR = 230;
    this.baseShrinkRate = 2.2; // 毎秒の収縮量

    // コンボシステム
    this.combo = 0;
    this.comboTimer = 0;

    // 配列管理
    this.bullets = [];      // プレイヤー弾
    this.enemyBullets = []; // 敵弾
    this.enemies = [];      // 敵
    this.strawberries = []; // イチゴドロップ
    this.particles = [];    // パーティクル

    this.spawnTimer = 1.5;
    this.warnSoundTimer = 0;
  },

  update(dt) {
    this.time += dt;

    // タイムアップ判定 (3分完走)
    if (this.time >= this.maxTime) {
      this.api.addScore(50000 + this.player.hp * 10000);
      this.api.sound.play('clear');
      this.api.clear();
      return;
    }

    // 操作入力（ドラッグ相対移動 + キーボード）
    const p = this.player;
    let mx = 0, my = 0;
    const inp = this.api.input;

    if (inp.pointer.down) {
      p.x += inp.pointer.dx;
      p.y += inp.pointer.dy;
      if (Math.hypot(inp.pointer.dx, inp.pointer.dy) > 0.5) {
        p.angle = Math.atan2(inp.pointer.dy, inp.pointer.dx);
      }
    }

    if (inp.left) mx -= 1;
    if (inp.right) mx += 1;
    if (inp.up) my -= 1;
    if (inp.down) my += 1;

    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      p.x += (mx / len) * p.speed * dt;
      p.y += (my / len) * p.speed * dt;
      p.angle = Math.atan2(my, mx);
    }

    // 安全エリアの縮小
    const progress = this.time / this.maxTime;
    const shrinkRate = this.baseShrinkRate + progress * 2.5;
    if (this.time > 3.0) {
      this.creamR = Math.max(this.minCreamR, this.creamR - shrinkRate * dt);
    }

    // クリーム接近警告音（ピンチ時）
    if (this.creamR < 80) {
      this.warnSoundTimer -= dt;
      if (this.warnSoundTimer <= 0) {
        this.api.sound.tone(130, 0.15, 'triangle', 0.2, 90);
        this.warnSoundTimer = 0.8;
      }
    }

    // クリーム境界によるプレイヤー拘束
    const cx = this.api.W / 2;
    const cy = this.api.H / 2;
    const distFromCenter = this.api.util.dist(p.x, p.y, cx, cy);
    const maxAllowedDist = Math.max(0, this.creamR - p.r);

    if (distFromCenter > maxAllowedDist) {
      const a = Math.atan2(p.y - cy, p.x - cx);
      p.x = cx + Math.cos(a) * maxAllowedDist;
      p.y = cy + Math.sin(a) * maxAllowedDist;
    }

    // クリームに押しつぶされた場合
    if (this.creamR <= this.minCreamR + 2) {
      this.hitPlayer(999);
      return;
    }

    // 無敵タイマー減衰
    if (p.invTimer > 0) p.invTimer -= dt;

    // コンボタイマー
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.combo = 0;
    }

    // オート射撃
    p.shootTimer -= dt;
    if (p.shootTimer <= 0) {
      p.shootTimer = 0.2; // 秒間5発
      this.shootPlayerBullet();
    }

    // 敵の出現
    this.spawnTimer -= dt;
    const spawnInterval = Math.max(0.45, 1.8 - progress * 1.3);
    if (this.spawnTimer <= 0) {
      this.spawnTimer = spawnInterval;
      this.spawnEnemy();
    }

    // プレイヤー弾の更新
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -20 || b.x > this.api.W + 20 || b.y < -20 || b.y > this.api.H + 20) {
        this.bullets.splice(i, 1);
      }
    }

    // 敵弾の更新
    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
      const eb = this.enemyBullets[i];
      eb.x += eb.vx * dt;
      eb.y += eb.vy * dt;
      eb.life -= dt;

      // プレイヤー接触判定
      if (p.invTimer <= 0 && this.api.util.dist(p.x, p.y, eb.x, eb.y) < p.r + eb.r) {
        this.createExplosion(eb.x, eb.y, '#f5a', 6);
        this.enemyBullets.splice(i, 1);
        this.hitPlayer(1);
        continue;
      }

      if (eb.life <= 0 || eb.x < -20 || eb.x > this.api.W + 20 || eb.y < -20 || eb.y > this.api.H + 20) {
        this.enemyBullets.splice(i, 1);
      }
    }

    // 敵の更新
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.age += dt;

      // 敵固有の動き
      if (e.type === 0) { // クッキー (直進低速)
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        e.vx = this.api.util.lerp(e.vx, Math.cos(a) * e.speed, dt * 1.5);
        e.vy = this.api.util.lerp(e.vy, Math.sin(a) * e.speed, dt * 1.5);
      } else if (e.type === 1) { // マカロン (波打ち高速)
        const a = Math.atan2(p.y - e.y, p.x - e.x) + Math.sin(e.age * 6) * 0.9;
        e.vx = Math.cos(a) * e.speed;
        e.vy = Math.sin(a) * e.speed;
      } else if (e.type === 2) { // ドーナツ (超低速・タフ)
        const a = Math.atan2(cy - e.y, cx - e.x);
        e.vx = Math.cos(a) * e.speed;
        e.vy = Math.sin(a) * e.speed;

        // 後半ならフォンダン弾を発射
        if (this.time > 80) {
          e.shootCooldown = (e.shootCooldown || 3.0) - dt;
          if (e.shootCooldown <= 0) {
            e.shootCooldown = 2.8;
            this.shootEnemyBullet(e.x, e.y, p.x, p.y);
          }
        }
      } else if (e.type === 3) { // 分裂ドーナツ
        const a = Math.atan2(p.y - e.y, p.x - e.x);
        e.vx = Math.cos(a) * e.speed;
        e.vy = Math.sin(a) * e.speed;
      }

      e.x += e.vx * dt;
      e.y += e.vy * dt;

      // プレイヤー弾との判定
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (this.api.util.dist(e.x, e.y, b.x, b.y) < e.r + b.r) {
          e.hp -= 1;
          this.bullets.splice(j, 1);
          this.createHitSparks(b.x, b.y, b.color);
          this.api.sound.tone(480 + Math.random() * 80, 0.05, 'square', 0.1);

          if (e.hp <= 0) {
            this.killEnemy(e);
            this.enemies.splice(i, 1);
            break;
          }
        }
      }

      // プレイヤーとの直接激突
      if (e.hp > 0 && p.invTimer <= 0 && this.api.util.dist(p.x, p.y, e.x, e.y) < p.r + e.r) {
        this.hitPlayer(1);
        e.hp -= 2;
        if (e.hp <= 0) {
          this.killEnemy(e);
          this.enemies.splice(i, 1);
        }
      }
    }

    // イチゴアイテム更新
    for (let i = this.strawberries.length - 1; i >= 0; i--) {
      const s = this.strawberries[i];
      s.life -= dt;
      // プレイヤーへ吸い寄せ
      const d = this.api.util.dist(p.x, p.y, s.x, s.y);
      if (d < 85) {
        const a = Math.atan2(p.y - s.y, p.x - s.x);
        s.x += Math.cos(a) * 190 * dt;
        s.y += Math.sin(a) * 190 * dt;
      }

      // 取得判定
      if (d < p.r + s.r) {
        this.collectStrawberry(s);
        this.strawberries.splice(i, 1);
        continue;
      }

      if (s.life <= 0) {
        this.strawberries.splice(i, 1);
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      pt.vx *= 0.94;
      pt.vy *= 0.94;
      if (pt.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  },

  shootPlayerBullet() {
    const p = this.player;
    // 最も近い敵を狙う
    let target = null;
    let minDist = 380;
    for (const e of this.enemies) {
      const d = this.api.util.dist(p.x, p.y, e.x, e.y);
      if (d < minDist) {
        minDist = d;
        target = e;
      }
    }

    let a = p.angle;
    if (target) {
      a = Math.atan2(target.y - p.y, target.x - p.x);
    }

    const colors = ['#ff5992', '#5ce1e6', '#ffde59', '#7ed957', '#cb6ce6'];
    const col = this.api.util.choice(colors);
    const speed = 400;

    this.bullets.push({
      x: p.x + Math.cos(a) * 14,
      y: p.y + Math.sin(a) * 14,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      r: 4.5,
      life: 1.2,
      color: col
    });

    this.api.sound.tone(680 + Math.random() * 100, 0.04, 'triangle', 0.15, 900);
  },

  shootEnemyBullet(sx, sy, tx, ty) {
    const a = Math.atan2(ty - sy, tx - sx);
    const spd = 130;
    this.enemyBullets.push({
      x: sx,
      y: sy,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      r: 5,
      life: 4.0
    });
    this.api.sound.tone(280, 0.08, 'sawtooth', 0.1, 140);
  },

  spawnEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const dist = 260;
    const x = this.api.W / 2 + Math.cos(angle) * dist;
    const y = this.api.H / 2 + Math.sin(angle) * dist;

    // 出現タイプの抽選
    const r = Math.random();
    let type = 0; // 0: クッキー, 1: マカロン, 2: ドーナツ
    if (this.time < 30) {
      type = r < 0.75 ? 0 : 1;
    } else {
      if (r < 0.45) type = 0;
      else if (r < 0.8) type = 1;
      else type = 2;
    }

    let hp = 3, spd = 45, radius = 15;
    if (type === 1) { hp = 1; spd = 85; radius = 12; }
    if (type === 2) { hp = 7; spd = 28; radius = 22; }

    this.enemies.push({
      type,
      x, y,
      vx: 0, vy: 0,
      r: radius,
      hp,
      maxHp: hp,
      speed: spd,
      age: 0
    });
  },

  killEnemy(e) {
    this.createExplosion(e.x, e.y, '#e89f65', 12);
    this.api.sound.tone(180, 0.12, 'sawtooth', 0.25, 60);

    const basePts = [100, 150, 400, 120][e.type];
    this.api.addScore(basePts);

    // イチゴのドロップ（大敵は複数）
    const count = e.type === 2 ? 3 : 1;
    for (let k = 0; k < count; k++) {
      this.strawberries.push({
        x: e.x + (Math.random() - 0.5) * 16,
        y: e.y + (Math.random() - 0.5) * 16,
        r: 8,
        life: 8.0,
        bob: Math.random() * Math.PI * 2
      });
    }

    // ドーナツ分裂
    if (e.type === 2) {
      for (let k = 0; k < 2; k++) {
        const off = (k === 0 ? 1 : -1) * 15;
        this.enemies.push({
          type: 3,
          x: e.x + off,
          y: e.y + off,
          vx: 0, vy: 0,
          r: 12,
          hp: 2,
          maxHp: 2,
          speed: 55,
          age: 0
        });
      }
    }
  },

  collectStrawberry(s) {
    this.combo++;
    this.comboTimer = 2.5;

    // クリームを押し戻す
    const pushBack = Math.min(8.0, 3.5 + this.combo * 0.4);
    this.creamR = Math.min(this.maxCreamR, this.creamR + pushBack);

    const pts = 200 + this.combo * 50;
    this.api.addScore(pts);

    // 回収パーティクル
    this.createExplosion(s.x, s.y, '#ff3b69', 8);

    // ピロリン高音
    const f = Math.min(1400, 750 + this.combo * 45);
    this.api.sound.tone(f, 0.08, 'sine', 0.2, f + 250);
  },

  hitPlayer(dmg) {
    this.player.hp -= dmg;
    this.player.invTimer = 1.6;
    this.api.sound.play('hurt');
    this.createExplosion(this.player.x, this.player.y, '#ffffff', 18);

    if (this.player.hp <= 0) {
      this.api.sound.play('over');
      this.api.gameOver();
    }
  },

  createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 30 + Math.random() * 120;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        r: 2 + Math.random() * 3,
        color,
        life: 0.35 + Math.random() * 0.25
      });
    }
  },

  createHitSparks(x, y, color) {
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * 60,
        vy: Math.sin(a) * 60,
        r: 2,
        color,
        life: 0.15
      });
    }
  },

  draw(ctx) {
    const W = this.api.W;
    const H = this.api.H;
    const cx = W / 2;
    const cy = H / 2;

    // 1. 背景テーブルクロス（ピンクのギンガムチェック）
    ctx.fillStyle = '#ffedf2';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fed6e2';
    const tileSize = 24;
    for (let x = 0; x < W; x += tileSize * 2) {
      ctx.fillRect(x, 0, tileSize, H);
    }
    for (let y = 0; y < H; y += tileSize * 2) {
      ctx.fillRect(0, y, W, tileSize);
    }

    // 2. クリームの壁（外周から中央へ迫るホイップ）
    ctx.save();
    ctx.beginPath();
    // 全体を覆う四角
    ctx.rect(0, 0, W, H);
    // 安全円エリアをくり抜く（反時計回り）
    const steps = 36;
    const waveT = this.time * 2.5;
    for (let i = steps; i >= 0; i--) {
      const th = (i / steps) * Math.PI * 2;
      // 生クリーム特有のモコモコ波
      const r = this.creamR + Math.sin(th * 9 + waveT) * 4 + Math.cos(th * 3 - waveT * 0.5) * 3;
      const px = cx + Math.cos(th) * Math.max(0, r);
      const py = cy + Math.sin(th) * Math.max(0, r);
      if (i === steps) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#fffdf7';
    ctx.fill();

    // クリームの縁に淡い影とホイップライン
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#f3e5db';
    ctx.stroke();
    ctx.restore();

    // 3. イチゴの描画
    for (const s of this.strawberries) {
      const bob = Math.sin(this.time * 6 + s.bob) * 2;
      ctx.save();
      ctx.translate(s.x, s.y + bob);
      // 実
      ctx.fillStyle = '#ff2a55';
      ctx.beginPath();
      ctx.moveTo(0, 7);
      ctx.quadraticCurveTo(8, 0, 6, -5);
      ctx.quadraticCurveTo(0, -7, -6, -5);
      ctx.quadraticCurveTo(-8, 0, 0, 7);
      ctx.fill();
      // ヘタ
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(0, -6, 3.5, 0, Math.PI * 2);
      ctx.fill();
      // つぶつぶ
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(-2, -1, 1.5, 1.5);
      ctx.fillRect(2, -1, 1.5, 1.5);
      ctx.fillRect(0, 2, 1.5, 1.5);
      ctx.restore();
    }

    // 4. 敵の描画
    for (const e of this.enemies) {
      ctx.save();
      ctx.translate(e.x, e.y);

      if (e.type === 0) { // クッキー
        ctx.fillStyle = '#c88647';
        ctx.beginPath();
        ctx.arc(0, 0, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8d5022';
        ctx.lineWidth = 2;
        ctx.stroke();
        // チョコチップ
        ctx.fillStyle = '#42210b';
        ctx.fillRect(-6, -5, 3, 3);
        ctx.fillRect(3, -4, 3.5, 3.5);
        ctx.fillRect(-2, 4, 3, 3);
        ctx.fillRect(4, 3, 2.5, 2.5);
      } else if (e.type === 1) { // マカロン
        ctx.fillStyle = '#a8e6cf';
        ctx.beginPath();
        ctx.ellipse(0, 0, e.r, e.r * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-e.r + 2, -2, (e.r - 2) * 2, 4);
        ctx.strokeStyle = '#68b59b';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (e.type === 2 || e.type === 3) { // ドーナツ
        const outer = e.r;
        const inner = e.r * 0.38;
        ctx.fillStyle = '#f3a663';
        ctx.beginPath();
        ctx.arc(0, 0, outer, 0, Math.PI * 2);
        ctx.fill();
        // チョコがけ
        ctx.fillStyle = '#ff70a6';
        ctx.beginPath();
        ctx.arc(0, 0, outer * 0.88, 0, Math.PI * 2);
        ctx.fill();
        // 穴
        ctx.fillStyle = '#fed6e2';
        ctx.beginPath();
        ctx.arc(0, 0, inner, 0, Math.PI * 2);
        ctx.fill();
        // カラフルスプレー
        ctx.fillStyle = '#fff';
        ctx.fillRect(-8, -8, 3, 1.5);
        ctx.fillRect(6, -6, 1.5, 3);
        ctx.fillRect(-6, 6, 3, 1.5);
        ctx.fillRect(5, 5, 1.5, 3);
      }

      // 耐久ゲージ（ボス・大型ドーナツのみ）
      if (e.maxHp > 3) {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(-16, -e.r - 8, 32, 4);
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(-16, -e.r - 8, 32 * (e.hp / e.maxHp), 4);
      }

      ctx.restore();
    }

    // 5. 敵弾（フォンダン弾）
    for (const eb of this.enemyBullets) {
      ctx.save();
      ctx.fillStyle = '#9b5de5';
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f15bb5';
      ctx.beginPath();
      ctx.arc(eb.x - 1.5, eb.y - 1.5, eb.r * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 6. プレイヤー弾（金平糖）
    for (const b of this.bullets) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = b.color;
      // 突起のある星形金平糖
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const rad = (k / 6) * Math.PI * 2;
        const rad2 = rad + Math.PI / 6;
        const r1 = b.r * 1.2;
        const r2 = b.r * 0.6;
        if (k === 0) ctx.moveTo(Math.cos(rad) * r1, Math.sin(rad) * r1);
        else ctx.lineTo(Math.cos(rad) * r1, Math.sin(rad) * r1);
        ctx.lineTo(Math.cos(rad2) * r2, Math.sin(rad2) * r2);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 7. パーティクル
    for (const pt of this.particles) {
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, Math.max(0.5, pt.r * (pt.life / 0.5)), 0, Math.PI * 2);
      ctx.fill();
    }

    // 8. プレイヤー描画（星型アラザン砲台）
    const p = this.player;
    const isFlashing = p.invTimer > 0 && Math.floor(this.time * 16) % 2 === 0;
    if (!isFlashing) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);

      // 銀色・水色グラデーションの星型アラザン
      ctx.fillStyle = '#e0f2fe';
      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a1 = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const a2 = a1 + (2 * Math.PI) / 10;
        const r1 = p.r * 1.35;
        const r2 = p.r * 0.65;
        if (i === 0) ctx.moveTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
        else ctx.lineTo(Math.cos(a1) * r1, Math.sin(a1) * r1);
        ctx.lineTo(Math.cos(a2) * r2, Math.sin(a2) * r2);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 砲口
      ctx.fillStyle = '#0369a1';
      ctx.beginPath();
      ctx.arc(7, 0, 4.5, 0, Math.PI * 2);
      ctx.fill();

      // 中心ハイライト
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-2, -3, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 9. HUD 表示
    this.drawHUD(ctx);
  },

  drawHUD(ctx) {
    const W = this.api.W;

    // 上部バー背景（半透明）
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.fillRect(0, 0, W, 42);
    ctx.fillStyle = '#f3a6b8';
    ctx.fillRect(0, 41, W, 2);

    // スコア
    ctx.fillStyle = '#be185d';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${this.api.score}`, 14, 26);

    // 残り時間
    const remain = Math.max(0, Math.ceil(this.maxTime - this.time));
    const mins = Math.floor(remain / 60);
    const secs = String(remain % 60).padStart(2, '0');
    ctx.textAlign = 'center';
    ctx.fillStyle = remain < 30 ? '#dc2626' : '#475569';
    ctx.fillText(`TIME: ${mins}:${secs}`, W / 2, 26);

    // ライフ (ハート)
    ctx.textAlign = 'right';
    let hearts = '';
    for (let i = 0; i < 3; i++) {
      hearts += i < this.player.hp ? '❤️' : '🤍';
    }
    ctx.font = '16px sans-serif';
    ctx.fillText(hearts, W - 14, 26);

    // コンボ表示（回収時）
    if (this.combo > 1) {
      ctx.save();
      ctx.fillStyle = '#ff0055';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${this.combo} STRAWBERRY COMBO!`, W / 2, 64);
      ctx.restore();
    }

    // クリーム接近警告
    if (this.creamR < 80) {
      ctx.save();
      ctx.fillStyle = `rgba(220, 38, 38, ${0.5 + Math.sin(this.time * 8) * 0.4})`;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚠️ クリームが迫っています！ イチゴを拾え！ ⚠️', W / 2, this.api.H - 18);
      ctx.restore();
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
