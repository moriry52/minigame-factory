<style>

</div>
<script type="application/json" id="meta">{"id": "20261124-134953-gemini-flash", "title": "ツインルーン", "summary": "正反対に動く2体の使い魔を操り、古代遺跡のギミックを解き明かすシンクロパズル！制限時間3分でどれだけ多くの祭壇を起動できるか挑もう。", "rules": ["十字キーで太陽の使い魔（順行）と月の使い魔（点対称で逆行）が2体同時に動きます。", "2体の間を結ぶ光の糸をルーンストーンに接触させると回収でき、スコアとコンボ倍率が増加します。", "部屋にある2つの祭壇に太陽と月を同時に重ねると部屋クリアとなり、残り時間が増加して次のパズルへ進みます。", "制限時間3分（180秒）以内に解いた部屋数と回収したルーンの合計スコアを競います。"], "controls": {"スマホ": "画面下の十字キーで2体同時に移動。リンクボタン（Aボタン）を押している間、2体の間に光の糸を張ります。", "PC": "矢印キー/WASDで2体同時に移動。Zキー/Spaceキーを押している間、2体の間に光の糸を張ります。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "仮想パッド", "buttons": [{"key": "A", "label": "リンク"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {

  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;
    overlay.classList.remove("hidden");
    Input._clear();
  } else {
    overlay.classList.add("hidden");
    __last = performance.now();
  }
}
$("pauseBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
$("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); Sound.toggle(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) togglePause(true); });

function __init3D() {

function startGame() {

  Input._clear();
  __G.score = 0; __G.frame = 0; __G.paused = false; __G.plays++;
  api.time = 0; api.hud("");
  if (CFG.mode === "3d") {
    api.scene = new THREE.Scene();
    api.camera = new THREE.PerspectiveCamera(60, CFG.w / CFG.h, 0.1, 1000);

function __frame(now) {

    return;
  }
  const dt = Math.min(0.05, Math.max(0, (now - __last) / 1000));
  __last = now;
  api.time += dt;

    Input._begin();
    GAME.update(dt);
    if (__G.state === "error") return;
    if (CFG.mode === "3d") R3.renderer.render(api.scene, api.camera);
    else if (GAME.draw) { ctx2d.save(); GAME.draw(ctx2d); ctx2d.restore(); }

  }

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.timeLeft = 180;
    this.floor = 1;
    this.multiplier = 1.0;
    this.comboTimer = 0;
    this.clearTimer = 0;

    // タイル設定 (15 x 12, 各32x32)
    this.cols = 15;
    this.rows = 12;
    this.tileSize = 32;
    this.offsetX = 0;
    this.offsetY = 48;

    // キャラクター
    this.sol = { x: 0, y: 0, r: 10, color: '#f5c542', eye: '#d97706', stunned: 0 };
    this.luna = { x: 0, y: 0, r: 10, color: '#67e8f9', eye: '#0284c7', stunned: 0 };

    this.particles = [];
    this.runes = [];
    this.spikes = [];
    this.doors = [];
    this.switchObj = null;

    this.altarSol = { x: 0, y: 0 };
    this.altarLuna = { x: 0, y: 0 };
    this.altarTimer = 0;

    this.stepSfxTimer = 0;
    this.threadActive = false;

    this.loadFloor(this.floor);
  },

  loadFloor(floor) {
    const W = this.cols;
    const H = this.rows;
    this.map = Array.from({ length: H }, () => Array(W).fill(0));

    // 外周を壁(1)に
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (x === 0 || x === W - 1 || y === 0 || y === H - 1) {
          this.map[y][x] = 1;
        }
      }
    }

    this.spikes = [];
    this.doors = [];
    this.switchObj = null;

    // 初期位置
    let sPos = { x: 3, y: 3 };
    let lPos = { x: W - 4, y: H - 4 };
    let asPos = { x: W - 4, y: 3 };
    let alPos = { x: 3, y: H - 4 };

    // フロアごとのギミック生成
    const seed = floor % 5;
    if (seed === 1) {
      // チュートリアル: 中央に小さな障害物
      this.map[5][7] = 1;
      this.map[6][7] = 1;
    } else if (seed === 2) {
      // 縦の仕切り壁（位置合わせ練習）
      for (let y = 2; y < H - 2; y++) {
        if (y !== 4 && y !== 7) this.map[y][7] = 1;
      }
    } else if (seed === 3) {
      // スイッチとドア
      for (let y = 1; y < H - 1; y++) {
        this.map[y][7] = 1;
      }
      this.doors.push({ x: 7, y: 5, open: false }, { x: 7, y: 6, open: false });
      this.map[5][7] = 0;
      this.map[6][7] = 0;
      this.switchObj = { x: 4, y: 6, pressed: false };
    } else if (seed === 4) {
      // トゲ床の配置
      for (let y = 3; y < H - 3; y++) {
        this.map[y][5] = 1;
        this.map[y][9] = 1;
      }
      this.spikes.push(
        { x: 7, y: 3 }, { x: 7, y: 4 },
        { x: 7, y: 7 }, { x: 7, y: 8 }
      );
    } else {
      // 複合パズル
      for (let x = 3; x < W - 3; x += 2) {
        this.map[4][x] = 1;
        this.map[7][x] = 1;
      }
      this.switchObj = { x: 7, y: 2, pressed: false };
      this.doors.push({ x: 7, y: 5, open: false }, { x: 7, y: 6, open: false });
      this.spikes.push({ x: 4, y: 5 }, { x: 10, y: 6 });
    }

    // 座標設定
    this.sol.x = (sPos.x + 0.5) * this.tileSize;
    this.sol.y = (sPos.y + 0.5) * this.tileSize + this.offsetY;
    this.luna.x = (lPos.x + 0.5) * this.tileSize;
    this.luna.y = (lPos.y + 0.5) * this.tileSize + this.offsetY;

    this.altarSol.x = (asPos.x + 0.5) * this.tileSize;
    this.altarSol.y = (asPos.y + 0.5) * this.tileSize + this.offsetY;
    this.altarLuna.x = (alPos.x + 0.5) * this.tileSize;
    this.altarLuna.y = (alPos.y + 0.5) * this.tileSize + this.offsetY;

    // ルーン生成（空間の空いている場所）
    this.runes = [];
    const runeCount = Math.min(3 + Math.floor(floor * 0.8), 7);
    const runeColors = ['#f87171', '#34d399', '#60a5fa', '#f472b6'];
    for (let i = 0; i < runeCount; i++) {
      let rx, ry;
      let tries = 0;
      do {
        rx = this.api.util.randInt(2, W - 3);
        ry = this.api.util.randInt(2, H - 3);
        tries++;
      } while (tries < 50 && (this.map[ry][rx] === 1 || this.isDoor(rx, ry)));
      this.runes.push({
        x: (rx + 0.5) * this.tileSize,
        y: (ry + 0.5) * this.tileSize + this.offsetY,
        r: 8,
        color: runeColors[i % runeColors.length],
        collected: false
      });
    }

    this.altarTimer = 0;
  },

  isDoor(gx, gy) {
    return this.doors.some(d => d.x === gx && d.y === gy);
  },

  isSolid(gx, gy) {
    if (gx < 0 || gx >= this.cols || gy < 0 || gy >= this.rows) return true;
    if (this.map[gy][gx] === 1) return true;
    const door = this.doors.find(d => d.x === gx && d.y === gy);
    if (door && !door.open) return true;
    return false;
  },

  checkCircleCollide(cx, cy, r) {
    const left = Math.floor((cx - r) / this.tileSize);
    const right = Math.floor((cx + r) / this.tileSize);
    const top = Math.floor((cy - this.offsetY - r) / this.tileSize);
    const bottom = Math.floor((cy - this.offsetY + r) / this.tileSize);

    for (let gy = top; gy <= bottom; gy++) {
      for (let gx = left; gx <= right; gx++) {
        if (this.isSolid(gx, gy)) {
          const rx = gx * this.tileSize;
          const ry = gy * this.tileSize + this.offsetY;
          const nearestX = this.api.util.clamp(cx, rx, rx + this.tileSize);
          const nearestY = this.api.util.clamp(cy, ry, ry + this.tileSize);
          const dx = cx - nearestX;
          const dy = cy - nearestY;
          if (dx * dx + dy * dy < r * r) {
            return true;
          }
        }
      }
    }
    return false;
  },

  moveChar(ch, dx, dy) {
    if (ch.stunned > 0) return;

    // X軸
    const origX = ch.x;
    ch.x += dx;
    if (this.checkCircleCollide(ch.x, ch.y, ch.r)) {
      ch.x = origX;
    }

    // Y軸
    const origY = ch.y;
    ch.y += dy;
    if (this.checkCircleCollide(ch.x, ch.y, ch.r)) {
      ch.y = origY;
    }
  },

  distToSegment(px, py, x1, y1, x2, y2) {
    const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
    if (l2 === 0) return this.api.util.dist(px, py, x1, y1);
    let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
    t = this.api.util.clamp(t, 0, 1);
    const projX = x1 + t * (x2 - x1);
    const projY = y1 + t * (y2 - y1);
    return this.api.util.dist(px, py, projX, projY);
  },

  update(dt) {
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.api.sound.play('over');
      this.api.gameOver();
      return;
    }

    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.multiplier = 1.0;
      }
    }

    // 入力
    let inX = 0;
    let inY = 0;
    if (this.api.input.left) inX -= 1;
    if (this.api.input.right) inX += 1;
    if (this.api.input.up) inY -= 1;
    if (this.api.input.down) inY += 1;

    if (inX !== 0 && inY !== 0) {
      const inv = 1 / Math.SQRT2;
      inX *= inv;
      inY *= inv;
    }

    this.threadActive = this.api.input.a;
    const speed = (this.threadActive ? 95 : 125) * dt;

    if (this.sol.stunned > 0) this.sol.stunned -= dt;
    if (this.luna.stunned > 0) this.luna.stunned -= dt;

    if (inX !== 0 || inY !== 0) {
      this.moveChar(this.sol, inX * speed, inY * speed);
      this.moveChar(this.luna, -inX * speed, -inY * speed);

      this.stepSfxTimer -= dt;
      if (this.stepSfxTimer <= 0) {
        this.api.sound.tone(280, 0.03, 'triangle', 0.1);
        this.stepSfxTimer = 0.22;
      }
    }

    // パーティクル生成
    if (Math.random() < 0.3) {
      this.particles.push({
        x: this.sol.x + this.api.util.rand(-4, 4),
        y: this.sol.y + this.api.util.rand(-4, 4),
        vx: this.api.util.rand(-10, 10),
        vy: this.api.util.rand(-10, 10),
        life: 0.3,
        color: '#fde047'
      });
      this.particles.push({
        x: this.luna.x + this.api.util.rand(-4, 4),
        y: this.luna.y + this.api.util.rand(-4, 4),
        vx: this.api.util.rand(-10, 10),
        vy: this.api.util.rand(-10, 10),
        life: 0.3,
        color: '#a5f3fc'
      });
    }

    // スイッチ判定
    if (this.switchObj) {
      const swCenter = {
        x: (this.switchObj.x + 0.5) * this.tileSize,
        y: (this.switchObj.y + 0.5) * this.tileSize + this.offsetY
      };
      const dSol = this.api.util.dist(this.sol.x, this.sol.y, swCenter.x, swCenter.y);
      const dLuna = this.api.util.dist(this.luna.x, this.luna.y, swCenter.x, swCenter.y);
      const isPressed = dSol < 18 || dLuna < 18;

      if (isPressed && !this.switchObj.pressed) {
        this.api.sound.play('powerup');
      }
      this.switchObj.pressed = isPressed;
      for (const d of this.doors) {
        d.open = isPressed;
      }
    }

    // トゲ床判定
    for (const sp of this.spikes) {
      const spCenter = {
        x: (sp.x + 0.5) * this.tileSize,
        y: (sp.y + 0.5) * this.tileSize + this.offsetY
      };
      if (this.sol.stunned <= 0 && this.api.util.dist(this.sol.x, this.sol.y, spCenter.x, spCenter.y) < 16) {
        this.sol.stunned = 0.5;
        this.api.sound.play('hurt');
      }
      if (this.luna.stunned <= 0 && this.api.util.dist(this.luna.x, this.luna.y, spCenter.x, spCenter.y) < 16) {
        this.luna.stunned = 0.5;
        this.api.sound.play('hurt');
      }
    }

    // 糸とルーンの判定
    if (this.threadActive) {
      if (Math.random() < 0.2) {
        this.api.sound.tone(600, 0.02, 'sine', 0.05);
      }
      for (const r of this.runes) {
        if (!r.collected) {
          const d = this.distToSegment(r.x, r.y, this.sol.x, this.sol.y, this.luna.x, this.luna.y);
          if (d < r.r + 6) {
            r.collected = true;
            this.multiplier = Math.min(3.0, +(this.multiplier + 0.2).toFixed(1));
            this.comboTimer = 3.5;
            const pts = Math.round(200 * this.multiplier);
            this.api.addScore(pts);
            this.api.sound.play('coin');

            // 獲得演出
            for (let i = 0; i < 8; i++) {
              this.particles.push({
                x: r.x,
                y: r.y,
                vx: this.api.util.rand(-40, 40),
                vy: this.api.util.rand(-40, 40),
                life: 0.4,
                color: r.color
              });
            }
          }
        }
      }
    }

    // 祭壇の判定（ソルが金、ルナが青に乗る）
    const solOnAltar = this.api.util.dist(this.sol.x, this.sol.y, this.altarSol.x, this.altarSol.y) < 14;
    const lunaOnAltar = this.api.util.dist(this.luna.x, this.luna.y, this.altarLuna.x, this.altarLuna.y) < 14;

    if (solOnAltar && lunaOnAltar) {
      this.altarTimer += dt;
      if (Math.random() < 0.5) {
        this.particles.push({
          x: this.altarSol.x + this.api.util.rand(-10, 10),
          y: this.altarSol.y + this.api.util.rand(-10, 10),
          vx: 0,
          vy: -30,
          life: 0.3,
          color: '#fbbf24'
        });
      }
      if (this.altarTimer >= 0.45) {
        // フロアクリア！
        this.api.sound.play('clear');
        this.api.addScore(1000);
        this.timeLeft = Math.min(180, this.timeLeft + 5);
        this.floor++;
        this.loadFloor(this.floor);
      }
    } else {
      this.altarTimer = Math.max(0, this.altarTimer - dt * 2);
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  },

  draw(ctx) {
    // 背景
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, this.api.W, this.api.H);

    // フロアの床
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, this.offsetY, this.cols * this.tileSize, this.rows * this.tileSize);

    // タイル＆障害物の描画
    for (let y = 0; y < this.rows; y++) {
      for (let x = 0; x < this.cols; x++) {
        const px = x * this.tileSize;
        const py = y * this.tileSize + this.offsetY;

        // グリッド線
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.strokeRect(px, py, this.tileSize, this.tileSize);

        if (this.map[y][x] === 1) {
          // 壁ブロック
          ctx.fillStyle = '#475569';
          ctx.fillRect(px + 2, py + 2, this.tileSize - 4, this.tileSize - 4);
          ctx.fillStyle = '#64748b';
          ctx.fillRect(px + 4, py + 4, this.tileSize - 8, 4);
          ctx.fillStyle = '#334155';
          ctx.fillRect(px + 4, py + this.tileSize - 8, this.tileSize - 8, 4);
        }
      }
    }

    // トゲ床
    for (const sp of this.spikes) {
      const sx = sp.x * this.tileSize;
      const sy = sp.y * this.tileSize + this.offsetY;
      ctx.fillStyle = '#dc2626';
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          ctx.fillRect(sx + 6 + i * 8, sy + 6 + j * 8, 4, 4);
        }
      }
    }

    // スイッチ
    if (this.switchObj) {
      const swx = this.switchObj.x * this.tileSize;
      const swy = this.switchObj.y * this.tileSize + this.offsetY;
      ctx.fillStyle = this.switchObj.pressed ? '#22c55e' : '#94a3b8';
      ctx.fillRect(swx + 6, swy + 6, 20, 20);
      ctx.fillStyle = this.switchObj.pressed ? '#15803d' : '#64748b';
      ctx.fillRect(swx + 10, swy + 10, 12, 12);
    }

    // ドア
    for (const d of this.doors) {
      const dx = d.x * this.tileSize;
      const dy = d.y * this.tileSize + this.offsetY;
      if (!d.open) {
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(dx + 3, dy + 3, 26, 26);
        ctx.fillStyle = '#d8b4fe';
        ctx.fillRect(dx + 8, dy + 8, 16, 16);
      } else {
        ctx.strokeStyle = '#a855f7';
        ctx.strokeRect(dx + 3, dy + 3, 26, 26);
      }
    }

    // 祭壇描画
    this.drawAltar(ctx, this.altarSol.x, this.altarSol.y, '#f59e0b', '#fef08a');
    this.drawAltar(ctx, this.altarLuna.x, this.altarLuna.y, '#06b6d4', '#cffafe');

    // 祭壇達成チャージエフェクト
    if (this.altarTimer > 0) {
      const ratio = this.altarTimer / 0.45;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.altarSol.x, this.altarSol.y, 16 * ratio, 0, Math.PI * 2);
      ctx.arc(this.altarLuna.x, this.altarLuna.y, 16 * ratio, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 光の糸（Aボタン）
    if (this.threadActive) {
      ctx.save();
      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(this.sol.x, this.sol.y);
      ctx.lineTo(this.luna.x, this.luna.y);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // ルーン
    for (const r of this.runes) {
      if (!r.collected) {
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(r.x - 2, r.y - 2, 4, 4);
      }
    }

    // パーティクル
    for (const p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }

    // キャラクター（ソル: 太陽）
    this.drawChar(ctx, this.sol, '#f59e0b', '#fef08a');
    // キャラクター（ルナ: 月）
    this.drawChar(ctx, this.luna, '#0284c7', '#38bdf8');

    // HUD描画
    this.drawHUD(ctx);
  },

  drawAltar(ctx, x, y, c1, c2) {
    ctx.fillStyle = c1;
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = c2;
    ctx.fillRect(x - 6, y - 6, 12, 12);
  },

  drawChar(ctx, ch, c1, c2) {
    ctx.save();
    if (ch.stunned > 0) {
      ctx.globalAlpha = Math.floor(Date.now() / 100) % 2 === 0 ? 0.3 : 0.8;
    }
    // 外枠
    ctx.fillStyle = c1;
    ctx.fillRect(ch.x - 10, ch.y - 10, 20, 20);
    // 内側
    ctx.fillStyle = c2;
    ctx.fillRect(ch.x - 7, ch.y - 7, 14, 14);
    // 目
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(ch.x - 4, ch.y - 3, 3, 5);
    ctx.fillRect(ch.x + 2, ch.y - 3, 3, 5);
    ctx.restore();
  },

  drawHUD(ctx) {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, this.api.W, 44);
    ctx.fillRect(0, 436, this.api.W, 44);

    ctx.font = 'bold 15px monospace';

    // フロア
    ctx.fillStyle = '#38bdf8';
    ctx.fillText(`FLOOR ${this.floor}`, 16, 28);

    // スコア
    ctx.fillStyle = '#fbbf24';
    ctx.fillText(`SCORE ${this.api.score}`, 140, 28);

    // コンボ倍率
    if (this.multiplier > 1.0) {
      ctx.fillStyle = '#ec4899';
      ctx.fillText(`x${this.multiplier.toFixed(1)}`, 265, 28);
    }

    // 残り時間（カウントダウン）
    const m = Math.floor(this.timeLeft / 60);
    const s = Math.floor(this.timeLeft % 60);
    const timeStr = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    ctx.fillStyle = this.timeLeft < 30 ? '#ef4444' : '#f8fafc';
    ctx.fillText(`TIME ${timeStr}`, 370, 28);

    // 下部ガイド
    ctx.font = '12px monospace';
    ctx.fillStyle = '#94a3b8';
    ctx.textAlign = 'center';
    ctx.fillText(
      this.api.isTouch ? '[十字キー]: 2体移動  [Aボタン]: 光の糸' : '[矢印/WASD]: 2体移動  [Z/Space]: 光の糸',
      this.api.W / 2,
      462
    );
    ctx.textAlign = 'left';
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
