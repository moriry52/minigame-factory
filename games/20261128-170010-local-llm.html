<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。

const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
// 画面まわりの設定（無い＝以前に作ったゲームなので、以前と同じ動き）
const UI = Object.assign({ pad: "classic", guide: false, bg: "dark" }, META.ui || {});
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）

const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",

const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false, stick: { x: 0, y: 0 },
  _key: {}, _pad: {}, _stick: null, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    // stick: 仮想パッドのスティックの傾き（-1..1）。使っていないときは方向の押しっぱなしから作る
    if (this._stick) { this.stick.x = this._stick.x; this.stick.y = this._stick.y; }
    else {

    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._stick = null; this.stick.x = this.stick.y = 0; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });

  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };

});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);

  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  if (UI.pad === "floating") return __buildFloatPad();
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// 新しい仮想パッド：画面に半透明で重ねる。左半分のどこに指を置いてもそこがスティックの中心になり、右側はボタン
let __vpad = null;
function __buildFloatPad() {
  stage.classList.add("vpadOn");
  const vp = document.createElement("div");
  vp.id = "vpad";
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  vp.innerHTML = `<div class="vzone"></div><div class="vbase idle"><div class="vknob"></div></div>` +
    btns.map((b, i) => `<div class="vbtn ${i ? "b2" : "b1"}" data-btn="${esc(b.key.toLowerCase())}">${esc(b.label || b.key)}</div>`).join("");
  stage.insertBefore(vp, overlay);
  const base = vp.querySelector(".vbase"), knob = vp.querySelector(".vknob");
  const R = 48, DEAD = 0.3;
  const st = { id: null, bx: 0, by: 0 }, owner = {};
  const home = () => {
    const r = vp.getBoundingClientRect();
    return { x: Math.min(110, r.width * 0.25), y: r.height - Math.min(120, r.height * 0.2) };
  };
  const place = (bx, by, kx, ky) => {
    base.style.left = bx + "px"; base.style.top = by + "px";
    knob.style.transform = `translate(${kx}px,${ky}px)`;
  };
  const rest = () => { const h = home(); place(h.x, h.y, 0, 0); base.classList.add("idle"); };
  const refresh = () => {
    const on = {};
    const sx = Input._stick ? Input._stick.x : 0, sy = Input._stick ? Input._stick.y : 0;
    if (sx < -DEAD) on.left = true;
    if (sx > DEAD) on.right = true;
    if (sy < -DEAD) on.up = true;
    if (sy > DEAD) on.down = true;
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    vp.querySelectorAll(".vbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  // 右側に触れたら、いちばん近いボタン（多少ずれても押せる）
  const nearest = (cx, cy) => {
    let best = null, bd = 1e9;
    vp.querySelectorAll(".vbtn").forEach((el) => {
      const r = el.getBoundingClientRect(), d = Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2));
      if (d < bd) { bd = d; best = el.dataset.btn; }
    });
    return best;
  };
  const local = (ev) => { const r = vp.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width }; };

    let dx = x - st.bx, dy = y - st.by;
    const len = Math.hypot(dx, dy);
    if (len > R) { st.bx += dx / len * (len - R); st.by += dy / len * (len - R); dx = x - st.bx; dy = y - st.by; }  // 中心が指についてくる
    Input._stick = { x: U.clamp(dx / R, -1, 1), y: U.clamp(dy / R, -1, 1) };
    place(st.bx, st.by, dx, dy);
  };

    Sound.unlock(); ev.preventDefault();
    ev.stopPropagation();   // 下のゲーム画面に指を取られないように
    if (__G.state !== "playing" || __G.paused) return;

      place(p.x, p.y, 0, 0);

    const L = off, R = api.W - off;

    // ---- 壁が1段階狭まった時の効果音 ----
    const stage = Math.min(3, Math.floor(this.t / 60));
    if (stage > this.wallTick) {
      this.wallTick = stage;
      api.sound.tone(220, 0.18, 'triangle', 0.2, 150);
      this.addText(api.W / 2, 130, '狭くなってきた…', '#424242', 15);
    }

    // ---- 雪だるま移動 ----
    let kx = 0;
    if (inp.left) kx -= 1;
    if (inp.right) kx += 1;
    if (kx !== 0) {
      s.x += kx * 280 * dt;
      s.vx = 0;
      this.lastDir = kx;
    }
    if (inp.swipe === 'left') { s.vx = -540; this.lastDir = -1; }
    if (inp.swipe === 'right') { s.vx = 540; this.lastDir = 1; }
    s.x += s.vx * dt;
    s.vx *= Math.exp(-6 * dt);
    if (Math.abs(s.vx) < 4) s.vx = 0;

    // ドラッグ
    if (this.press && this.press.moved) {
      s.x += inp.pointer.dx * 1.3;
      if (Math.abs(inp.pointer.dx) > 0.5) this.lastDir = inp.pointer.dx > 0 ? 1 : -1;
    }
    s.x = U.clamp(s.x, L + s.r, R - s.r);
    if (s.inv > 0) s.inv -= dt;
    if (s.squash > 0) s.squash = Math.max(0, s.squash - dt * 3);
    s.bob += dt * 3;

    // ---- 氷柱スポーン ----
    this.spawnT -= dt;
    const prog = this.t / this.maxT;
    if (this.spawnT <= 0 && this.pillars.length < 8) {
      this.spawnT = Math.max(0.85, 1.9 - prog * 1.05) * U.rand(0.85, 1.15);
      this.spawnPillar(prog);
    }

    // ---- 氷柱更新 ----
    for (let i = this.pillars.length - 1; i >= 0; i--) {
      const p = this.pillars[i];
      p.y += p.vy * dt;
      p.x = U.clamp(p.x, L + p.w / 2, R - p.w / 2);
      if (s.inv <= 0 && this.circleRect(s.x, s.y, s.r, p.x - p.w / 2, p.y - p.h / 2, p.w, p.h)) {
        this.onMiss(p.x, p.y);
        this.shatterPillar(p, false);
        this.pillars.splice(i, 1);
        continue;
      }
      if (p.y + p.h / 2 >= this.groundY) {
        this.shatterPillar(p, false);
        api.sound.tone(160, 0.08, 'sine', 0.12, 90);
        this.pillars.splice(i, 1);
      }
    }

    // ---- 割れかけの氷片 ----
    for (let i = this.halves.length - 1; i >= 0; i--) {
      const h = this.halves[i];
      h.vy += 500 * dt;
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.rot += h.vr * dt;
      h.life -= dt;
      if (h.life <= 0 || h.y > api.H + 60) this.halves.splice(i, 1);
    }

    // ---- 雪玉更新 ----
    for (let i = this.snowballs.length - 1; i >= 0; i--) {
      const b = this.snowballs[i];
      b.vy += 100 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x - b.r <= L || b.x + b.r >= R) {
        api.sound.tone(130, 0.1, 'sine', 0.2, 70);
        this.puff(b.x, b.y, 6, '#FFFFFF');
        this.shards.push({ x: b.x, y: b.y, vx: (b.x < api.W / 2 ? 1 : -1) * 60, vy: -40, rot: 0, vr: 6, s: 5, life: 0.4, max: 0.4, col: '#FFFFFF' });
        this.snowballs.splice(i, 1);
        continue;
      }
      if (U.dist(s.x, s.y, b.x, b.y) < s.r + b.r) {
        this.onPickup(b);
        this.snowballs.splice(i, 1);
        continue;
      }
      if (b.y + b.r >= this.groundY) {
        this.puff(b.x, this.groundY, 5, '#FFFFFF');
        this.snowballs.splice(i, 1);
      }
    }

    // ---- 入力：タップで氷柱を割る ----
    if (inp.pointer.pressed) {
      this.press = { x: inp.pointer.x, y: inp.pointer.y, t: this.t, moved: false, dist: 0 };
    }
    if (this.press && inp.pointer.down) {
      this.press.dist += Math.abs(inp.pointer.dx) + Math.abs(inp.pointer.dy);
      if (this.press.dist > 14) this.press.moved = true;
    }
    if (this.press && inp.pointer.released) {
      if (!this.press.moved && (this.t - this.press.t) < 0.4) this.tryBreak(this.press.x, this.press.y);
      this.press = null;
    }

    // ---- コンボ ----
    if (this.comboT > 0) {
      this.comboT -= dt;
      if (this.comboT <= 0) this.combo = 0;
    }

    // ---- 演出 ----
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 26);
    if (this.missFlash > 0) this.missFlash = Math.max(0, this.missFlash - dt * 2.2);
    for (let i = this.shards.length - 1; i >= 0; i--) {
      const sh = this.shards[i];
      sh.vy += 420 * dt;
      sh.x += sh.vx * dt;
      sh.y += sh.vy * dt;
      sh.rot += sh.vr * dt;
      sh.life -= dt;
      if (sh.life <= 0 || sh.y > api.H + 40) this.shards.splice(i, 1);
    }
    for (let i = this.puffs.length - 1; i >= 0; i--) {
      const pf = this.puffs[i];
      pf.x += pf.vx * dt;
      pf.y += pf.vy * dt;
      pf.r += pf.gr * dt;
      pf.life -= dt;
      if (pf.life <= 0) this.puffs.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const tx = this.texts[i];
      tx.y -= 34 * dt;
      tx.life -= dt;
      if (tx.life <= 0) this.texts.splice(i, 1);
    }
    for (const f of this.snowflakes) {
      f.y += f.v * dt;
      f.x += Math.sin(this.t * 1.4 + f.ph) * 14 * dt;
      if (f.y > api.H + 4) { f.y = -4; f.x = U.rand(0, api.W); }
      if (f.x < -4) f.x = api.W + 4;
      if (f.x > api.W + 4) f.x = -4;
    }
  },

  spawnPillar(prog) {
    const U = this.api.util;
    const off = this.wallOff();
    const w = U.rand(40, 60) * (1 - prog * 0.25);
    const h = U.rand(80, 120);
    const min = off + w / 2 + 6, max = api.W - off - w / 2 - 6;
    if (max <= min) return;
    let x = U.rand(min, max), tries = 0;
    while (tries < 10) {
      let bad = false;
      for (const p of this.pillars) {
        if (p.y < 230 && Math.abs(p.x - x) < (p.w + w) / 2 + 14) { bad = true; break; }
      }
      if (!bad) break;
      x = U.rand(min, max);
      tries++;
    }
    this.pillars.push({ x, y: -h / 2 - 4, w, h, vy: U.rand(26, 42) + prog * 60, seed: U.rand(0, 10) });
  },

  circleRect(cx, cy, r, rx, ry, rw, rh) {
    const U = this.api.util;
    const nx = U.clamp(cx, rx, rx + rw);
    const ny = U.clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy <= r * r;
  },

  tryBreak(tx, ty) {
    const U = this.api.util;
    for (let i = this.pillars.length - 1; i >= 0; i--) {
      const p = this.pillars[i];
      if (tx >= p.x - p.w / 2 - 10 && tx <= p.x + p.w / 2 + 10 &&
          ty >= p.y - p.h / 2 - 10 && ty <= p.y + p.h / 2 + 10) {
        this.breakPillar(i);
        return;
      }
    }
    // 外したタップのフィードバック
    this.puff(tx, ty, 4, '#FFFFFF');
    this.api.sound.tone(500, 0.04, 'sine', 0.08, 420);
  },

  breakPillar(i) {
    const U = this.api.util;
    const p = this.pillars[i];
    this.pillars.splice(i, 1);
    // 中心から雪玉
    this.snowballs.push({ x: p.x, y: p.y, vx: U.rand(-14, 14), vy: 30, r: 10 });
    // 2つに割れる
    const dir = p.x < this.api.W / 2 ? 1 : -1;
    this.halves.push({ x: p.x - p.w / 4, y: p.y, w: p.w / 2, h: p.h, vx: -dir * U.rand(90, 140), vy: -40, rot: 0, vr: -dir * 2.2, life: 0.9, max: 0.9, seed: p.seed });
    this.halves.push({ x: p.x + p.w / 4, y: p.y, w: p.w / 2, h: p.h, vx: dir * U.rand(90, 140), vy: -40, rot: 0, vr: dir * 2.2, life: 0.9, max: 0.9, seed: p.seed + 3 });
    this.shatterPillar(p, true);
    this.shake = Math.max(this.shake, 3);
    this.api.sound.play('hit');
    this.api.sound.tone(900, 0.05, 'square', 0.12, 1400);
  },

  shatterPillar(p, big) {
    const U = this.api.util;
    const n = big ? 10 : 7;
    for (let i = 0; i < n; i++) {
      this.shards.push({
        x: p.x + U.rand(-p.w / 2, p.w / 2),
        y: p.y + U.rand(-p.h / 2, p.h / 2),
        vx: U.rand(-140, 140),
        vy: U.rand(-160, -20),
        rot: U.rand(0, 6.28),
        vr: U.rand(-8, 8),
        s: U.rand(4, 9),
        life: U.rand(0.4, 0.7),
        max: 0.7,
        col: i % 3 === 0 ? '#FFFFFF' : '#0D47A1'
      });
    }
    this.puff(p.x, p.y, 6, '#FFFFFF');
  },

  onPickup(b) {
    const api = this.api;
    this.comboT = 2.5;
    this.combo += 1;
    const bonus = (this.combo - 1) * 2;
    const pts = 10 + bonus;
    api.addScore(pts);
    this.snowman.squash = 1;
    if (this.combo >= 2) {
      api.sound.play('powerup');
      api.sound.tone(700 + this.combo * 60, 0.08, 'square', 0.12, 1200);
      this.addText(b.x, b.y - 26, 'COMBO x' + this.combo, '#263238', 15);
    } else {
      api.sound.play('coin');
    }
    this.addText(b.x, b.y - 8, '+' + pts, '#263238', 16);
    this.puff(b.x, b.y, 8, '#FFF59D');
    this.puff(b.x, b.y, 5, '#FFFFFF');
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * 6.28;
      this.shards.push({ x: b.x, y: b.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 40, rot: 0, vr: 8, s: 3, life: 0.5, max: 0.5, col: '#FFF59D' });
    }
  },

  onMiss(px, py) {
    const api = this.api;
    api.setScore(Math.max(0, api.score - 50));
    this.combo = 0;
    this.comboT = 0;
    this.snowman.inv = 1.2;
    this.missFlash = 1;
    this.shake = Math.max(this.shake, 9);
    this.addText(this.snowman.x, this.snowman.y - 40, '-50', '#424242', 18);
    this.puff(px, py, 8, '#FFFFFF');
    api.sound.play('explode');
    api.sound.tone(180, 0.25, 'sawtooth', 0.22, 60);
  },

  puff(x, y, n, col) {
    const U = this.api.util;
    for (let i = 0; i < n; i++) {
      const a = U.rand(0, 6.28), sp = U.rand(20, 90);
      this.puffs.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, r: U.rand(3, 6), gr: U.rand(14, 30), life: U.rand(0.3, 0.55), max: 0.55, col });
    }
  },

  addText(x, y, str, col, size) {
    this.texts.push({ x, y, str, col, size, life: 1, max: 1 });
  },

  draw(ctx) {
    const api = this.api, U = api.util;
    const W = api.W, H = api.H;
    const off = this.wallOff();
    const L = off, R = W - off;

    ctx.save();
    if (this.shake > 0) ctx.translate(U.rand(-this.shake, this.shake), U.rand(-this.shake, this.shake));

    // ---- 空 ----
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#DCEEFB');
    sky.addColorStop(1, '#E3F2FD');
    ctx.fillStyle = sky;
    ctx.fillRect(-12, -12, W + 24, H + 24);

    // ---- 遠景の山 ----
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(-10, 470);
    ctx.lineTo(60, 380); ctx.lineTo(120, 450);
    ctx.lineTo(200, 360); ctx.lineTo(270, 445);
    ctx.lineTo(330, 390); ctx.lineTo(W + 10, 470);
    ctx.lineTo(W + 10, H); ctx.lineTo(-10, H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#CFD8DC';
    ctx.beginPath();
    ctx.moveTo(60, 380); ctx.lineTo(88, 415); ctx.lineTo(40, 420); ctx.closePath();
    ctx.moveTo(200, 360); ctx.lineTo(232, 400); ctx.lineTo(172, 405); ctx.closePath();
    ctx.fill();

    // ---- 雪 ----
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const f of this.snowflakes) {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.s, 0, 6.283);
      ctx.fill();
    }

    // ---- 地面 ----
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(-12, this.groundY, W + 24, H - this.groundY + 12);
    ctx.strokeStyle = '#CFD8DC';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, this.groundY);
    ctx.lineTo(W + 12, this.groundY);
    ctx.stroke();
    ctx.fillStyle = '#ECEFF1';
    for (let i = 0; i < 7; i++) {
      ctx.beginPath();
      ctx.ellipse(30 + i * 52, this.groundY + 14 + (i % 3) * 6, 10, 3, 0, 0, 6.283);
      ctx.fill();
    }

    // ---- 壁 ----
    for (const side of [0, 1]) {
      const bx = side === 0 ? L : R;
      const dir = side === 0 ? 1 : -1;
      ctx.fillStyle = '#424242';
      ctx.fillRect(bx - 5, -12, 10, H + 24);
      ctx.fillStyle = '#616161';
      ctx.fillRect(bx + dir * 3, -12, 2, H + 24);
      ctx.strokeStyle = '#757575';
      ctx.lineWidth = 1.5;
      for (let y = 20; y < H; y += 46) {
        ctx.beginPath();
        ctx.moveTo(bx - 5, y);
        ctx.lineTo(bx + 5, y + 10);
        ctx.stroke();
      }
    }

    // ---- 雪だるまの影 ----
    const s = this.snowman;
    ctx.fillStyle = 'rgba(96,125,139,0.18)';
    ctx.beginPath();
    ctx.ellipse(s.x, this.groundY + 6, 22, 6, 0, 0, 6.283);
    ctx.fill();

    // ---- 氷柱 ----
    for (const p of this.pillars) {
      const x = p.x - p.w / 2, y = p.y - p.h / 2;
      ctx.save();
      ctx.shadowColor = 'rgba(13,71,161,0.3)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#0D47A1';
      this.roundRect(ctx, x, y, p.w, p.h, 6);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = '#08306B';
      ctx.lineWidth = 2;
      this.roundRect(ctx, x, y, p.w, p.h, 6);
      ctx.stroke();
      // 白の線（氷の筋）
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + p.w * 0.3, y + 8);
      ctx.lineTo(x + p.w * 0.3, y + p.h - 10);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + p.w * 0.62, y + 14);
      ctx.lineTo(x + p.w * 0.62, y + p.h * 0.5);
      ctx.stroke();
      // 先端の氷
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(x + 3, y + p.h - 4);
      ctx.lineTo(x + p.w / 2, y + p.h + 8);
      ctx.lineTo(x + p.w - 3, y + p.h - 4);
      ctx.closePath();
      ctx.fill();
    }

    // ---- 割れかけの氷片 ----
    for (const h of this.halves) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, h.life / h.max);
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      ctx.fillStyle = '#0D47A1';
      this.roundRect(ctx, -h.w / 2, -h.h / 2, h.w, h.h, 5);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-h.w / 2 + 5, -h.h / 2 + 8);
      ctx.lineTo(-h.w / 2 + 5, h.h / 2 - 8);
      ctx.stroke();
      ctx.restore();
    }

    // ---- 雪玉（差し色の光） ----
    for (const b of this.snowballs) {
      const g = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, 22);
      g.addColorStop(0, 'rgba(255,245,157,0.85)');
      g.addColorStop(1, 'rgba(255,245,157,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 22, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = '#B0BEC5';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,245,157,0.9)';
      ctx.beginPath();
      ctx.arc(b.x - 3, b.y - 3, 3, 0, 6.283);
      ctx.fill();
    }

    // ---- 雪だるま ----
    const blink = s.inv > 0 && Math.floor(this.t * 14) % 2 === 0;
    if (!blink) {
      const sq = s.squash * 0.15;
      const bobY = Math.sin(s.bob) * 1.5;
      ctx.save();
      ctx.translate(s.x, s.y + bobY);
      ctx.scale(1 + sq, 1 - sq);
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(0, 0, s.r, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = '#37474F';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // 目
      const ex = this.lastDir * 3;
      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.arc(-6 + ex, -5, 2.6, 0, 6.283);
      ctx.arc(6 + ex, -5, 2.6, 0, 6.283);
      ctx.fill();
      // 口
      ctx.strokeStyle = '#212121';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ex, 3, 5, 0.25, Math.PI - 0.25);
      ctx.stroke();
      // 頬
      ctx.fillStyle = 'rgba(176,190,197,0.5)';
      ctx.beginPath();
      ctx.arc(-11 + ex, 1, 2.5, 0, 6.283);
      ctx.arc(11 + ex, 1, 2.5, 0, 6.283);
      ctx.fill();
      // 帽子
      ctx.fillStyle = '#424242';
      ctx.fillRect(-13, -26, 26, 5);
      ctx.fillRect(-9, -36, 18, 11);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(-9, -27, 18, 3);
      ctx.restore();
    }

    // ---- 氷の破片 ----
    for (const sh of this.shards) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, sh.life / sh.max);
      ctx.translate(sh.x, sh.y);
      ctx.rotate(sh.rot);
      ctx.fillStyle = sh.col;
      ctx.fillRect(-sh.s / 2, -sh.s / 2, sh.s, sh.s);
      ctx.restore();
    }

    // ---- 雪の粉 ----
    for (const pf of this.puffs) {
      ctx.globalAlpha = Math.max(0, pf.life / pf.max) * 0.8;
      ctx.fillStyle = pf.col;
      ctx.beginPath();
      ctx.arc(pf.x, pf.y, pf.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- 浮き文字 ----
    for (const tx of this.texts) {
      const a = Math.max(0, tx.life / tx.max);
      ctx.globalAlpha = a;
      ctx.font = 'bold ' + tx.size + 'px "Hiragino Sans","Meiryo",sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeText(tx.str, tx.x, tx.y);
      ctx.fillStyle = tx.col;
      ctx.fillText(tx.str, tx.x, tx.y);
    }
    ctx.globalAlpha = 1;

    // ---- ミスフラッシュ ----
    if (this.missFlash > 0) {
      ctx.fillStyle = 'rgba(66,66,66,' + (this.missFlash * 0.22).toFixed(3) + ')';
      ctx.fillRect(-12, -12, W + 24, H + 24);
    }

    ctx.restore();

    // ---- HUD ----
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px "Hiragino Sans","Meiryo",sans-serif';
    ctx.fillStyle = '#546E7A';
    ctx.fillText('SCORE', 12, 22);
    ctx.font = 'bold 24px "Hiragino Sans","Meiryo",sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(String(Math.max(0, api.score)), 12, 45);
    ctx.fillStyle = '#263238';
    ctx.fillText(String(Math.max(0, api.score)), 12, 45);

    // 残り時間
    const remain = Math.max(0, this.maxT - this.t);
    const mm = Math.floor(remain / 60), ss = Math.floor(remain % 60);
    ctx.textAlign = 'center';
    ctx.font = 'bold 20px "Hiragino Sans","Meiryo",sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeText(mm + ':' + (ss < 10 ? '0' : '') + ss, W / 2, 34);
    ctx.fillStyle = remain < 30 ? '#424242' : '#263238';
    ctx.fillText(mm + ':' + (ss < 10 ? '0' : '') + ss, W / 2, 34);
    // 時間バー
    ctx.fillStyle = 'rgba(66,66,66,0.15)';
    ctx.fillRect(W / 2 - 55, 42, 110, 5);
    ctx.fillStyle = '#424242';
    ctx.fillRect(W / 2 - 55, 42, 110 * (1 - this.t / this.maxT), 5);

    // コンボ
    if (this.combo >= 2) {
      ctx.textAlign = 'right';
      ctx.font = 'bold 16px "Hiragino Sans","Meiryo",sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeText('COMBO x' + this.combo, W - 12, 30);
      ctx.fillStyle = '#263238';
      ctx.fillText('COMBO x' + this.combo, W - 12, 30);
      ctx.fillStyle = 'rgba(66,66,66,0.2)';
      ctx.fillRect(W - 62, 36, 50, 4);
      ctx.fillStyle = '#424242';
      ctx.fillRect(W - 62, 36, 50 * (this.comboT / 2.5), 4);
    }

    // 開始時の案内
    if (this.t < 3.2) {
      const a = Math.min(1, this.t * 2) * Math.min(1, (3.2 - this.t) * 1.5);
      ctx.globalAlpha = Math.max(0, a);
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px "Hiragino Sans","Meiryo",sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeText('氷柱をタップで割って雪玉を拾おう！', W / 2, 110);
      ctx.fillStyle = '#263238';
      ctx.fillText('氷柱をタップで割って雪玉を拾おう！', W / 2, 110);
      ctx.font = '13px "Hiragino Sans","Meiryo",sans-serif';
      ctx.strokeText('雪だるまはスワイプ／ドラッグで移動', W / 2, 132);
      ctx.fillText('雪だるまはスワイプ／ドラッグで移動', W / 2, 132);
      ctx.globalAlpha = 1;
    }
  },

  roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
};
