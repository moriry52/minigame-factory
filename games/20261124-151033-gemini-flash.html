<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.stageWidth = 3200;
    this.bossAreaX = 2500;
    this.cameraX = 0;

    // プレイヤー
    this.player = {
      x: 80,
      y: 200,
      w: 24,
      h: 32,
      vx: 0,
      vy: 0,
      dir: 1, // 1:右, -1:左
      grounded: false,
      hp: 3,
      maxHp: 3,
      invuln: 2.0, // 開始時は無敵
      attackTimer: 0,
      attackCooldown: 0,
      animTime: 0
    };

    // 足場・地形
    this.platforms = [
      { x: 0, y: 300, w: 700, h: 60, type: 'wafer' },
      { x: 250, y: 220, w: 120, h: 20, type: 'choco' },
      { x: 450, y: 170, w: 140, h: 20, type: 'choco' },
      { x: 780, y: 300, w: 600, h: 60, type: 'wafer' },
      { x: 900, y: 210, w: 140, h: 20, type: 'choco' },
      { x: 1120, y: 150, w: 120, h: 20, type: 'choco' },
      { x: 1460, y: 300, w: 500, h: 60, type: 'wafer' },
      { x: 1600, y: 210, w: 150, h: 20, type: 'choco' },
      { x: 1820, y: 160, w: 120, h: 20, type: 'choco' },
      { x: 2040, y: 300, w: 400, h: 60, type: 'wafer' },
      { x: 2160, y: 200, w: 140, h: 20, type: 'choco' },
      // ボス部屋
      { x: 2480, y: 300, w: 720, h: 60, type: 'wafer' },
      { x: 2600, y: 200, w: 130, h: 20, type: 'choco' },
      { x: 2870, y: 200, w: 130, h: 20, type: 'choco' }
    ];

    // トゲ
    this.spikes = [
      { x: 700, y: 340, w: 80, h: 20 },
      { x: 1380, y: 340, w: 80, h: 20 },
      { x: 1960, y: 340, w: 80, h: 20 }
    ];

    // 敵リスト
    this.enemies = [
      // 道中の敵 (x, y, tier: 3=大, 2=中, 1=小, type)
      { x: 400, y: 260, vx: -40, vy: 0, tier: 3, type: 'gummy', r: 18, color: '#ff66aa' },
      { x: 950, y: 260, vx: -50, vy: 0, tier: 3, type: 'cookie', r: 18, color: '#e09848' },
      { x: 1200, y: 260, vx: 50, vy: 0, tier: 2, type: 'gummy', r: 14, color: '#66e0aa' },
      { x: 1650, y: 260, vx: -60, vy: 0, tier: 3, type: 'cookie', r: 18, color: '#e09848' },
      { x: 1850, y: 120, vx: 60, vy: 0, tier: 2, type: 'gummy', r: 14, color: '#ff99cc' },
      { x: 2250, y: 260, vx: -60, vy: 0, tier: 3, type: 'gummy', r: 18, color: '#a088ff' }
    ];

    // ボス状態
    this.bossTriggered = false;
    this.bossCleared = false;
    this.bossMacarons = []; // 撃破対象のマカロンたち

    // エフェクト / パーティクル / アイテム
    this.particles = [];
    this.items = []; // スイーツダイヤ
    this.slashes = []; // スプーン軌跡エフェクト
    this.bgDecorations = [];
    for (let i = 0; i < 30; i++) {
      this.bgDecorations.push({
        x: api.util.rand(0, 3200),
        y: api.util.rand(20, 240),
        r: api.util.rand(8, 24),
        type: api.util.choice(['cloud', 'candy', 'cherry']),
        speed: api.util.rand(0.2, 0.5)
      });
    }

    this.cleared = false;
    this.dead = false;
    this.fadeTimer = 0;
  },

  spawnDiamonds(x, y, count) {
    for (let i = 0; i < count; i++) {
      this.items.push({
        x: x,
        y: y,
        vx: this.api.util.rand(-100, 100),
        vy: this.api.util.rand(-200, -80),
        life: 10
      });
    }
  },

  spawnSplitEnemy(x, y, tier, type, isBoss = false) {
    const nextTier = tier - 1;
    if (nextTier <= 0) {
      this.spawnDiamonds(x, y, isBoss ? 5 : 2);
      return;
    }

    const count = 2;
    for (let i = 0; i < count; i++) {
      const dir = (i === 0 ? -1 : 1);
      const speedX = isBoss ? (nextTier === 2 ? 90 : 150) : (nextTier === 2 ? 70 : 110);
      const r = isBoss ? (nextTier === 2 ? 26 : 16) : (nextTier === 2 ? 14 : 9);
      const color = isBoss 
        ? (nextTier === 2 ? '#ff6097' : '#ffa4d0') 
        : (type === 'gummy' ? '#ff77aa' : '#e09848');

      const enemy = {
        x: x + dir * 12,
        y: y - 10,
        vx: dir * speedX,
        vy: this.api.util.rand(-260, -180),
        tier: nextTier,
        type: type,
        r: r,
        color: color,
        isBoss: isBoss,
        hp: isBoss ? (nextTier === 2 ? 8 : 4) : 1,
        maxHp: isBoss ? (nextTier === 2 ? 8 : 4) : 1,
        jumpTimer: this.api.util.rand(0.5, 1.5)
      };

      if (isBoss) {
        this.bossMacarons.push(enemy);
      } else {
        this.enemies.push(enemy);
      }
    }
  },

  createParticles(x, y, color, count = 8, spread = 120) {
    for (let i = 0; i < count; i++) {
      const angle = this.api.util.rand(0, Math.PI * 2);
      const spd = this.api.util.rand(30, spread);
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 40,
        r: this.api.util.rand(2, 5),
        color: color,
        life: this.api.util.rand(0.3, 0.6),
        maxLife: 0.6
      });
    }
  },

  update(dt) {
    if (this.cleared || this.dead) {
      this.fadeTimer += dt;
      if (this.fadeTimer > 2.0) {
        if (this.cleared) this.api.clear();
        else this.api.gameOver();
      }
      return;
    }

    const p = this.player;
    const inp = this.api.input;

    p.animTime += dt;
    if (p.invuln > 0) p.invuln -= dt;
    if (p.attackCooldown > 0) p.attackCooldown -= dt;

    // 左右移動
    const moveAcc = 900;
    const maxSpeed = 160;
    const friction = 1000;

    if (inp.left) {
      p.vx = Math.max(p.vx - moveAcc * dt, -maxSpeed);
      p.dir = -1;
    } else if (inp.right) {
      p.vx = Math.min(p.vx + moveAcc * dt, maxSpeed);
      p.dir = 1;
    } else {
      if (p.vx > 0) p.vx = Math.max(0, p.vx - friction * dt);
      else if (p.vx < 0) p.vx = Math.min(0, p.vx + friction * dt);
    }

    // ジャンプ (Aボタン長押しで高く飛ぶ)
    const gravity = 800;
    if (inp.aPressed && p.grounded) {
      p.vy = -340;
      p.grounded = false;
      this.api.sound.play('jump');
    }
    // 低ジャンプ制御
    if (!inp.a && p.vy < -150) {
      p.vy += gravity * 1.5 * dt;
    }
    p.vy += gravity * dt;

    // スプーン攻撃 (Bボタン)
    if (inp.bPressed && p.attackCooldown <= 0) {
      p.attackTimer = 0.16;
      p.attackCooldown = 0.32;
      this.api.sound.tone(600, 0.08, 'triangle', 0.25, 300);
      this.slashes.push({
        x: p.x + p.dir * 18,
        y: p.y,
        dir: p.dir,
        life: 0.16
      });
    }

    // 位置更新 & プラットフォーム当たり判定
    p.x += p.vx * dt;
    // 画面外防止（ボス戦はボスエリア外に出られない）
    const minX = this.bossTriggered ? this.bossAreaX - 10 : 0;
    const maxX = this.stageWidth - p.w;
    p.x = this.api.util.clamp(p.x, minX, maxX);

    p.y += p.vy * dt;
    p.grounded = false;

    // 足場接触
    for (const plat of this.platforms) {
      if (
        p.x + p.w / 2 > plat.x &&
        p.x - p.w / 2 < plat.x + plat.w &&
        p.y + p.h / 2 >= plat.y &&
        p.y + p.h / 2 <= plat.y + 16 &&
        p.vy >= 0
      ) {
        p.y = plat.y - p.h / 2;
        p.vy = 0;
        p.grounded = true;
      }
    }

    // トゲ・穴判定
    for (const spike of this.spikes) {
      if (
        p.x + p.w / 2 > spike.x &&
        p.x - p.w / 2 < spike.x + spike.w &&
        p.y + p.h / 2 >= spike.y
      ) {
        this.hitPlayer(1);
        p.vy = -260;
      }
    }
    if (p.y > 380) {
      this.hitPlayer(1);
      p.y = 220;
      p.vy = -150;
      p.x = Math.max(minX + 40, p.x - 80);
    }

    // スラッシュ判定
    if (p.attackTimer > 0) {
      p.attackTimer -= dt;
      const attackBox = {
        x: p.x + (p.dir === 1 ? 4 : -40),
        y: p.y - 18,
        w: 36,
        h: 36
      };

      // ザコ敵への攻撃判定
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        if (this.api.util.rectHit(attackBox, { x: e.x - e.r, y: e.y - e.r, w: e.r * 2, h: e.r * 2 })) {
          this.killEnemy(e, i, false);
        }
      }

      // ボスマカロンへの攻撃判定
      for (let i = this.bossMacarons.length - 1; i >= 0; i--) {
        const b = this.bossMacarons[i];
        if (this.api.util.rectHit(attackBox, { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 })) {
          b.hp--;
          this.createParticles(b.x, b.y, '#ffffff', 5, 80);
          this.api.sound.tone(350, 0.05, 'square', 0.2, 500);
          p.attackTimer = 0; // 多段ヒット防止
          if (b.hp <= 0) {
            this.killEnemy(b, i, true);
          }
          break;
        }
      }
    }

    // カメラ移動
    if (!this.bossTriggered) {
      const targetCamX = p.x - this.api.W * 0.35;
      this.cameraX = this.api.util.clamp(targetCamX, 0, this.bossAreaX - 100);
      if (p.x >= this.bossAreaX) {
        this.bossTriggered = true;
        this.cameraX = this.bossAreaX - 50;
        this.startBossFight();
      }
    } else {
      this.cameraX = this.api.util.lerp(this.cameraX, this.bossAreaX - 50, 0.1);
    }

    // ザコ敵更新
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.vy += 650 * dt;
      e.x += e.vx * dt;
      e.y += e.vy * dt;

      // 地面バウンド
      for (const plat of this.platforms) {
        if (e.x > plat.x && e.x < plat.x + plat.w && e.y + e.r >= plat.y && e.y + e.r <= plat.y + 16 && e.vy >= 0) {
          e.y = plat.y - e.r;
          e.vy = e.tier === 1 ? -180 : -130; // 小さいほどピョンピョン跳ねる
        }
      }
      // 反転（壁や適度な範囲）
      if (e.x < 10 || e.x > this.bossAreaX - 20) e.vx *= -1;

      // プレイヤーとの接触
      if (p.invuln <= 0) {
        if (this.api.util.circleHit({ x: p.x, y: p.y, r: 12 }, { x: e.x, y: e.y, r: e.r })) {
          this.hitPlayer(1);
        }
      }

      // 画面外落下
      if (e.y > 400) {
        this.enemies.splice(i, 1);
      }
    }

    // ボスマカロン更新
    for (let i = this.bossMacarons.length - 1; i >= 0; i--) {
      const b = this.bossMacarons[i];
      b.vy += 600 * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // ボス部屋の壁でバウンド
      if (b.x - b.r < this.bossAreaX - 40) {
        b.x = this.bossAreaX - 40 + b.r;
        b.vx = Math.abs(b.vx);
      } else if (b.x + b.r > this.bossAreaX + 580) {
        b.x = this.bossAreaX + 580 - b.r;
        b.vx = -Math.abs(b.vx);
      }

      // 地面・足場バウンド
      for (const plat of this.platforms) {
        if (b.x > plat.x - 10 && b.x < plat.x + plat.w + 10 && b.y + b.r >= plat.y && b.y + b.r <= plat.y + 20 && b.vy >= 0) {
          b.y = plat.y - b.r;
          // 分裂段階に応じて大きく跳ねる
          const bJump = b.tier === 3 ? -240 : (b.tier === 2 ? -280 : -320);
          b.vy = bJump;
          this.createParticles(b.x, b.y + b.r, '#ffffff', 4, 40);
        }
      }

      // プレイヤー接触
      if (p.invuln <= 0) {
        if (this.api.util.circleHit({ x: p.x, y: p.y, r: 12 }, { x: b.x, y: b.y, r: b.r })) {
          this.hitPlayer(1);
        }
      }
    }

    // ボス全滅チェック
    if (this.bossTriggered && this.bossMacarons.length === 0 && !this.cleared) {
      this.cleared = true;
      this.api.sound.play('clear');
      this.api.addScore(3000);
    }

    // スイーツダイヤ（回収アイテム）
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.vy += 450 * dt;
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.life -= dt;

      // 拾う判定
      if (this.api.util.dist(p.x, p.y, it.x, it.y) < 28) {
        this.api.addScore(100);
        this.api.sound.play('coin');
        this.createParticles(it.x, it.y, '#ffff66', 6, 60);
        this.items.splice(i, 1);
        continue;
      }
      if (it.y > 380 || it.life <= 0) {
        this.items.splice(i, 1);
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // スラッシュ演出更新
    for (let i = this.slashes.length - 1; i >= 0; i--) {
      this.slashes[i].life -= dt;
      if (this.slashes[i].life <= 0) this.slashes.splice(i, 1);
    }
  },

  startBossFight() {
    this.api.sound.play('powerup');
    // キングマカロン出現（Tier 3: 巨大）
    this.bossMacarons.push({
      x: this.bossAreaX + 440,
      y: 180,
      vx: -70,
      vy: -100,
      tier: 3,
      r: 36,
      color: '#ff3377',
      isBoss: true,
      hp: 16,
      maxHp: 16
    });
  },

  killEnemy(e, index, isBoss) {
    if (isBoss) {
      this.bossMacarons.splice(index, 1);
      this.api.sound.play('explode');
      this.createParticles(e.x, e.y, '#ff4488', 16, 180);
      this.api.addScore(e.tier * 250);
      this.spawnSplitEnemy(e.x, e.y, e.tier, 'boss', true);
    } else {
      this.enemies.splice(index, 1);
      this.api.sound.tone(200 + e.tier * 150, 0.08, 'sine', 0.25, 600);
      this.createParticles(e.x, e.y, e.color, 8, 100);
      this.api.addScore(e.tier * 50);
      this.spawnSplitEnemy(e.x, e.y, e.tier, e.type, false);
    }
  },

  hitPlayer(dmg) {
    const p = this.player;
    p.hp -= dmg;
    p.invuln = 1.2;
    this.api.sound.play('hurt');
    this.createParticles(p.x, p.y, '#ff3333', 10, 100);

    if (p.hp <= 0) {
      this.dead = true;
      this.api.sound.play('over');
    }
  },

  draw(ctx) {
    // 背景グラデーション (パステルスイーツキャッスル)
    const bgGrad = ctx.createLinearGradient(0, 0, 0, this.api.H);
    bgGrad.addColorStop(0, '#ffd1dc');
    bgGrad.addColorStop(0.6, '#ffeef4');
    bgGrad.addColorStop(1, '#ffdfba');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, this.api.W, this.api.H);

    ctx.save();
    ctx.translate(-this.cameraX, 0);

    // 背景の装飾（お菓子の山・キャンディ雲）
    for (const d of this.bgDecorations) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // プラットフォーム（ウェハース & チョコ）描画
    for (const plat of this.platforms) {
      if (plat.type === 'wafer') {
        ctx.fillStyle = '#eed6af';
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        // ウェハースの網目模様
        ctx.fillStyle = '#ddbe90';
        for (let ix = plat.x; ix < plat.x + plat.w; ix += 16) {
          ctx.fillRect(ix, plat.y, 2, plat.h);
        }
        ctx.fillRect(plat.x, plat.y + 6, plat.w, 3);
      } else {
        // 板チョコ
        ctx.fillStyle = '#6d4229';
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = '#825235';
        for (let ix = plat.x + 4; ix < plat.x + plat.w - 4; ix += 24) {
          ctx.fillRect(ix, plat.y + 3, 20, plat.h - 6);
        }
      }
    }

    // トゲ（イチゴホイップ針）
    for (const sp of this.spikes) {
      ctx.fillStyle = '#ff4d6d';
      const count = sp.w / 16;
      for (let i = 0; i < count; i++) {
        ctx.beginPath();
        ctx.moveTo(sp.x + i * 16, sp.y + sp.h);
        ctx.lineTo(sp.x + i * 16 + 8, sp.y);
        ctx.lineTo(sp.x + i * 16 + 16, sp.y + sp.h);
        ctx.fill();
      }
    }

    // スイーツダイヤ（アイテム）
    for (const it of this.items) {
      ctx.fillStyle = '#ffea00';
      ctx.beginPath();
      ctx.moveTo(it.x, it.y - 7);
      ctx.lineTo(it.x + 6, it.y);
      ctx.lineTo(it.x, it.y + 7);
      ctx.lineTo(it.x - 6, it.y);
      ctx.closePath();
      ctx.fill();
    }

    // ザコ敵描画
    for (const e of this.enemies) {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();

      // 顔のパーツ
      ctx.fillStyle = '#331122';
      const eyeDir = e.vx >= 0 ? 1 : -1;
      ctx.beginPath();
      ctx.arc(e.x + eyeDir * (e.r * 0.35), e.y - 2, Math.max(1.5, e.r * 0.15), 0, Math.PI * 2);
      ctx.fill();
    }

    // ボスマカロン描画
    for (const b of this.bossMacarons) {
      // マカロン上下生地
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y - b.r * 0.3, b.r, b.r * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      // クリーム層
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x - b.r * 0.9, b.y - 3, b.r * 1.8, 6);

      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y + b.r * 0.3, b.r, b.r * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      // Tier 3の王冠
      if (b.tier === 3) {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        const cy = b.y - b.r * 0.8;
        ctx.moveTo(b.x - 16, cy);
        ctx.lineTo(b.x - 16, cy - 14);
        ctx.lineTo(b.x - 8, cy - 6);
        ctx.lineTo(b.x, cy - 18);
        ctx.lineTo(b.x + 8, cy - 6);
        ctx.lineTo(b.x + 16, cy - 14);
        ctx.lineTo(b.x + 16, cy);
        ctx.closePath();
        ctx.fill();
      }

      // ボスの目
      ctx.fillStyle = '#220011';
      const lookDir = b.vx >= 0 ? 1 : -1;
      ctx.beginPath();
      ctx.arc(b.x + lookDir * (b.r * 0.3), b.y - 4, Math.max(2, b.r * 0.14), 0, Math.PI * 2);
      ctx.fill();
    }

    // スラッシュ攻撃軌跡
    for (const s of this.slashes) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      const sx = s.x;
      const sy = s.y;
      ctx.arc(sx, sy, 24, (s.dir === 1 ? -0.8 : 0.8) * Math.PI, (s.dir === 1 ? 0.3 : 2.3) * Math.PI, s.dir === -1);
      ctx.stroke();
    }

    // プレイヤー（パティシエ）
    const p = this.player;
    if (p.invuln <= 0 || Math.floor(this.api.time * 15) % 2 === 0) {
      // 体・エプロン
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2 + 8, p.w, p.h - 8);

      // コック帽
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - p.h / 2 + 6, p.w * 0.65, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(p.x - p.w * 0.45, p.y - p.h / 2, p.w * 0.9, 10);

      // 顔
      ctx.fillStyle = '#ffdfba';
      ctx.fillRect(p.x - 8, p.y - 6, 16, 12);
      ctx.fillStyle = '#442211';
      ctx.fillRect(p.x + (p.dir === 1 ? 2 : -5), p.y - 2, 3, 4);

      // 銀のスプーン
      ctx.fillStyle = '#cfd8dc';
      const spX = p.x + p.dir * 12;
      const spY = p.y + (p.attackTimer > 0 ? -4 : 2);
      ctx.fillRect(spX - 2, spY, 4, 14);
      ctx.beginPath();
      ctx.ellipse(spX, spY - 3, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // パーティクル描画
    for (const pt of this.particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.life / pt.maxLife;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    ctx.restore();

    // ---------------- UI (HUD) ----------------
    // ハート（HP）
    for (let i = 0; i < p.maxHp; i++) {
      ctx.fillStyle = i < p.hp ? '#ff3366' : '#888888';
      const hx = 24 + i * 26;
      const hy = 22;
      ctx.beginPath();
      ctx.arc(hx - 5, hy - 4, 6, Math.PI, 0, false);
      ctx.arc(hx + 5, hy - 4, 6, Math.PI, 0, false);
      ctx.lineTo(hx, hy + 8);
      ctx.closePath();
      ctx.fill();
    }

    // ボスHPバー（ボス戦中）
    if (this.bossTriggered && !this.cleared) {
      let currentBossHp = 0;
      for (const b of this.bossMacarons) currentBossHp += b.hp;
      // 合計HP（Tier3:16 + Tier2:16 + Tier1:16 = 48相当）
      const maxTotal = 48;
      const barW = 200;
      const fillW = Math.max(0, (currentBossHp / maxTotal) * barW);

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(this.api.W / 2 - barW / 2 - 2, 12, barW + 4, 14);
      ctx.fillStyle = '#ff4081';
      ctx.fillRect(this.api.W / 2 - barW / 2, 14, fillW, 10);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('KING MACARON', this.api.W / 2, 23);
    }

    // スコア
    ctx.fillStyle = '#5d4037';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('SCORE ' + this.api.score, this.api.W - 20, 26);

    // クリア / ゲームオーバー時の文字エフェクト
    if (this.cleared) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillRect(0, 0, this.api.W, this.api.H);
      ctx.fillStyle = '#ff3388';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SWEETS CLEAR!', this.api.W / 2, this.api.H / 2);
    } else if (this.dead) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fillRect(0, 0, this.api.W, this.api.H);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', this.api.W / 2, this.api.H / 2);
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
