<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d14;color:#eef;overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#screen{display:block;background:#000;touch-action:none;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,6,12,.72);backdrop-filter:blur(2px);touch-action:none}
#overlay.hidden{display:none}
.panel{width:min(92%,420px);max-height:92%;overflow:auto;background:#151a2b;border:1px solid #2c3554;
  border-radius:16px;padding:20px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h1{font-size:24px;margin-bottom:8px;letter-spacing:.02em}

.btn{display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:999px;border:0;
  background:#5b7cff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}

.blink{animation:blink 1.2s infinite}

#pad{display:none;height:190px;flex:none;position:relative;touch-action:none}

<body>
<div id="app">
<div id="topbar">

  </div>
  <div id="stage">

</div>
<script type="application/json" id="meta">{"id": "20261124-135334-gemini-flash", "title": "すりぬけグミタワー", "summary": "異色はすり抜け、同色だけが積み重なる！3分間で巨大なスイーツタワーを築き上げる新感覚落ちモノパズル。", "rules": ["上から落ちてくるグミは「同じ色」と「床」にしか衝突せず、違う色はすり抜けて落下します。", "同じ色のグミをタテ・ヨコに3つ以上つなげると弾けて消滅し、スコアを獲得できます。", "グミを消すとカメラが上へスクロールし、新たなトレイ（床）が現れてタワーが上空へ伸びていきます。", "制限時間は3分間。画面上部にあるデンジャーラインまで同色グミが詰まるとペナルティ（減点＆数秒フリーズ）となります。"], "controls": {"スマホ": "画面を左右スワイプで落下中グミの移動、下スワイプで即座に着地、タップでグミの向きを90度回転。", "PC": "左右矢印キーで移動、下キー（またはスペース）で高速落下、上キーまたはクリックで回転。"}, "cfg": {"mode": "2d", "w": 360, "h": 640, "scheme": "タップ/スワイプ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;
    overlay.classList.remove("hidden");
    Input._clear();
  } else {
    overlay.classList.add("hidden");
    __last = performance.now();
  }
}
$("pauseBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
$("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); Sound.toggle(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) togglePause(true); });

// ---------------- 進行 ----------------
let GAME = null, __last = 0;
function __fail(where, e) {
  console.error(e);
  __G.errors.push(`${where}: ${e && e.message ? e.message : e}`);
  __G.state = "error";
  overlay.innerHTML = `<div class="panel"><h2>エラーが発生しました</h2><p>${esc(e && e.message ? e.message : e)}</p></div>`;
  overlay.classList.remove("hidden");
}
function __init3D() {
  if (R3) return;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(DPR);
  R3 = { renderer };
  api.THREE = THREE; api.renderer = renderer;
}
function startGame() {
  if (!GAME) return;
  Input._clear();
  __G.score = 0; __G.frame = 0; __G.paused = false; __G.plays++;
  api.time = 0; api.hud("");
  if (CFG.mode === "3d") {
    api.scene = new THREE.Scene();
    api.camera = new THREE.PerspectiveCamera(60, CFG.w / CFG.h, 0.1, 1000);
    api.camera.position.set(0, 5, 10); api.camera.lookAt(0, 0, 0);
  }
  try { GAME.init(api); } catch (e) { return __fail("init", e); }
  __layout();
  overlay.classList.add("hidden");
  __G.state = "playing"; __G.startedAt = performance.now();
  __last = performance.now();
}
function __endGame(kind) {
  if (__G.state !== "playing") return;
  __G.state = kind; __G.endedAt = performance.now();
  __saveBest(__G.score);
  Sound.play(kind === "clear" ? "clear" : "over");
  setTimeout(() => __showResult(kind), 500);
}
function __frame(now) {
  requestAnimationFrame(__frame);
  if (__G.state !== "playing" || __G.paused) {
    if (CFG.mode === "3d" && R3 && api.scene && api.camera) R3.renderer.render(api.scene, api.camera);
    return;
  }
  const dt = Math.min(0.05, Math.max(0, (now - __last) / 1000));
  __last = now;
  api.time += dt;
  try {
    Input._begin();
    GAME.update(dt);
    if (__G.state === "error") return;
    if (CFG.mode === "3d") R3.renderer.render(api.scene, api.camera);
    else if (GAME.draw) { ctx2d.save(); GAME.draw(ctx2d); ctx2d.restore(); }
    __G.frame++;
    if (!Number.isFinite(__G.score)) throw new Error("score が数値ではありません");
  } catch (e) { __fail("update/draw", e); }
}
function __boot(game) {
  GAME = game;
  if (!GAME || typeof GAME.init !== "function" || typeof GAME.update !== "function") {
    return __fail("boot", new Error("Game オブジェクト（init / update）が定義されていません"));
  }
  try {
    if (CFG.mode === "3d") { __init3D(); }
    else { ctx2d = canvas.getContext("2d"); api.ctx = ctx2d; }
  } catch (e) { return __fail("boot", e); }
  __buildPad();
  __layout();
  if (CFG.mode !== "3d") { ctx2d.fillStyle = "#000"; ctx2d.fillRect(0, 0, CFG.w, CFG.h); }
  __showTitle();
  requestAnimationFrame(__frame);
}

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.COLS = 6;
    this.ROWS = 11;
    this.CELL_SIZE = 48;
    this.BOARD_X = (api.W - this.COLS * this.CELL_SIZE) / 2; // 36
    this.BOARD_Y = 88; // 88 + 11*48 = 616
    this.DANGER_ROW = 1;

    this.timeLeft = 180;
    this.height = 0; // タワーの高さ (m)
    this.scrollSpeed = 0;
    this.bgY = 0;

    // グリッド: 各セルに色の配列を持たせる
    this.grid = [];
    for (let r = 0; r < this.ROWS; r++) {
      this.grid[r] = [];
      for (let c = 0; c < this.COLS; c++) {
        this.grid[r][c] = [];
      }
    }

    this.colors = [
      { name: 'Strawberry', color: '#ff3366', dark: '#cc1144', eye: '#fff' },
      { name: 'Soda', color: '#00c3ff', dark: '#0088cc', eye: '#fff' },
      { name: 'Lemon', color: '#ffd000', dark: '#d4aa00', eye: '#553300' },
      { name: 'Cookie', color: '#8d5524', dark: '#5c3311', eye: '#fff' }
    ];

    this.particles = [];
    this.floatingTexts = [];

    this.pair = null;
    this.nextPairs = [this.createPair(), this.createPair()];
    this.spawnPair();

    this.dropTimer = 0;
    this.penaltyTimer = 0;
    this.shakeTimer = 0;
    this.clearingState = null; // 連鎖アニメーション用
    this.chainCount = 0;

    this.touchStartX = 0;
    this.touchStartY = 0;
  },

  createPair() {
    const isLateGame = this.timeLeft < 60;
    const pool = isLateGame && Math.random() < 0.25 ? [0, 1, 2, 3] : [0, 1, 2];
    const c1 = this.api.util.choice(pool);
    // クッキー同士のペアは避け、色を分かれやすくする
    let c2 = this.api.util.choice(pool);
    if (c1 === 3 && c2 === 3) c2 = this.api.util.randInt(0, 2);
    return { c1, c2 };
  },

  spawnPair() {
    const next = this.nextPairs.shift();
    this.nextPairs.push(this.createPair());
    this.pair = {
      col: 2,
      row: 0.5,
      dir: 1, // 0:右, 1:下, 2:左, 3:上
      c1: next.c1,
      c2: next.c2
    };
  },

  // (col, color) における着地可能な行
  getLandingRow(col, color) {
    if (col < 0 || col >= this.COLS) return -1;
    for (let r = this.ROWS - 1; r >= 0; r--) {
      const cell = this.grid[r][col];
      // クッキー(3)は全色にとっての床、同色も床になる
      const hasBlock = cell.includes(color) || cell.includes(3) || (color === 3 && cell.length > 0);
      if (hasBlock) {
        return r - 1;
      }
    }
    return this.ROWS - 1;
  },

  getPairPositions(p) {
    const dx = [1, 0, -1, 0][p.dir];
    const dy = [0, 1, 0, -1][p.dir];
    return [
      { col: p.col, row: p.row, color: p.c1 },
      { col: p.col + dx, row: p.row + dy, color: p.c2 }
    ];
  },

  canMove(p, dCol, dRow) {
    const nextP = { ...p, col: p.col + dCol, row: p.row + dRow };
    const parts = this.getPairPositions(nextP);
    for (const pt of parts) {
      if (pt.col < 0 || pt.col >= this.COLS) return false;
      if (pt.row >= this.ROWS) return false;
      // 着地判定（同色またはクッキーより下には潜れない）
      const landing = this.getLandingRow(pt.col, pt.color);
      if (pt.row > landing) return false;
    }
    return true;
  },

  rotatePair() {
    if (!this.pair) return;
    const nextDir = (this.pair.dir + 1) % 4;
    const testP = { ...this.pair, dir: nextDir };
    if (this.canMove(testP, 0, 0)) {
      this.pair.dir = nextDir;
      this.api.sound.tone(480, 0.05, 'sine', 0.2);
    } else if (this.canMove({ ...testP, col: testP.col - 1 }, 0, 0)) {
      this.pair.col--;
      this.pair.dir = nextDir;
      this.api.sound.tone(480, 0.05, 'sine', 0.2);
    } else if (this.canMove({ ...testP, col: testP.col + 1 }, 0, 0)) {
      this.pair.col++;
      this.pair.dir = nextDir;
      this.api.sound.tone(480, 0.05, 'sine', 0.2);
    }
  },

  dropInstantly() {
    if (!this.pair) return;
    const parts = this.getPairPositions(this.pair);
    // 各パーツをそれぞれの色に応じた床まで瞬間落下
    for (const pt of parts) {
      const landR = this.getLandingRow(pt.col, pt.color);
      if (landR >= 0) {
        this.grid[landR][pt.col].push(pt.color);
        this.addBounce(pt.col, landR, pt.color);
      }
    }
    this.api.sound.play('hit');
    this.api.sound.tone(320, 0.1, 'triangle', 0.3, 160);
    this.pair = null;
    this.startClearCheck();
  },

  addBounce(col, row, color) {
    for (let i = 0; i < 4; i++) {
      this.particles.push({
        x: this.BOARD_X + col * this.CELL_SIZE + this.CELL_SIZE / 2,
        y: this.BOARD_Y + row * this.CELL_SIZE + this.CELL_SIZE / 2,
        vx: this.api.util.rand(-60, 60),
        vy: this.api.util.rand(-80, -20),
        color: this.colors[color].color,
        life: 0.3,
        maxLife: 0.3,
        size: 5
      });
    }
  },

  startClearCheck() {
    this.chainCount = 0;
    this.checkMatches();
  },

  checkMatches() {
    let matchedCells = []; // [{r, c, color}]

    // 各色ごとに4近傍の連結判定（クッキー3は除く）
    for (let targetColor = 0; targetColor < 3; targetColor++) {
      const visited = Array(this.ROWS).fill(0).map(() => Array(this.COLS).fill(false));
      for (let r = 0; r < this.ROWS; r++) {
        for (let c = 0; c < this.COLS; c++) {
          if (!visited[r][c] && this.grid[r][c].includes(targetColor)) {
            // BFS探索
            const group = [];
            const queue = [[r, c]];
            visited[r][c] = true;

            while (queue.length > 0) {
              const [currR, currC] = queue.shift();
              group.push({ r: currR, c: currC });
              const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
              for (const [dr, dc] of dirs) {
                const nr = currR + dr;
                const nc = currC + dc;
                if (nr >= 0 && nr < this.ROWS && nc >= 0 && nc < this.COLS) {
                  if (!visited[nr][nc] && this.grid[nr][nc].includes(targetColor)) {
                    visited[nr][nc] = true;
                    queue.push([nr, nc]);
                  }
                }
              }
            }

            if (group.length >= 3) {
              group.forEach(pt => matchedCells.push({ r: pt.r, c: pt.c, color: targetColor }));
            }
          }
        }
      }
    }

    if (matchedCells.length > 0) {
      this.chainCount++;
      const pts = matchedCells.length * 120 * this.chainCount;
      this.api.addScore(pts);

      // 上昇
      const hGain = matchedCells.length * 2.5;
      this.height += hGain;
      this.scrollSpeed = 180;

      // 効果音（マリンバ連鎖）
      const notes = [440, 554, 659, 880, 1108, 1318];
      const freq = notes[Math.min(this.chainCount - 1, notes.length - 1)];
      this.api.sound.tone(freq, 0.15, 'sine', 0.4, freq * 1.05);

      // テキスト表示
      const first = matchedCells[0];
      const tx = this.BOARD_X + first.c * this.CELL_SIZE + 24;
      const ty = this.BOARD_Y + first.r * this.CELL_SIZE;
      this.floatingTexts.push({
        text: this.chainCount > 1 ? `${this.chainCount}連鎖! +${pts}` : `+${pts}`,
        x: tx, y: ty, vy: -50, life: 0.8, color: '#fff'
      });

      // マスからグミを削除しパーティクル発生
      for (const m of matchedCells) {
        const idx = this.grid[m.r][m.c].indexOf(m.color);
        if (idx !== -1) {
          this.grid[m.r][m.c].splice(idx, 1);
        }
        for (let i = 0; i < 8; i++) {
          this.particles.push({
            x: this.BOARD_X + m.c * this.CELL_SIZE + 24,
            y: this.BOARD_Y + m.r * this.CELL_SIZE + 24,
            vx: this.api.util.rand(-120, 120),
            vy: this.api.util.rand(-140, 40),
            color: this.colors[m.color].color,
            life: 0.5,
            maxLife: 0.5,
            size: this.api.util.rand(4, 9)
          });
        }
      }

      // 重力落下を待ってから再チェック
      this.clearingState = { timer: 0.25 };
    } else {
      // 連鎖終了。重力適用＆デンジャーライン判定
      this.applyGravity();
      this.checkDanger();
      if (this.penaltyTimer <= 0) {
        this.spawnPair();
      }
    }
  },

  applyGravity() {
    // 各列・各色ごとに隙間なく下へ落とす
    for (let c = 0; c < this.COLS; c++) {
      for (let color = 0; color < 4; color++) {
        let count = 0;
        for (let r = 0; r < this.ROWS; r++) {
          const idx = this.grid[r][c].indexOf(color);
          if (idx !== -1) {
            count++;
            this.grid[r][c].splice(idx, 1);
          }
        }
        // 下から詰め直す
        for (let k = 0; k < count; k++) {
          const targetR = this.ROWS - 1 - k;
          if (targetR >= 0) {
            this.grid[targetR][c].push(color);
          }
        }
      }
    }
  },

  checkDanger() {
    let overflow = false;
    for (let c = 0; c < this.COLS; c++) {
      for (let r = 0; r <= this.DANGER_ROW; r++) {
        if (this.grid[r][c].length > 0) {
          overflow = true;
          break;
        }
      }
      if (overflow) break;
    }

    if (overflow) {
      // ペナルティ発動
      this.api.sound.play('hurt');
      this.shakeTimer = 0.5;
      this.penaltyTimer = 2.0;
      const penalty = Math.min(this.api.score, 300);
      this.api.addScore(-penalty);

      this.floatingTexts.push({
        text: `デンジャー! -${penalty}`,
        x: this.api.W / 2, y: this.BOARD_Y + 50, vy: -30, life: 1.5, color: '#ff3344'
      });

      // 上部2行のブロックを消滅させてリセット
      for (let r = 0; r <= this.DANGER_ROW + 1; r++) {
        for (let c = 0; c < this.COLS; c++) {
          this.grid[r][c] = [];
        }
      }
    }
  },

  update(dt) {
    // 制限時間
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.api.clear();
      return;
    }

    // カメラ背景スクロール
    if (this.scrollSpeed > 0) {
      this.bgY += this.scrollSpeed * dt;
      this.scrollSpeed = Math.max(0, this.scrollSpeed - 300 * dt);
    } else {
      this.bgY += 15 * dt;
    }

    // ペナルティフリーズ
    if (this.penaltyTimer > 0) {
      this.penaltyTimer -= dt;
      if (this.penaltyTimer <= 0) {
        this.spawnPair();
      }
      this.updateParticles(dt);
      return;
    }

    if (this.shakeTimer > 0) {
      this.shakeTimer -= dt;
    }

    // 連鎖処理中
    if (this.clearingState) {
      this.clearingState.timer -= dt;
      if (this.clearingState.timer <= 0) {
        this.clearingState = null;
        this.applyGravity();
        this.checkMatches();
      }
      this.updateParticles(dt);
      return;
    }

    // 操作
    const input = this.api.input;
    if (input.swipe === 'left' || input.leftPressed) {
      if (this.pair && this.canMove(this.pair, -1, 0)) {
        this.pair.col--;
        this.api.sound.tone(350, 0.03, 'sine', 0.15);
      }
    } else if (input.swipe === 'right' || input.rightPressed) {
      if (this.pair && this.canMove(this.pair, 1, 0)) {
        this.pair.col++;
        this.api.sound.tone(350, 0.03, 'sine', 0.15);
      }
    } else if (input.swipe === 'up' || input.tap || input.upPressed || input.aPressed) {
      this.rotatePair();
    } else if (input.swipe === 'down' || input.downPressed || input.bPressed) {
      this.dropInstantly();
    }

    // 自然落下
    if (this.pair) {
      // 経過時間で徐々に高速化
      const fallInterval = this.api.util.lerp(0.7, 0.28, (180 - this.timeLeft) / 180);
      this.dropTimer += dt;
      if (this.dropTimer >= fallInterval) {
        this.dropTimer = 0;
        if (this.canMove(this.pair, 0, 1)) {
          this.pair.row++;
          // すり抜け音
          this.api.sound.tone(200, 0.02, 'sine', 0.05);
        } else {
          // これ以上落ちないなら固定
          this.dropInstantly();
        }
      }
    }

    this.updateParticles(dt);
  },

  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.life -= dt;
      if (ft.life <= 0) this.floatingTexts.splice(i, 1);
    }
  },

  draw(ctx) {
    ctx.save();

    // 画面シェイク
    if (this.shakeTimer > 0) {
      const sx = this.api.util.rand(-4, 4);
      const sy = this.api.util.rand(-4, 4);
      ctx.translate(sx, sy);
    }

    // 背景描画（高度に応じてパフェ→雲→ケーキ城へとグラデーション）
    const altRatio = this.api.util.clamp(this.height / 500, 0, 1);
    const grad = ctx.createLinearGradient(0, 0, 0, this.api.H);
    if (altRatio < 0.5) {
      grad.addColorStop(0, '#ffe5ec');
      grad.addColorStop(1, '#ffc2d1');
    } else {
      grad.addColorStop(0, '#cce3de');
      grad.addColorStop(1, '#e8dff5');
    }
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.api.W, this.api.H);

    // 背景のパステルスイーツタワーの柱
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    const offset = this.bgY % 60;
    for (let y = -60 + offset; y < this.api.H; y += 60) {
      ctx.beginPath();
      ctx.arc(this.BOARD_X - 12, y, 8, 0, Math.PI * 2);
      ctx.arc(this.BOARD_X + this.COLS * this.CELL_SIZE + 12, y, 8, 0, Math.PI * 2);
      ctx.fill();
    }

    // プレイボードの枠（パフェグラス調）
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.roundRect(this.BOARD_X - 4, this.BOARD_Y - 4, this.COLS * this.CELL_SIZE + 8, this.ROWS * this.CELL_SIZE + 8, 16);
    ctx.fill();

    // グリッド線
    ctx.strokeStyle = 'rgba(255, 180, 200, 0.3)';
    ctx.lineWidth = 1;
    for (let r = 0; r <= this.ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(this.BOARD_X, this.BOARD_Y + r * this.CELL_SIZE);
      ctx.lineTo(this.BOARD_X + this.COLS * this.CELL_SIZE, this.BOARD_Y + r * this.CELL_SIZE);
      ctx.stroke();
    }
    for (let c = 0; c <= this.COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(this.BOARD_X + c * this.CELL_SIZE, this.BOARD_Y);
      ctx.lineTo(this.BOARD_X + c * this.CELL_SIZE, this.BOARD_Y + this.ROWS * this.CELL_SIZE);
      ctx.stroke();
    }

    // デンジャーライン
    const dangerY = this.BOARD_Y + (this.DANGER_ROW + 1) * this.CELL_SIZE;
    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(this.BOARD_X, dangerY);
    ctx.lineTo(this.BOARD_X + this.COLS * this.CELL_SIZE, dangerY);
    ctx.stroke();
    ctx.setLineDash([]);

    // ボード上の固定グミ描画
    for (let r = 0; r < this.ROWS; r++) {
      for (let c = 0; c < this.COLS; c++) {
        const list = this.grid[r][c];
        const count = list.length;
        if (count === 0) continue;

        // 同居時は少し重ねて描画
        list.forEach((color, idx) => {
          const offsetX = count > 1 ? (idx - (count - 1) / 2) * 8 : 0;
          const offsetY = count > 1 ? (idx - (count - 1) / 2) * 4 : 0;
          const gx = this.BOARD_X + c * this.CELL_SIZE + offsetX;
          const gy = this.BOARD_Y + r * this.CELL_SIZE + offsetY;
          this.drawGummy(ctx, gx, gy, color, count > 1 ? 0.75 : 0.95);
        });
      }
    }

    // 落下中グミのガイド（落下先ゴースト）
    if (this.pair && this.penaltyTimer <= 0) {
      const parts = this.getPairPositions(this.pair);
      for (const pt of parts) {
        const landR = this.getLandingRow(pt.col, pt.color);
        if (landR >= 0) {
          ctx.strokeStyle = this.colors[pt.color].color;
          ctx.lineWidth = 2;
          ctx.strokeRect(
            this.BOARD_X + pt.col * this.CELL_SIZE + 6,
            this.BOARD_Y + landR * this.CELL_SIZE + 6,
            this.CELL_SIZE - 12,
            this.CELL_SIZE - 12
          );
        }
      }

      // 落下中ペアの描画
      for (const pt of parts) {
        const gx = this.BOARD_X + pt.col * this.CELL_SIZE;
        const gy = this.BOARD_Y + pt.row * this.CELL_SIZE;
        this.drawGummy(ctx, gx, gy, pt.color, 0.95);
      }
    }

    // パーティクル
    for (const p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
      ctx.fill();
    }

    // フローティングテキスト
    for (const ft of this.floatingTexts) {
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
    }

    // ペナルティ中のエフェクト表示
    if (this.penaltyTimer > 0) {
      ctx.fillStyle = 'rgba(255, 0, 50, 0.2)';
      ctx.fillRect(this.BOARD_X, this.BOARD_Y, this.COLS * this.CELL_SIZE, this.ROWS * this.CELL_SIZE);
      ctx.fillStyle = '#ff2244';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('FREEZE!', this.BOARD_X + (this.COLS * this.CELL_SIZE) / 2, this.BOARD_Y + 180);
    }

    // HUD描画（上部）
    this.drawHUD(ctx);

    ctx.restore();
  },

  drawGummy(ctx, x, y, colorIdx, scale = 1) {
    const info = this.colors[colorIdx];
    const s = (this.CELL_SIZE - 6) * scale;
    const px = x + (this.CELL_SIZE - s) / 2;
    const py = y + (this.CELL_SIZE - s) / 2;
    const rad = s * 0.35;

    // クッキー（全色床）のお邪魔ブロック
    if (colorIdx === 3) {
      ctx.fillStyle = info.color;
      ctx.beginPath();
      ctx.roundRect(px, py, s, s, 6);
      ctx.fill();
      // 焼き目
      ctx.fillStyle = info.dark;
      ctx.beginPath();
      ctx.arc(px + s * 0.3, py + s * 0.3, 3, 0, Math.PI * 2);
      ctx.arc(px + s * 0.7, py + s * 0.4, 2.5, 0, Math.PI * 2);
      ctx.arc(px + s * 0.5, py + s * 0.7, 3, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    // グミ本体（ツヤツヤ半透明ゼリー）
    ctx.save();
    ctx.shadowColor = info.dark;
    ctx.shadowBlur = 4;
    ctx.fillStyle = info.color;
    ctx.beginPath();
    ctx.roundRect(px, py, s, s, rad);
    ctx.fill();
    ctx.restore();

    // ぷるぷるツヤ光沢
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    ctx.ellipse(px + s * 0.35, py + s * 0.3, s * 0.22, s * 0.12, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // 顔（つぶらな瞳）
    ctx.fillStyle = info.eye;
    ctx.beginPath();
    ctx.arc(px + s * 0.35, py + s * 0.58, 2.5, 0, Math.PI * 2);
    ctx.arc(px + s * 0.65, py + s * 0.58, 2.5, 0, Math.PI * 2);
    ctx.fill();
  },

  drawHUD(ctx) {
    // スコア & 高さ
    ctx.fillStyle = '#4a2810';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${this.api.score}`, 16, 32);

    ctx.fillStyle = '#e63946';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`TOWER: ${Math.floor(this.height)}m`, 16, 56);

    // 制限時間カウントダウン
    const min = Math.floor(this.timeLeft / 60);
    const sec = Math.floor(this.timeLeft % 60);
    const timeStr = `${min}:${sec < 10 ? '0' : ''}${sec}`;
    ctx.fillStyle = this.timeLeft <= 30 ? '#ff1133' : '#4a2810';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`TIME ${timeStr}`, this.api.W / 2, 32);

    // NEXT表示
    ctx.fillStyle = '#4a2810';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('NEXT', this.api.W - 20, 24);

    if (this.nextPairs[0]) {
      const np = this.nextPairs[0];
      const nx = this.api.W - 48;
      const ny = 32;
      this.drawGummy(ctx, nx, ny, np.c1, 0.5);
      this.drawGummy(ctx, nx, ny + 22, np.c2, 0.5);
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
