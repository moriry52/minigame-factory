<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();

  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});

  if (ev.pointerId !== __activePtr) return;

  Input.pointer.down = false;
  Input._ptrReleased = true;

    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;

      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");

      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;

document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);

      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }

}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">

    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");

}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;

  } else {

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.time = 0;
    this.targetTime = 180;
    this.shake = 0;
    this.gameEnded = false;

    // 自機（青・赤）
    this.p1 = { x: 160, y: 240, r: 8, drawR: 12, color: '#00f0ff', trailColor: 'rgba(0, 240, 255, 0.4)' };
    this.p2 = { x: 320, y: 240, r: 8, drawR: 12, color: '#ff0055', trailColor: 'rgba(255, 0, 85, 0.4)' };

    // オブジェクト群
    this.obstacles = [];
    this.warnings = [];
    this.particles = [];

    // 背景星
    this.stars = [];
    for (let i = 0; i < 60; i++) {
      this.stars.push({
        x: api.util.rand(0, api.W),
        y: api.util.rand(0, api.H),
        size: api.util.rand(0.8, 2.2),
        speed: api.util.rand(8, 24),
        alpha: api.util.rand(0.2, 0.8)
      });
    }

    // スポーンタイマー
    this.spawnTimer = 0;
    this.cometTimer = 0;
    this.mineTimer = 0;
  },

  update(dt) {
    if (this.gameEnded) return;

    this.time += dt;
    this.api.setScore(Math.floor(this.time * 100));

    // 画面揺れ減衰
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 30);
    }

    // 勝利判定
    if (this.time >= this.targetTime) {
      this.gameEnded = true;
      this.api.sound.play('clear');
      for (let i = 0; i < 100; i++) {
        this.addParticle(this.api.W / 2, this.api.H / 2, '#ffffff', 4, 300);
      }
      setTimeout(() => this.api.clear(), 1200);
      return;
    }

    // 入力処理（キーボード + ドラッグ）
    let moveX = 0;
    let moveY = 0;

    // キーボード入力
    const kSpeed = 220;
    let kx = 0;
    let ky = 0;
    if (this.api.input.left) kx -= 1;
    if (this.api.input.right) kx += 1;
    if (this.api.input.up) ky -= 1;
    if (this.api.input.down) ky += 1;

    if (kx !== 0 || ky !== 0) {
      const len = Math.hypot(kx, ky);
      moveX += (kx / len) * kSpeed * dt;
      moveY += (ky / len) * kSpeed * dt;
    }

    // ポインタ（ドラッグ）入力
    if (this.api.input.pointer.down) {
      moveX += this.api.input.pointer.dx;
      moveY += this.api.input.pointer.dy;
    }

    // 機体移動（青は通常、赤は反転対称）
    const rMargin = 16;
    if (moveX !== 0 || moveY !== 0) {
      this.p1.x = this.api.util.clamp(this.p1.x + moveX, rMargin, this.api.W - rMargin);
      this.p1.y = this.api.util.clamp(this.p1.y + moveY, rMargin, this.api.H - rMargin);

      this.p2.x = this.api.util.clamp(this.p2.x - moveX, rMargin, this.api.W - rMargin);
      this.p2.y = this.api.util.clamp(this.p2.y - moveY, rMargin, this.api.H - rMargin);

      // スラスター粒子
      if (Math.random() < 0.6) {
        this.addParticle(this.p1.x - moveX * 0.5, this.p1.y - moveY * 0.5, this.p1.color, 2, 40);
        this.addParticle(this.p2.x + moveX * 0.5, this.p2.y + moveY * 0.5, this.p2.color, 2, 40);
      }
    }

    // 背景星のスクロール
    for (const star of this.stars) {
      star.y += star.speed * dt;
      if (star.y > this.api.H) {
        star.y = 0;
        star.x = this.api.util.rand(0, this.api.W);
      }
    }

    // 障害物スポーン管理 (最初の3秒は安全)
    if (this.time > 3.0) {
      this.updateSpawns(dt);
    }

    // 予告線（彗星）更新
    for (let i = this.warnings.length - 1; i >= 0; i--) {
      const w = this.warnings[i];
      w.timer -= dt;
      if (w.timer <= 0) {
        // 彗星発射
        this.obstacles.push({
          type: 'comet',
          x: w.startX,
          y: w.startY,
          vx: Math.cos(w.angle) * w.speed,
          vy: Math.sin(w.angle) * w.speed,
          r: 10,
          color: '#fffb00',
          nearMissP1: false,
          nearMissP2: false
        });
        this.warnings.splice(i, 1);
      }
    }

    // 障害物更新
    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const obs = this.obstacles[i];
      obs.x += obs.vx * dt;
      obs.y += obs.vy * dt;

      // 分裂機雷の炸裂判定
      if (obs.type === 'mine') {
        obs.fuse -= dt;
        if (obs.fuse <= 0) {
          this.api.sound.play('explode');
          for (let k = 0; k < 4; k++) {
            const ang = (Math.PI / 2) * k + obs.rotOffset;
            const spd = this.api.util.rand(90, 140);
            this.obstacles.push({
              type: 'shard',
              x: obs.x,
              y: obs.y,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 6,
              color: '#39ff14',
              nearMissP1: false,
              nearMissP2: false
            });
          }
          this.obstacles.splice(i, 1);
          continue;
        }
      }

      // 画面外除去（少し余裕を持たせる）
      if (obs.x < -60 || obs.x > this.api.W + 60 || obs.y < -60 || obs.y > this.api.H + 60) {
        this.obstacles.splice(i, 1);
        continue;
      }

      // 衝突判定 & ニアミス判定
      for (const ship of [this.p1, this.p2]) {
        const d = this.api.util.dist(ship.x, ship.y, obs.x, obs.y);

        // 衝突
        if (d < ship.r + obs.r) {
          this.triggerGameOver(ship);
          return;
        }

        // ニアミス
        const flagKey = ship === this.p1 ? 'nearMissP1' : 'nearMissP2';
        if (!obs[flagKey] && d < ship.drawR + obs.r + 14) {
          obs[flagKey] = true;
          this.api.sound.tone(880, 0.05, 'triangle', 0.15);
          this.api.addScore(50);
          this.addParticle((ship.x + obs.x) / 2, (ship.y + obs.y) / 2, '#ffffaa', 2.5, 60);
        }
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        this.particles.splice(i, 1);
      }
    }
  },

  updateSpawns(dt) {
    const t = this.time;
    // 進行に応じたスポーン頻度
    const progress = Math.min(1, t / 150);
    const asteroidInterval = this.api.util.lerp(1.2, 0.32, progress);

    this.spawnTimer += dt;
    if (this.spawnTimer >= asteroidInterval) {
      this.spawnTimer = 0;
      this.spawnAsteroid();
    }

    // 彗星（30秒以降）
    if (t > 30) {
      this.cometTimer += dt;
      const cometInterval = this.api.util.lerp(5.0, 2.0, (t - 30) / 120);
      if (this.cometTimer >= cometInterval) {
        this.cometTimer = 0;
        this.spawnCometWarning();
      }
    }

    // 分裂機雷（60秒以降）
    if (t > 60) {
      this.mineTimer += dt;
      const mineInterval = this.api.util.lerp(4.5, 2.2, (t - 60) / 120);
      if (this.mineTimer >= mineInterval) {
        this.mineTimer = 0;
        this.spawnMine();
      }
    }
  },

  spawnAsteroid() {
    // 画面外のランダムな辺から
    const edge = this.api.util.randInt(0, 3);
    let x, y;
    if (edge === 0) { x = this.api.util.rand(0, this.api.W); y = -20; }
    else if (edge === 1) { x = this.api.W + 20; y = this.api.util.rand(0, this.api.H); }
    else if (edge === 2) { x = this.api.util.rand(0, this.api.W); y = this.api.H + 20; }
    else { x = -20; y = this.api.util.rand(0, this.api.H); }

    // 画面中央付近を狙う
    const targetX = this.api.W / 2 + this.api.util.rand(-100, 100);
    const targetY = this.api.H / 2 + this.api.util.rand(-100, 100);
    const angle = this.api.util.angle(x, y, targetX, targetY);

    const speed = this.api.util.rand(90, 160) + Math.min(100, this.time * 0.6);
    const r = this.api.util.rand(13, 20);

    this.obstacles.push({
      type: 'asteroid',
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r,
      rot: 0,
      rotSpeed: this.api.util.rand(-2, 2),
      color: this.api.util.choice(['#8a7f7d', '#6e6766', '#a5978b']),
      nearMissP1: false,
      nearMissP2: false
    });
  },

  spawnCometWarning() {
    // 彗星の出現予告
    const side = Math.random() < 0.5;
    const startX = side ? -30 : this.api.W + 30;
    const startY = this.api.util.rand(60, this.api.H - 60);

    // いずれかの機体の現在位置を目標にする
    const targetShip = Math.random() < 0.5 ? this.p1 : this.p2;
    const angle = this.api.util.angle(startX, startY, targetShip.x, targetShip.y);
    const speed = 360 + Math.min(140, this.time * 0.8);

    this.warnings.push({
      startX,
      startY,
      angle,
      speed,
      timer: 1.0 // 予告猶予秒数
    });

    // 予告ブザー音
    this.api.sound.tone(280, 0.15, 'sawtooth', 0.2, 220);
  },

  spawnMine() {
    const edge = this.api.util.randInt(0, 3);
    let x, y;
    if (edge === 0) { x = this.api.util.rand(40, this.api.W - 40); y = -20; }
    else if (edge === 1) { x = this.api.W + 20; y = this.api.util.rand(40, this.api.H - 40); }
    else if (edge === 2) { x = this.api.util.rand(40, this.api.W - 40); y = this.api.H + 20; }
    else { x = -20; y = this.api.util.rand(40, this.api.H - 40); }

    const targetX = this.api.W / 2 + this.api.util.rand(-70, 70);
    const targetY = this.api.H / 2 + this.api.util.rand(-70, 70);
    const angle = this.api.util.angle(x, y, targetX, targetY);
    const dist = this.api.util.dist(x, y, targetX, targetY);
    const speed = 100;
    const fuse = dist / speed;

    this.obstacles.push({
      type: 'mine',
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 12,
      fuse,
      rotOffset: this.api.util.rand(0, Math.PI),
      color: '#00ff88',
      nearMissP1: false,
      nearMissP2: false
    });
  },

  addParticle(x, y, color, size, speed) {
    const ang = this.api.util.rand(0, Math.PI * 2);
    const spd = this.api.util.rand(speed * 0.3, speed);
    this.particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      size,
      color,
      life: this.api.util.rand(0.2, 0.5)
    });
  },

  triggerGameOver(ship) {
    this.gameEnded = true;
    this.shake = 12;
    this.api.sound.play('explode');

    for (let i = 0; i < 60; i++) {
      this.addParticle(ship.x, ship.y, ship.color, 4, 180);
      this.addParticle(ship.x, ship.y, '#ffffff', 2.5, 240);
    }

    setTimeout(() => this.api.gameOver(), 1000);
  },

  draw(ctx) {
    ctx.save();

    // 画面揺れ適用
    if (this.shake > 0) {
      const rx = (Math.random() - 0.5) * this.shake;
      const ry = (Math.random() - 0.5) * this.shake;
      ctx.translate(rx, ry);
    }

    // 背景描画
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, this.api.W, this.api.H);

    // 中央グリッド線
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(this.api.W / 2, 0);
    ctx.lineTo(this.api.W / 2, this.api.H);
    ctx.moveTo(0, this.api.H / 2);
    ctx.lineTo(this.api.W, this.api.H / 2);
    ctx.stroke();

    // 背景星
    for (const star of this.stars) {
      ctx.fillStyle = `rgba(200, 220, 255, ${star.alpha})`;
      ctx.fillRect(star.x, star.y, star.size, star.size);
    }

    // 彗星予告線
    for (const w of this.warnings) {
      ctx.save();
      const alpha = ((this.time * 15) % 2 > 1) ? 0.6 : 0.2;
      ctx.strokeStyle = `rgba(255, 60, 60, ${alpha})`;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(w.startX, w.startY);
      ctx.lineTo(w.startX + Math.cos(w.angle) * 800, w.startY + Math.sin(w.angle) * 800);
      ctx.stroke();
      ctx.restore();
    }

    // 障害物描画
    for (const obs of this.obstacles) {
      ctx.save();
      ctx.translate(obs.x, obs.y);

      if (obs.type === 'asteroid') {
        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.arc(0, 0, obs.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#443f3e';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 簡易クレーター
        ctx.fillStyle = '#443f3e';
        ctx.beginPath();
        ctx.arc(obs.r * 0.3, -obs.r * 0.2, obs.r * 0.25, 0, Math.PI * 2);
        ctx.fill();
      } else if (obs.type === 'comet') {
        // 彗星の尾
        const tailLen = 30;
        const norm = Math.hypot(obs.vx, obs.vy) || 1;
        const grad = ctx.createLinearGradient(0, 0, -obs.vx / norm * tailLen, -obs.vy / norm * tailLen);
        grad.addColorStop(0, '#ffff55');
        grad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = obs.r * 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-obs.vx / norm * tailLen, -obs.vy / norm * tailLen);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, obs.r, 0, Math.PI * 2);
        ctx.fill();
      } else if (obs.type === 'mine') {
        // 機雷（点滅）
        const blink = Math.sin(this.time * 12) > 0;
        ctx.fillStyle = blink ? '#ff3333' : '#00ff88';
        ctx.beginPath();
        ctx.arc(0, 0, obs.r, 0, Math.PI * 2);
        ctx.fill();

        // 突起
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        for (let a = 0; a < 4; a++) {
          const ang = (Math.PI / 2) * a + this.time * 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * obs.r, Math.sin(ang) * obs.r);
          ctx.lineTo(Math.cos(ang) * (obs.r + 4), Math.sin(ang) * (obs.r + 4));
          ctx.stroke();
        }
      } else if (obs.type === 'shard') {
        ctx.fillStyle = obs.color;
        ctx.beginPath();
        ctx.arc(0, 0, obs.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // パーティクル描画
    for (const p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // 自機描画（青・赤）
    this.drawShip(ctx, this.p1, 'BLUE');
    this.drawShip(ctx, this.p2, 'RED');

    // HUD 描画
    this.drawHUD(ctx);

    ctx.restore();
  },

  drawShip(ctx, ship, label) {
    ctx.save();
    ctx.translate(ship.x, ship.y);

    // 外枠オーラ
    ctx.beginPath();
    ctx.arc(0, 0, ship.drawR + 4, 0, Math.PI * 2);
    ctx.fillStyle = ship.trailColor;
    ctx.fill();

    // コア本体
    ctx.beginPath();
    ctx.arc(0, 0, ship.drawR, 0, Math.PI * 2);
    ctx.fillStyle = ship.color;
    ctx.fill();

    // 当たり判定を示す中央核
    ctx.beginPath();
    ctx.arc(0, 0, ship.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // 識別ラベル
    ctx.font = '10px sans-serif';
    ctx.fillStyle = ship.color;
    ctx.textAlign = 'center';
    ctx.fillText(label, 0, -ship.drawR - 6);

    ctx.restore();
  },

  drawHUD(ctx) {
    const W = this.api.W;
    const remain = Math.max(0, this.targetTime - this.time);
    const m = Math.floor(remain / 60);
    const s = Math.floor(remain % 60);
    const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;

    // 背景バー
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(0, 0, W, 44);

    // 生存時間・カウントダウン
    ctx.font = 'bold 20px monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(`WARP IN: ${timeStr}`, W / 2, 26);

    // スコア表示
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#00f0ff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${this.api.score}`, 16, 26);

    // 進行度バー
    const barW = W - 32;
    const progress = Math.min(1, this.time / this.targetTime);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.fillRect(16, 36, barW, 4);

    const grad = ctx.createLinearGradient(16, 0, 16 + barW, 0);
    grad.addColorStop(0, '#00f0ff');
    grad.addColorStop(1, '#ff0055');
    ctx.fillStyle = grad;
    ctx.fillRect(16, 36, barW * progress, 4);

    // 序盤の操作ガイド表示
    if (this.time < 3.5) {
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      const alpha = Math.sin(this.time * 6) * 0.3 + 0.7;
