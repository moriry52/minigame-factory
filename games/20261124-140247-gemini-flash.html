<!DOCTYPE html>
<html lang="ja">
<head>

<title>マグネフォージ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d14;color:#eef;overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#screen{display:block;background:#000;touch-action:none;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,6,12,.72);backdrop-filter:blur(2px);touch-action:none}
#overlay.hidden{display:none}
.panel{width:min(92%,420px);max-height:92%;overflow:auto;background:#151a2b;border:1px solid #2c3554;
  border-radius:16px;padding:20px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h1{font-size:24px;margin-bottom:8px;letter-spacing:.02em}
.panel h2{font-size:20px;margin-bottom:8px}
.panel p{font-size:14px;line-height:1.6;color:#c9d0ea}
.panel .box{margin:12px 0;padding:10px 12px;background:#0e1220;border-radius:10px;text-align:left}
.panel .box b{display:block;font-size:12px;color:#8fa0d8;margin-bottom:4px}
.panel ul{padding-left:1.2em;font-size:13px;line-height:1.6;color:#c9d0ea}
.panel .score{font-size:40px;font-weight:800;margin:6px 0}
.panel .best{font-size:13px;color:#8fa0d8}
.btn{display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:999px;border:0;
  background:#5b7cff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sub{background:#2c3554}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#pad{display:none;height:190px;flex:none;position:relative;touch-action:none}
#pad.show{display:block}
.pbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(120,140,220,.18);border:2px solid rgba(160,180,255,.35);color:#dfe6ff;
  font-weight:800;font-size:18px;touch-action:none}
.pbtn.on{background:rgba(120,150,255,.55)}
.pbtn.dir{border-radius:14px;width:58px;height:58px;font-size:20px}
.pbtn.act{width:78px;height:78px;font-size:15px;text-align:center;line-height:1.1;padding:4px}
#topbar{flex:none;height:38px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 8px}
#topbar a,#topbar button{background:rgba(20,24,40,.7);border:1px solid #2c3554;color:#cfd7f5;font-size:13px;
  padding:6px 10px;border-radius:999px;text-decoration:none;cursor:pointer}

<body>
<div id="app">
<div id="topbar">
    <button id="muteBtn" type="button" aria-label="音のオン・オフ">🔊</button>
    <button id="pauseBtn" type="button" aria-label="一時停止">⏸</button>
    <a href="../index.html">一覧</a>
  </div>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="hud"></div>
    <div id="overlay"></div>
  </div>

</div>
<script type="application/json" id="meta">{"id": "20261124-140247-gemini-flash", "title": "マグネフォージ", "summary": "磁気ドローンを操り、鉄くずを引き寄せて弾き飛ばす工場アクション！スクラップを炉へ一気にシュートしてハイスコアを目指せ。", "rules": ["十字キーで全方向に移動し、Aボタンで磁気吸引、Bボタンで磁気反発を発動する", "散らばる金属スクラップを吸引して引き連れ、反発で画面上部の「溶解炉」へ弾き飛ばすと得点", "赤熱した危険ボルトに当たるとタイムロス。反発で弾き飛ばして安全を確保せよ", "制限時間180秒（3分）でどれだけ多くのスクラップを処理できるかを競う"], "controls": {"スマホ": "画面下の十字キーで移動、Aボタンで吸い寄せ（長押し）、Bボタンで周囲へ強力に弾き飛ばします。", "PC": "矢印キーで移動、Zキー長押しで吸い寄せ、Xキーで弾き飛ばします。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "仮想パッド", "buttons": [{"key": "A", "label": "吸引"}, {"key": "B", "label": "反発"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.timeRemaining = 180;
    this.player = {
      x: 240,
      y: 320,
      vx: 0,
      vy: 0,
      r: 14,
      speed: 180,
      stun: 0,
      invuln: 0,
      repelCd: 0
    };
    this.scraps = [];
    this.hazards = [];
    this.particles = [];
    this.shockwaves = [];
    this.floatingTexts = [];

    this.furnace = { x: 160, y: 15, w: 160, h: 55 };

    this.scrapTimer = 0;
    this.hazardTimer = 4.0; // 最初の3秒以上は危険物なし

    this.combo = 0;
    this.comboTimer = 0;

    this.attractHumTimer = 0;
  },

  update(dt) {
    // タイムカウントダウン
    this.timeRemaining -= dt;
    if (this.timeRemaining <= 0) {
      this.timeRemaining = 0;
      this.api.clear();
      return;
    }

    const input = this.api.input;
    const p = this.player;

    // スタンと無敵時間の処理
    if (p.stun > 0) {
      p.stun -= dt;
      p.vx = 0;
      p.vy = 0;
    } else {
      let dx = 0;
      let dy = 0;
      if (input.left) dx -= 1;
      if (input.right) dx += 1;
      if (input.up) dy -= 1;
      if (input.down) dy += 1;

      if (dx !== 0 && dy !== 0) {
        const inv = 1 / Math.SQRT2;
        dx *= inv;
        dy *= inv;
      }

      p.vx = dx * p.speed;
      p.vy = dy * p.speed;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      // 画面境界 (上部は炉の下あたりに壁)
      p.x = this.api.util.clamp(p.x, 24, this.api.W - 24);
      p.y = this.api.util.clamp(p.y, 80, this.api.H - 24);
    }

    if (p.invuln > 0) p.invuln -= dt;
    if (p.repelCd > 0) p.repelCd -= dt;

    // Aボタン: 磁気吸引
    const isAttracting = input.a && p.stun <= 0;
    if (isAttracting) {
      this.attractHumTimer -= dt;
      if (this.attractHumTimer <= 0) {
        this.api.sound.tone(140, 0.08, 'triangle', 0.15, 90);
        this.attractHumTimer = 0.12;
      }
      // 自機周囲に吸い込みパーティクル
      if (Math.random() < 0.6) {
        const ang = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 35;
        this.particles.push({
          x: p.x + Math.cos(ang) * dist,
          y: p.y + Math.sin(ang) * dist,
          vx: -Math.cos(ang) * 90,
          vy: -Math.sin(ang) * 90,
          life: 0.3,
          maxLife: 0.3,
          r: 2,
          color: '#55d6ff'
        });
      }
    }

    // Bボタン: 磁気反発
    if ((input.bPressed || (input.b && p.repelCd <= 0)) && p.stun <= 0) {
      p.repelCd = 0.28;
      this.api.sound.play('powerup');
      this.api.sound.tone(320, 0.15, 'sawtooth', 0.3, 80);

      // 衝撃波エフェクト追加
      this.shockwaves.push({
        x: p.x,
        y: p.y,
        r: 10,
        maxR: 125,
        alpha: 1.0
      });

      // スクラップを弾く
      for (const s of this.scraps) {
        const d = this.api.util.dist(p.x, p.y, s.x, s.y);
        if (d < 125 && d > 0) {
          const ang = this.api.util.angle(p.x, p.y, s.x, s.y);
          // プレイヤーが上向きまたは上方に押し出すのを助ける補正
          let bonusY = -100;
          const force = 380 + (125 - d) * 2.2;
          s.vx = Math.cos(ang) * force;
          s.vy = Math.sin(ang) * force + bonusY;
          s.launched = true;
          s.trailTimer = 0;
        }
      }

      // 赤熱ボルトを弾く
      for (const h of this.hazards) {
        const d = this.api.util.dist(p.x, p.y, h.x, h.y);
        if (d < 125 && d > 0) {
          const ang = this.api.util.angle(p.x, p.y, h.x, h.y);
          const force = 480;
          h.vx = Math.cos(ang) * force;
          h.vy = Math.sin(ang) * force;
          h.repelled = true;
        }
      }
    }

    // スクラップの挙動
    for (let i = this.scraps.length - 1; i >= 0; i--) {
      const s = this.scraps[i];

      // 吸引処理
      if (isAttracting) {
        const d = this.api.util.dist(p.x, p.y, s.x, s.y);
        if (d < 95 && d > 2) {
          const ang = this.api.util.angle(s.x, s.y, p.x, p.y);
          const pull = 260 * (1 - d / 110);
          s.vx += Math.cos(ang) * pull * dt * 8;
          s.vy += Math.sin(ang) * pull * dt * 8;
          // 速度上限
          const spd = Math.hypot(s.vx, s.vy);
          if (spd > 240) {
            s.vx = (s.vx / spd) * 240;
            s.vy = (s.vy / spd) * 240;
          }
        }
      }

      // 摩擦
      s.vx *= Math.pow(0.88, dt * 60);
      s.vy *= Math.pow(0.88, dt * 60);

      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vRot * dt;

      // 打ち出し時の軌跡
      if (s.launched && Math.hypot(s.vx, s.vy) > 80) {
        s.trailTimer = (s.trailTimer || 0) + dt;
        if (s.trailTimer > 0.04) {
          s.trailTimer = 0;
          this.particles.push({
            x: s.x,
            y: s.y,
            vx: 0,
            vy: 0,
            life: 0.2,
            maxLife: 0.2,
            r: s.r * 0.7,
            color: '#ffd24c'
          });
        }
      }

      // 溶解炉への投入判定
      if (
        s.x >= this.furnace.x &&
        s.x <= this.furnace.x + this.furnace.w &&
        s.y <= this.furnace.y + this.furnace.h + 5
      ) {
        // 得点処理
        this.combo++;
        this.comboTimer = 2.0;
        const multiplier = Math.min(3.0, 1.0 + (this.combo - 1) * 0.2);
        const pts = Math.round(s.scoreBase * multiplier);
        this.api.addScore(pts);

        this.api.sound.play('coin');
        this.api.sound.tone(600 + this.combo * 40, 0.12, 'square', 0.2);

        // 炉内炎エフェクト
        for (let k = 0; k < 12; k++) {
          this.particles.push({
            x: s.x + this.api.util.rand(-10, 10),
            y: s.y,
            vx: this.api.util.rand(-60, 60),
            vy: this.api.util.rand(-140, -40),
            life: 0.4,
            maxLife: 0.4,
            r: 4,
            color: this.api.util.choice(['#ff3b00', '#ff9900', '#ffee55'])
          });
        }

        this.floatingTexts.push({
          x: s.x,
          y: s.y,
          text: `+${pts}` + (this.combo > 1 ? ` (x${multiplier.toFixed(1)})` : ''),
          life: 0.8,
          color: '#ffee44'
        });

        this.scraps.splice(i, 1);
        continue;
      }

      // 壁との反射
      if (s.x < 18 + s.r) { s.x = 18 + s.r; s.vx *= -0.7; }
      if (s.x > this.api.W - 18 - s.r) { s.x = this.api.W - 18 - s.r; s.vx *= -0.7; }
      if (s.y > this.api.H - 18 - s.r) { s.y = this.api.H - 18 - s.r; s.vy *= -0.7; }
      if (s.y < 70 + s.r && (s.x < this.furnace.x || s.x > this.furnace.x + this.furnace.w)) {
        s.y = 70 + s.r;
        s.vy *= -0.7;
      }
    }

    // 危険ボルトの処理
    for (let i = this.hazards.length - 1; i >= 0; i--) {
      const h = this.hazards[i];

      if (!h.repelled) {
        // 自機に向かってゆっくり移動
        const ang = this.api.util.angle(h.x, h.y, p.x, p.y);
        h.vx += Math.cos(ang) * h.accel * dt;
        h.vy += Math.sin(ang) * h.accel * dt;
        const spd = Math.hypot(h.vx, h.vy);
        if (spd > h.maxSpd) {
          h.vx = (h.vx / spd) * h.maxSpd;
          h.vy = (h.vy / spd) * h.maxSpd;
        }
      } else {
        // 反発されて高速移動中
        h.vx *= Math.pow(0.96, dt * 60);
        h.vy *= Math.pow(0.96, dt * 60);
      }

      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.rot += 6 * dt;

      // 自機との接触判定
      if (p.invuln <= 0) {
        if (this.api.util.dist(p.x, p.y, h.x, h.y) < p.r + h.r) {
          // 被弾！スタン＆タイムロス
          p.stun = 1.0;
          p.invuln = 2.0;
          this.timeRemaining = Math.max(0, this.timeRemaining - 5);
          this.combo = 0;
          this.api.sound.play('hurt');
          this.api.sound.play('explode');

          this.floatingTexts.push({
            x: p.x,
            y: p.y - 15,
            text: '-5 SEC!',
            life: 1.0,
            color: '#ff2244'
          });

          // 衝撃飛散
          for (let k = 0; k < 16; k++) {
            this.particles.push({
              x: p.x,
              y: p.y,
              vx: this.api.util.rand(-150, 150),
              vy: this.api.util.rand(-150, 150),
              life: 0.5,
              maxLife: 0.5,
              r: 3,
              color: '#ff3344'
            });
          }
          this.hazards.splice(i, 1);
          continue;
        }
      }

      // 反発されたボルトが外壁に衝突して消滅ボーナス
      if (h.repelled) {
        const hitWall =
          h.x <= 18 + h.r ||
          h.x >= this.api.W - 18 - h.r ||
          h.y <= 65 + h.r ||
          h.y >= this.api.H - 18 - h.r;

        if (hitWall) {
          this.api.addScore(50);
          this.api.sound.play('hit');
          for (let k = 0; k < 8; k++) {
            this.particles.push({
              x: h.x,
              y: h.y,
              vx: this.api.util.rand(-100, 100),
              vy: this.api.util.rand(-100, 100),
              life: 0.3,
              maxLife: 0.3,
              r: 3,
              color: '#ffaa33'
            });
          }
          this.floatingTexts.push({
            x: h.x,
            y: h.y,
            text: '+50 (CRUSH)',
            life: 0.7,
            color: '#ffaa33'
          });
          this.hazards.splice(i, 1);
          continue;
        }
      } else {
        // 通常ボルトの壁押し戻し
        h.x = this.api.util.clamp(h.x, 24, this.api.W - 24);
        h.y = this.api.util.clamp(h.y, 75, this.api.H - 24);
      }
    }

    // コンボタイマー
    if (this.combo > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.combo = 0;
      }
    }

    // スクラップ湧き
    this.scrapTimer -= dt;
    const progress = 1 - this.timeRemaining / 180; // 0..1
    const scrapInterval = this.api.util.lerp(1.2, 0.5, progress);
    if (this.scrapTimer <= 0 && this.scraps.length < 24) {
      this.scrapTimer = scrapInterval;
      this.spawnScrap();
    }

    // 危険ボルト湧き（3秒後から）
    this.hazardTimer -= dt;
    const hazardInterval = this.api.util.lerp(4.0, 1.6, progress);
    if (this.hazardTimer <= 0) {
      this.hazardTimer = hazardInterval;
      this.spawnHazard(progress);
    }

    // 衝撃波更新
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      const sw = this.shockwaves[i];
      sw.r += 420 * dt;
      sw.alpha = 1 - sw.r / sw.maxR;
      if (sw.r >= sw.maxR) {
        this.shockwaves.splice(i, 1);
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) {
        this.particles.splice(i, 1);
      }
    }

    // ポップアップテキスト更新
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y -= 35 * dt;
      ft.life -= dt;
      if (ft.life <= 0) {
        this.floatingTexts.splice(i, 1);
      }
    }
  },

  spawnScrap() {
    const roll = Math.random();
    let type = 0; // 0: 小型ネジ, 1: 中型ギア, 2: 大型鉄塊
    let r = 6;
    let scoreBase = 10;
    if (roll > 0.82) {
      type = 2;
      r = 15;
      scoreBase = 80;
    } else if (roll > 0.45) {
      type = 1;
      r = 10;
      scoreBase = 30;
    }

    // 画面中央〜下部に出現
    const x = this.api.util.rand(40, this.api.W - 40);
    const y = this.api.util.rand(140, this.api.H - 40);

    this.scraps.push({
      x,
      y,
      vx: this.api.util.rand(-20, 20),
      vy: this.api.util.rand(-20, 20),
      rot: Math.random() * Math.PI * 2,
      vRot: this.api.util.rand(-3, 3),
      type,
      r,
      scoreBase,
      launched: false
    });
  },

  spawnHazard(progress) {
    const side = this.api.util.choice(['left', 'right', 'bottom']);
    let x, y;
    if (side === 'left') {
      x = 24;
      y = this.api.util.rand(120, this.api.H - 50);
    } else if (side === 'right') {
      x = this.api.W - 24;
      y = this.api.util.rand(120, this.api.H - 50);
    } else {
      x = this.api.util.rand(40, this.api.W - 40);
      y = this.api.H - 24;
    }

    const accel = this.api.util.lerp(70, 140, progress);
    const maxSpd = this.api.util.lerp(80, 150, progress);

    this.hazards.push({
      x,
      y,
      vx: 0,
      vy: 0,
      r: 8,
      rot: 0,
      accel,
      maxSpd,
      repelled: false
    });
  },

  draw(ctx) {
    const W = this.api.W;
    const H = this.api.H;
    const p = this.player;

    // 1. 床面背景（ダークグレー鉄板）
    ctx.fillStyle = '#1c1f24';
    ctx.fillRect(0, 0, W, H);

    // 鉄板タイル模様
    ctx.strokeStyle = '#252a30';
    ctx.lineWidth = 1;
    for (let x = 20; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 20; y < H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    // 2. 外周の警戒縞模様の壁
    this.drawHazardBorder(ctx, W, H);

    // 3. 溶解炉（上部中央）
    this.drawFurnace(ctx);

    // 4. 衝撃波
    for (const sw of this.shockwaves) {
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(100, 230, 255, ${sw.alpha * 0.9})`;
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r * 0.8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 255, 255, ${sw.alpha * 0.5})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 5. 吸引中の電磁力フィールドエフェクト
    if (this.api.input.a && p.stun <= 0) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 90, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(70, 180, 255, 0.08)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(100, 210, 255, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 6. スクラップ描画
    for (const s of this.scraps) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      if (s.type === 0) {
        // 小型ネジ
        ctx.fillStyle = '#9aa5b5';
        ctx.beginPath();
        ctx.arc(0, 0, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4f5863';
        ctx.fillRect(-s.r * 0.7, -1.5, s.r * 1.4, 3);
      } else if (s.type === 1) {
        // 中型ギア
        ctx.fillStyle = '#b08b59';
        ctx.beginPath();
        ctx.arc(0, 0, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1c1f24';
        ctx.beginPath();
        ctx.arc(0, 0, s.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
        // ギアの歯
        ctx.strokeStyle = '#b08b59';
        ctx.lineWidth = 3;
        for (let a = 0; a < 6; a++) {
          const ang = (a * Math.PI) / 3;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * (s.r - 1), Math.sin(ang) * (s.r - 1));
          ctx.lineTo(Math.cos(ang) * (s.r + 3), Math.sin(ang) * (s.r + 3));
          ctx.stroke();
        }
      } else {
        // 大型鉄塊
        ctx.fillStyle = '#6e7682';
        ctx.fillRect(-s.r, -s.r, s.r * 2, s.r * 2);
        ctx.strokeStyle = '#9ca4b0';
        ctx.lineWidth = 2;
        ctx.strokeRect(-s.r, -s.r, s.r * 2, s.r * 2);
        ctx.fillStyle = '#ffaa33';
        ctx.fillRect(-3, -3, 6, 6);
      }
      ctx.restore();
    }

    // 7. 危険ボルト描画（赤熱）
    for (const h of this.hazards) {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);

      // グロー効果
      ctx.shadowColor = '#ff3300';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ff2a1a';
      // 六角ボルト風
      ctx.beginPath();
      for (let a = 0; a < 6; a++) {
        const rad = (a * Math.PI) / 3;
        const x = Math.cos(rad) * h.r;
        const y = Math.sin(rad) * h.r;
        if (a === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffe555';
      ctx.beginPath();
      ctx.arc(0, 0, h.r * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    // 8. 自機描画
    if (p.invuln <= 0 || Math.floor(this.api.time * 15) % 2 === 0) {
      ctx.save();
      ctx.translate(p.x, p.y);

      // 外周リング
      ctx.strokeStyle = p.stun > 0 ? '#ff4444' : '#00e5ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.stroke();

      // 内周コア
      ctx.fillStyle = p.stun > 0 ? '#ff8888' : '#e0f7fa';
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 回転ブレード/マグネット極
      const angle = this.api.time * (this.api.input.a ? 12 : 4);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        const a = angle + (i * Math.PI) / 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
        ctx.lineTo(Math.cos(a) * (p.r - 1), Math.sin(a) * (p.r - 1));
        ctx.stroke();
      }
      ctx.restore();
    }

    // 9. パーティクル
    for (const pt of this.particles) {
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * (pt.life / pt.maxLife), 0, Math.PI * 2);
      ctx.fill();
    }

    // 10. フローティングテキスト
    for (const ft of this.floatingTexts) {
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
    }

    // 11. HUD描画（上端付近）
    this.drawHUD(ctx);
  },

  drawHazardBorder(ctx, W, H) {
    const bw = 14;
    ctx.fillStyle = '#2d2d30';
    ctx.fillRect(0, 0, W, bw);
    ctx.fillRect(0, H - bw, W, bw);
    ctx.fillRect(0, 0, bw, H);
    ctx.fillRect(W - bw, 0, bw, H);

    // 警戒縞アクセント
    ctx.fillStyle = '#f0b000';
    for (let x = 0; x < W; x += 28) {
      ctx.fillRect(x, 0, 14, bw);
      ctx.fillRect(x + 14, H - bw, 14, bw);
    }
  },

  drawFurnace(ctx) {
    const f = this.furnace;

    // 炉外壁
    ctx.fillStyle = '#3a2d28';
    ctx.fillRect(f.x, f.y, f.w, f.h);
    ctx.strokeStyle = '#734e3d';
    ctx.lineWidth = 4;
    ctx.strokeRect(f.x, f.y, f.w, f.h);

    // 炉内部の炎
    const glow = 0.7 + Math.sin(this.api.time * 8) * 0.3;
    const grad = ctx.createLinearGradient(f.x, f.y, f.x, f.y + f.h);
    grad.addColorStop(0, `rgba(255, 60, 0, ${glow})`);
    grad.addColorStop(1, `rgba(255, 200, 40, ${glow})`);
    ctx.fillStyle = grad;
    ctx.fillRect(f.x + 6, f.y + 6, f.w - 12, f.h - 12);

    // 看板「MELTER」
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('▼ 溶解炉 MELTER ▼', f.x + f.w / 2, f.y + f.h / 2 + 5);
  },

  drawHUD(ctx) {
    // スコア
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`SCORE: ${this.api.score}`, 22, 38);

    // 残り時間
    const sec = Math.ceil(this.timeRemaining);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;
    ctx.textAlign = 'right';
    ctx.fillStyle = sec <= 20 ? '#ff3b30' : '#4cd964';
    ctx.fillText(`TIME: ${timeStr}`, this.api.W - 22, 38);

    // コンボ表示
    if (this.combo > 1) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd633';
      ctx.font = 'bold 15px sans-serif';
      const mult = Math.min(3.0, 1.0 + (this.combo - 1) * 0.2);
      ctx.fillText(`COMBO x${this.combo} (${mult.toFixed(1)}倍!)`, this.api.W / 2, 88);
    }

    // スタン警告
    if (this.player.stun > 0) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff3344';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('EMERGENCY STUNNED!', this.api.W / 2, 220);
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
