<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.totalTime = 180; // 3分間 (180秒)
    this.timer = this.totalTime;
    this.combo = 0;
    this.maxCombo = 0;

    // スクロール背景
    this.bgOffset1 = 0;
    this.bgOffset2 = 0;

    // 大木（幹）のリスト
    this.trees = [];
    this.treeSpawnTimer = 0.5;

    // ストック動物（3枠固定：画面下部）
    // 形状タイプ: 0: 丸(リス), 1: 三角(キツネ), 2: 四角(クマ)
    this.stockSlots = [
      { x: 180, y: 310, animal: null },
      { x: 320, y: 310, animal: null },
      { x: 460, y: 310, animal: null }
    ];
    for (let slot of this.stockSlots) {
      slot.animal = this.createAnimal(slot.x, slot.y, this.api.util.randInt(0, 2));
    }

    // ドラッグ中の動物
    this.draggedAnimal = null;

    // キーボード操作用の選択インデックス
    this.selectedSlot = 1;

    // パーティクル & エフェクトテキスト
    this.particles = [];
    this.popups = [];
  },

  createAnimal(x, y, type) {
    return {
      type: type, // 0: 丸(リス), 1: 三角(キツネ), 2: 四角(クマ)
      x: x,
      y: y,
      homeX: x,
      homeY: y,
      returning: false
    };
  },

  update(dt) {
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = 0;
      this.api.sound.play('clear');
      this.api.clear();
      return;
    }

    const elapsed = this.totalTime - this.timer;
    // 難易度に応じたスクロール速度 (40px/s から最大 85px/s)
    const baseSpeed = 45 + Math.min(40, elapsed * 0.25);

    // 背景スクロール
    this.bgOffset1 = (this.bgOffset1 + baseSpeed * 0.25 * dt) % this.api.W;
    this.bgOffset2 = (this.bgOffset2 + baseSpeed * 0.5 * dt) % this.api.W;

    // 木の出現
    this.treeSpawnTimer -= dt;
    if (this.treeSpawnTimer <= 0) {
      // 巣穴の個数: 後半は複数出現
      let holeCount = 1;
      if (elapsed > 35 && Math.random() < 0.45) holeCount = 2;
      if (elapsed > 80 && Math.random() < 0.3) holeCount = 3;

      const holes = [];
      const holeSpacing = 50;
      const startHoleY = 140 - ((holeCount - 1) * holeSpacing) / 2;

      for (let i = 0; i < holeCount; i++) {
        const isGold = Math.random() < 0.12; // 12%で金の枠
        holes.push({
          y: startHoleY + i * holeSpacing,
          type: this.api.util.randInt(0, 2),
          isGold: isGold,
          filled: false,
          fillAnimal: null,
          pulse: 0
        });
      }

      this.trees.push({
        x: this.api.W + 60,
        w: 90,
        h: 240,
        holes: holes
      });

      this.treeSpawnTimer = 3.2 - Math.min(1.4, elapsed * 0.008) + this.api.util.rand(-0.2, 0.4);
    }

    // 木の移動と更新
    for (let i = this.trees.length - 1; i >= 0; i--) {
      const tree = this.trees[i];
      tree.x -= baseSpeed * dt;

      for (let h of tree.holes) {
        h.pulse += dt * 3;
      }

      // 画面外に出たら消去
      if (tree.x + tree.w < -50) {
        const missed = tree.holes.some(h => !h.filled);
        if (missed && this.combo > 0) {
          this.combo = 0;
        }
        this.trees.splice(i, 1);
      }
    }

    // ドラッグ＆入力処理
    const input = this.api.input;

    // キーボード操作：数字キーや矢印キー対応
    if (!this.draggedAnimal) {
      if (input.leftPressed) this.selectedSlot = (this.selectedSlot + 2) % 3;
      if (input.rightPressed) this.selectedSlot = (this.selectedSlot + 1) % 3;
      if (input.aPressed || input.upPressed) {
        const slotAnimal = this.stockSlots[this.selectedSlot]?.animal;
        if (slotAnimal && !slotAnimal.returning) {
          this.draggedAnimal = slotAnimal;
          this.api.sound.play('select');
        }
      }
    }

    // タッチ / マウスの押し込み開始
    if (input.pointer.pressed) {
      let bestDist = 60;
      let targetIdx = -1;
      for (let i = 0; i < this.stockSlots.length; i++) {
        const slot = this.stockSlots[i];
        if (slot.animal && !slot.animal.returning) {
          const d = this.api.util.dist(input.pointer.x, input.pointer.y, slot.animal.x, slot.animal.y);
          if (d < bestDist) {
            bestDist = d;
            targetIdx = i;
          }
        }
      }

      if (targetIdx !== -1) {
        this.selectedSlot = targetIdx;
        this.draggedAnimal = this.stockSlots[targetIdx].animal;
        // 指で隠れないよう少し上に持ち上げる
        this.draggedAnimal.y -= 25;
        this.api.sound.play('select');
      }
    }

    // ドラッグ中の移動（指で自機が隠れないよう pointer.dx / pointer.dy による相対移動）
    if (this.draggedAnimal) {
      if (input.pointer.down) {
        this.draggedAnimal.x += input.pointer.dx;
        this.draggedAnimal.y += input.pointer.dy;
      }

      // 矢印キーでの移動も可能
      const keySpeed = 260 * dt;
      if (input.left) this.draggedAnimal.x -= keySpeed;
      if (input.right) this.draggedAnimal.x += keySpeed;
      if (input.up) this.draggedAnimal.y -= keySpeed;
      if (input.down) this.draggedAnimal.y += keySpeed;

      // 画面内制限
      this.draggedAnimal.x = this.api.util.clamp(this.draggedAnimal.x, 20, this.api.W - 20);
      this.draggedAnimal.y = this.api.util.clamp(this.draggedAnimal.y, 20, this.api.H - 20);

      // 指を離した時、またはキーボードで再度Aが押されたら配置判定
      if (input.pointer.released || (input.aPressed && !input.pointer.down)) {
        this.checkMatch(this.draggedAnimal);
        this.draggedAnimal = null;
      }
    }

    // ストック補充 & 戻るアニメーション
    for (let i = 0; i < this.stockSlots.length; i++) {
      const slot = this.stockSlots[i];
      if (!slot.animal) {
        slot.animal = this.createAnimal(slot.x, slot.y + 70, this.api.util.randInt(0, 2));
      }
      const a = slot.animal;
      if (a) {
        if (a.returning) {
          a.x = this.api.util.lerp(a.x, a.homeX, dt * 14);
          a.y = this.api.util.lerp(a.y, a.homeY, dt * 14);
          if (this.api.util.dist(a.x, a.y, a.homeX, a.homeY) < 2) {
            a.x = a.homeX;
            a.y = a.homeY;
            a.returning = false;
          }
        } else if (a !== this.draggedAnimal) {
          a.x = this.api.util.lerp(a.x, a.homeX, dt * 8);
          a.y = this.api.util.lerp(a.y, a.homeY, dt * 8);
        }
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      p.alpha = Math.max(0, p.life / p.maxLife);
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    // ポップアップ文字更新
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const pop = this.popups[i];
      pop.y -= 25 * dt;
      pop.life -= dt;
      if (pop.life <= 0) this.popups.splice(i, 1);
    }
  },

  checkMatch(animal) {
    let matchedHole = null;
    let targetTree = null;
    let minDist = 48;

    for (let tree of this.trees) {
      for (let hole of tree.holes) {
        if (!hole.filled) {
          const hx = tree.x + tree.w / 2;
          const hy = hole.y;
          const d = this.api.util.dist(animal.x, animal.y, hx, hy);
          if (d < minDist) {
            minDist = d;
            matchedHole = hole;
            targetTree = tree;
          }
        }
      }
    }

    if (matchedHole && targetTree) {
      if (animal.type === matchedHole.type) {
        // ぴったり合致
        matchedHole.filled = true;
        matchedHole.fillAnimal = animal.type;
        this.combo++;
        if (this.combo > this.maxCombo) this.maxCombo = this.combo;

        const multiplier = Math.min(5, 1 + Math.floor(this.combo / 5));
        let pts = 100 * multiplier;
        if (matchedHole.isGold) pts += 500;

        this.api.addScore(pts);
        this.api.sound.play(matchedHole.isGold ? 'powerup' : 'coin');

        this.popups.push({
          text: `+${pts}` + (matchedHole.isGold ? ' どんぐりボーナス!' : (multiplier > 1 ? ` (${multiplier}倍)` : '')),
          x: targetTree.x + targetTree.w / 2,
          y: matchedHole.y - 20,
          color: matchedHole.isGold ? '#facc15' : '#4ade80',
          life: 0.8
        });

        const hx = targetTree.x + targetTree.w / 2;
        const hy = matchedHole.y;
        for (let k = 0; k < 12; k++) {
          const ang = this.api.util.rand(0, Math.PI * 2);
          const spd = this.api.util.rand(40, 120);
          this.particles.push({
            x: hx,
            y: hy,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            life: 0.5,
            maxLife: 0.5,
            color: matchedHole.isGold ? '#fbbf24' : '#86efac',
            size: this.api.util.rand(3, 6)
          });
        }

        for (let slot of this.stockSlots) {
          if (slot.animal === animal) {
            slot.animal = null;
            break;
          }
        }
        return;
      } else {
        // 形が違う
        this.combo = 0;
        this.api.sound.play('hurt');
        this.popups.push({
          text: 'ちがうよ！',
          x: targetTree.x + targetTree.w / 2,
          y: matchedHole.y - 20,
          color: '#f87171',
          life: 0.6
        });
      }
    }

    animal.returning = true;
  },

  draw(ctx) {
    // 背景
    const bgGrad = ctx.createLinearGradient(0, 0, 0, this.api.H);
    bgGrad.addColorStop(0, '#78be97');
    bgGrad.addColorStop(0.6, '#a8dfb5');
    bgGrad.addColorStop(1, '#5a824e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, this.api.W, this.api.H);

    // 遠景の山
    ctx.fillStyle = '#4f8560';
    for (let x = -100; x < this.api.W + 100; x += 180) {
      const rx = x - (this.bgOffset1 * 0.4) % 180;
      ctx.beginPath();
      ctx.arc(rx, 230, 90, Math.PI, 0, false);
      ctx.fill();
    }

    // 中景の木々
    ctx.fillStyle = '#3c6e4b';
    for (let x = -60; x < this.api.W + 80; x += 90) {
      const rx = x - (this.bgOffset2 * 0.7) % 90;
      ctx.beginPath();
      ctx.arc(rx, 250, 50, Math.PI, 0, false);
      ctx.fill();
    }

    // 地面
    const groundGrad = ctx.createLinearGradient(0, 250, 0, this.api.H);
    groundGrad.addColorStop(0, '#533c2a');
    groundGrad.addColorStop(0.2, '#3d281a');
    groundGrad.addColorStop(1, '#27170c');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, 250, this.api.W, this.api.H - 250);

    // 草の茂み
    ctx.fillStyle = '#2f5736';
    ctx.fillRect(0, 246, this.api.W, 8);

    // 大木と巣穴の描画
    for (let tree of this.trees) {
      ctx.fillStyle = '#785338';
      ctx.fillRect(tree.x, 30, tree.w, tree.h);

      ctx.strokeStyle = '#5a3b23';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(tree.x + 20, 30); ctx.lineTo(tree.x + 20, 30 + tree.h);
      ctx.moveTo(tree.x + 65, 30); ctx.lineTo(tree.x + 65, 30 + tree.h);
      ctx.stroke();

      // 木の上の葉飾り
      ctx.fillStyle = '#2d5a27';
      ctx.beginPath();
      ctx.arc(tree.x + tree.w / 2, 25, 45, 0, Math.PI * 2);
      ctx.fill();

      for (let hole of tree.holes) {
        const hx = tree.x + tree.w / 2;
        const hy = hole.y;
        const r = 24;

        if (hole.isGold) {
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 4 + Math.sin(hole.pulse) * 1.5;
        } else {
          ctx.strokeStyle = '#3d2616';
          ctx.lineWidth = 3;
        }

        ctx.fillStyle = '#22130c';

        ctx.save();
        ctx.translate(hx, hy);
        this.drawShape(ctx, hole.type, r);
        ctx.fill();
        ctx.stroke();

        if (hole.filled) {
          this.drawAnimalFace(ctx, hole.fillAnimal, 0, 0, 0.9);
        } else {
          ctx.globalAlpha = 0.35 + Math.sin(hole.pulse) * 0.15;
          this.drawAnimalFace(ctx, hole.type, 0, 0, 0.7);
          ctx.globalAlpha = 1.0;
        }
        ctx.restore();
      }
    }

    // ストック台座
    for (let i = 0; i < this.stockSlots.length; i++) {
      const slot = this.stockSlots[i];
      // 選択中のカーソル枠
      if (i === this.selectedSlot && !this.draggedAnimal) {
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(slot.x, slot.y + 20, 40, 15, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(slot.x, slot.y + 20, 35, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // ストック動物描画
    for (let slot of this.stockSlots) {
      if (slot.animal && slot.animal !== this.draggedAnimal) {
        this.drawAnimalEntity(ctx, slot.animal);
      }
    }
    if (this.draggedAnimal) {
      this.drawAnimalEntity(ctx, this.draggedAnimal, true);
    }

    // パーティクル
    for (let p of this.particles) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // ポップアップ文字
    ctx.textAlign = 'center';
    ctx.font = 'bold 15px sans-serif';
    for (let pop of this.popups) {
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, pop.x, pop.y);
    }

    // HUD
    this.drawHUD(ctx);
  },

  drawShape(ctx, type, r) {
    ctx.beginPath();
    if (type === 0) {
      ctx.arc(0, 0, r, 0, Math.PI * 2);
    } else if (type === 1) {
      ctx.moveTo(0, -r - 2);
      ctx.lineTo(r * 1.1, r * 0.9);
      ctx.lineTo(-r * 1.1, r * 0.9);
      ctx.closePath();
    } else if (type === 2) {
      this.roundRectPath(ctx, -r * 0.9, -r * 0.9, r * 1.8, r * 1.8, 6);
    }
  },

  // 互換性のため自前で角丸四角形を定義
  roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  },

  drawAnimalEntity(ctx, animal, isDragging = false) {
    ctx.save();
    ctx.translate(animal.x, animal.y);
    const s = isDragging ? 1.15 : 1.0;
    ctx.scale(s, s);

    if (!isDragging) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 24, 20, 7, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    this.drawAnimalFace(ctx, animal.type, 0, 0, 1.0);
    ctx.restore();
  },

  drawAnimalFace(ctx, type, x, y, scale) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    if (type === 0) {
      // リス (丸・オレンジ)
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.arc(-14, -16, 7, 0, Math.PI * 2);
      ctx.arc(14, -16, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(-8, 6, 8, 0, Math.PI * 2);
      ctx.arc(8, 6, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(-7, -2, 2.5, 0, Math.PI * 2);
      ctx.arc(7, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7c2d12';
      ctx.beginPath();
      ctx.arc(0, 3, 2.5, 0, Math.PI * 2);
      ctx.fill();

    } else if (type === 1) {
      // キツネ (三角・赤茶)
      ctx.fillStyle = '#451a03';
      ctx.beginPath();
      ctx.moveTo(-20, 2); ctx.lineTo(-14, -26); ctx.lineTo(-4, -6);
      ctx.moveTo(20, 2); ctx.lineTo(14, -26); ctx.lineTo(4, -6);
      ctx.fill();

      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.moveTo(0, 24);
      ctx.lineTo(-24, -16);
      ctx.lineTo(24, -16);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff7ed';
      ctx.beginPath();
      ctx.moveTo(0, 24);
      ctx.lineTo(-12, 2);
      ctx.lineTo(12, 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.ellipse(-8, -4, 3, 1.8, -0.2, 0, Math.PI * 2);
      ctx.ellipse(8, -4, 3, 1.8, 0.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(0, 19, 2.5, 0, Math.PI * 2);
      ctx.fill();

    } else if (type === 2) {
      // クマ (四角・こげ茶)
      ctx.fillStyle = '#543310';
      ctx.beginPath();
      ctx.arc(-17, -17, 7, 0, Math.PI * 2);
      ctx.arc(17, -17, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#78350f';
      this.roundRectPath(ctx, -20, -20, 40, 40, 7);
      ctx.fill();

      ctx.fillStyle = '#d97706';
      ctx.beginPath();
      ctx.ellipse(0, 4, 12, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(-8, -6, 2.5, 0, Math.PI * 2);
      ctx.arc(8, -6, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1c1917';
      ctx.beginPath();
      ctx.arc(0, 2, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  },

  drawHUD(ctx) {
    ctx.fillStyle = 'rgba(20, 30, 20, 0.75)';
    ctx.fillRect(0, 0, this.api.W, 36);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${this.api.score}`, 16, 24);

    if (this.combo > 1) {
      ctx.fillStyle = '#fde047';
      const mul = Math.min(5, 1 + Math.floor(this.combo / 5));
      ctx.fillText(`${this.combo} COMBO! (${mul}x)`, 170, 24);
    }

    const m = Math.floor(this.timer / 60);
    const s = Math.floor(this.timer % 60);
    const timeStr = `${m}:${s < 10 ? '0' : ''}${s}`;

    ctx.fillStyle = this.timer < 30 ? '#ef4444' : '#e2e8f0';
    ctx.textAlign = 'right';
    ctx.fillText(`のこり: ${timeStr}`, this.api.W - 16, 24);

    const barW = 110;
    const barH = 5;
    const barX = this.api.W - 130 - barW;
    const barY = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = this.timer < 30 ? '#ef4444' : '#38bdf8';
    ctx.fillRect(barX, barY, barW * (this.timer / this.totalTime), barH);

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('どうぶつをドラッグしておなじ形の巣穴へ運ぼう！', this.api.W / 2, this.api.H - 8);
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
