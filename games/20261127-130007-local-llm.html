<script type="module">
import * as THREE from "three";
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,

  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }

});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {

  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };

});
stage.addEventListener("pointermove", (ev) => {

    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }

  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }

}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });

  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {

    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {

    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {

  },

  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),

    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {

    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }

    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);

// ---------------- ゲームに渡す api ----------------
const api = {

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>

    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {

// 自動テスト用：ゲームの状態（Game の変数）を短い文字列に要約する。操作したときとしないときの違いを比べるのに使う
__G.peek = function () {
  const seen = new WeakSet(); let n = 0;
  const walk = (v, d) => {
    if (++n > 5000 || v === null || v === undefined) return null;
    const t = typeof v;
    if (t === "number") return Number.isFinite(v) ? Math.round(v * 1000) / 1000 : String(v);
    if (t === "string") return v.length > 60 ? v.slice(0, 60) : v;
    if (t === "boolean") return v;
    if (t !== "object" || d > 4 || seen.has(v)) return null;

    if (v.isVector2 || v.isVector3) return [v.x, v.y, v.z].map((x) => walk(x, d + 1));
    if (Array.isArray(v)) return [v.length].concat(v.slice(0, 40).map((x) => walk(x, d + 1)));
    if (v instanceof Map || v instanceof Set) return [v.size];
    const o = {};
    for (const k of Object.keys(v).slice(0, 60)) o[k] = walk(v[k], d + 1);

  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }

  update(dt) {
    if (this.ended) return;
    this.t += dt;
    const input = this.api.input;

    const keySpeed = 8.2 * dt;
    if (input.left) this.targetPos.x -= keySpeed;
    if (input.right) this.targetPos.x += keySpeed;
    if (input.up) this.targetPos.y += keySpeed;
    if (input.down) this.targetPos.y -= keySpeed;

    if (input.pointer && input.pointer.down && (input.pointer.dx || input.pointer.dy)) {
      this.targetPos.x += input.pointer.dx * 0.032;
      this.targetPos.y -= input.pointer.dy * 0.032;
    } else if (input.swipe && (input.swipe.dx || input.swipe.dy)) {
      this.targetPos.x += input.swipe.dx * 0.032;
      this.targetPos.y -= input.swipe.dy * 0.032;
    }

    if (input.tap && input.pointer && (input.pointer.nx !== undefined || input.pointer.x !== undefined)) {
      const p = this.screenToWorld(input.pointer.nx !== undefined ? input.pointer.nx : (input.pointer.x / 360) * 2 - 1, input.pointer.ny !== undefined ? input.pointer.ny : 1 - (input.pointer.y / 640) * 2);
      this.targetPos.x = p.x;
      this.targetPos.y = p.y;
    }

    this.targetPos.x = THREE.MathUtils.clamp(this.targetPos.x, -3.6, 2.4);
    this.targetPos.y = THREE.MathUtils.clamp(this.targetPos.y, -3.4, 3.4);
    this.targetPos.z = 0;

    const smooth = 1 - Math.exp(-12 * dt);
    this.playerPos.lerp(this.targetPos, smooth);
    this.player.position.copy(this.playerPos);
    this.player.rotation.z = THREE.MathUtils.clamp((this.targetPos.y - this.playerPos.y) * 0.18, -0.28, 0.28);

    const flame = this.player.userData.flame;
    if (flame) {
      const s = 0.85 + Math.sin(this.t * 22) * 0.12;
      flame.scale.set(1.15 * s, 0.7 * s, 0.7 * s);
    }

    if (this.invuln > 0) {
      this.invuln -= dt;
      this.player.visible = Math.floor(this.invuln * 14) % 2 === 0;
    } else {
      this.player.visible = true;
    }

    for (const it of this.bgItems) {
      it.obj.position.x -= it.speed * dt;
      if (it.obj.position.x < -13) it.obj.position.x = 13;
    }

    if (this.bossActive) {
      this.bgColor.lerp(this.bossBgColor, 1 - Math.exp(-2 * dt));
      this.scene.fog.color.copy(this.bgColor);
    }

    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fireTimer = 0.17;
      this.spawnPlayerBullet();
      this.playTone(920, 0.055, 'triangle', 0.025);
    }

    if (!this.bossActive && this.t < 50) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        let interval = 2.0;
        if (this.t >= 20) interval = 1.0;
        if (this.t >= 40) interval = 0.55;
        this.spawnTimer = interval * (0.85 + Math.random() * 0.35);
        this.spawnEnemy();
      }
    }

    if (!this.bossActive && this.t >= 50) {
      this.startBoss();
    }

    this.updateBullets(dt);
    this.updateEnemies(dt);
    this.updateBoss(dt);
    this.collide();

    const score = (this.api.score !== undefined ? this.api.score : this.score) || 0;
    const hearts = '♥'.repeat(Math.max(0, this.hp)) + '♡'.repeat(Math.max(0, 3 - this.hp));
    const timeLeft = Math.max(0, Math.ceil(60 - this.t));
    let hud = `HP ${hearts}  残り${timeLeft}s  スコア${score}  コンボ${this.combo}`;
    if (this.bossActive) {
      const bw = Math.max(0, Math.round((this.bossHp / this.bossMaxHp) * 100));
      hud += `  ボス${bw}%`;
    }
    this.api.hud(hud);

    if (this.hp <= 0) {
      this.ended = true;
      this.api.gameOver();
    } else if (this.t >= 60 && !this.bossActive) {
      this.ended = true;
      this.api.gameOver();
    }
  },

  screenToWorld(nx, ny) {
    const v = this._v1.set(nx, ny, 0.5).unproject(this.camera);
    const dir = this._v2.copy(v).sub(this.camera.position).normalize();
    const dist = (0 - this.camera.position.z) / dir.z;
    return this._v3.copy(this.camera.position).addScaledVector(dir, dist);
  },

  spawnPlayerBullet() {
    const b = this.playerBullets.find(x => !x.visible);
    if (!b) return;
    b.visible = true;
    b.position.set(this.playerPos.x + 0.72, this.playerPos.y + 0.08, 0);
    b.scale.setScalar(1);
    b.userData.vx = this.combo >= 20 ? 18.5 : 14.5;
    b.userData.vy = 0;
    b.userData.pierce = this.combo >= 20 ? 3 : (this.combo >= 10 ? 2 : 1);
    b.userData.dmg = 1;
  },

  spawnEnemyBullet(x, y, vx, vy, mat) {
    const b = this.enemyBullets.find(e => !e.visible);
    if (!b) return;
    b.visible = true;
    b.position.set(x, y, 0);
    b.material = mat || this.mat.purple;
    b.scale.setScalar(1);
    b.userData.vx = vx;
    b.userData.vy = vy;
  },

  spawnEnemy() {
    const types = ['squirrel', 'rabbit'];
    if (this.t >= 20) types.push('muntjac');
    if (this.t >= 34) types.push('muntjac');
    const type = types[(Math.random() * types.length) | 0];
    const pool = this.enemyPools[type];
    const e = pool.find(x => !x.visible);
    if (!e) return;

    e.visible = true;
    e.position.set(6.4, 0, 0);
    e.rotation.set(0, 0, 0);
    e.scale.setScalar(1);

    const speedMul = 1 + Math.min(0.55, this.t * 0.009);
    if (type === 'rabbit') {
      e.position.y = 4.2 + Math.random() * 0.6;
      e.userData.vx = -2.1 * speedMul;
      e.userData.vy = -1.35 * speedMul;
      e.userData.hp = 1;
      e.userData.type = 'rabbit';
      e.userData.phase = Math.random() * Math.PI * 2;
      e.userData.shootTimer = 0;
    } else if (type === 'squirrel') {
      e.position.y = -3.2 + Math.random() * 6.4;
      e.userData.vx = -2.8 * speedMul;
      e.userData.vy = 0;
      e.userData.hp = 1;
      e.userData.type = 'squirrel';
      e.userData.phase = Math.random() * Math.PI * 2;
      e.userData.shootTimer = 0;
    } else {
      e.position.y = -2.6 + Math.random() * 5.2;
      e.userData.vx = -1.8 * speedMul;
      e.userData.vy = 0;
      e.userData.hp = 2;
      e.userData.type = 'muntjac';
      e.userData.phase = Math.random() * Math.PI * 2;
      e.userData.shootTimer = 0.6 + Math.random() * 0.8;
    }
    e.userData.baseY = e.position.y;
  },

  startBoss() {
    this.bossActive = true;
    this.bossHp = this.bossMaxHp;
    this.boss.group.visible = true;
    this.boss.group.position.set(6.8, 0, 0);
    this.boss.group.scale.setScalar(1.15);
    this.boss.userData.x = 6.8;
    this.boss.userData.y = 0;
    this.boss.userData.shootTimer = 1.1;
    this.boss.userData.entering = true;
    this.playTone(70, 0.28, 'sine', 0.08);
    this.playTone(110, 0.18, 'triangle', 0.04);
  },

  updateBullets(dt) {
    for (const b of this.playerBullets) {
      if (!b.visible) continue;
      b.position.x += (b.userData.vx || 0) * dt;
      b.position.y += (b.userData.vy || 0) * dt;
      if (b.position.x > 8.5 || b.position.y < -5.5 || b.position.y > 5.5) b.visible = false;
    }

    for (const b of this.enemyBullets) {
      if (!b.visible) continue;
      b.position.x += (b.userData.vx || 0) * dt;
      b.position.y += (b.userData.vy || 0) * dt;
      if (b.position.x < -7.5 || b.position.y < -5.8 || b.position.y > 5.8) b.visible = false;
    }
  },

  updateEnemies(dt) {
    for (const type in this.enemyPools) {
      for (const e of this.enemyPools[type]) {
        if (!e.visible) continue;
        e.position.x += e.userData.vx * dt;
        if (type === 'rabbit') {
          e.position.y += e.userData.vy * dt;
        } else if (type === 'squirrel') {
          e.userData.phase += dt * 2.4;
          e.position.y = e.userData.baseY + Math.sin(e.userData.phase) * 0.55;
        } else {
          e.userData.phase += dt * 1.8;
          e.position.y = e.userData.baseY + Math.sin(e.userData.phase) * 1.25;
          e.userData.shootTimer -= dt;
          if (e.userData.shootTimer <= 0) {
            e.userData.shootTimer = 1.15 + Math.random() * 0.5;
            const dx = this.playerPos.x - e.position.x;
            const dy = this.playerPos.y - e.position.y;
            const len = Math.hypot(dx, dy) || 1;
            const sp = 4.2 + Math.min(1.6, this.t * 0.025);
            this.spawnEnemyBullet(e.position.x - 0.35, e.position.y, (dx / len) * sp, (dy / len) * sp, this.mat.blue);
          }
        }
        e.rotation.z = Math.sin(e.userData.phase) * 0.12;

        if (e.position.x < -7.2 || e.position.y < -5.8 || e.position.y > 5.8) {
          e.visible = false;
        }
      }
    }
  },

  updateBoss(dt) {
    if (!this.bossActive) return;
    const g = this.boss.group;
    if (g.userData.entering) {
      g.userData.x -= 2.2 * dt;
      if (g.userData.x <= 3.35) {
        g.userData.x = 3.35;
        g.userData.entering = false;
      }
    } else {
      g.userData.y = Math.sin(this.t * 1.35) * 1.85;
    }
    g.position.x = g.userData.x;
    g.position.y = g.userData.y || 0;
    g.rotation.z = Math.sin(this.t * 2.1) * 0.08;

    g.userData.shootTimer -= dt;
    if (g.userData.shootTimer <= 0) {
      g.userData.shootTimer = 1.05;
      const bx = g.position.x - 1.2;
      const by = g.position.y + 0.25;
      const base = Math.atan2(this.playerPos.y - by, this.playerPos.x - bx);
      const sp = 4.6;
      for (let i = -1; i <= 1; i++) {
        const a = base + i * 0.32;
        this.spawnEnemyBullet(bx, by, Math.cos(a) * sp, Math.sin(a) * sp, this.mat.purple);
      }
      if (this.t > 55) {
        this.spawnEnemyBullet(bx, by - 0.5, Math.cos(base + 0.55) * sp, Math.sin(base + 0.55) * sp, this.mat.blue);
        this.spawnEnemyBullet(bx, by + 0.5, Math.cos(base - 0.55) * sp, Math.sin(base - 0.55) * sp, this.mat.blue);
      }
    }
  },

  collide() {
    if (this.invuln > 0) {
      this.checkBulletHits();
      return;
    }

    this.checkBulletHits();

    for (const type in this.enemyPools) {
      for (const e of this.enemyPools[type]) {
        if (!e.visible) continue;
        const dx = e.position.x - this.playerPos.x;
        const dy = e.position.y - this.playerPos.y;
        if (dx * dx + dy * dy < 0.82 * 0.82) {
          this.damagePlayer();
          e.visible = false;
          this.addScore(0);
        }
      }
    }

    for (const b of this.enemyBullets) {
      if (!b.visible) continue;
      const dx = b.position.x - this.playerPos.x;
      const dy = b.position.y - this.playerPos.y;
      if (dx * dx + dy * dy < 0.55 * 0.55) {
        b.visible = false;
        this.damagePlayer();
      }
    }

    if (this.bossActive) {
      const g = this.boss.group;
      const dx = g.position.x - this.playerPos.x;
      const dy = g.position.y - this.playerPos.y;
      if (dx * dx + dy * dy < 1.95 * 1.95) this.damagePlayer();
    }
  },

  checkBulletHits() {
    for (const b of this.playerBullets) {
      if (!b.visible) continue;
      let consumed = false;

      for (const type in this.enemyPools) {
        for (const e of this.enemyPools[type]) {
          if (!e.visible) continue;
          const dx = e.position.x - b.position.x;
          const dy = e.position.y - b.position.y;
          if (dx * dx + dy * dy < 0.72 * 0.72) {
            e.userData.hp -= b.userData.dmg || 1;
            b.userData.pierce -= 1;
            if (e.userData.hp <= 0) {
              e.visible = false;
              this.combo += 1;
              this.addScore(10);
              this.playTone(360 + Math.min(520, this.combo * 18), 0.08, 'sine', 0.045);
            } else {
              this.playTone(520, 0.035, 'triangle', 0.02);
            }
            if (b.userData.pierce <= 0) {
              b.visible = false;
              consumed = true;
              break;
            }
          }
        }
        if (consumed) break;
      }

      if (!consumed && this.bossActive) {
        const g = this.boss.group;
        const head = this.boss.head;
        const body = this.boss.body;
        const hdx = head.position.x + g.position.x - b.position.x;
        const hdy = head.position.y + g.position.y - b.position.y;
        const bdx = body.position.x + g.position.x - b.position.x;
        const bdy = body.position.y + g.position.y - b.position.y;
        const hitHead = hdx * hdx + hdy * hdy < 0.95 * 0.95;
        const hitBody = bdx * bdx + bdy * bdy < 1.75 * 1.75;
        if (hitHead || hitBody) {
          const dmg = hitHead ? 2 : 1;
          this.bossHp -= dmg;
          b.userData.pierce -= 1;
          this.playTone(hitHead ? 620 : 430, 0.045, 'triangle', 0.03);
          if (this.bossHp <= 0) {
            this.winGame();
            return;
          }
          if (b.userData.pierce <= 0) {
            b.visible = false;
          }
        }
      }
    }
  },

  damagePlayer() {
    if (this.invuln > 0 || this.ended) return;
    this.hp -= 1;
    this.combo = 0;
    this.invuln = 1.0;
    this.playTone(95, 0.16, 'sine', 0.07);
  },

  winGame() {
    if (this.ended) return;
    this.ended = true;
    this.bossActive = false;
    this.boss.group.visible = false;
    const bonus = 1000 + Math.max(0, this.hp) * 100;
    this.addScore(bonus);
    this.playTone(660, 0.12, 'triangle', 0.05);
    this.playTone(880, 0.18, 'sine', 0.05);
    this.api.clear();
  },

  addScore(n) {
    if (n === 0) return;
    if (typeof this.api.addScore === 'function') {
      this.api.addScore(n);
    } else if (typeof this.api.setScore === 'function') {
      const cur = (this.api.score !== undefined ? this.api.score : this.score) || 0;
      this.api.setScore(cur + n);
    }
    this.score = (this.api.score !== undefined ? this.api.score : this.score) + n;
  },

  ensureAudio() {
    const input = this.api.input;
    const active = input && (input.left || input.right || input.up || input.down || (input.pointer && input.pointer.down) || input.tap || input.a || input.b);
    if (!active) return;
    if (this.audioCtx) {
      if (this.audioCtx.state === 'suspended') this.audioCtx.resume().catch(() => {});
      return;
    }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.audioCtx = new AC();
    } catch (e) {
      this.audioCtx = null;
    }
  },

  playTone(freq, dur, type, vol) {
    try {
      if (!this.audioCtx) return;
      if (this.audioCtx.state === 'suspended') this.audioCtx.resume().catch(() => {});
      const now = this.audioCtx.currentTime;
      const osc = this.audioCtx.createOscillator();
      const gain = this.audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(Math.max(40, freq), now);
      gain.gain.setValueAtTime(vol || 0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(this.audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    } catch (e) {
      // ignore audio errors
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
