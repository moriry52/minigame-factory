<script type="application/json" id="meta">{"id": "20261126-001928-local-llm", "title": "ツインギア・シフト", "summary": "機械工場を横スクロールし、連動する2体のドリルで敵を撃破するシューティング。片方を動かすともう片方も同じ方向に動くが、2体間の「連動距離」をスワイプで変えながら、ボスギアを挟み撃ちして破壊せよ。", "rules": ["ドラッグ（または矢印キー）で2体のドリルを同時に移動させる（同じ方向に動く）。", "PCではZキーで2体間の「連動距離」を広げ、Xキーで狭める。スマホでは横スワイプで変更する。", "敵を撃破すると「燃料」が落ちてくるので、どちらかのドリルで拾う。", "燃料が尽きるとドリルが停止し、敵に接触するとミス。", "ステージ奥の巨大ボスギアを破壊すればクリア。"], "controls": {"スマホ": "1本指ドラッグで移動、横スワイプで連動距離の変更。", "PC": "マウスドラッグまたは矢印キーで移動、Zキー（広げる）/Xキー（狭める）で連動距離の変更。"}, "cfg": {"mode": "2d", "w": 640, "h": 360, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.state = 'play';
    this.stateT = 0;
    this.time = 0;
    this.progress = 0;
    this.lives = 3;
    this.fuel = 100;
    this.fuelMax = 100;
    this.stopped = false;
    this.stun = 0;
    this.invuln = 3.0;
    this.cx = 150;
    this.cy = 180;
    this.gap = 120;
    this.gapMin = 50;
    this.gapMax = 300;
    this.gapAnim = 0;
    this.drills = [
      { cd: 0, ang: 0 },
      { cd: 0, ang: 0 }
    ];
    this.bullets = [];
    this.ebullets = [];
    this.walls = [];
    this.enemies = [];
    this.fuels = [];
    this.particles = [];
    this.shake = 0;
    this.spawnT = 1.2;
    this.bossWarn = false;
    this.boss = null;
    this.bossDefeated = false;
    this.clearT = 0;
    this.overT = 0;
    this.fuelFlash = 0;
    this.hurtFlash = 0;
    this.hintT = 6;
    this.bg = { off1: 0, off2: 0, off3: 0, rot: 0 };
    this.deco = [];
    for (let i = 0; i < 7; i++) {
      this.deco.push({
        x: api.util.rand(0, api.W),
        y: api.util.rand(40, api.H - 40),
        r: api.util.randInt(10, 26),
        s: api.util.rand(0.4, 1.2) * (api.util.rand(0, 1) > 0.5 ? 1 : -1),
        layer: api.util.randInt(0, 2),
        a: api.util.rand(0, 6.28)
      });
    }
    this.belt = [];
    for (let i = 0; i < 16; i++) this.belt.push((i * 40) % (api.W + 80));
  },

  drill(i) {
    return {
      x: this.cx + (i === 0 ? -this.gap / 2 : this.gap / 2),
      y: this.cy,
      r: 10
    };
  },

  clampPlayer() {
    const api = this.api;
    const U = api.util;
    const half = this.gap / 2;
    this.cx = U.clamp(this.cx, 16 + half, api.W - 16 - half);
    this.cy = U.clamp(this.cy, 36, api.H - 16);
  },

  burst(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = spd * (0.4 + Math.random() * 0.8);
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.4 + Math.random() * 0.4, max: 0.8,
        size: 2 + Math.random() * 3, color: color
      });
    }
    if (this.particles.length > 500) this.particles.splice(0, this.particles.length - 500);
  },

  update(dt) {
    const api = this.api;
    const U = api.util;
    this.stateT += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 3);
    if (this.fuelFlash > 0) this.fuelFlash -= dt;
    if (this.hurtFlash > 0) this.hurtFlash -= dt;
    if (this.hintT > 0) this.hintT -= dt;
    if (this.gapAnim > 0) this.gapAnim -= dt;

    const bs = this.state === 'clear' ? 0.3 : 1;
    this.bg.off1 = (this.bg.off1 + 22 * bs * dt) % 220;
    this.bg.off2 = (this.bg.off2 + 55 * bs * dt) % 160;
    this.bg.off3 = (this.bg.off3 + 110 * bs * dt) % 120;
    this.bg.rot += dt * 0.5;
    for (let i = 0; i < this.belt.length; i++) {
      this.belt[i] -= 70 * bs * dt;
      if (this.belt[i] < -40) this.belt[i] += api.W + 80;
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 60 * dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    if (this.state === 'over') {
      this.overT += dt;
      if (this.overT > 1.2) api.gameOver();
      return;
    }
    if (this.state === 'clear') {
      this.clearT += dt;
      if (this.clearT > 2.2) api.clear();
      return;
    }

    this.time += dt;
    this.progress = Math.min(1, this.time / 150);

    let mx = 0, my = 0;
    const inp = api.input;
    if (inp.pointer && inp.pointer.down) {
      mx += inp.pointer.dx || 0;
      my += inp.pointer.dy || 0;
    }
    const ks = 240 * dt;
    if (inp.left) mx -= ks;
    if (inp.right) mx += ks;
    if (inp.up) my -= ks;
    if (inp.down) my += ks;
    const moving = (mx !== 0 || my !== 0) && !this.stopped && this.stun <= 0;
    if (moving) {
      this.cx += mx;
      this.cy += my;
      this.clampPlayer();
    }

    let gapDir = 0;
    if (inp.a) gapDir += 1;
    if (inp.b) gapDir -= 1;
    if (inp.swipe === 'right') gapDir += 1;
    if (inp.swipe === 'left') gapDir -= 1;
    if (gapDir !== 0) {
      this.gap = U.clamp(this.gap + gapDir * 260 * dt, this.gapMin, this.gapMax);
      this.gapAnim = 0.2;
      this.clampPlayer();
    }

    const drain = 1.4 + this.progress * 1.2;
    this.fuel -= drain * dt;
    if (this.fuel <= 0) {
      if (!this.stopped) {
        this.stopped = true;
        api.sound.tone(220, 0.35, 'sawtooth', 0.4, 90);
        for (let i = 0; i < 2; i++) {
          this.fuels.push({
            x: U.rand(200, 420), y: -20,
            vx: 0, vy: 60, home: true, r: 9, t: 0, rot: 0
          });
        }
      }
      this.fuel = 0;
    }

    if (this.stun > 0) this.stun -= dt;
    if (this.invuln > 0) this.invuln -= dt;

    for (let i = 0; i < 2; i++) {
      const d = this.drill(i);
      const ds = this.drills[i];
      ds.cd -= dt;
      if (ds.cd <= 0 && !this.stopped) {
        let tgt = null, best = 340;
        for (const e of this.enemies) {
          const dd = U.dist(d.x, d.y, e.x, e.y);
          if (dd < best) { best = dd; tgt = e; }
        }
        if (this.boss && this.boss.state === 'fight') {
          const dd = U.dist(d.x, d.y, this.boss.x, this.boss.y);
          if (dd < best) { best = dd; tgt = this.boss; }
        }
        let ang;
        if (tgt) ang = U.angle(d.x, d.y, tgt.x, tgt.y);
        else ang = 0;
        ds.ang = ang;
        this.bullets.push({
          x: d.x + Math.cos(ang) * 14,
          y: d.y + Math.sin(ang) * 14,
          vx: Math.cos(ang) * 430,
          vy: Math.sin(ang) * 430,
          r: 3.5, life: 1.4,
          color: i === 0 ? '#4FC3FF' : '#FF6B5E'
        });
        ds.cd = 0.24;
        api.sound.play('shot');
      }
    }

    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      if (b.life <= 0 || b.x < -20 || b.x > api.W + 20 || b.y < -20 || b.y > api.H + 20) {
        this.bullets.splice(i, 1);
        continue;
      }
      let hit = false;
      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (U.circleHit(b, e)) {
          e.hp -= 1;
          this.burst(b.x, b.y, '#FFD24A', 3, 90);
          api.sound.play('hit');
          if (e.hp <= 0) this.killEnemy(j);
          hit = true;
          break;
        }
      }
      if (!hit && this.boss && this.boss.state === 'fight' && U.circleHit(b, this.boss)) {
        this.boss.hp -= 1;
        this.boss.flash = 0.08;
        this.burst(b.x, b.y, '#FFB347', 3, 90);
        api.sound.play('hit');
        api.addScore(1);
        if (this.boss.hp <= 0) this.defeatBoss();
        hit = true;
      }
      if (hit) this.bullets.splice(i, 1);
    }

    if (!this.boss && !this.bossDefeated) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) {
        const interval = 1.7 - this.progress * 0.9;
        this.spawnT = interval * U.rand(0.8, 1.2);
        this.spawnEnemy();
      }
      if (this.time >= 150 && !this.bossWarn) {
        this.bossWarn = true;
        api.sound.tone(160, 0.5, 'sawtooth', 0.5, 80);
      }
      if (this.time >= 152) {
        this.boss = {
          x: api.W + 70, y: api.H / 2, r: 46,
          hp: 90, maxHp: 90, state: 'in',
          t: 0, atkT: 1.6, atk: 0, flash: 0, rot: 0
        };
        for (const e of this.enemies) this.burst(e.x, e.y, '#FF9A3C', 6, 120);
        this.enemies.length = 0;
        api.sound.tone(90, 0.8, 'sawtooth', 0.5, 50);
      }
    }

    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.t += dt;
      e.rot += dt * e.spin;
      if (e.type === 'small') {
        e.x += e.vx * dt;
        e.y += Math.sin(e.t * 3 + e.phase) * 20 * dt;
      } else {
        e.x += e.vx * dt;
        e.y += Math.sin(e.t * 4) * 70 * dt;
        e.shootT -= dt;
        if (e.shootT <= 0 && e.x < api.W - 30 && e.x > 120) {
          e.shootT = U.lerp(2.4, 1.4, this.progress);
          const mid = { x: this.cx, y: this.cy };
          const a = U.angle(e.x, e.y, mid.x, mid.y);
          const spd = U.lerp(130, 190, this.progress);
          this.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4 });
          api.sound.tone(500, 0.06, 'square', 0.15, 300);
        }
      }
      if (e.x < -40 || e.y < -50 || e.y > api.H + 50) {
        this.enemies.splice(i, 1);
        continue;
      }
      if (this.invuln <= 0) {
        for (let k = 0; k < 2; k++) {
          const d = this.drill(k);
          if (U.circleHit(d, e)) {
            this.hitDrill(e.x, e.y);

        }
      }
    }

    if (this.boss) {
      const bo = this.boss;

      if (bo.flash > 0) bo.flash -= dt;

        if (this.invuln <= 0) {
          for (let k = 0; k < 2; k++) {
            const d = this.drill(k);
            if (U.circleHit(d, bo)) { this.hitDrill(bo.x, bo.y); break; }
          }
        }
      } else if (bo.state === 'out') {
        bo.x += 140 * dt;
        bo.y += Math.sin(this.time * 6) * 60 * dt;
      }
    }

    for (let i = this.walls.length - 1; i >= 0; i--) {
      const w = this.walls[i];
      w.x -= w.v * dt;
      if (this.invuln <= 0) {
        for (let k = 0; k < 2; k++) {
          const d = this.drill(k);
          const box = { x: d.x - d.r, y: d.y - d.r, w: d.r * 2, h: d.r * 2 };
          const top = { x: w.x, y: 0, w: 16, h: Math.max(0, w.gapY - w.gapH / 2) };
          const bottom = { x: w.x, y: w.gapY + w.gapH / 2, w: 16, h: Math.max(0, api.H - (w.gapY + w.gapH / 2)) };
          if (U.rectHit(box, top) || U.rectHit(box, bottom)) {

          }

      }
      if (w.x + 16 < -20) this.walls.splice(i, 1);
    }

    for (let i = this.ebullets.length - 1; i >= 0; i--) {
      const b = this.ebullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -20 || b.x > api.W + 20 || b.y < -20 || b.y > api.H + 20) {
        this.ebullets.splice(i, 1);
        continue;
      }
      if (this.invuln <= 0) {
        for (let k = 0; k < 2; k++) {
          const d = this.drill(k);
          if (U.circleHit(d, b)) {
            this.ebullets.splice(i, 1);
            this.hitDrill(b.x, b.y);
            break;
          }
        }
      }
    }

    for (let i = this.fuels.length - 1; i >= 0; i--) {
      const f = this.fuels[i];
      f.t += dt;
      f.rot = (f.rot || 0) + dt * 4;
      if (f.home) {

        f.vx = Math.cos(a) * 130;
        f.vy = Math.sin(a) * 130;
      } else {
        f.vy += 30 * dt;
        f.vy = Math.min(f.vy, 60);
        if (f.y > api.H - 26) { f.y = api.H - 26; f.vy = 0; }
      }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.t > 12 && !f.home) { this.fuels.splice(i, 1); continue; }
      for (let k = 0; k < 2; k++) {
        const d = this.drill(k);
        if (U.circleHit(d, f)) {
          this.fuels.splice(i, 1);
          this.fuel = Math.min(this.fuelMax, this.fuel + 30);
          this.fuelFlash = 0.4;
          api.addScore(5);
          api.sound.play('coin');
          this.burst(f.x, f.y, '#FFE066', 8, 110);
          if (this.stopped && this.fuel > 0) {
            this.stopped = false;
            api.sound.tone(300, 0.15, 'square', 0.3, 600);
          }
          break;
        }
      }
    }
  },

  hitDrill(hx, hy) {
    const api = this.api;
    if (this.stopped) {
      this.lives -= 1;
      api.sound.play('hurt');
      this.shake = 1;
      this.hurtFlash = 0.5;
      this.burst(this.cx, this.cy, '#FF5544', 26, 220);
      for (let i = this.ebullets.length - 1; i >= 0; i--) {
        if (api.util.dist(this.ebullets[i].x, this.ebullets[i].y, this.cx, this.cy) < 160) this.ebullets.splice(i, 1);
      }
      if (this.lives <= 0) {
        this.state = 'over';
        this.overT = 0;
        api.sound.play('over');
        return;
      }
      this.fuel = 55;
      this.stopped = false;
      this.invuln = 2.5;
      this.cx = 150;
      this.cy = 180;
      this.gap = 120;
      this.clampPlayer();
      return;
    }
    const dmg = 16;
    this.fuel = Math.max(0, this.fuel - dmg);
    this.stun = 0.45;
    this.invuln = 1.0;
    this.shake = 0.6;
    this.hurtFlash = 0.3;
    api.sound.play('hurt');
    this.burst(hx, hy, '#FFD24A', 12, 160);
    if (this.fuel <= 0) this.stopped = true;
  },

  spawnEnemy() {
    const api = this.api;
    const U = api.util;
    const medP = 0.25 + this.progress * 0.35;
    const y = U.rand(50, api.H - 40);
    if (Math.random() < medP) {
      this.enemies.push({
        type: 'med', x: api.W + 30, y: y,
        vx: -U.rand(55, 85), r: 15, hp: 4,
        t: 0, rot: 0, spin: 2, phase: U.rand(0, 6),
        shootT: U.rand(1, 2.2)
      });
    } else {
      this.enemies.push({
        type: 'small', x: api.W + 30, y: y,
        vx: -U.rand(90, 130 + this.progress * 60), r: 11, hp: 2,
        t: 0, rot: 0, spin: 3, phase: U.rand(0, 6)
      });
    }
  },

  killEnemy(j) {
    const api = this.api;
    const e = this.enemies[j];
    this.enemies.splice(j, 1);
    api.addScore(e.type === 'med' ? 25 : 10);
    api.sound.play('explode');
    this.burst(e.x, e.y, '#FF9A3C', 14, 170);
    this.burst(e.x, e.y, '#FFD24A', 6, 120);
    const dropP = e.type === 'med' ? 0.8 : 0.55 - this.progress * 0.2;
    if (Math.random() < dropP) {
      this.fuels.push({ x: e.x, y: e.y, vx: -20, vy: 20, home: false, r: 9, t: 0, rot: 0 });
    }
  },

  bossAttack() {
    const api = this.api;
    const U = api.util;
    const bo = this.boss;
    const phase = bo.hp > 60 ? 0 : (bo.hp > 30 ? 1 : 2);
    const opts = phase === 0 ? [0, 1] : (phase === 1 ? [0, 1, 2] : [1, 2, 3]);
    bo.atk = U.choice(opts);
    const spd = U.lerp(130, 200, this.progress) + phase * 15;
    if (bo.atk === 0) {
      bo.atkT = U.lerp(1.8, 1.1, this.progress);
      const n = 14 + phase * 4;
      const off = U.rand(0, 6.28);
      for (let k = 0; k < n; k++) {
        const a = off + (k / n) * Math.PI * 2;
        this.ebullets.push({ x: bo.x, y: bo.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4.5 });
      }
      api.sound.tone(280, 0.2, 'sawtooth', 0.3, 150);
    } else if (bo.atk === 1) {
      bo.atkT = U.lerp(1.6, 0.9, this.progress);
      const mid = { x: this.cx, y: this.cy };
      const base = U.angle(bo.x, bo.y, mid.x, mid.y);
      const shots = 5 + phase * 2;
      for (let k = 0; k < shots; k++) {
        const a = base + (Math.random() - 0.5) * 0.12;
        this.ebullets.push({
          x: bo.x, y: bo.y,
          vx: Math.cos(a) * spd * 1.3, vy: Math.sin(a) * spd * 1.3, r: 4.5
        });
      }
      api.sound.tone(420, 0.12, 'square', 0.25, 250);
    } else if (bo.atk === 2) {
      bo.atkT = U.lerp(2.2, 1.5, this.progress);
      const gapH = U.lerp(150, 95, this.progress) + phase * 10;
      this.walls.push({
        x: api.W + 20,
        v: U.lerp(80, 110, this.progress) + phase * 10,
        gapY: U.rand(70 + gapH / 2, api.H - 30 - gapH / 2),
        gapH: gapH
      });
      api.sound.tone(150, 0.3, 'sawtooth', 0.35, 90);
    } else {
      bo.atkT = U.lerp(1.4, 0.8, this.progress);
      const n = 20;
      const off = U.rand(0, 6.28);
      for (let k = 0; k < n; k++) {
        const a = off + (k / n) * Math.PI * 2;
        this.ebullets.push({ x: bo.x, y: bo.y, vx: Math.cos(a) * spd * 0.85, vy: Math.sin(a) * spd * 0.85, r: 4 });
      }
      api.sound.tone(350, 0.25, 'sawtooth', 0.3, 180);
    }
  },

  defeatBoss() {
    const api = this.api;
    const bo = this.boss;
    bo.state = 'out';
    bo.hp = 0;
    api.addScore(500);
    api.sound.play('explode');
    api.sound.tone(120, 0.8, 'sawtooth', 0.5, 40);
    this.shake = 1.2;
    for (let i = 0; i < 40; i++) {
      this.burst(bo.x + api.util.rand(-30, 30), bo.y + api.util.rand(-30, 30),
        api.util.choice(['#FFD24A', '#FF9A3C', '#FF5544']), 3, 200);
    }
    this.ebullets.length = 0;
    this.walls.length = 0;
    this.bossDefeated = true;
    this.state = 'clear';
    this.clearT = 0;
  },

  drawGear(ctx, x, y, r, teeth, rot, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = color;
    ctx.beginPath();
    const inner = r * 0.78;
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2;
      const a1 = ((i + 0.5) / teeth) * Math.PI * 2;
      const a2 = ((i + 1) / teeth) * Math.PI * 2;
      const am = ((i + 0.25) / teeth) * Math.PI * 2;
      const an = ((i + 0.75) / teeth) * Math.PI * 2;
      if (i === 0) ctx.moveTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
      ctx.lineTo(Math.cos(am) * r, Math.sin(am) * r);
      ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r);
      ctx.lineTo(Math.cos(a1) * inner, Math.sin(a1) * inner);
      ctx.lineTo(Math.cos(a2) * inner, Math.sin(a2) * inner);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  },

  drawDrill(ctx, x, y, ang, color, dark, t, stopped) {
    ctx.save();
    ctx.translate(x, y);
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, 6.29);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, 6.29);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(stopped ? 0 : t * 14);
    ctx.fillStyle = color;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 4, Math.sin(a) * 4);
      ctx.lineTo(Math.cos(a + 0.5) * 13, Math.sin(a + 0.5) * 13);
      ctx.lineTo(Math.cos(a + 0.9) * 4, Math.sin(a + 0.9) * 4);
      ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#0d1018';
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, 6.29);
    ctx.fill();
    ctx.restore();
  },

  draw(ctx) {
    const api = this.api;
    const U = api.util;
    const W = api.W, H = api.H;
    ctx.save();
    if (this.shake > 0) {
      ctx.translate(U.rand(-1, 1) * this.shake * 5, U.rand(-1, 1) * this.shake * 5);
    }

    const g0 = ctx.createLinearGradient(0, 0, 0, H);
    g0.addColorStop(0, '#14161c');
    g0.addColorStop(0.5, '#1b1e26');
    g0.addColorStop(1, '#101218');
    ctx.fillStyle = g0;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    ctx.save();
    for (const d of this.deco) {
      if (d.layer !== 0) continue;
      const x = ((d.x - this.bg.off1 * 0.5) % (W + 100) + W + 100) % (W + 100) - 50;
      this.drawGear(ctx, x, d.y, d.r, 8, this.bg.rot * d.s + d.a, 'rgba(70,76,90,0.35)');
    }
    ctx.restore();

    ctx.strokeStyle = '#2a2e3a';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(0, 26); ctx.lineTo(W, 26);
    ctx.moveTo(0, H - 14); ctx.lineTo(W, H - 14);
    ctx.stroke();
    ctx.strokeStyle = '#3a4050';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 22); ctx.lineTo(W, 22);
    ctx.stroke();
    ctx.fillStyle = '#333a4a';
    for (let x = -this.bg.off2; x < W + 160; x += 160) {
      ctx.fillRect(x, 18, 14, 16);
      ctx.fillRect(x + 60, H - 22, 14, 16);
    }

    for (const d of this.deco) {
      if (d.layer !== 1) continue;
      const x = ((d.x - this.bg.off2) % (W + 100) + W + 100) % (W + 100) - 50;
      this.drawGear(ctx, x, d.y, d.r, 10, this.bg.rot * d.s * 1.4 + d.a, 'rgba(90,98,115,0.4)');
    }

    ctx.fillStyle = '#232833';
    ctx.fillRect(0, H - 8, W, 8);
    ctx.fillStyle = '#39404f';
    for (const bx of this.belt) {
      ctx.fillRect(bx, H - 8, 22, 8);
    }

    for (const d of this.deco) {
      if (d.layer !== 2) continue;
      const x = ((d.x - this.bg.off3) % (W + 120) + W + 120) % (W + 120) - 60;
      this.drawGear(ctx, x, d.y, d.r * 0.8, 10, this.bg.rot * d.s * 2 + d.a, 'rgba(115,125,145,0.35)');
    }

    if (Math.random() < 0.15) {
      this.particles.push({
        x: U.rand(0, W), y: H - 8,
        vx: U.rand(-20, 20), vy: U.rand(-90, -40),
        life: 0.7, max: 0.7, size: 1.5, color: '#FFB347'
      });
    }

    for (const w of this.walls) {
      const topH = Math.max(0, w.gapY - w.gapH / 2);
      const bottomY = w.gapY + w.gapH / 2;
      const bottomH = Math.max(0, H - bottomY);
      if (topH > 0) {
        const wg = ctx.createLinearGradient(w.x, 0, w.x + 16, 0);
        wg.addColorStop(0, '#5a4632');
        wg.addColorStop(0.5, '#8a6a40');
        wg.addColorStop(1, '#5a4632');
        ctx.fillStyle = wg;
        ctx.fillRect(w.x, 0, 16, topH);
        ctx.fillStyle = 'rgba(255,180,80,0.5)';
        for (let y = 10; y < topH; y += 26) {
          ctx.fillRect(w.x + 2, y, 12, 4);
        }
        ctx.fillStyle = 'rgba(255,220,150,0.8)';
        ctx.fillRect(w.x + 6, 0, 4, topH);
      }
      if (bottomH > 0) {
        const wg = ctx.createLinearGradient(w.x, 0, w.x + 16, 0);
        wg.addColorStop(0, '#5a4632');
        wg.addColorStop(0.5, '#8a6a40');
        wg.addColorStop(1, '#5a4632');
        ctx.fillStyle = wg;
        ctx.fillRect(w.x, bottomY, 16, bottomH);
        ctx.fillStyle = 'rgba(255,180,80,0.5)';
        for (let y = bottomY + 10; y < H; y += 26) {
          ctx.fillRect(w.x + 2, y, 12, 4);
        }
        ctx.fillStyle = 'rgba(255,220,150,0.8)';
        ctx.fillRect(w.x + 6, bottomY, 4, bottomH);
      }
    }

    for (const f of this.fuels) {
      const blink = f.t > 9 && !f.home && Math.floor(f.t * 8) % 2 === 0;
      if (!blink) {
        ctx.save();
        ctx.shadowColor = '#FFE066';
        ctx.shadowBlur = 10;
        this.drawGear(ctx, f.x, f.y, f.r, 8, f.rot || 0, '#FFD24A');
        ctx.restore();
        ctx.fillStyle = '#7a5a10';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 3, 0, 6.29);
        ctx.fill();
      }
    }

    for (const e of this.enemies) {
      const col = e.type === 'med' ? '#FF7A2E' : '#FFA03C';
      ctx.save();
      ctx.shadowColor = col;
      ctx.shadowBlur = 8;
      this.drawGear(ctx, e.x, e.y, e.r, e.type === 'med' ? 10 : 8, e.rot, col);
      ctx.restore();
      ctx.fillStyle = '#3a2410';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 0.35, 0, 6.29);
      ctx.fill();
      if (e.hp < (e.type === 'med' ? 4 : 2)) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        const maxHp = e.type === 'med' ? 4 : 2;
        for (let k = 0; k < e.hp; k++) {
          ctx.fillRect(e.x - (maxHp * 4) / 2 + k * 4, e.y - e.r - 8, 3, 3);
        }
      }
    }

    if (this.boss) {
      const bo = this.boss;
      ctx.save();
      ctx.shadowColor = '#FF5544';
      ctx.shadowBlur = 20;
      this.drawGear(ctx, bo.x, bo.y, bo.r, 12, bo.rot, bo.flash > 0 ? '#FFFFFF' : '#E8543C');
      ctx.restore();
      this.drawGear(ctx, bo.x, bo.y, bo.r * 0.6, 10, -bo.rot * 1.5, '#8a3226');
      ctx.fillStyle = '#2a0e0a';
      ctx.beginPath();
      ctx.arc(bo.x, bo.y, bo.r * 0.3, 0, 6.29);
      ctx.fill();
      const eyeA = U.angle(bo.x, bo.y, this.cx, this.cy);
      ctx.fillStyle = '#FFD24A';
      ctx.beginPath();
      ctx.arc(bo.x + Math.cos(eyeA) * 6, bo.y + Math.sin(eyeA) * 6, 5, 0, 6.29);
      ctx.fill();
      if (bo.state === 'fight') {
        const bw = 200;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(W / 2 - bw / 2, 40, bw, 8);
        ctx.fillStyle = '#FF5544';
        ctx.fillRect(W / 2 - bw / 2, 40, bw * Math.max(0, bo.hp / bo.maxHp), 8);
        ctx.strokeStyle = '#FFB347';
        ctx.lineWidth = 1;
        ctx.strokeRect(W / 2 - bw / 2, 40, bw, 8);
      }
    }

    if (this.bossWarn && !this.boss) {
      const blink = Math.floor(this.stateT * 4) % 2 === 0;
      if (blink) {
        ctx.fillStyle = '#FF5544';
        ctx.font = 'bold 26px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('!! WARNING !!', W / 2, H / 2 - 20);
        ctx.font = 'bold 14px monospace';
        ctx.fillText('BOSS GEAR APPROACHING', W / 2, H / 2 + 6);
      }
    }

    for (const b of this.ebullets) {
      ctx.save();
      ctx.shadowColor = '#FF5544';
      ctx.shadowBlur = 8;
      ctx.fillStyle = '#FF6B4A';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.29);
      ctx.fill();
      ctx.fillStyle = '#FFD24A';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.5, 0, 6.29);
      ctx.fill();
      ctx.restore();
    }

    for (const b of this.bullets) {
      ctx.save();
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 8;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, 6.29);
      ctx.fill();
      ctx.restore();
    }

    const d0 = this.drill(0), d1 = this.drill(1);
    const linkA = this.gapAnim > 0 ? 0.9 : 0.35;
    ctx.strokeStyle = `rgba(200,220,255,${linkA})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(d0.x, d0.y);
    ctx.lineTo(d1.x, d1.y);
    ctx.stroke();
    ctx.setLineDash([]);
    const mx = (d0.x + d1.x) / 2, my = d0.y + 18;
    ctx.fillStyle = `rgba(200,220,255,${this.gapAnim > 0 ? 0.9 : 0.4})`;
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(Math.round(this.gap) + 'px', mx, my);

    const blink = this.invuln > 0 && Math.floor(this.stateT * 12) % 2 === 0;
    if (!blink) {
      this.drawDrill(ctx, d0.x, d0.y, this.drills[0].ang || 0, '#4FC3FF', '#1a6fa8', this.stateT, this.stopped);
      this.drawDrill(ctx, d1.x, d1.y, this.drills[1].ang || 0, '#FF6B5E', '#a83226', this.stateT + 0.3, this.stopped);
    }
    if (this.stopped) {
      const blink2 = Math.floor(this.stateT * 6) % 2 === 0;
      if (blink2) {
        ctx.fillStyle = '#FF5544';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FUEL EMPTY!', this.cx, this.cy - 26);
      }
    }

    for (const p of this.particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    if (this.hurtFlash > 0) {
      ctx.fillStyle = `rgba(255,60,40,${this.hurtFlash * 0.35})`;
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }

    ctx.restore();

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(8, 6, 130, 20);
    ctx.fillStyle = '#E8ECF5';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + String(api.score || 0).padStart(6, '0'), 14, 20);

    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < this.lives ? '#4FC3FF' : 'rgba(255,255,255,0.15)';
      ctx.beginPath();
      ctx.arc(W - 70 + i * 20, 16, 6, 0, 6.29);
      ctx.fill();
      ctx.strokeStyle = '#E8ECF5';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const gw = 180, gx = W / 2 - gw / 2, gy = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(gx - 3, gy - 3, gw + 6, 16);
    const fr = this.fuel / this.fuelMax;
    const fuelCol = this.fuelFlash > 0 ? '#FFFFFF' : (fr > 0.4 ? '#FFD24A' : (Math.floor(this.stateT * 6) % 2 === 0 ? '#FF5544' : '#FF8A3C'));
    ctx.fillStyle = fuelCol;
    ctx.fillRect(gx, gy, gw * Math.max(0, fr), 10);
    ctx.strokeStyle = '#E8ECF5';
    ctx.lineWidth = 1;
    ctx.strokeRect(gx, gy, gw, 10);
    ctx.fillStyle = '#E8ECF5';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('FUEL', gx + gw / 2, gy + 9);

    const ggw = 100, gxx = W / 2 - ggw / 2, gyy = H - 14;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(gxx - 2, gyy - 2, ggw + 4, 10);
    const gt = (this.gap - this.gapMin) / (this.gapMax - this.gapMin);
    ctx.fillStyle = '#7FE7FF';
    ctx.fillRect(gxx, gyy, ggw * gt, 6);
    ctx.strokeStyle = 'rgba(232,236,245,0.6)';
    ctx.strokeRect(gxx, gyy, ggw, 6);
    ctx.fillStyle = 'rgba(232,236,245,0.8)';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('GAP', gxx + ggw / 2, gyy + 5.5);

    if (this.hintT > 0 && this.time < 10) {
      const a = Math.min(1, this.hintT);
      ctx.fillStyle = `rgba(232,236,245,${a * 0.9})`;
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      if (api.isTouch) {
        ctx.fillText('ドラッグ:移動 / 横スワイプ:連動距離', W / 2, H - 24);
      } else {
        ctx.fillText('ドラッグ/矢印:移動  Z:距離広げ X:距離狭める', W / 2, H - 24);
      }
    }

    if (this.state === 'clear') {
      ctx.fillStyle = `rgba(10,14,20,${Math.min(0.6, this.clearT * 0.4)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFD24A';
      ctx.font = 'bold 34px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('STAGE CLEAR!', W / 2, H / 2);
    }
    if (this.state === 'over') {
      ctx.fillStyle = `rgba(40,8,8,${Math.min(0.6, this.overT * 0.5)})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
