<script type="application/json" id="meta">{"id": "20261126-152216-local-llm", "title": "ペラリゲート：影の隙間", "summary": "タップで紙の羽根を回転・加速させ、夕焼けの影絵世界で『影の隙間』から現れるワープゲートを狙う。ワンボタンで方向を操り、3分間で3つのゲートを貫通せよ。", "rules": ["タップで自機（紙の羽根）を現在の進行方向から90度回転させ、その方向に一定の速度で移動する。", "画面端に現れる『ワープゲート』に自機が触れると、次のステージへワープする。", "黒い影の障害物（雲や鳥）に触れるとHP-1。HP0でゲームオーバー。", "影は画面端から中央へ、あるいは中央から外周へと流動的に動く。影が画面端を覆うと、その端のゲートは『隠蔽』され、触れてもワープしない（ダメージのみ）。", "3段階のステージをクリアすると勝利。"], "controls": {"スマホ": "画面のどこでもタップで、自機を現在の角度から90度回転させ、その方向に定速で移動させる。", "PC": "スペースキーまたはクリックで、自機を現在の角度から90度回転させ、その方向に定速で移動させる。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "ワンボタン", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    const U = api.util;
    this.W = api.W; this.H = api.H;
    this.t = 0;
    this.state = 'play';
    this.endTimer = 0;
    this.stage = 1;
    this.hp = 3;
    this.inv = 3.0;
    this.shake = 0;
    this.flash = 0;
    this.redFlash = 0;
    this.warpFx = 0;
    this.hudMsg = '';
    this.hudMsgT = 0;
    this.hudMsgC = '#fff';

    this.player = { x: 240, y: 240, dir: 0, moving: false, spin: 0, size: 40 };
    this.SPEED = 175;
    this.PR = 15;

    this.gate = null;
    this.gateTimer = 0;
    this.gateSamples = [];
    this.gateHidden = false;
    this.gatePulse = 0;

    this.shadows = [];
    this.particles = [];
    this.floaters = [];
    this.rings = [];
    this.embers = [];
    this.motes = [];
    this.sparks = [];
    for (let i = 0; i < 26; i++) this.embers.push({ x: U.rand(0, 480), y: U.rand(0, 480), r: U.rand(0.8, 2.2), sp: U.rand(6, 18), ph: U.rand(0, 6.28), a: U.rand(0.15, 0.4) });
    for (let i = 0; i < 14; i++) this.motes.push({ x: U.rand(0, 480), y: U.rand(0, 480), r: U.rand(1, 2.4), sp: U.rand(3, 9), ph: U.rand(0, 6.28) });
    for (let i = 0; i < 10; i++) this.sparks.push({ x: U.rand(0, 480), y: U.rand(0, 480), r: U.rand(0.6, 1.4), ph: U.rand(0, 6.28) });

    this.setupStage();
  },

  setupStage() {
    const U = this.api.util;
    const n = this.stage;
    this.shadows = [];
    for (let i = 0; i < n; i++) this.shadows.push(this.makeShadow(i === 0 ? 'cloud' : U.choice(['cloud', 'bird', 'cloud'])));
    this.player.x = 240; this.player.y = 240;
    this.player.dir = 0; this.player.moving = false; this.player.spin = 0;
    this.inv = Math.max(this.inv, 1.2);
    this.spawnGate(true);
  },

  makeShadow(type) {
    const U = this.api.util;
    const s = { type: type, x: 240, y: 240, rot: 0, phase: U.rand(0, 6.28), wph: U.rand(0, 6.28), wamp: U.rand(10, 22), scale: U.rand(0.85, 1.2), alpha: 1, puffs: [], flap: 0 };
    if (type === 'cloud') {
      const d = U.rand(20, 30);

        { ox: -d, oy: U.rand(-4, 4), r: U.rand(20, 26) },
        { ox: 0, oy: -U.rand(6, 12), r: U.rand(24, 30) },
        { ox: d, oy: U.rand(-4, 4), r: U.rand(20, 26) },
        { ox: U.rand(-d, d) * 0.5, oy: U.rand(6, 10), r: U.rand(16, 20) }
      ];
    } else {
      s.puffs = [
        { ox: 0, oy: 0, r: 13 },
        { ox: -13, oy: -5, r: 8 },
        { ox: 13, oy: -5, r: 8 }
      ];
      s.rot = U.rand(-0.4, 0.4);
      s.scale = U.rand(0.9, 1.25);
    }
    const side = U.randInt(0, 4);
    let ax, ay;
    if (side === 0) { ax = U.rand(40, 440); ay = 0; }
    else if (side === 1) { ax = 480; ay = U.rand(40, 440); }
    else if (side === 2) { ax = U.rand(40, 440); ay = 480; }
    else { ax = 0; ay = U.rand(40, 440); }
    const tx = 240 + U.rand(-150, 150), ty = 240 + U.rand(-150, 150);
    const a = U.angle(ax, ay, tx, ty);
    const len = U.rand(140, 240);
    s.ax = ax; s.ay = ay;

  spawnGate(first) {

    if (side === 0) { cx = U.rand(70, 410); cy = 0; nx = 0; ny = 1; }
    else if (side === 1) { cx = 480; cy = U.rand(70, 410); nx = -1; ny = 0; }
    else if (side === 2) { cx = U.rand(70, 410); cy = 480; nx = 0; ny = -1; }

    for (const a of angs) {
      samples.push([Math.sin(a) * 27, Math.cos(a) * 27]);
      samples.push([Math.sin(a) * 12, Math.cos(a) * 12]);
    }
    this.gateSamples = samples;
    const gs = this.shadows[0];
    gs.ax = cx; gs.ay = cy;
    gs.bx = cx + nx * U.rand(150, 230);
    gs.by = cy + ny * U.rand(150, 230);
    gs.phase = -Math.PI / 2 + U.rand(-0.12, 0.12);
    gs.x = cx + nx * 14; gs.y = cy + ny * 14;
    gs.alpha = 0;
    this.gateHidden = false;
    this.api.sound.play('select');
    this.api.sound.tone(330, 0.12, 'triangle', 0.12, 520);
  },

  updateGate(dt) {
    const g = this.gate;
    if (!g) return;
    this.gateTimer -= dt;
    if (this.gateTimer <= 0) { this.spawnGate(false); return; }
    let all = true;
    for (const smp of this.gateSamples) {
      const px = g.cx + smp[0], py = g.cy + smp[1];
      let cov = false;
      for (const s of this.shadows) {
        for (const c of this.shadowCircles(s)) {

      }
      if (!cov) { all = false; break; }
    }

  },

      api.sound.tone(220, 0.6, 'sawtooth', 0.22, 50);

      this.floater(p.x, p.y - 28, 'HP ' + this.hp, '#ffffff', 15);

  warp() {

  update(dt) {

    if (this.redFlash > 0) this.redFlash -= dt;

      if (f.life <= 0) this.floaters.splice(i, 1);

  draw() {

    const bg = ctx.createLinearGradient(0, 0, 0, 480);

    bg.addColorStop(0.55, '#D95E87');

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (const m of this.motes) {
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(this.t * 1.5 + m.ph);
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    this.drawGate(ctx);

    for (const s of this.shadows) this.drawShadow(ctx, s);

    for (const r of this.rings) {
      ctx.globalAlpha = U.clamp(r.life / r.max, 0, 1) * 0.8;
      ctx.strokeStyle = r.c;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, 6.283);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const pt of this.particles) {
      ctx.globalAlpha = U.clamp(pt.life / pt.max, 0, 1);
      ctx.fillStyle = pt.c;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    this.drawPlayer(ctx);

    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    for (const f of this.floaters) {
      ctx.globalAlpha = U.clamp(f.life / f.max, 0, 1);
      ctx.fillStyle = f.c;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    if (this.flash > 0) {
      ctx.globalAlpha = U.clamp(this.flash / 0.55, 0, 1) * 0.85;
      ctx.fillStyle = '#fff8e0';
      ctx.fillRect(-20, -20, 520, 520);
      ctx.globalAlpha = 1;
    }
    if (this.redFlash > 0) {
      ctx.globalAlpha = U.clamp(this.redFlash / 0.45, 0, 1) * 0.35;
      ctx.fillStyle = '#c03040';
      ctx.fillRect(-20, -20, 520, 520);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    this.drawHUD(ctx);
  },

  drawGate(ctx) {
    const g = this.gate;
    if (!g) return;
    const U = this.api.util;
    const a0 = Math.atan2(g.ny, g.nx) - Math.PI / 2;
    const pulse = 0.6 + 0.4 * Math.sin(this.t * 6);
    const col = this.gateHidden ? '#808080' : '#FFE066';
    const age = this.t - g.born;
    const appear = U.clamp(age / 0.25, 0, 1);
    const vanish = U.clamp((g.life - (this.t - g.born)) / 0.4, 0, 1);
    const alpha = Math.min(appear, vanish);

    ctx.save();
    ctx.globalAlpha = alpha;
    if (!this.gateHidden) {
      ctx.globalAlpha = alpha * 0.25 * pulse;
      ctx.fillStyle = '#FFE066';
      ctx.beginPath();
      ctx.arc(g.cx, g.cy, g.R + 10, a0, a0 + Math.PI);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = alpha;
    }
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.R, a0, a0 + Math.PI);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = this.gateHidden ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = this.gateHidden ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.arc(g.cx, g.cy, g.R * 0.45, a0, a0 + Math.PI);
    ctx.closePath();
    ctx.fill();
    if (this.gateHidden) {
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(g.cx - 8, g.cy + g.ny * 14 - g.nx * 8);
      ctx.lineTo(g.cx + 8, g.cy + g.ny * 14 + g.nx * 8);
      ctx.moveTo(g.cx + 8, g.cy + g.ny * 14 - g.nx * 8);
      ctx.lineTo(g.cx - 8, g.cy + g.ny * 14 + g.nx * 8);
      ctx.stroke();
    } else {
      for (let i = 0; i < 3; i++) {
        const ph = (this.t * 1.4 + i * 0.33) % 1;
        ctx.globalAlpha = alpha * (1 - ph) * 0.7;
        ctx.fillStyle = '#fff6c8';
        ctx.beginPath();
        ctx.arc(g.cx + g.nx * (6 + ph * 24), g.cy + g.ny * (6 + ph * 24), 2.5, 0, 6.283);
        ctx.fill();
      }
    }
    ctx.restore();
  },

  drawShadow(ctx, s) {
    ctx.save();
    ctx.globalAlpha = s.alpha * 0.95;
    ctx.fillStyle = '#1A1A1A';
    ctx.strokeStyle = '#1A1A1A';
    if (s.type === 'cloud') {
      ctx.beginPath();
      for (const p of s.puffs) {
        const cx = s.x + p.ox * s.scale, cy = s.y + p.oy * s.scale, r = p.r * s.scale;
        ctx.moveTo(cx + r, cy);
        ctx.arc(cx, cy, r, 0, 6.283);
      }
      ctx.fill();
    } else {
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.scale(s.scale, s.scale);
      const f = s.flap;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, 6.283);
      ctx.arc(12, -4, 7, 0, 6.283);
      ctx.moveTo(18, -5);
      ctx.lineTo(26, -3);
      ctx.lineTo(18, -1);
      ctx.closePath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(-12, -14 - 10 * f, -26, -4 - 16 * f);
      ctx.quadraticCurveTo(-12, -2, 0, 2);
      ctx.closePath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(12, -14 - 10 * f, 26, -4 - 16 * f);
      ctx.quadraticCurveTo(12, -2, 0, 2);
      ctx.closePath();
      ctx.moveTo(-8, 4);
      ctx.lineTo(-14, 10);
      ctx.lineTo(-4, 7);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  },

  drawPlayer(ctx) {
    const p = this.player, U = this.api.util;
    if (this.state === 'dying' || this.state === 'done') return;
    const blink = this.inv > 0 && Math.floor(this.t * 14) % 2 === 0;
    ctx.save();
    ctx.translate(p.x, p.y);
    const ang = [0, Math.PI / 2, Math.PI, -Math.PI / 2][p.dir];
    ctx.rotate(ang + (p.spin > 0 ? (p.spin / 0.18) * 0.5 : 0));
    ctx.globalAlpha = blink ? 0.35 : 1;
    ctx.fillStyle = 'rgba(20,10,30,0.3)';
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-16, 14);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-16, -14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#1A1A1A';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-16, 14);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-16, -14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(26,26,26,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(-8, 0);
    ctx.stroke();
    if (this.hp <= 2) {
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(-16, 14);
      ctx.lineTo(-6, 14);
      ctx.lineTo(-11, 9);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1A1A1A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-16, 14);
      ctx.lineTo(-11, 9);
      ctx.lineTo(-6, 14);
      ctx.stroke();
    }
    if (this.hp <= 1) {
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.moveTo(-16, -14);
      ctx.lineTo(-5, -14);
      ctx.lineTo(-10, -9);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1A1A1A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-16, -14);
      ctx.lineTo(-10, -9);
      ctx.lineTo(-5, -14);
      ctx.stroke();
    }
    ctx.restore();

    if (this.inv > 0 && this.inv < 3) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#FFE066';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 26, this.t * 3, this.t * 3 + 6.283);
      ctx.stroke();
      ctx.restore();
    }
  },

  drawHUD(ctx) {
    const U = this.api.util;
    ctx.save();
    ctx.fillStyle = 'rgba(26,10,40,0.35)';
    ctx.fillRect(0, 0, 480, 40);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 40.5);
    ctx.lineTo(480, 40.5);
    ctx.stroke();

    ctx.fillStyle = '#FFFFFF';
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.translate(24 + i * 26, 20);
      ctx.globalAlpha = i < this.hp ? 1 : 0.25;
      ctx.beginPath();
      ctx.moveTo(9, 0);
      ctx.lineTo(-8, 7);
      ctx.lineTo(-4, 0);
      ctx.lineTo(-8, -7);
      ctx.closePath();
      ctx.fill();
      if (i >= this.hp) {
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-5, -5);
        ctx.lineTo(5, 5);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFE066';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('STAGE ' + Math.min(this.stage, 3) + ' / 3', 240, 25);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('SCORE ' + this.api.score, 466, 25);

    const g = this.gate;
    if (g && this.state === 'play') {
      const rem = Math.max(0, this.gateTimer);
      const bw = 120 * (rem / 5);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(180, 44, 120, 5);
      ctx.fillStyle = this.gateHidden ? '#808080' : '#FFE066';
      ctx.fillRect(240 - bw / 2, 44, bw, 5);
      ctx.textAlign = 'center';
      ctx.font = '10px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(this.gateHidden ? 'GATE HIDDEN' : 'GATE OPEN', 240, 62);
    }

    if (this.inv > 2.5 && this.state === 'play') {
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('TAP TO TURN 90°', 240, 452);
    }

    if (this.hudMsgT > 0) {
      ctx.globalAlpha = U.clamp(this.hudMsgT / 1.4, 0, 1);
      ctx.fillStyle = this.hudMsgC;
      ctx.font = 'bold 30px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(this.hudMsg, 240, 210);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
