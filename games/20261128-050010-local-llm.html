<script type="application/json" id="meta">{"id": "20261128-050010-local-llm", "title": "氷晶スライド", "summary": "自機は常に「白」の氷塊。同じ色同士は干渉しないため、敵氷塊の色に合わせて自機の色を瞬時に切り替え、貫通または回避を選択せよ。1分以内に「暖房コア」へ到達せよ。", "rules": ["自機は基本「白」だが、タップで赤・青・緑・白の順に瞬時（0.1秒）に切り替えられる。", "自機の色と敵氷塊の色が一致する場合、接触すると敵氷塊が破壊され、10点獲得できるとともにスクロール速度が上昇する。", "自機の色と敵氷塊の色が異なる場合、接触するとスクロール速度が低下し、自機は元の「白」に戻る。", "ステージの最下部にある「暖房コア」に到達すればクリア。1分以内にゴールに辿り着けない場合、温度不足で凍結し失敗となる。"], "controls": {"スマホ": "指を置いたまま動かす（ドラッグ）で氷塊を移動。タップで色を赤・青・緑・白の順に切り替え。", "PC": "マウスのドラッグまたは矢印キーで移動。クリックで色を赤・青・緑・白の順に切り替え。"}, "cfg": {"mode": "2d", "w": 360, "h": 640, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "赤"}, {"key": "B", "label": "青"}]}, "ui": {"pad": "floating", "guide": true, "bg": "light"}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
// 画面まわりの設定（無い＝以前に作ったゲームなので、以前と同じ動き）
const UI = Object.assign({ pad: "classic", guide: false, bg: "dark" }, META.ui || {});
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false, stick: { x: 0, y: 0 },
  _key: {}, _pad: {}, _stick: null, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    // stick: 仮想パッドのスティックの傾き（-1..1）。使っていないときは方向の押しっぱなしから作る
    if (this._stick) { this.stick.x = this._stick.x; this.stick.y = this._stick.y; }
    else {
      let sx = (this.right ? 1 : 0) - (this.left ? 1 : 0), sy = (this.down ? 1 : 0) - (this.up ? 1 : 0);
      if (sx && sy) { sx *= Math.SQRT1_2; sy *= Math.SQRT1_2; }
      this.stick.x = sx; this.stick.y = sy;
    }
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._stick = null; this.stick.x = this.stick.y = 0; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
    if (typeof __vpad !== "undefined" && __vpad) __vpad.reset();
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  if (UI.pad === "floating") return __buildFloatPad();
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// 新しい仮想パッド：画面に半透明で重ねる。左半分のどこに指を置いてもそこがスティックの中心になり、右側はボタン
let __vpad = null;
function __buildFloatPad() {
  stage.classList.add("vpadOn");
  const vp = document.createElement("div");
  vp.id = "vpad";
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  vp.innerHTML = `<div class="vzone"></div><div class="vbase idle"><div class="vknob"></div></div>` +
    btns.map((b, i) => `<div class="vbtn ${i ? "b2" : "b1"}" data-btn="${esc(b.key.toLowerCase())}">${esc(b.label || b.key)}</div>`).join("");
  stage.insertBefore(vp, overlay);
  const base = vp.querySelector(".vbase"), knob = vp.querySelector(".vknob");
  const R = 48, DEAD = 0.3;
  const st = { id: null, bx: 0, by: 0 }, owner = {};
  const home = () => {
    const r = vp.getBoundingClientRect();
    return { x: Math.min(110, r.width * 0.25), y: r.height - Math.min(120, r.height * 0.2) };
  };
  const place = (bx, by, kx, ky) => {
    base.style.left = bx + "px"; base.style.top = by + "px";
    knob.style.transform = `translate(${kx}px,${ky}px)`;
  };
  const rest = () => { const h = home(); place(h.x, h.y, 0, 0); base.classList.add("idle"); };
  const refresh = () => {
    const on = {};
    const sx = Input._stick ? Input._stick.x : 0, sy = Input._stick ? Input._stick.y : 0;
    if (sx < -DEAD) on.left = true;
    if (sx > DEAD) on.right = true;
    if (sy < -DEAD) on.up = true;
    if (sy > DEAD) on.down = true;
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    vp.querySelectorAll(".vbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  // 右側に触れたら、いちばん近いボタン（多少ずれても押せる）
  const nearest = (cx, cy) => {
    let best = null, bd = 1e9;
    vp.querySelectorAll(".vbtn").forEach((el) => {
      const r = el.getBoundingClientRect(), d = Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2));
      if (d < bd) { bd = d; best = el.dataset.btn; }
    });
    return best;
  };
  const local = (ev) => { const r = vp.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top, w: r.width }; };
  const moveStick = (x, y) => {
    let dx = x - st.bx, dy = y - st.by;
    const len = Math.hypot(dx, dy);
    if (len > R) { st.bx += dx / len * (len - R); st.by += dy / len * (len - R); dx = x - st.bx; dy = y - st.by; }  // 中心が指についてくる
    Input._stick = { x: U.clamp(dx / R, -1, 1), y: U.clamp(dy / R, -1, 1) };
    place(st.bx, st.by, dx, dy);
  };
  vp.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    ev.stopPropagation();   // 下のゲーム画面に指を取られないように
    if (__G.state !== "playing" || __G.paused) return;
    try { vp.setPointerCapture(ev.pointerId); } catch (_) {}
    const p = local(ev);
    if (p.x < p.w * 0.5 && st.id === null) {
      st.id = ev.pointerId; st.bx = p.x; st.by = p.y;
      base.classList.remove("idle");
      Input._stick = { x: 0, y: 0 };
      place(p.x, p.y, 0, 0);

    for (let i = 0; i < 26; i++) {
      this.snow.push({
        x: U.rand(0, this.W), y: U.rand(0, this.H),
        r: U.rand(1.5, 3.5), v: U.rand(10, 26),
        ph: U.rand(0, 6.28), sw: U.rand(8, 20)
      });
    }

    api.setScore(0);
  },

  baseSpeed() {
    return this.api.time >= 40 ? 150 : 120;
  },

  curSpeed() {
    return this.api.util.clamp(this.baseSpeed() + this.speedMod, 50, 260);
  },

  phase() {
    const t = this.api.time;
    if (t < 20) return 1;
    if (t < 40) return 2;
    return 3;
  },

  spacing() {
    const p = this.phase();
    return p === 1 ? 150 : p === 2 ? 100 : 80;
  },

  burst(x, y, color, n, spd, life, r) {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    if (this.parts.length > 300) return;
    for (let i = 0; i < n; i++) {
      const a = this.api.util.rand(0, Math.PI * 2);
      const v = this.api.util.rand(spd * 0.3, spd);
      this.parts.push({
        x, y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: life * this.api.util.rand(0.6, 1), max: life,
        r: r * this.api.util.rand(0.6, 1.2), c: color, g: 0
      });
      if (this.parts.length > 340) break;
    }
  },

  sparkle(x, y, color) {
    if (this.parts.length > 300) return;
    for (let i = 0; i < 8; i++) {
      const a = this.api.util.rand(0, Math.PI * 2);
      const v = this.api.util.rand(40, 120);
      this.parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 0.3, max: 0.3, r: this.api.util.rand(1.5, 3), c: color, g: 0
      });
    }
  },

  addFloat(x, y, txt, c) {
    if (this.floats.length > 12) return;
    this.floats.push({ x, y, txt, c, life: 0.9, max: 0.9 });
  },

  spawnRow() {
    const p = this.phase();
    const cols = ['red', 'blue', 'green'];
    const y = -34;
    const count = p === 1 ? 1 : (p === 2 ? (this.api.util.rand(0, 1) < 0.4 ? 2 : 1) : (this.api.util.rand(0, 1) < 0.6 ? 2 : 1));
    if (count === 1) {
      const x = this.api.util.rand(30, this.W - 30);
      this.blocks.push({ x, y, color: this.api.util.choice(cols), passed: false, flash: 0 });
    } else {
      const c1 = this.api.util.choice(cols);
      let c2 = this.api.util.choice(cols);
      if (c2 === c1) c2 = this.api.util.choice(cols.filter(c => c !== c1));
      const gap = 70;
      const x1 = this.api.util.rand(30, this.W / 2 - gap / 2);
      const x2 = this.api.util.rand(this.W / 2 + gap / 2, this.W - 30);
      this.blocks.push({ x: x1, y, color: c1, passed: false, flash: 0 });
      this.blocks.push({ x: x2, y, color: c2, passed: false, flash: 0 });
    }
    if (this.blocks.length > 40) this.blocks.splice(0, this.blocks.length - 40);
  },

  hitWrong() {
    const P = this.P;
    const api = this.api;
    if (this.over || this.cleared) return;

    this.speedMod = Math.max(-90, this.speedMod - 70);
    P.color = 'white';
    P.colorIndex = 0;
    P.colorT = 0.1;
    this.shake = 5;

    api.sound.play('hurt');
    api.sound.tone(220, 0.15, 'sawtooth', 0.15, 90);
    this.burst(P.x, P.y, '#B3E5FC', 12, 140, 0.5, 4);
    this.addFloat(P.x, P.y - 26, 'SLOW!', '#0288D1');
  },

  update(dt) {
    if (this.over) {
      this.endT += dt;
      if (this.shake > 0) this.shake = Math.max(0, this.shake - 60 * dt);
      this.updateParticles(dt);
      this.updateSnow(dt);
      if (this.endT > 1.4 && !this.endPlayed) this.endPlayed = true;
      return;
    }

    if (this.cleared) {
      this.endT += dt;
      if (this.shake > 0) this.shake = Math.max(0, this.shake - 60 * dt);
      this.updateParticles(dt);
      this.updateSnow(dt);
      if (this.core) this.corePulse += dt;
      if (this.endT > 1.8 && !this.endPlayed) this.endPlayed = true;
      return;
    }

    const api = this.api;
    const t = api.time;
    const P = this.P;

    if (this.hintT > 0) this.hintT -= dt;
    if (this.warnT > 0) this.warnT -= dt;
    if (this.coreWarnT > 0) this.coreWarnT -= dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - 60 * dt);

    if (t >= 3 && !this.hintPlayed) {
      this.hintPlayed = true;
      this.hintT = 4.0;
    }

    if (t >= this.TIME_LIMIT) {
      this.cleared = false;
      this.over = true;
      this.endT = 0;
      this.endPlayed = false;
      this.burst(P.x, P.y, '#E1F5FE', 26, 180, 0.9, 5);
      api.sound.play('over');
      api.sound.tone(120, 0.7, 'sine', 0.2, 50);
      api.gameOver();
      return;
    }

    if (this.speedMod > 0) this.speedMod = Math.max(0, this.speedMod - 30 * dt);
    else if (this.speedMod < 0) this.speedMod = Math.min(0, this.speedMod + 30 * dt);

    const spd = this.curSpeed();
    this.dist += spd * dt;

    if (!this.coreSpawned && this.STAGE_LEN - this.dist < 720) {
      this.coreSpawned = true;
      this.core = { x: this.W / 2, y: -60, r: 24 };
      api.sound.tone(520, 0.25, 'sine', 0.18, 780);
    }

    if (this.core && this.core.y > this.H * 0.35 && !this.coreWarnPlayed) {
      this.coreWarnPlayed = true;
      this.coreWarnT = 1.5;
      api.sound.tone(660, 0.15, 'sine', 0.15, 990);
    }

    if (t > 45 && !this.warnPlayed) {
      this.warnPlayed = true;
      this.warnT = 3.0;
    }

    if (t > 50) {
      this.freezeT = Math.min(1, (t - 50) / 10);
    } else {
      this.freezeT = 0;
    }

    const inp = api.input;
    const pt = inp.pointer || { down: false, dx: 0, dy: 0 };

    if (inp.tap) {
      P.colorIndex = (P.colorIndex + 1) % 4;
      P.color = this.CNAMES[P.colorIndex];
      P.colorT = 0.1;
      api.sound.tone(880 + P.colorIndex * 110, 0.06, 'sine', 0.12, 1320 + P.colorIndex * 110);
      this.sparkle(P.x, P.y, this.CHEX[P.color]);
    }

    if (P.colorT > 0) P.colorT -= dt;
    if (P.flash > 0) P.flash -= dt;

    const mx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    const my = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
    const ms = 230;

    let dx = 0;
    let dy = 0;
    if (pt.down) {
      dx = Number.isFinite(pt.dx) ? pt.dx : 0;
      dy = Number.isFinite(pt.dy) ? pt.dy : 0;
      const maxD = 30;
      if (dx > maxD) dx = maxD;
      if (dx < -maxD) dx = -maxD;
      if (dy > maxD) dy = maxD;
      if (dy < -maxD) dy = -maxD;
    }

    P.x += mx * ms * dt + dx;
    P.y += my * ms * dt + dy;

    const m = P.r + 4;
    if (P.x < m) P.x = m;
    if (P.x > this.W - m) P.x = this.W - m;
    if (P.y < 200) P.y = 200;
    if (P.y > 505) P.y = 505;

    P.trailT -= dt;
    if (P.trailT <= 0) {
      P.trailT = 0.05;
      if (this.parts.length < 320) {
        this.parts.push({
          x: P.x + this.api.util.rand(-4, 4),
          y: P.y + P.r + 2,
          vx: this.api.util.rand(-10, 10),
          vy: 60,
          life: 0.3, max: 0.3,
          r: this.api.util.rand(2, 4),
          c: P.color === 'white' ? '#FFFFFF' : this.CHEX[P.color],
          g: 0
        });
      }
    }

    if (t > 3 && !this.coreSpawned) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) {
        this.spawnRow();
        const sp = this.spacing();
        this.spawnT = sp / spd;
      }
    }

    for (let i = this.blocks.length - 1; i >= 0; i--) {
      const b = this.blocks[i];
      b.y += spd * dt;
      if (b.flash > 0) b.flash -= dt;

      const d = this.api.util.dist(P.x, P.y, b.x, b.y);
      if (d < P.r + 13) {
        if (P.color === b.color) {
          if (!b.passed) {
            b.passed = true;
            api.addScore(10);
            this.speedMod = Math.min(150, this.speedMod + 50);
            this.sparkle(b.x, b.y, this.CHEX[b.color]);
            this.burst(b.x, b.y, this.CHEX[b.color], 10, 130, 0.4, 3.5);
            api.sound.tone(1200, 0.05, 'sine', 0.08, 1600);
            this.addFloat(b.x, b.y - 18, 'SPEED UP!', '#FF8F00');
            this.blocks.splice(i, 1);
            continue;
          }
        } else {
          this.blocks.splice(i, 1);
          this.burst(b.x, b.y, this.CHEX[b.color], 10, 130, 0.4, 3.5);
          this.hitWrong();
          if (this.over) return;
          continue;
        }
      }

      if (b.y > this.H + 40) {
        this.blocks.splice(i, 1);
      }
    }

    if (this.core) {
      this.core.y += spd * dt;
      this.corePulse += dt;
      const c = this.core;
      const cd = this.api.util.dist(P.x, P.y, c.x, c.y);
      if (cd < P.r + c.r + 4) {
        this.cleared = true;
        this.endT = 0;
        this.endPlayed = false;
        api.addScore(100);
        this.burst(c.x, c.y, '#FFAB40', 30, 200, 1.0, 5);
        this.burst(c.x, c.y, '#FFE0B2', 20, 150, 0.8, 4);
        this.burst(P.x, P.y, '#FFFFFF', 15, 120, 0.6, 3);
        api.sound.play('clear');
        api.sound.tone(440, 0.4, 'sine', 0.2, 880);
        api.sound.tone(660, 0.4, 'sine', 0.15, 990);
        api.clear();
        return;
      }
      if (c.y > this.H + 60) {
        this.over = true;
        this.endT = 0;
        this.endPlayed = false;
        this.burst(P.x, P.y, '#E1F5FE', 26, 180, 0.9, 5);
        api.sound.play('over');
        api.sound.tone(120, 0.7, 'sine', 0.2, 50);
        api.gameOver();
        return;
      }
    }

    this.updateParticles(dt);
    this.updateSnow(dt);
  },

  updateParticles(dt) {
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.g * dt;
      p.life -= dt;
      if (p.life <= 0) this.parts.splice(i, 1);
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.y -= 40 * dt;
      f.life -= dt;
      if (f.life <= 0) this.floats.splice(i, 1);
    }
  },

  updateSnow(dt) {
    const spd = this.curSpeed();
    for (let i = 0; i < this.snow.length; i++) {
      const s = this.snow[i];
      s.y += (s.v + spd * 0.3) * dt;
      s.x += Math.sin(this.api.time * 1.5 + s.ph) * s.sw * dt;
      if (s.y > this.H + 10) {
        s.y = -10;
        s.x = this.api.util.rand(0, this.W);
      }
      if (s.x < -10) s.x = this.W + 10;
      if (s.x > this.W + 10) s.x = -10;
    }
  },

  drawHex(ctx, x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = rot + i * Math.PI / 3;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  },

  drawBlock(ctx, b) {
    const c = this.CHEX[b.color];
    const s = 30;
    const x = b.x - s / 2;
    const y = b.y - s / 2;

    ctx.fillStyle = c;
    ctx.fillRect(x, y, s, s);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x + 4, y + 4, s - 8, 6);

    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, s - 2, s - 2);

    if (b.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, b.flash * 2.5) + ')';
      ctx.fillRect(x - 2, y - 2, s + 4, s + 4);
    }
  },

  drawCore(ctx) {
    if (!this.core) return;
    const c = this.core;
    const pulse = 1 + Math.sin(this.corePulse * 4) * 0.08;
    const r = c.r * pulse;

    ctx.fillStyle = 'rgba(255,171,64,0.25)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, r + 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = this.C.orange;
    ctx.beginPath();
    ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FFE0B2';
    ctx.beginPath();
    ctx.arc(c.x, c.y, r * 0.55, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FFF3E0';
    ctx.beginPath();
    ctx.arc(c.x, c.y, r * 0.25, 0, Math.PI * 2);
    ctx.fill();
  },

  drawPlayer(ctx) {
    const P = this.P;
    if (this.over) return;

    const c = this.CHEX[P.color];
    const rot = this.api.time * 0.5;

    this.drawHex(ctx, P.x, P.y, P.r + 3, rot);
    if (P.color === 'white') {
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
    } else {
      ctx.globalAlpha = 0.33;
      ctx.fillStyle = c;
    }
    ctx.fill();
    ctx.globalAlpha = 1;

    this.drawHex(ctx, P.x, P.y, P.r, rot);
    ctx.fillStyle = P.color === 'white' ? '#FFFFFF' : c;
    ctx.fill();

    this.drawHex(ctx, P.x, P.y - 2, P.r * 0.5, rot);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();

    if (P.color !== 'white') {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(P.x, P.y, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (P.colorT > 0) {
      const k = 1 - P.colorT / 0.1;
      ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.strokeStyle = P.color === 'white' ? '#FFFFFF' : c;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(P.x, P.y, P.r + 4 + k * 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  },

  drawHUD(ctx) {
    const P = this.P;
    const t = this.api.time;
    const rem = Math.max(0, this.TIME_LIMIT - t);

    ctx.fillStyle = 'rgba(224,247,250,0.85)';
    ctx.fillRect(0, 0, this.W, 44);
    ctx.fillStyle = 'rgba(129,212,250,0.3)';
    ctx.fillRect(0, 44, this.W, 2);

    const spd = this.curSpeed();
    const base = this.baseSpeed();
    const minS = 50, maxS = 260;
    const bw2 = 76;
    const bx2 = 14;
    const by2 = 12;
    ctx.fillStyle = 'rgba(129,212,250,0.3)';
    ctx.fillRect(bx2, by2, bw2, 8);
    const frac = this.api.util.clamp((spd - minS) / (maxS - minS), 0, 1);
    ctx.fillStyle = spd > base + 15 ? '#FFAB40' : (spd < base - 15 ? '#40C4FF' : '#81D4FA');
    ctx.fillRect(bx2, by2, bw2 * frac, 8);
    const mxp = bx2 + bw2 * ((base - minS) / (maxS - minS));
    ctx.fillStyle = 'rgba(2,136,209,0.55)';
    ctx.fillRect(mxp - 1, by2 - 2, 2, 12);
    ctx.font = 'bold 8px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(2,136,209,0.7)';
    ctx.fillText('SPEED', bx2, by2 + 14);

    const mm = Math.floor(rem / 60);
    const ss = Math.floor(rem % 60);
    const timeStr = mm + ':' + (ss < 10 ? '0' : '') + ss;
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = rem < 30 ? '#FF5252' : '#0288D1';
    ctx.fillText(timeStr, this.W - 14, 22);

    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#0288D1';
    ctx.fillText('SCORE ' + this.api.score, 14, 38);

    const prog = Math.min(1, this.dist / this.STAGE_LEN);
    const bw = 120;
    const bx = this.W / 2 - bw / 2;
    const by = 38;
    ctx.fillStyle = 'rgba(129,212,250,0.3)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = '#FFAB40';
    ctx.fillRect(bx, by, bw * prog, 4);
    ctx.fillStyle = '#FFAB40';
    ctx.beginPath();
    ctx.arc(bx + bw, by + 2, 4, 0, Math.PI * 2);
    ctx.fill();

    const chipX = this.W / 2 + 74;
    const chipY = 40;
    this.drawHex(ctx, chipX, chipY, 7, 0);
    ctx.fillStyle = this.CHEX[P.color];
    ctx.fill();
    ctx.strokeStyle = 'rgba(2,136,209,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  },

  draw(ctx) {
    const W = this.W;
    const H = this.H;
    const t = this.api.time;
    const P = this.P;

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#E0F7FA');
    bg.addColorStop(1, '#B3E5FC');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const stripe = 80;
    const off = this.dist % stripe;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    for (let y = -stripe + off; y < H; y += stripe) {
      ctx.fillRect(0, y, W, 2);
    }

    ctx.fillStyle = 'rgba(129,212,250,0.22)';
    ctx.fillRect(0, 0, 10, H);
    ctx.fillRect(W - 10, 0, 10, H);

    if (this.freezeT > 0) {
      ctx.fillStyle = 'rgba(129,212,250,' + (this.freezeT * 0.25) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    for (let i = 0; i < this.snow.length; i++) {
      const s = this.snow[i];
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    let sx = 0;
    let sy = 0;
    if (this.shake > 0) {
      sx = (Math.random() * 2 - 1) * this.shake;
      sy = (Math.random() * 2 - 1) * this.shake;
    }

    ctx.save();
    ctx.translate(sx, sy);

    for (let i = 0; i < this.blocks.length; i++) {
      this.drawBlock(ctx, this.blocks[i]);
    }

    this.drawCore(ctx);
    this.drawPlayer(ctx);

    for (let i = 0; i < this.parts.length; i++) {
      const p = this.parts[i];
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < this.floats.length; i++) {
      const f = this.floats[i];
      const a = Math.max(0, f.life / f.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.c;
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    if (this.over) {
      const a = Math.min(1, this.endT / 1.0);
      ctx.fillStyle = 'rgba(225,245,254,' + (a * 0.65) + ')';
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.85) + ')';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const ang = i * Math.PI / 3 + this.endT * 0.3;
        ctx.beginPath();
        ctx.moveTo(P.x, P.y);
        ctx.lineTo(P.x + Math.cos(ang) * 60, P.y + Math.sin(ang) * 60);
        ctx.stroke();
      }

      this.drawHex(ctx, P.x, P.y, 18, this.endT * 0.3);
      ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.55) + ')';
      ctx.fill();
    }

    if (this.cleared) {
      const a = Math.min(1, this.endT / 1.0);
      ctx.fillStyle = 'rgba(255,224,178,' + (a * 0.45) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    this.drawHUD(ctx);

    if (!this.over && !this.cleared) {
      if (this.hintT > 0) {
        const a = Math.min(1, this.hintT / 0.5);
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(2,136,209,0.9)';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ドラッグ:移動 タップ:色変換', W / 2, H - 140);
        ctx.font = '12px sans-serif';
        ctx.fillText('タップで 白→赤→青→緑', W / 2, H - 122);
        ctx.fillText('同色で消すと加速 / 異色は減速', W / 2, H - 106);
        ctx.globalAlpha = 1;
      }

      if (this.warnT > 0) {
        const a = Math.min(1, this.warnT / 0.5);
        ctx.globalAlpha = a * (0.5 + Math.sin(t * 8) * 0.3);
        ctx.fillStyle = '#FF5252';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('時間切れ注意!', W / 2, 80);
        ctx.globalAlpha = 1;
      }

      if (this.coreWarnT > 0) {
        const a = Math.min(1, this.coreWarnT / 0.5);
        ctx.globalAlpha = a * (0.5 + Math.sin(t * 6) * 0.3);
        ctx.fillStyle = '#FF8F00';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('暖房コア接近!', W / 2, 100);
        ctx.globalAlpha = 1;
      }
    }
  }
};

__boot(typeof Game !== "undefined" ? Game : null);
