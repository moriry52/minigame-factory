<script type="application/json" id="meta">{"id": "20261125-115617-gemini-flash", "title": "ハリフウセン", "summary": "木の実を食べて巨大化＆全方位トゲ乱射！体が大きくなるほど攻撃は派手になるが、敵に当たりやすくなるサバイバルシューティング。", "rules": ["画面をドラッグしてハリネズミを全方向へ自在に動かそう。", "針は自動で全方位に発射され、迫り来る森の動物たちを迎撃する。", "木の実を拾うと体が巨大化して針が増加するが、被弾リスクも急上昇！", "敵や突進にぶつかると縮小。最小サイズで被弾すると終了。60秒間生き残れ！"], "controls": {"スマホ": "画面を指でなぞってハリネズミを全方向に移動（相対ドラッグで自機が隠れません）。", "PC": "マウスドラッグまたは矢印キー（WASD）でハリネズミを移動。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {

  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;

$("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); Sound.toggle(); });

let GAME = null, __last = 0;
function __fail(where, e) {

  __G.errors.push(`${where}: ${e && e.message ? e.message : e}`);
  __G.state = "error";
  overlay.innerHTML = `<div class="panel"><h2>エラーが発生しました</h2><p>${esc(e && e.message ? e.message : e)}</p></div>`;
  overlay.classList.remove("hidden");
}
function __init3D() {
  if (R3) return;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(DPR);
  R3 = { renderer };
  api.THREE = THREE; api.renderer = renderer;
}
function startGame() {
  if (!GAME) return;
  Input._clear();
  __G.score = 0; __G.frame = 0; __G.paused = false; __G.plays++;
  api.time = 0; api.hud("");
  if (CFG.mode === "3d") {
    api.scene = new THREE.Scene();
    api.camera = new THREE.PerspectiveCamera(60, CFG.w / CFG.h, 0.1, 1000);
    api.camera.position.set(0, 5, 10); api.camera.lookAt(0, 0, 0);
  }

}
function __endGame(kind) {

  __G.state = kind; __G.endedAt = performance.now();
  __saveBest(__G.score);

}
function __frame(now) {
  requestAnimationFrame(__frame);
  if (__G.state !== "playing" || __G.paused) {
    if (CFG.mode === "3d" && R3 && api.scene && api.camera) R3.renderer.render(api.scene, api.camera);
    return;
  }
  const dt = Math.min(0.05, Math.max(0, (now - __last) / 1000));
  __last = now;
  api.time += dt;
  try {
    Input._begin();
    GAME.update(dt);
    if (__G.state === "error") return;
    if (CFG.mode === "3d") R3.renderer.render(api.scene, api.camera);
    else if (GAME.draw) { ctx2d.save(); GAME.draw(ctx2d); ctx2d.restore(); }
    __G.frame++;

  } catch (e) { __fail("update/draw", e); }

function __boot(game) {

  if (!GAME || typeof GAME.init !== "function" || typeof GAME.update !== "function") {
    return __fail("boot", new Error("Game オブジェクト（init / update）が定義されていません"));
  }
  try {
    if (CFG.mode === "3d") { __init3D(); }
    else { ctx2d = canvas.getContext("2d"); api.ctx = ctx2d; }
  } catch (e) { return __fail("boot", e); }
  __buildPad();
  __layout();

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.player = {
      x: api.W / 2,
      y: api.H / 2,
      level: 1, // 1〜5
      r: 14,
      targetR: 14,
      invincible: 0,
      shootTimer: 0,
      angle: 0
    };
    this.berries = [];
    this.enemies = [];
    this.needles = [];
    this.particles = [];
    this.spawners = {
      berry: 1.0,
      crow: 3.5,
      boar: 20.0,
      bear: 38.0
    };
    this.timeLeft = 60.0;
    this.cleared = false;
    this.leaves = [];
    for (let i = 0; i < 20; i++) {
      this.leaves.push({
        x: api.util.rand(0, api.W),
        y: api.util.rand(0, api.H),
        r: api.util.rand(15, 45),
        alpha: api.util.rand(0.04, 0.12),
        speed: api.util.rand(5, 15)
      });
    }
  },

  update(dt) {
    if (this.cleared) return;

    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.cleared = true;
      this.api.addScore(Math.floor(this.player.level * 500));
      this.api.sound.play('clear');
      this.api.clear();
      return;
    }

    const input = this.api.input;
    const p = this.player;

    // 移動処理: ドラッグ(相対) & キーボード
    let mx = 0;
    let my = 0;
    if (input.pointer.down) {
      mx += input.pointer.dx;
      my += input.pointer.dy;
    }
    const keySpeed = 220 * dt;
    if (input.left) mx -= keySpeed;
    if (input.right) mx += keySpeed;
    if (input.up) my -= keySpeed;
    if (input.down) my += keySpeed;

    p.x = this.api.util.clamp(p.x + mx, p.r, this.api.W - p.r);
    p.y = this.api.util.clamp(p.y + my, 30 + p.r, this.api.H - p.r);

    if (mx !== 0 || my !== 0) {
      p.angle = Math.atan2(my, mx);
    }

    // サイズ補間
    const baseRadii = [14, 19, 25, 32, 40];
    p.targetR = baseRadii[p.level - 1];
    p.r = this.api.util.lerp(p.r, p.targetR, dt * 8);

    if (p.invincible > 0) p.invincible -= dt;

    // 針の自動発射
    const shootIntervals = [0.45, 0.40, 0.35, 0.30, 0.25];
    p.shootTimer += dt;
    if (p.shootTimer >= shootIntervals[p.level - 1]) {
      p.shootTimer = 0;
      this.shootNeedles();
    }

    // スポーン管理
    this.updateSpawns(dt);

    // 木の実更新
    for (let i = this.berries.length - 1; i >= 0; i--) {
      const b = this.berries[i];
      b.time += dt;
      if (this.api.util.circleHit(p, b)) {
        this.api.sound.play('powerup');
        this.api.addScore(100 * p.level);
        if (p.level < 5) {
          p.level++;
          this.createExplosion(p.x, p.y, '#ffff88', 12);
        }
        this.berries.splice(i, 1);
      } else if (b.time > 15) {
        this.berries.splice(i, 1);
      }
    }

    // 針の更新
    for (let i = this.needles.length - 1; i >= 0; i--) {
      const n = this.needles[i];
      n.x += n.vx * dt;
      n.y += n.vy * dt;
      if (n.x < -10 || n.x > this.api.W + 10 || n.y < -10 || n.y > this.api.H + 10) {
        this.needles.splice(i, 1);
        continue;
      }
      // 敵との衝突判定
      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (e.warnTimer && e.warnTimer > 0) continue; // 突進予告中は無敵
        if (this.api.util.circleHit(n, e)) {
          e.hp -= n.dmg;
          this.needles.splice(i, 1);
          this.createExplosion(n.x, n.y, '#fff', 3);
          this.api.sound.tone(600 + Math.random() * 200, 0.04, 'triangle', 0.1);
          if (e.hp <= 0) {
            this.killEnemy(j);
          }
          break;
        }
      }
    }

    // 敵の更新
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.type === 'crow') {
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        if (e.x < -50 || e.x > this.api.W + 50 || e.y < -50 || e.y > this.api.H + 50) {
          this.enemies.splice(i, 1);
          continue;
        }
      } else if (e.type === 'boar') {
        if (e.warnTimer > 0) {
          e.warnTimer -= dt;
          if (e.warnTimer <= 0) {
            this.api.sound.tone(220, 0.25, 'sawtooth', 0.3, 110);
            e.vx = Math.cos(e.chargeAngle) * 380;
            e.vy = Math.sin(e.chargeAngle) * 380;
          }
        } else {
          e.x += e.vx * dt;
          e.y += e.vy * dt;
          if (e.x < -60 || e.x > this.api.W + 60 || e.y < -60 || e.y > this.api.H + 60) {
            this.enemies.splice(i, 1);
            continue;
          }
        }
      } else if (e.type === 'bear') {
        const ang = this.api.util.angle(e.x, e.y, p.x, p.y);
        e.vx = Math.cos(ang) * 45;
        e.vy = Math.sin(ang) * 45;
        e.x += e.vx * dt;
        e.y += e.vy * dt;
      }

      // 自機との衝突判定
      if (p.invincible <= 0 && (!e.warnTimer || e.warnTimer <= 0)) {
        if (this.api.util.circleHit(p, e)) {
          this.hitPlayer();
          break;
        }
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // 木漏れ日移動
    for (const l of this.leaves) {
      l.y += l.speed * dt;
      if (l.y - l.r > this.api.H) {
        l.y = -l.r;
        l.x = this.api.util.rand(0, this.api.W);
      }
    }
  },

  hitPlayer() {
    const p = this.player;
    if (p.level <= 1) {
      this.api.sound.play('hurt');
      this.createExplosion(p.x, p.y, '#e55', 25);
      this.api.gameOver();
    } else {
      p.level--;
      p.invincible = 1.3;
      // 縮小音 (シュルル)
      this.api.sound.tone(500, 0.25, 'sawtooth', 0.25, 120);
      this.createExplosion(p.x, p.y, '#ff9966', 15);
    }
  },

  killEnemy(index) {
    const e = this.enemies[index];
    this.createExplosion(e.x, e.y, e.color, 12);
    this.api.sound.play('hit');
    this.api.addScore(e.score);
    // 稀にベリーをドロップ
    if (Math.random() < 0.25) {
      this.berries.push({ x: e.x, y: e.y, r: 8, time: 0 });
    }
    this.enemies.splice(index, 1);
  },

  shootNeedles() {
    const p = this.player;
    const needleCounts = [4, 6, 8, 12, 16];
    const count = needleCounts[p.level - 1];
    const speed = 250 + p.level * 20;
    const dmg = p.level >= 4 ? 2 : 1;

    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 / count) * i + (p.level % 2 === 0 ? 0.2 : 0);
      this.needles.push({
        x: p.x + Math.cos(a) * p.r,
        y: p.y + Math.sin(a) * p.r,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        r: p.level >= 4 ? 4 : 3,
        dmg: dmg,
        color: '#ffee44'
      });
    }
    this.api.sound.tone(800 + p.level * 80, 0.05, 'square', 0.08);
  },

  updateSpawns(dt) {
    const elapsed = 60.0 - this.timeLeft;

    // 木の実
    this.spawners.berry -= dt;
    if (this.spawners.berry <= 0) {
      this.spawners.berry = this.api.util.rand(2.0, 3.5);
      if (this.berries.length < 5) {
        this.berries.push({
          x: this.api.util.rand(30, this.api.W - 30),
          y: this.api.util.rand(60, this.api.H - 40),
          r: 8,
          time: 0
        });
      }
    }

    // 0〜3秒は何もしない
    if (elapsed < 3.0) return;

    // カラス（全期間）
    this.spawners.crow -= dt;
    const crowFreq = elapsed > 40 ? 1.2 : (elapsed > 20 ? 1.8 : 2.5);
    if (this.spawners.crow <= 0) {
      this.spawners.crow = crowFreq + Math.random() * 0.5;
      const fromLeft = Math.random() < 0.5;
      const startX = fromLeft ? -20 : this.api.W + 20;
      const startY = this.api.util.rand(60, this.api.H - 60);
      const targetY = startY + this.api.util.rand(-120, 120);
      const spd = this.api.util.rand(160, 240);
      const ang = Math.atan2(targetY - startY, fromLeft ? 300 : -300);
      this.enemies.push({
        type: 'crow',
        x: startX,
        y: startY,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 12,
        hp: 1,
        score: 50,
        color: '#333344'
      });
    }

    // イノシシ (20秒以降)
    if (elapsed >= 20.0) {
      this.spawners.boar -= dt;
      if (this.spawners.boar <= 0) {
        this.spawners.boar = elapsed > 45 ? 3.0 : 4.5;
        // 予告突進
        const side = this.api.util.randInt(0, 3); // 0上 1右 2下 3左
        let sx = 0, sy = 0;
        if (side === 0) { sx = this.player.x; sy = 40; }
        else if (side === 1) { sx = this.api.W - 10; sy = this.player.y; }
        else if (side === 2) { sx = this.player.x; sy = this.api.H - 10; }
        else { sx = 10; sy = this.player.y; }

        const cAng = this.api.util.angle(sx, sy, this.player.x, this.player.y);
        this.enemies.push({
          type: 'boar',
          x: sx,
          y: sy,
          warnTimer: 1.0,
          chargeAngle: cAng,
          vx: 0,
          vy: 0,
          r: 18,
          hp: 3,
          score: 150,
          color: '#8b5a2b'
        });
        this.api.sound.tone(440, 0.12, 'sawtooth', 0.2);
      }
    }

    // クマ (40秒以降)
    if (elapsed >= 40.0) {
      this.spawners.bear -= dt;
      if (this.spawners.bear <= 0) {
        this.spawners.bear = 7.0;
        const corner = this.api.util.choice([
          { x: 30, y: 50 },
          { x: this.api.W - 30, y: 50 },
          { x: 30, y: this.api.H - 30 },
          { x: this.api.W - 30, y: this.api.H - 30 }
        ]);
        this.enemies.push({
          type: 'bear',
          x: corner.x,
          y: corner.y,
          vx: 0,
          vy: 0,
          r: 26,
          hp: 8,
          score: 300,
          color: '#5c3317'
        });
        this.api.sound.tone(150, 0.3, 'sine', 0.35);
      }
    }
  },

  createExplosion(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = this.api.util.rand(30, 140);
      this.particles.push({
        x, y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        life: this.api.util.rand(0.2, 0.5),
        maxLife: 0.5,
        color,
        r: this.api.util.rand(2, 4)
      });
    }
  },

  draw(ctx) {
    const W = this.api.W;
    const H = this.api.H;

    // 森の草地背景
    ctx.fillStyle = '#24431d';
    ctx.fillRect(0, 0, W, H);

    // 木漏れ日
    ctx.fillStyle = '#ffffff';
    for (const l of this.leaves) {
      ctx.globalAlpha = l.alpha;
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // 木の実
    for (const b of this.berries) {
      const pulse = 1 + Math.sin(b.time * 6) * 0.15;
      ctx.fillStyle = '#e64a19';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      // ヘタ
      ctx.fillStyle = '#6d4c41';
      ctx.fillRect(b.x - 1, b.y - b.r * pulse - 3, 2, 4);
    }

    // 敵の予告線
    for (const e of this.enemies) {
      if (e.warnTimer && e.warnTimer > 0) {
        ctx.strokeStyle = `rgba(255, 50, 50, ${0.4 + Math.sin(e.warnTimer * 20) * 0.3})`;
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.chargeAngle) * 500, e.y + Math.sin(e.chargeAngle) * 500);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // 針
    for (const n of this.needles) {
      ctx.fillStyle = n.color;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 敵
    for (const e of this.enemies) {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();

      // 各敵の特徴ディテール
      if (e.type === 'crow') {
        // カラスのくちばし
        const ang = Math.atan2(e.vy, e.vx);
        ctx.fillStyle = '#ffa726';
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(ang) * (e.r + 5), e.y + Math.sin(ang) * (e.r + 5));
        ctx.lineTo(e.x + Math.cos(ang + 2) * e.r, e.y + Math.sin(ang + 2) * e.r);
        ctx.lineTo(e.x + Math.cos(ang - 2) * e.r, e.y + Math.sin(ang - 2) * e.r);
        ctx.fill();
      } else if (e.type === 'boar') {
        // 牙
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(e.x - 6, e.y - 4, 3, 0, Math.PI * 2);
        ctx.arc(e.x + 6, e.y - 4, 3, 0, Math.PI * 2);
        ctx.fill();
      } else if (e.type === 'bear') {
        // 耳
        ctx.fillStyle = '#3e200c';
        ctx.beginPath();
        ctx.arc(e.x - 18, e.y - 18, 9, 0, Math.PI * 2);
        ctx.arc(e.x + 18, e.y - 18, 9, 0, Math.PI * 2);
        ctx.fill();
        // HPバー
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 20, e.y - e.r - 8, 40, 4);
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(e.x - 20, e.y - e.r - 8, 40 * (e.hp / 8), 4);
      }
    }

    // パーティクル
    for (const pt of this.particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.life / pt.maxLife;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1.0;

    // 自機（ハリネズミ）
    const p = this.player;
    const isBlinking = p.invincible > 0 && Math.floor(p.invincible * 15) % 2 === 0;
    if (!isBlinking) {
      // 背中のトゲ（放射状）
      const spikeCount = 8 + p.level * 2;
      ctx.fillStyle = '#8d6e63';
      for (let i = 0; i < spikeCount; i++) {
        const sa = (Math.PI * 2 / spikeCount) * i;
        const sx = p.x + Math.cos(sa) * (p.r + 4);
        const sy = p.y + Math.sin(sa) * (p.r + 4);
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // まるっこい体
      ctx.fillStyle = '#d7ccc8';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();

      // 顔の向き・目・鼻
      const fx = Math.cos(p.angle);
      const fy = Math.sin(p.angle);
      // 鼻
      ctx.fillStyle = '#3e2723';
      ctx.beginPath();
      ctx.arc(p.x + fx * (p.r - 2), p.y + fy * (p.r - 2), 3, 0, Math.PI * 2);
      ctx.fill();
      // 目
      const perpX = -fy * 5;
      const perpY = fx * 5;
      ctx.beginPath();
      ctx.arc(p.x + fx * (p.r * 0.4) + perpX, p.y + fy * (p.r * 0.4) + perpY, 2.5, 0, Math.PI * 2);
      ctx.arc(p.x + fx * (p.r * 0.4) - perpX, p.y + fy * (p.r * 0.4) - perpY, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // HUD (上部)
    ctx.fillStyle = 'rgba(20, 35, 15, 0.85)';
    ctx.fillRect(0, 0, W, 36);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`TIME: ${this.timeLeft.toFixed(1)}s`, 12, 24);

    // サイズLvゲージ
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillStyle = '#ffecb3';
    ctx.fillText(`SIZE: Lv.${p.level}`, W / 2 - 40, 23);

    // ゲージ枠と中身
    const gx = W / 2 + 5;
    const gy = 12;
    const gw = 60;
    const gh = 12;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(gx, gy, gw, gh);
    ctx.fillStyle = p.level === 5 ? '#ff5252' : '#ffeb3b';
    ctx.fillRect(gx + 2, gy + 2, (gw - 4) * (p.level / 5), gh - 4);

    // スコア
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText(`SCORE: ${this.api.score}`, W - 12, 24);
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
