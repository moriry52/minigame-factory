<script type="application/json" id="meta">{"id": "20261124-151819-local-llm", "title": "クラヤミビーコン", "summary": "視界ゼロの暗黒宇宙をライトの明かりだけを頼りに突き進む、ワンボタン操作の全方位サバイバルアクション。", "rules": ["自機は自動で時計回りに旋回し、画面を押している間だけ向いている方向へブースト前進します。", "自機の周囲ごくわずかしか見えない暗闇の中、迫り来るデブリや宇宙機雷を避けてください。", "浮遊する「フォトン」を拾うと視界が一時的に広がり、索敵が有利になります。", "障害物に一度でも激突すると大破。3分間（180秒）生き延びれば脱出成功です。"], "controls": {"スマホ": "画面タップ長押しでブースト前進。指を離すとその場で旋回します。", "PC": "スペースキー/Zキー長押しでブースト前進。キーを離すとその場で旋回します。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "ワンボタン", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;
    overlay.classList.remove("hidden");
    Input._clear();
  } else {
    overlay.classList.add("hidden");
    __last = performance.now();
  }
}
$("pauseBtn").addEventListener("click", (e) => { e.stopPropagation(); togglePause(); });
$("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); Sound.toggle(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) togglePause(true); });

// ---------------- 進行 ----------------
let GAME = null, __last = 0;
function __fail(where, e) {
  console.error(e);
  __G.errors.push(`${where}: ${e && e.message ? e.message : e}`);
  __G.state = "error";
  overlay.innerHTML = `<div class="panel"><h2>エラーが発生しました</h2><p>${esc(e && e.message ? e.message : e)}</p></div>`;
  overlay.classList.remove("hidden");
}
function __init3D() {
  if (R3) return;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(DPR);
  R3 = { renderer };
  api.THREE = THREE; api.renderer = renderer;
}
function startGame() {
  if (!GAME) return;
  Input._clear();
  __G.score = 0; __G.frame = 0; __G.paused = false; __G.plays++;
  api.time = 0; api.hud("");
  if (CFG.mode === "3d") {
    api.scene = new THREE.Scene();
    api.camera = new THREE.PerspectiveCamera(60, CFG.w / CFG.h, 0.1, 1000);
    api.camera.position.set(0, 5, 10); api.camera.lookAt(0, 0, 0);
  }
  try { GAME.init(api); } catch (e) { return __fail("init", e); }
  __layout();
  overlay.classList.add("hidden");
  __G.state = "playing"; __G.startedAt = performance.now();
  __last = performance.now();
}
function __endGame(kind) {
  if (__G.state !== "playing") return;
  __G.state = kind; __G.endedAt = performance.now();
  __saveBest(__G.score);
  Sound.play(kind === "clear" ? "clear" : "over");
  setTimeout(() => __showResult(kind), 500);
}
function __frame(now) {
  requestAnimationFrame(__frame);
  if (__G.state !== "playing" || __G.paused) {
    if (CFG.mode === "3d" && R3 && api.scene && api.camera) R3.renderer.render(api.scene, api.camera);
    return;
  }
  const dt = Math.min(0.05, Math.max(0, (now - __last) / 1000));
  __last = now;
  api.time += dt;
  try {
    Input._begin();
    GAME.update(dt);
    if (__G.state === "error") return;
    if (CFG.mode === "3d") R3.renderer.render(api.scene, api.camera);
    else if (GAME.draw) { ctx2d.save(); GAME.draw(ctx2d); ctx2d.restore(); }
    __G.frame++;
    if (!Number.isFinite(__G.score)) throw new Error("score が数値ではありません");
  } catch (e) { __fail("update/draw", e); }
}
function __boot(game) {
  GAME = game;
  if (!GAME || typeof GAME.init !== "function" || typeof GAME.update !== "function") {
    return __fail("boot", new Error("Game オブジェクト（init / update）が定義されていません"));
  }
  try {
    if (CFG.mode === "3d") { __init3D(); }
    else { ctx2d = canvas.getContext("2d"); api.ctx = ctx2d; }
  } catch (e) { return __fail("boot", e); }
  __buildPad();
  __layout();
  if (CFG.mode !== "3d") { ctx2d.fillStyle = "#000"; ctx2d.fillRect(0, 0, CFG.w, CFG.h); }
  __showTitle();
  requestAnimationFrame(__frame);
}

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.W = api.W;
    this.H = api.H;
    this.cx = this.W / 2;
    this.cy = this.H / 2;

    this.ship = { x: this.cx, y: this.cy, vx: 0, vy: 0, angle: -Math.PI / 2, r: 10 };
    this.maxSpeed = 180;
    this.turnRate = 150 * Math.PI / 180;
    this.boostAcc = 260;

    this.baseVision = 70;
    this.maxVision = 120;
    this.vision = this.baseVision;

    this.debris = [];
    this.mines = [];
    this.photons = [];
    this.particles = [];
    this.rings = [];

    this.time = 0;
    this.targetTime = 180;
    this.grace = 3;

    this.debrisTimer = 0;
    this.mineTimer = 0;
    this.photonTimer = 0;

    this.boosting = false;
    this.boostSoundOn = false;
    this.boostT = 0;

    this.warnTimer = 0;
    this.warnLevel = 0;

    this.shake = 0;
    this.starSeed = [];
    for (let i = 0; i < 120; i++) {
      this.starSeed.push({ x: api.util.rand(0, this.W), y: api.util.rand(0, this.H), s: api.util.rand(0.4, 1.6), b: api.util.rand(0.2, 0.9) });
    }

    api.setScore(0);
  },

  spawnDebris() {
    const edge = this.api.util.randInt(0, 3);
    const m = 26;
    let x, y;
    if (edge === 0) { x = this.api.util.rand(0, this.W); y = -m; }
    else if (edge === 1) { x = this.W + m; y = this.api.util.rand(0, this.H); }
    else if (edge === 2) { x = this.api.util.rand(0, this.W); y = this.H + m; }
    else { x = -m; y = this.api.util.rand(0, this.H); }
    const r = this.api.util.rand(12, 20);
    const dx = this.ship.x - x, dy = this.ship.y - y;
    const d = Math.hypot(dx, dy) || 1;
    const sp = this.api.util.rand(45, 70) * this.debrisSpeedMult();
    this.debris.push({ x, y, vx: dx / d * sp, vy: dy / d * sp, r, rot: this.api.util.rand(0, 6.28), vr: this.api.util.rand(-1.5, 1.5) });
  },

  debrisSpeedMult() {
    if (this.time >= 120) return 1.5;
    if (this.time >= 60) return 1.3;
    return 1.0;
  },

  mineCount() {
    return this.time >= 120 ? 4 : 2;
  },

  spawnMine() {
    const edge = this.api.util.randInt(0, 3);
    const m = 16;
    let x, y;
    if (edge === 0) { x = this.api.util.rand(0, this.W); y = -m; }
    else if (edge === 1) { x = this.W + m; y = this.api.util.rand(0, this.H); }
    else if (edge === 2) { x = this.api.util.rand(0, this.W); y = this.H + m; }
    else { x = -m; y = this.api.util.rand(0, this.H); }
    this.mines.push({ x, y, vx: 0, vy: 0, r: 8, pulse: this.api.util.rand(0, 6.28) });
  },

  spawnPhoton() {
    let x, y, tries = 0;
    do {
      x = this.api.util.rand(40, this.W - 40);
      y = this.api.util.rand(40, this.H - 40);
      tries++;
    } while (this.api.util.dist(x, y, this.ship.x, this.ship.y) < 120 && tries < 20);
    this.photons.push({ x, y, r: 6, pulse: this.api.util.rand(0, 6.28) });
  },

  addParticle(x, y, vx, vy, life, size, color, grav) {
    this.particles.push({ x, y, vx, vy, life, maxLife: life, size, color, grav: grav || 0 });
  },

  explode(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = this.api.util.rand(0, Math.PI * 2);
      const sp = this.api.util.rand(30, 160);
      this.addParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, this.api.util.rand(0.4, 0.9), this.api.util.rand(2, 5), color);
    }
  },

  update(dt) {
    this.time += dt;
    const ship = this.ship;
    const in_ = this.api.input;

    this.boosting = in_.a;
    if (this.boosting) {
      ship.vx += Math.cos(ship.angle) * this.boostAcc * dt;
      ship.vy += Math.sin(ship.angle) * this.boostAcc * dt;
      this.boostT += dt;
      if (!this.boostSoundOn) { this.api.sound.tone(120, 0.15, 'sawtooth', 0.15, 220); this.boostSoundOn = true; }
      if (this.api.util.rand(0, 1) < 0.9) {
        const bx = ship.x - Math.cos(ship.angle) * ship.r;
        const by = ship.y - Math.sin(ship.angle) * ship.r;
        const a = ship.angle + Math.PI + this.api.util.rand(-0.4, 0.4);
        const sp = this.api.util.rand(40, 90);
        this.addParticle(bx, by, Math.cos(a) * sp, Math.sin(a) * sp, this.api.util.rand(0.2, 0.45), this.api.util.rand(2, 4), this.api.util.hsl(190, 100, 70, 1));
      }
    } else {
      ship.angle += this.turnRate * dt;
      if (this.boostSoundOn) { this.boostSoundOn = false; }
    }

    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > this.maxSpeed) { ship.vx = ship.vx / sp * this.maxSpeed; ship.vy = ship.vy / sp * this.maxSpeed; }

    const drag = this.boosting ? 0.4 : 1.6;
    ship.vx *= Math.pow(drag, dt);
    ship.vy *= Math.pow(drag, dt);

    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;

    const pad = ship.r + 4;
    if (ship.x < pad) { ship.x = pad; ship.vx = Math.abs(ship.vx) * 0.5; }
    if (ship.x > this.W - pad) { ship.x = this.W - pad; ship.vx = -Math.abs(ship.vx) * 0.5; }
    if (ship.y < pad) { ship.y = pad; ship.vy = Math.abs(ship.vy) * 0.5; }
    if (ship.y > this.H - pad) { ship.y = this.H - pad; ship.vy = -Math.abs(ship.vy) * 0.5; }

    // vision
    this.vision = this.api.util.lerp(this.vision, this.baseVision, 1 - Math.pow(0.5, dt / 1.5));
    if (this.vision < this.baseVision) this.vision = this.baseVision;

    // spawns
    this.debrisTimer -= dt;
    if (this.debrisTimer <= 0) {
      this.spawnDebris();
      const base = this.api.util.lerp(1.4, 0.7, Math.min(1, this.time / this.targetTime));
      this.debrisTimer = base * this.api.util.rand(0.7, 1.3);
    }

    this.mineTimer -= dt;
    const maxMines = this.mineCount();
    if (this.mineTimer <= 0 && this.mines.length < maxMines) {
      this.spawnMine();
      this.mineTimer = this.api.util.rand(2.5, 4.5);
    }

    this.photonTimer -= dt;
    if (this.photonTimer <= 0 && this.photons.length < 3) {
      this.spawnPhoton();
      this.photonTimer = this.api.util.rand(4, 7);
    }

    // update debris
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.rot += d.vr * dt;
      if (d.x < -40 || d.x > this.W + 40 || d.y < -40 || d.y > this.H + 40) { this.debris.splice(i, 1); continue; }
      if (this.api.util.circleHit({ x: ship.x, y: ship.y, r: ship.r }, { x: d.x, y: d.y, r: d.r })) {
        this.die();
        return;
      }
    }

    // update mines
    for (let i = this.mines.length - 1; i >= 0; i--) {
      const m = this.mines[i];
      m.pulse += dt * 4;
      const dist = this.api.util.dist(m.x, m.y, ship.x, ship.y);
      if (dist < this.vision + 30) {
        const a = this.api.util.angle(m.x, m.y, ship.x, ship.y);
        const acc = 60;
        m.vx += Math.cos(a) * acc * dt;
        m.vy += Math.sin(a) * acc * dt;
        const ms = Math.hypot(m.vx, m.vy);
        const maxM = this.api.util.lerp(60, 95, Math.min(1, this.time / this.targetTime));
        if (ms > maxM) { m.vx = m.vx / ms * maxM; m.vy = m.vy / ms * maxM; }
      }
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.x < -30 || m.x > this.W + 30 || m.y < -30 || m.y > this.H + 30) { this.mines.splice(i, 1); continue; }
      if (this.api.util.circleHit({ x: ship.x, y: ship.y, r: ship.r }, { x: m.x, y: m.y, r: m.r })) {
        this.die();
        return;
      }
    }

    // photons
    for (let i = this.photons.length - 1; i >= 0; i--) {
      const p = this.photons[i];
      p.pulse += dt * 3;
      if (this.api.util.circleHit({ x: ship.x, y: ship.y, r: ship.r + 4 }, { x: p.x, y: p.y, r: p.r + 4 })) {
        this.vision = this.maxVision;
        this.api.addScore(50);
        this.api.sound.play('coin');
        this.explode(p.x, p.y, this.api.util.hsl(130, 90, 65, 1), 14);
        this.rings.push({ x: p.x, y: p.y, r: 4, max: 60, life: 0.6 });
        this.photons.splice(i, 1);
      }
    }

    // rings
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      r.r += (r.max - r.r) * (1 - Math.pow(0.02, dt));
      if (r.life <= 0) this.rings.splice(i, 1);
    }

    // particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.9, dt);
      p.vy *= Math.pow(0.9, dt);
      if (p.life <= 0) this.particles.splice(i, 1);
    }

    // warning proximity
    let nearest = 1e9;
    for (const d of this.debris) nearest = Math.min(nearest, this.api.util.dist(d.x, d.y, ship.x, ship.y) - d.r);
    for (const m of this.mines) nearest = Math.min(nearest, this.api.util.dist(m.x, m.y, ship.x, ship.y) - m.r);
    this.warnLevel = this.api.util.clamp(1 - nearest / 120, 0, 1);
    if (this.warnLevel > 0.4 && this.time > this.grace) {
      this.warnTimer -= dt;
      if (this.warnTimer <= 0) {
        this.api.sound.tone(660 + this.warnLevel * 200, 0.08, 'square', 0.06, 440);
        this.warnTimer = 0.25 - this.warnLevel * 0.12;
      }
    }

    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 3);

    if (this.time >= this.targetTime) {
      this.api.addScore(500);
      this.api.sound.play('clear');
      this.api.clear();
    }
  },

  die() {
    this.shake = 1;
    this.explode(this.ship.x, this.ship.y, this.api.util.hsl(190, 100, 70, 1), 30);
    this.explode(this.ship.x, this.ship.y, this.api.util.hsl(20, 100, 60, 1), 20);
    this.api.sound.play('explode');
    this.api.gameOver();
  },

  draw(ctx) {
    const ship = this.ship;
    const W = this.W, H = this.H;

    ctx.save();
    if (this.shake > 0) {
      const s = this.shake * 8;
      ctx.translate(this.api.util.rand(-s, s), this.api.util.rand(-s, s));
    }

    // background
    ctx.fillStyle = '#05050A';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // stars (dim, only visible in light)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const st of this.starSeed) {
      const d = this.api.util.dist(st.x, st.y, ship.x, ship.y);
      if (d < this.vision) {
        const a = st.b * (1 - d / this.vision);
        ctx.fillStyle = this.api.util.hsl(200, 30, 80, a);
        ctx.fillRect(st.x, st.y, st.s, st.s);
      }
    }
    ctx.restore();

    // rings
    for (const r of this.rings) {
      const a = Math.max(0, r.life / 0.6);
      ctx.strokeStyle = this.api.util.hsl(130, 90, 65, a * 0.6);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // photons
    for (const p of this.photons) {
      const d = this.api.util.dist(p.x, p.y, ship.x, ship.y);
      if (d > this.vision + 20) continue;
      const glow = 0.6 + 0.4 * Math.sin(p.pulse);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
      g.addColorStop(0, this.api.util.hsl(130, 90, 70, 0.9 * glow));
      g.addColorStop(1, this.api.util.hsl(130, 90, 70, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.api.util.hsl(130, 100, 85, 1);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // debris
    for (const d of this.debris) {
      const dist = this.api.util.dist(d.x, d.y, ship.x, ship.y);
      if (dist > this.vision + 20) continue;
      const fade = 1 - Math.max(0, dist - this.vision) / 20;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, d.r);
      g.addColorStop(0, this.api.util.hsl(30, 20, 55, fade));
      g.addColorStop(1, this.api.util.hsl(25, 25, 30, fade));
      ctx.fillStyle = g;
      ctx.beginPath();
      const pts = 7;
      for (let i = 0; i < pts; i++) {
        const a = i / pts * Math.PI * 2;
        const rr = d.r * (0.8 + 0.2 * Math.sin(i * 3 + d.rot));
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // mines
    for (const m of this.mines) {
      const dist = this.api.util.dist(m.x, m.y, ship.x, ship.y);
      if (dist > this.vision + 20) continue;
      const fade = 1 - Math.max(0, dist - this.vision) / 20;
      const pulse = 0.5 + 0.5 * Math.sin(m.pulse);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 2.5);
      g.addColorStop(0, this.api.util.hsl(345, 90, 60, fade * (0.6 + 0.4 * pulse)));
      g.addColorStop(1, this.api.util.hsl(345, 90, 60, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.api.util.hsl(345, 90, 55, fade);
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = this.api.util.hsl(345, 100, 85, fade * pulse);
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // particles
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = this.api.util.hsl(0, 0, 100, a);
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // ship
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);
    if (this.boosting) {
      const fl = 12 + this.api.util.rand(0, 8);
      const g = ctx.createLinearGradient(-ship.r, 0, -ship.r - fl, 0);
      g.addColorStop(0, this.api.util.hsl(190, 100, 80, 0.9));
      g.addColorStop(1, this.api.util.hsl(190, 100, 80, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-ship.r * 0.6, -ship.r * 0.5);
      ctx.lineTo(-ship.r - fl, 0);
      ctx.lineTo(-ship.r * 0.6, ship.r * 0.5);
      ctx.closePath();
      ctx.fill();
    }
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, ship.r);
    sg.addColorStop(0, this.api.util.hsl(190, 100, 95, 1));
    sg.addColorStop(1, this.api.util.hsl(200, 90, 60, 1));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(0, 0, ship.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = this.api.util.hsl(190, 100, 100, 1);
    ctx.beginPath();
    ctx.arc(ship.r * 0.5, 0, ship.r * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // darkness mask
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#05050A';
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(ship.x, ship.y, this.vision, 0, Math.PI * 2, true);
    ctx.fill('evenodd');
    // soft light edge
    const lg = ctx.createRadialGradient(ship.x, ship.y, this.vision * 0.7, ship.x, ship.y, this.vision);
    lg.addColorStop(0, this.api.util.hsl(190, 100, 80, 0));
    lg.addColorStop(1, this.api.util.hsl(190, 100, 80, 0.12));
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, this.vision, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // warning vignette
    if (this.warnLevel > 0.3 && this.time > this.grace) {
      const wa = (this.warnLevel - 0.3) * 0.5 * (0.5 + 0.5 * Math.sin(this.time * 12));
      const wg = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.7);
      wg.addColorStop(0, this.api.util.hsl(345, 90, 50, 0));
      wg.addColorStop(1, this.api.util.hsl(345, 90, 50, wa));
      ctx.fillStyle = wg;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();

    // HUD
    this.drawHUD(ctx);
  },

  drawHUD(ctx) {
    const W = this.W;
    const remain = Math.max(0, this.targetTime - this.time);
    const frac = remain / this.targetTime;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px monospace';
    ctx.fillStyle = this.api.util.hsl(190, 100, 85, 1);
    ctx.shadowColor = this.api.util.hsl(190, 100, 60, 0.8);
    ctx.shadowBlur = 8;
    ctx.fillText(Math.ceil(remain) + 's', W / 2, 34);
    ctx.shadowBlur = 0;

    const gw = 200, gx = W / 2 - gw / 2, gy = 44, gh = 6;
    ctx.fillStyle = this.api.util.hsl(190, 30, 20, 0.8);
    ctx.fillRect(gx, gy, gw, gh);
    const barCol = frac > 0.3 ? this.api.util.hsl(190, 100, 65, 1) : this.api.util.hsl(345, 90, 60, 1);
    ctx.fillStyle = barCol;
    ctx.fillRect(gx, gy, gw * frac, gh);
    ctx.strokeStyle = this.api.util.hsl(190, 60, 50, 0.6);
    ctx.lineWidth = 1;
    ctx.strokeRect(gx, gy, gw, gh);

    ctx.font = '12px monospace';
    ctx.fillStyle = this.api.util.hsl(190, 40, 80, 0.8);
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + this.api.score, 12, 22);

    if (this.vision > this.baseVision + 2) {
      ctx.textAlign = 'right';
      ctx.fillStyle = this.api.util.hsl(130, 90, 70, 0.9);
      ctx.fillText('FOCUS', W - 12, 22);
    }
    ctx.restore();
  },
};
