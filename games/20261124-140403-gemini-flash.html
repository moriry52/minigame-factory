<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d14;color:#eef;overflow:hidden;
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#screen{display:block;background:#000;touch-action:none;image-rendering:auto}
#hud{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:14px;font-weight:700;
  text-shadow:0 1px 3px #000;pointer-events:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,6,12,.72);backdrop-filter:blur(2px);touch-action:none}
#overlay.hidden{display:none}
.panel{width:min(92%,420px);max-height:92%;overflow:auto;background:#151a2b;border:1px solid #2c3554;
  border-radius:16px;padding:20px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.panel h1{font-size:24px;margin-bottom:8px;letter-spacing:.02em}
.panel h2{font-size:20px;margin-bottom:8px}
.panel p{font-size:14px;line-height:1.6;color:#c9d0ea}
.panel .box{margin:12px 0;padding:10px 12px;background:#0e1220;border-radius:10px;text-align:left}
.panel .box b{display:block;font-size:12px;color:#8fa0d8;margin-bottom:4px}
.panel ul{padding-left:1.2em;font-size:13px;line-height:1.6;color:#c9d0ea}
.panel .score{font-size:40px;font-weight:800;margin:6px 0}
.panel .best{font-size:13px;color:#8fa0d8}
.btn{display:inline-block;margin:10px 6px 0;padding:12px 22px;border-radius:999px;border:0;
  background:#5b7cff;color:#fff;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sub{background:#2c3554}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#pad{display:none;height:190px;flex:none;position:relative;touch-action:none}
#pad.show{display:block}
.pbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(120,140,220,.18);border:2px solid rgba(160,180,255,.35);color:#dfe6ff;
  font-weight:800;font-size:18px;touch-action:none}
.pbtn.on{background:rgba(120,150,255,.55)}
.pbtn.dir{border-radius:14px;width:58px;height:58px;font-size:20px}
.pbtn.act{width:78px;height:78px;font-size:15px;text-align:center;line-height:1.1;padding:4px}
#topbar{flex:none;height:38px;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 8px}

  padding:6px 10px;border-radius:999px;text-decoration:none;cursor:pointer}

<body>
<div id="app">
<div id="topbar">

</div>
<script type="application/json" id="meta">{"id": "20261124-140403-gemini-flash", "title": "ネオンバウンド", "summary": "煌めく夜の摩天楼を駆け抜けろ！ビルの壁で反射するレーザーを駆使して、正面無敵の暴走ボスを撃破する跳弾シューティング。", "rules": ["画面ドラッグで自機（サイバーバイク）を自由に移動、ショットは自動連射", "左右のビルの壁に弾を当てると斜めに反射し、攻撃力と弾速がアップ", "道中の敵ドローンを倒しながら夜の高速道路を進み、最奥のボスを目指す", "ボスは正面シールドを展開！壁の反射弾を側面や背後に撃ち込んで撃破せよ"], "controls": {"スマホ": "画面を指でドラッグして自機を移動（指の相対移動で自機が隠れません）。", "PC": "マウスドラッグまたは矢印キー（WASD）で自機を移動。"}, "cfg": {"mode": "2d", "w": 360, "h": 640, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {
  if (__G.state !== "playing") return;
  const p = typeof force === "boolean" ? force : !__G.paused;
  __G.paused = p;
  if (p) {
    overlay.innerHTML = `<div class="panel"><h2>一時停止中</h2><p class="blink">${IS_TOUCH ? "タップで再開" : "クリック / スペースで再開"}</p></div>`;
    overlay.classList.remove("hidden");
    Input._clear();
  } else {
    overlay.classList.add("hidden");
    __last = performance.now();

$("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); Sound.unlock(); Sound.toggle(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) togglePause(true); });

function __init3D() {

function startGame() {

  Input._clear();
  __G.score = 0; __G.frame = 0; __G.paused = false; __G.plays++;
  api.time = 0; api.hud("");
  if (CFG.mode === "3d") {
    api.scene = new THREE.Scene();
    api.camera = new THREE.PerspectiveCamera(60, CFG.w / CFG.h, 0.1, 1000);

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.p = { x: 180, y: 520, w: 22, h: 30, hp: 3, maxHp: 3, inv: 0, shootTimer: 0 };
    this.bullets = [];
    this.enemyBullets = [];
    this.enemies = [];
    this.particles = [];
    this.bgLines = [];
    for (let i = 0; i < 24; i++) {
      this.bgLines.push({
        x: api.util.rand(40, 320),
        y: api.util.rand(0, 640),
        len: api.util.rand(20, 60),
        spd: api.util.rand(300, 500),
        color: api.util.choice(['#00f0ff', '#ff0077', '#334466'])
      });
    }
    this.signs = [];
    for (let i = 0; i < 8; i++) {
      this.signs.push({
        side: i % 2 === 0 ? 0 : 1,
        y: i * 90,
        text: api.util.choice(['NEON', 'CYBER', 'TOKYO', 'ZONE', 'FAST', '88']),
        color: api.util.choice(['#00ffff', '#ff0055', '#ffe600'])
      });
    }

    this.spawnTimer = 2.0;
    this.boss = null;
    this.bossWarning = false;
    this.warningTimer = 0;
    this.stageTime = 0;
    this.shake = 0;
    this.clearTimer = 0;
  },

  update(dt) {
    const api = this.api;
    this.stageTime += dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 25);

    // プレイヤー無敵
    if (this.p.inv > 0) this.p.inv -= dt;

    // 自機移動（ドラッグ＆キーボード）
    let moveX = 0;
    let moveY = 0;
    const speed = 260;

    if (api.input.left) moveX -= 1;
    if (api.input.right) moveX += 1;
    if (api.input.up) moveY -= 1;
    if (api.input.down) moveY += 1;

    if (moveX !== 0 || moveY !== 0) {
      const len = Math.hypot(moveX, moveY);
      this.p.x += (moveX / len) * speed * dt;
      this.p.y += (moveY / len) * speed * dt;
    }

    if (api.input.pointer.down) {
      this.p.x += api.input.pointer.dx * 1.15;
      this.p.y += api.input.pointer.dy * 1.15;
    }

    // 移動範囲制限（左右壁30px）
    this.p.x = api.util.clamp(this.p.x, 44, 316);
    this.p.y = api.util.clamp(this.p.y, 80, 600);

    // 背景更新
    for (let b of this.bgLines) {
      b.y += b.spd * dt;
      if (b.y > 660) {
        b.y = -60;
        b.x = api.util.rand(40, 320);
      }
    }
    for (let s of this.signs) {
      s.y += 380 * dt;
      if (s.y > 660) s.y = -40;
    }

    // 自動射撃（斜め2方向）
    this.p.shootTimer -= dt;
    if (this.p.shootTimer <= 0) {
      this.p.shootTimer = 0.12;
      const angles = [-0.38, 0.38];
      const spd = 500;
      for (let a of angles) {
        this.bullets.push({
          x: this.p.x,
          y: this.p.y - 12,
          vx: Math.sin(a) * spd,
          vy: -Math.cos(a) * spd,
          r: 5,
          dmg: 1,
          bounced: false,
          color: '#00ffff'
        });
      }
      api.sound.tone(600, 0.04, 'square', 0.08, 900);
    }

    // 自機弾の挙動（反射システム）
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // 左右壁（30px, 330px）での反射
      if (b.x <= 34 && b.vx < 0) {
        b.x = 34;
        b.vx = -b.vx * 1.25;
        b.vy *= 1.1;
        this.onBulletBounce(b);
      } else if (b.x >= 326 && b.vx > 0) {
        b.x = 326;
        b.vx = -b.vx * 1.25;
        b.vy *= 1.1;
        this.onBulletBounce(b);
      }

      // 上端反射
      if (b.y <= 10 && b.vy < 0 && b.bounced) {
        b.y = 10;
        b.vy = -b.vy;
        this.spawnSparks(b.x, b.y, '#ff0077', 4);
      }

      // 画面外削除
      if (b.y < -30 || b.y > 670 || b.x < 10 || b.x > 350) {
        this.bullets.splice(i, 1);
      }
    }

    // スポーン制御
    if (this.stageTime < 20) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this.spawnTimer = api.util.rand(1.2, 1.8);
        const type = Math.random() < 0.45 ? 'shield' : 'drone';
        this.enemies.push({
          type: type,
          x: api.util.rand(70, 290),
          y: -30,
          w: type === 'shield' ? 30 : 22,
          h: type === 'shield' ? 24 : 22,
          hp: type === 'shield' ? 2 : 1,
          maxHp: type === 'shield' ? 2 : 1,
          vx: api.util.rand(-30, 30),
          vy: type === 'shield' ? 90 : 130,
          shield: type === 'shield',
          shootCd: api.util.rand(1.0, 2.0)
        });
      }
    } else if (this.stageTime >= 20 && this.stageTime < 24 && !this.boss && !this.bossWarning) {
      this.bossWarning = true;
      this.warningTimer = 3.5;
      api.sound.tone(300, 0.4, 'sawtooth', 0.3, 150);
    } else if (this.stageTime >= 24 && !this.boss) {
      this.bossWarning = false;
      this.boss = {
        x: 180,
        y: -70,
        targetY: 130,
        w: 90,
        h: 64,
        hp: 55,
        maxHp: 55,
        state: 'enter',
        timer: 0,
        dir: 1,
        shieldW: 66,
        shieldH: 14
      };
      api.sound.tone(200, 0.5, 'sawtooth', 0.4, 500);
    }

    // ボス更新
    if (this.boss) {
      const b = this.boss;
      b.timer += dt;
      if (b.state === 'enter') {
        b.y = api.util.lerp(b.y, b.targetY, dt * 2.5);
        if (Math.abs(b.y - b.targetY) < 2) {
          b.y = b.targetY;
          b.state = 'fight';
        }
      } else {
        // ボス左右往復
        b.x += b.dir * 65 * dt;
        if (b.x > 260) { b.x = 260; b.dir = -1; }
        if (b.x < 100) { b.x = 100; b.dir = 1; }

        // ボス攻撃
        const attackInterval = b.hp < 25 ? 1.0 : 1.5;
        if (b.timer > attackInterval) {
          b.timer = 0;
          api.sound.tone(440, 0.1, 'square', 0.15, 220);
          const shots = b.hp < 25 ? 5 : 3;
          for (let i = 0; i < shots; i++) {
            const spread = (i - (shots - 1) / 2) * 0.28;
            this.enemyBullets.push({
              x: b.x,
              y: b.y + 24,
              vx: Math.sin(spread) * 190,
              vy: Math.cos(spread) * 190,
              r: 5,
              wallBounce: b.hp < 25,
              color: '#ff2255'
            });
          }
        }
      }
    }

    // 雑魚敵更新
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      e.x += e.vx * dt;
      e.y += e.vy * dt;
      if (e.x < 45 || e.x > 315) e.vx = -e.vx;

      // 敵射撃
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        e.shootCd = 2.5;
        this.enemyBullets.push({
          x: e.x,
          y: e.y + 10,
          vx: 0,
          vy: 200,
          r: 4,
          wallBounce: false,
          color: '#ff0055'
        });
      }

      // 自機衝突
      if (this.p.inv <= 0 && api.util.rectHit(
        { x: this.p.x - 10, y: this.p.y - 12, w: 20, h: 24 },
        { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h }
      )) {
        this.hitPlayer();
        e.hp = 0;
      }

      if (e.y > 680 || e.hp <= 0) {
        if (e.hp <= 0) {
          api.addScore(e.type === 'shield' ? 250 : 100);
          this.spawnExplosion(e.x, e.y, e.type === 'shield' ? '#ffe600' : '#00ffff');
          api.sound.play('explode');
        }
        this.enemies.splice(i, 1);
      }
    }

    // 自機弾と敵の当たり判定
    for (let bi = this.bullets.length - 1; bi >= 0; bi--) {
      const b = this.bullets[bi];
      let bulletHit = false;

      // ボス判定
      if (this.boss && this.boss.state === 'fight') {
        const bs = this.boss;
        // シールド判定（ボスの正面下部）
        const shieldBox = {
          x: bs.x - bs.shieldW / 2,
          y: bs.y + 10,
          w: bs.shieldW,
          h: bs.shieldH
        };

        if (api.util.rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, shieldBox)) {
          // 正面からの弾はブロック！
          bulletHit = true;
          this.spawnSparks(b.x, b.y, '#00ffff', 5);
          api.sound.tone(800, 0.05, 'triangle', 0.1, 100);
        } else {
          // ボス本体（コア）判定：背面・側面に回り込んだ弾が届く
          const bodyBox = {
            x: bs.x - bs.w / 2,
            y: bs.y - bs.h / 2,
            w: bs.w,
            h: bs.h - 10
          };
          if (api.util.rectHit({ x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 }, bodyBox)) {
            bulletHit = true;
            // 反射弾は特大ダメージ
            const dmg = b.bounced ? 2 : 1;
            bs.hp -= dmg;
            this.spawnSparks(b.x, b.y, b.bounced ? '#ff0077' : '#ffffff', 8);
            api.sound.play('hit');
            this.shake = b.bounced ? 6 : 2;

            if (bs.hp <= 0) {
              api.addScore(5000);
              this.spawnExplosion(bs.x, bs.y, '#ff0077');
              this.spawnExplosion(bs.x - 20, bs.y - 10, '#00ffff');
              this.spawnExplosion(bs.x + 20, bs.y + 10, '#ffe600');
              api.sound.play('explode');
              this.boss = null;
              this.clearTimer = 2.0;
            }
          }
        }
      }

      // 雑魚敵判定
      if (!bulletHit) {
        for (let ei = this.enemies.length - 1; ei >= 0; ei--) {
          const e = this.enemies[ei];
          const hit = api.util.rectHit(
            { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 },
            { x: e.x - e.w / 2, y: e.y - e.h / 2, w: e.w, h: e.h }
          );

          if (hit) {
            bulletHit = true;
            if (e.shield && !b.bounced) {
              // シールド持ちは非反射弾を防ぐ
              this.spawnSparks(b.x, b.y, '#00ffff', 4);
              api.sound.tone(900, 0.04, 'triangle', 0.1, 150);
            } else {
              e.hp -= b.dmg;
              this.spawnSparks(b.x, b.y, '#ff0077', 6);
              api.sound.play('hit');
            }
            break;
          }
        }
      }

      if (bulletHit) {
        this.bullets.splice(bi, 1);
      }
    }

    // 敵弾更新
    for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
      const eb = this.enemyBullets[i];
      eb.x += eb.vx * dt;
      eb.y += eb.vy * dt;

      // ボスの反射弾ギミック
      if (eb.wallBounce) {
        if ((eb.x <= 34 && eb.vx < 0) || (eb.x >= 326 && eb.vx > 0)) {
          eb.vx = -eb.vx;
          this.spawnSparks(eb.x, eb.y, '#ff2255', 4);
          api.sound.tone(500, 0.05, 'triangle', 0.1);
        }
      }

      // プレイヤーヒット
      if (this.p.inv <= 0 && api.util.circleHit({ x: eb.x, y: eb.y, r: eb.r }, { x: this.p.x, y: this.p.y, r: 8 })) {
        this.hitPlayer();
        this.enemyBullets.splice(i, 1);
        continue;
      }

      if (eb.y > 670 || eb.y < -30 || eb.x < 10 || eb.x > 350) {
        this.enemyBullets.splice(i, 1);
      }
    }

    // パーティクル
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // クリアディレイ
    if (this.clearTimer > 0) {
      this.clearTimer -= dt;
      if (this.clearTimer <= 0) {
        api.clear();
      }
    }
  },

  onBulletBounce(b) {
    if (!b.bounced) {
      b.bounced = true;
      b.dmg = 2;
      b.color = '#ff0077';
      this.api.addScore(20);
      this.api.sound.tone(1000, 0.08, 'triangle', 0.25, 1400);
      this.spawnSparks(b.x, b.y, '#ff0077', 8);
    } else {
      this.spawnSparks(b.x, b.y, '#ff77aa', 4);
      this.api.sound.tone(1200, 0.05, 'triangle', 0.15, 1600);
    }
  },

  hitPlayer() {
    this.p.hp--;
    this.p.inv = 1.5;
    this.shake = 10;
    this.api.sound.play('hurt');
    this.spawnExplosion(this.p.x, this.p.y, '#ff0055');
    if (this.p.hp <= 0) {
      this.api.sound.play('over');
      this.api.gameOver();
    }
  },

  spawnSparks(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = this.api.util.rand(60, 180);
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        color: color,
        life: this.api.util.rand(0.2, 0.4),
        maxLife: 0.4,
        size: this.api.util.rand(2, 4)
      });
    }
  },

  spawnExplosion(x, y, color) {
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = this.api.util.rand(40, 240);
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        color: color,
        life: this.api.util.rand(0.3, 0.7),
        maxLife: 0.7,
        size: this.api.util.rand(3, 7)
      });
    }
  },

  draw(ctx) {
    ctx.save();
    if (this.shake > 0) {
      const sx = (Math.random() - 0.5) * this.shake;
      const sy = (Math.random() - 0.5) * this.shake;
      ctx.translate(sx, sy);
    }

    // 背景：夜のハイウェイ
    ctx.fillStyle = '#060814';
    ctx.fillRect(0, 0, 360, 640);

    // 道路レーン
    ctx.strokeStyle = '#141c38';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(110, 0); ctx.lineTo(110, 640);
    ctx.moveTo(180, 0); ctx.lineTo(180, 640);
    ctx.moveTo(250, 0); ctx.lineTo(250, 640);
    ctx.stroke();

    // 背景光ライン
    for (let b of this.bgLines) {
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.4;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y + b.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1.0;

    // 左右ビル壁（反射ゾーン）
    this.drawCityWalls(ctx);

    // 雑魚敵
    for (let e of this.enemies) {
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.type === 'drone') {
        // ドローン
        ctx.fillStyle = '#ff2a7a';
        ctx.beginPath();
        ctx.moveTo(0, 10);
        ctx.lineTo(-11, -8);
        ctx.lineTo(0, -3);
        ctx.lineTo(11, -8);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else {
        // シールドビット
        ctx.fillStyle = '#9933ff';
        ctx.fillRect(-12, -8, 24, 16);
        // 正面シールド
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-15, 10);
        ctx.lineTo(15, 10);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ボスメガフロート
    if (this.boss) {
      this.drawBoss(ctx, this.boss);
    }

    // 敵弾
    for (let eb of this.enemyBullets) {
      ctx.fillStyle = eb.color;
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // 自機弾
    for (let b of this.bullets) {
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      // 跳弾グロー
      if (b.bounced) {
        ctx.strokeStyle = '#ffe6ff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // パーティクル
    for (let pt of this.particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.life / pt.maxLife;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1.0;

    // 自機（サイバーバイク）
    if (this.p.inv <= 0 || Math.floor(this.stageTime * 15) % 2 === 0) {
      this.drawPlayer(ctx, this.p.x, this.p.y);
    }

    // WARNING 表示
    if (this.bossWarning) {
      ctx.fillStyle = Math.floor(this.stageTime * 6) % 2 === 0 ? '#ff0055' : '#ffe600';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('! WARNING: BOSS DETECTED !', 180, 220);
      ctx.font = '12px sans-serif';
      ctx.fillText('壁反射ショットで弱点背面を狙え！', 180, 245);
    }

    // HUD
    this.drawHUD(ctx);

    ctx.restore();
  },

  drawCityWalls(ctx) {
    // 左ビル
    ctx.fillStyle = '#0b1021';
    ctx.fillRect(0, 0, 30, 640);
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(30, 0); ctx.lineTo(30, 640);
    ctx.stroke();

    // 右ビル
    ctx.fillRect(330, 0, 30, 640);
    ctx.strokeStyle = '#ff0077';
    ctx.beginPath();
    ctx.moveTo(330, 0); ctx.lineTo(330, 640);
    ctx.stroke();

    // ビル窓グリッド＆サイン
    for (let s of this.signs) {
      const rx = s.side === 0 ? 4 : 334;
      ctx.fillStyle = s.color;
      ctx.globalAlpha = 0.7;
      ctx.font = 'bold 9px monospace';
      ctx.save();
      ctx.translate(rx + 11, s.y);
      ctx.rotate(Math.PI / 2);
      ctx.fillText(s.text, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1.0;
  },

  drawPlayer(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);

    // エンジン噴射
    const flameH = 8 + Math.random() * 8;
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.moveTo(-6, 14);
    ctx.lineTo(6, 14);
    ctx.lineTo(0, 14 + flameH);
    ctx.closePath();
    ctx.fill();

    // ボディ
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(9, 6);
    ctx.lineTo(5, 14);
    ctx.lineTo(-5, 14);
    ctx.lineTo(-9, 6);
    ctx.closePath();
    ctx.fill();

    // ネオンライン
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // キャノピー
    ctx.fillStyle = '#ff0077';
    ctx.fillRect(-3, -7, 6, 8);

    ctx.restore();
  },

  drawBoss(ctx, b) {
    ctx.save();
    ctx.translate(b.x, b.y);

    // 背面弱点コア
    ctx.fillStyle = Math.floor(this.stageTime * 8) % 2 === 0 ? '#ff0055' : '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -16, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 2;
    ctx.stroke();

    // メインボディ
    ctx.fillStyle = '#16192e';
    ctx.beginPath();
    ctx.moveTo(0, 20);
    ctx.lineTo(b.w / 2, 0);
    ctx.lineTo(b.w / 2 - 8, -b.h / 2);
    ctx.lineTo(-b.w / 2 + 8, -b.h / 2);
    ctx.lineTo(-b.w / 2, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#ff0077';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 正面電磁シールド
    const pulse = Math.sin(this.stageTime * 10) * 2;
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-b.shieldW / 2, 14 + pulse);
    ctx.lineTo(b.shieldW / 2, 14 + pulse);
    ctx.stroke();

    // シールド発光エフェクト
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
    ctx.lineWidth = 8;
    ctx.stroke();

    // ボスHPバー
    const hpRatio = Math.max(0, b.hp / b.maxHp);
    ctx.fillStyle = '#220011';
    ctx.fillRect(-40, -42, 80, 6);
    ctx.fillStyle = '#ff0055';
    ctx.fillRect(-40, -42, 80 * hpRatio, 6);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.strokeRect(-40, -42, 80, 6);

    ctx.restore();
  },

  drawHUD(ctx) {
    // スコア
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE ${this.api.score}`, 38, 24);

    // HP表示（サイバーアイコン）
    ctx.textAlign = 'right';
    for (let i = 0; i < this.p.maxHp; i++) {
      ctx.fillStyle = i < this.p.hp ? '#00ffff' : '#334455';
      ctx.fillRect(322 - i * 16, 14, 12, 10);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(322 - i * 16, 14, 12, 10);
    }

    // 反射ヒントガイド
    if (this.stageTime < 5) {
      ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('壁に弾を当てて反射パワーアップ！', 180, 615);
    }
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
