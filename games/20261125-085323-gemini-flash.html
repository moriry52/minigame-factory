#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

#screen{display:block;background:#000;touch-action:none;image-rendering:auto}

<div id="app">

</div>
<script type="application/json" id="meta">{"id": "20261125-085323-gemini-flash", "title": "ネオンフリップ", "summary": "自機が中央ラインをまたぐと世界の重力が上下反転！迫る障害物を天井や床へ叩き落として粉砕し、ジェムを回収する爽快サイバーアクション。", "rules": ["ドラッグで自機を上下左右に動かし、右から迫る障害物を避けてジェムを集める。", "自機が画面中央の境界線を越えると世界の重力が反転し、物体が一斉に天井や床へ落下する。", "迫る赤いトゲブロックは、重力反転で上下の壁に激突させて破壊するとスコア獲得！", "制限時間は3分。被弾ペナルティを避けつつコンボを繋いでハイスコアを目指せ。"], "controls": {"スマホ": "画面をドラッグ（指のスライド量に連動）して自機を移動させます。", "PC": "マウスのドラッグ、または矢印キー（上下左右）で自機を移動させます。"}, "cfg": {"mode": "2d", "w": 640, "h": 360, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;

    api.scene = new THREE.Scene();

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.player = {
      x: 100,
      y: 180,
      r: 12,
      shield: false,
      invuln: 0,
      tail: []
    };
    this.gravity = 1; // 1: 下, -1: 上
    this.timeLeft = 180; // 3分
    this.combo = 0;
    this.comboTimer = 0;
    this.shake = 0;
    this.flash = 0;
    this.bgOffset = 0;

    this.spikes = [];
    this.gems = [];
    this.items = [];
    this.particles = [];
    this.floatingTexts = [];

    this.spawnTimer = 1.0;
    this.gemTimer = 1.5;
    this.itemTimer = 18.0;

    // 上下の危険壁（デンジャーゾーン）の厚み
    this.wallHeight = 28;
  },

  update(dt) {
    const api = this.api;
    const input = api.input;
    const p = this.player;

    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      api.sound.play('clear');
      api.clear();
      return;
    }

    // 進行度と難易度
    const progress = (180 - this.timeLeft) / 180; // 0..1
    const baseSpeed = 160 + progress * 130;

    // 自機移動（ドラッグ相対値 + キー入力）
    let mx = 0;
    let my = 0;
    if (input.pointer.down) {
      mx += input.pointer.dx;
      my += input.pointer.dy;
    }
    const keySpeed = 300 * dt;
    if (input.left) mx -= keySpeed;
    if (input.right) mx += keySpeed;
    if (input.up) my -= keySpeed;
    if (input.down) my += keySpeed;

    // 自機の可動域をデンジャー壁の内側に制限（天井・床の安全マージン）
    const minY = this.wallHeight + p.r + 2;
    const maxY = api.H - this.wallHeight - p.r - 2;
    p.x = api.util.clamp(p.x + mx, 30, api.W - 30);
    p.y = api.util.clamp(p.y + my, minY, maxY);

    // 壁（デンジャーゾーン）に極端に近接した場合の電撃ダメージ
    if (p.invuln <= 0) {
      const nearCeil = p.y <= minY + 4;
      const nearFloor = p.y >= maxY - 4;
      if (nearCeil || nearFloor) {
        if (p.shield) {
          p.shield = false;
          p.invuln = 1.0;
          this.shake = 0.2;
          api.sound.play('hurt');
          this.addFloatingText('SHIELD BREAK!', p.x, p.y + (nearCeil ? 25 : -25), '#00ffff');
        } else {
          p.invuln = 1.0;
          this.combo = 0;
          const loss = Math.min(api.score, 300);
          api.addScore(-loss);
          this.shake = 0.3;
          api.sound.play('hurt');
          this.addFloatingText(`WALL SHOCK! -${loss}`, p.x, p.y + (nearCeil ? 25 : -25), '#ff0055');
        }
        // 押し戻し
        p.y += nearCeil ? 15 : -15;
        // 電撃スパーク
        for (let k = 0; k < 10; k++) {
          this.particles.push({
            x: p.x + api.util.rand(-10, 10),
            y: nearCeil ? this.wallHeight : api.H - this.wallHeight,
            vx: api.util.rand(-100, 100),
            vy: nearCeil ? api.util.rand(50, 150) : api.util.rand(-150, -50),
            life: 0.3,
            maxLife: 0.3,
            color: '#ffff00',
            size: 3
          });
        }
      }
    }

    // 軌跡
    p.tail.push({ x: p.x, y: p.y });
    if (p.tail.length > 8) p.tail.shift();

    // 重力判定 (中央 Y=180)
    // 境界を越えると重力反転 (上: -1, 下: 1)
    const newGrav = p.y < 180 ? -1 : 1;
    if (newGrav !== this.gravity) {
      this.gravity = newGrav;
      this.flash = 0.25;
      api.sound.tone(newGrav === -1 ? 180 : 360, 0.18, 'sawtooth', 0.25, newGrav === -1 ? 360 : 180);
      for (let i = 0; i < 16; i++) {
        this.particles.push({
          x: api.util.rand(0, api.W),
          y: 180,
          vx: api.util.rand(-60, 60),
          vy: this.gravity * api.util.rand(60, 220),
          life: 0.35,
          maxLife: 0.35,
          color: this.gravity === -1 ? '#00e5ff' : '#ff0077',
          size: 3
        });
      }
    }

    // 無敵タイマー
    if (p.invuln > 0) p.invuln -= dt;

    // コンボタイマー
    if (this.comboTimer > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.combo = 0;
      }
    }

    // 背景スクロール
    this.bgOffset = (this.bgOffset + baseSpeed * dt) % 40;

    // スポーン処理（開始3秒は安全）
    if (api.time > 3.0) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0) {
        this.spawnTimer = api.util.rand(0.8, 1.4) - progress * 0.4;
        const hp = (progress > 0.4 && Math.random() < 0.35) ? 2 : 1;
        this.spikes.push({
          x: api.W + 30,
          // 中央付近から出現し、プレイヤーが反転させないと壁に届かない
          y: api.util.rand(100, api.H - 100),
          vx: -baseSpeed * api.util.rand(0.95, 1.25),
          vy: 0,
          w: hp === 2 ? 34 : 26,
          hp: hp,
          rot: 0
        });
      }

      this.gemTimer -= dt;
      if (this.gemTimer <= 0) {
        this.gemTimer = api.util.rand(1.2, 2.2);
        this.gems.push({
          x: api.W + 20,
          y: api.util.rand(70, api.H - 70),
          vx: -baseSpeed * 0.85,
          vy: api.util.rand(-40, 40),
          t: api.util.rand(0, Math.PI * 2)
        });
      }

      this.itemTimer -= dt;
      if (this.itemTimer <= 0) {
        this.itemTimer = api.util.rand(22, 32);
        if (!p.shield) {
          this.items.push({
            x: api.W + 20,
            y: api.util.rand(90, api.H - 90),
            vx: -baseSpeed * 0.75,
            vy: 0
          });
        }
      }
    }

    // スパイク更新
    const gravForce = 950;
    for (let i = this.spikes.length - 1; i >= 0; i--) {
      const s = this.spikes[i];
      s.x += s.vx * dt;
      s.vy += this.gravity * gravForce * dt;
      s.y += s.vy * dt;
      s.rot += (s.vx < 0 ? -1 : 1) * 3 * dt;

      // 上下の壁に衝突判定
      const hitCeil = s.y <= this.wallHeight + s.w * 0.4;
      const hitFloor = s.y >= api.H - this.wallHeight - s.w * 0.4;

      if (hitCeil || hitFloor) {
        // 重力反転により逆側の壁から十分加速された衝突（高速激突）のみ破壊！
        // 居座りで壁際を低速移動しているだけでは壊れない
        const impactSpeed = Math.abs(s.vy);
        const canSmash = impactSpeed >= 320;

        if (canSmash) {
          s.hp--;
          this.shake = 0.22;
          if (s.hp <= 0) {
            // クラッシュ粉砕！
            this.combo++;
            this.comboTimer = 3.0;
            const pts = 200 * this.combo;
            api.addScore(pts);
            this.addFloatingText(`+${pts} (${this.combo} COMBO!)`, s.x, hitCeil ? 50 : api.H - 50, '#ff0055');
            api.sound.play('explode');

            for (let k = 0; k < 16; k++) {
              this.particles.push({
                x: s.x,
                y: hitCeil ? this.wallHeight : api.H - this.wallHeight,
                vx: api.util.rand(-140, 140),
                vy: hitCeil ? api.util.rand(60, 260) : api.util.rand(-260, -60),
                life: 0.45,
                maxLife: 0.45,
                color: '#ff0055',
                size: api.util.rand(3, 7)
              });
            }
            this.spikes.splice(i, 1);
            continue;
          } else {
            // 耐久残ありの強烈バウンド
            s.vy = hitCeil ? 240 : -240;
            s.y = hitCeil ? this.wallHeight + s.w * 0.5 : api.H - this.wallHeight - s.w * 0.5;
            api.sound.tone(220, 0.1, 'triangle', 0.25);
          }
        } else {
          // 速度不足の接触（居座り放置時など）：壊れず跳ね返って画面内に残る
          s.vy = hitCeil ? 140 : -140;
          s.y = hitCeil ? this.wallHeight + s.w * 0.5 : api.H - this.wallHeight - s.w * 0.5;
        }
      }

      // 自機との衝突
      if (p.invuln <= 0 && api.util.dist(p.x, p.y, s.x, s.y) < p.r + s.w * 0.45) {
        if (p.shield) {
          p.shield = false;
          p.invuln = 1.0;
          this.shake = 0.25;
          api.sound.play('hurt');
          this.addFloatingText('SHIELD BREAK!', p.x, p.y - 20, '#00ffff');
        } else {
          p.invuln = 1.2;
          this.combo = 0;
          const loss = Math.min(api.score, 500);
          api.addScore(-loss);
          this.shake = 0.35;
          api.sound.play('hurt');
          this.addFloatingText(`-${loss} PTS!`, p.x, p.y - 20, '#ff2222');
        }
        for (let k = 0; k < 12; k++) {
          this.particles.push({
            x: p.x,
            y: p.y,
            vx: api.util.rand(-120, 120),
            vy: api.util.rand(-120, 120),
            life: 0.4,
            maxLife: 0.4,
            color: '#fff',
            size: 4
          });
        }
      }

      if (s.x < -40) this.spikes.splice(i, 1);
    }

    // ジェム更新（壁に張り付かず、中央エリアをバウンド・浮遊する）
    for (let i = this.gems.length - 1; i >= 0; i--) {
      const g = this.gems[i];
      g.x += g.vx * dt;
      g.vy += this.gravity * 360 * dt;
      g.y += g.vy * dt;
      g.t += dt * 4;

      // 上下の壁で跳ね返る（張り付き防止）
      if (g.y <= this.wallHeight + 14) {
        g.y = this.wallHeight + 14;
        g.vy = Math.abs(g.vy) * 0.75 + 40;
      } else if (g.y >= api.H - this.wallHeight - 14) {
        g.y = api.H - this.wallHeight - 14;
        g.vy = -Math.abs(g.vy) * 0.75 - 40;
      }

      if (api.util.dist(p.x, p.y, g.x, g.y) < p.r + 14) {
        api.addScore(100);
        api.sound.tone(620 + (this.combo % 8) * 80, 0.1, 'sine', 0.15);
        this.addFloatingText('+100', g.x, g.y, '#ffff00');
        for (let k = 0; k < 8; k++) {
          this.particles.push({
            x: g.x,
            y: g.y,
            vx: api.util.rand(-70, 70),
            vy: api.util.rand(-70, 70),
            life: 0.3,
            maxLife: 0.3,
            color: '#ffea00',
            size: 3
          });
        }
        this.gems.splice(i, 1);
        continue;
      }
      if (g.x < -20) this.gems.splice(i, 1);
    }

    // シールドアイテム更新
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.x += it.vx * dt;
      it.vy += this.gravity * 260 * dt;
      it.y += it.vy * dt;

      // アイテムも壁で跳ね返る
      if (it.y <= this.wallHeight + 16) {
        it.y = this.wallHeight + 16;
        it.vy = 80;
      } else if (it.y >= api.H - this.wallHeight - 16) {
        it.y = api.H - this.wallHeight - 16;
        it.vy = -80;
      }

      if (api.util.dist(p.x, p.y, it.x, it.y) < p.r + 16) {
        p.shield = true;
        api.sound.play('powerup');
        this.addFloatingText('SHIELD GET!', it.x, it.y, '#00ffff');
        this.items.splice(i, 1);
        continue;
      }
      if (it.x < -30) this.items.splice(i, 1);
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }

    // フローティングテキスト更新
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y -= 35 * dt;
      ft.life -= dt;
      if (ft.life <= 0) this.floatingTexts.splice(i, 1);
    }

    if (this.shake > 0) this.shake -= dt;
    if (this.flash > 0) this.flash -= dt;
  },

  addFloatingText(text, x, y, color) {
    this.floatingTexts.push({ text, x, y, color, life: 0.7, maxLife: 0.7 });
  },

  draw(ctx) {
    const api = this.api;
    const p = this.player;

    ctx.save();

    // 画面揺れ
    if (this.shake > 0) {
      const sx = api.util.rand(-5, 5);
      const sy = api.util.rand(-5, 5);
      ctx.translate(sx, sy);
    }

    // 背景描画
    ctx.fillStyle = '#060714';
    ctx.fillRect(0, 0, api.W, api.H);

    // ネオングリッド (上半分シアン、下半分マゼンタ)
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
    for (let x = -this.bgOffset; x < api.W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, this.wallHeight);
      ctx.lineTo(x, 180);
      ctx.stroke();
    }
    for (let y = this.wallHeight; y < 180; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(api.W, y);
      ctx.stroke();
    }

    ctx.strokeStyle = 'rgba(255, 0, 180, 0.1)';
    for (let x = -this.bgOffset; x < api.W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 180);
      ctx.lineTo(x, api.H - this.wallHeight);
      ctx.stroke();
    }
    for (let y = 180; y <= api.H - this.wallHeight; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(api.W, y);
      ctx.stroke();
    }

    // 中央境界パルスライン (Y=180)
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.shadowColor = this.gravity === -1 ? '#00ffff' : '#ff00bb';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(0, 180);
    ctx.lineTo(api.W, 180);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // 重力方向サイン
    ctx.fillStyle = this.gravity === -1 ? 'rgba(0,255,255,0.22)' : 'rgba(255,0,180,0.22)';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const arrow = this.gravity === -1 ? '▲ GRAVITY: UP ▲' : '▼ GRAVITY: DOWN ▼';
    ctx.fillText(arrow, api.W / 2, this.gravity === -1 ? 100 : 260);

    // 上下デンジャー壁（触れると電撃ダメージを受ける危険エリア）
    // 天井壁
    ctx.fillStyle = '#110519';
    ctx.fillRect(0, 0, api.W, this.wallHeight);
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, this.wallHeight);
    ctx.lineTo(api.W, this.wallHeight);
    ctx.stroke();

    // 天井の危険トゲハザード描画
    ctx.fillStyle = '#ff0055';
    for (let x = 0; x < api.W; x += 16) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 8, this.wallHeight - 2);
      ctx.lineTo(x + 16, 0);
      ctx.fill();
    }

    // 床壁
    ctx.fillStyle = '#110519';
    ctx.fillRect(0, api.H - this.wallHeight, api.W, this.wallHeight);
    ctx.strokeStyle = '#ff0055';
    ctx.beginPath();
    ctx.moveTo(0, api.H - this.wallHeight);
    ctx.lineTo(api.W, api.H - this.wallHeight);
    ctx.stroke();

    // 床の危険トゲハザード描画
    for (let x = 0; x < api.W; x += 16) {
      ctx.beginPath();
      ctx.moveTo(x, api.H);
      ctx.lineTo(x + 8, api.H - this.wallHeight + 2);
      ctx.lineTo(x + 16, api.H);
      ctx.fill();
    }

    // シールドアイテム描画
    for (const it of this.items) {
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('S', 0, 1);
      ctx.restore();
    }

    // ジェム描画
    for (const g of this.gems) {
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.t);
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffff33';
      ctx.beginPath();
      ctx.moveTo(0, -9);
      ctx.lineTo(7, 0);
      ctx.lineTo(0, 9);
      ctx.lineTo(-7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // スパイク描画
    for (const s of this.spikes) {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 10;
      ctx.fillStyle = s.hp === 2 ? '#ff5500' : '#ff0044';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;

      const hw = s.w / 2;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const ang = (i * Math.PI) / 2;
        ctx.lineTo(Math.cos(ang) * hw, Math.sin(ang) * hw);
        const ang2 = ang + Math.PI / 4;
        ctx.lineTo(Math.cos(ang2) * (hw * 0.4), Math.sin(ang2) * (hw * 0.4));
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (s.hp === 2) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('2', 0, 1);
      }
      ctx.restore();
    }

    // 自機の軌跡
    for (let i = 0; i < p.tail.length; i++) {
      const t = p.tail[i];
      const alpha = ((i + 1) / p.tail.length) * 0.4;
      ctx.fillStyle = p.y < 180 ? `rgba(0,255,255,${alpha})` : `rgba(255,0,200,${alpha})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, p.r * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    // 自機本体
    if (p.invuln <= 0 || Math.floor(api.time * 20) % 2 === 0) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.shadowColor = p.y < 180 ? '#00ffff' : '#ff00ff';
      ctx.shadowBlur = 15;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = p.y < 180 ? '#00ffff' : '#ff00ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -p.r);
      ctx.lineTo(p.r, 0);
      ctx.lineTo(0, p.r);
      ctx.lineTo(-p.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (p.shield) {
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, p.r + 6, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // パーティクル
    for (const pt of this.particles) {
      const alpha = pt.life / pt.maxLife;
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = alpha;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1.0;

    // フローティングテキスト
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px sans-serif';
    for (const ft of this.floatingTexts) {
      ctx.fillStyle = ft.color;
      ctx.globalAlpha = ft.life / ft.maxLife;
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha = 1.0;

    // 重力反転フラッシュ
    if (this.flash > 0) {
      ctx.fillStyle = `rgba(255, 255, 255, ${this.flash * 0.6})`;
      ctx.fillRect(0, 0, api.W, api.H);
    }

    // HUD描画（上部壁内）
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 5;
    ctx.fillText(`SCORE: ${api.score}`, 14, 14);

    ctx.textAlign = 'right';
    const min = Math.floor(this.timeLeft / 60);
    const sec = Math.floor(this.timeLeft % 60);
    const timeStr = `${min}:${sec < 10 ? '0' : ''}${sec}`;
    ctx.fillStyle = this.timeLeft <= 30 ? '#ff3333' : '#ff00ff';
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillText(`TIME: ${timeStr}`, api.W - 14, 14);

    if (this.combo > 1) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffea00';
      ctx.shadowColor = '#ffea00';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(`${this.combo} COMBO!`, api.W / 2, 14);
    }

    ctx.restore();
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
