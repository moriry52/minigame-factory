  const refresh = () => {
    const on = {};

let __vpad = null;

  bounds() {
    const s = this.t >= 90;
    return { x0: s ? 42 : 22, x1: s ? 438 : 458, y0: s ? 64 : 46, y1: s ? 418 : 442 };
  },

  weakPts() {
    if (this.level <= 2) return [{ dx: 0, dy: -32 }];
    if (this.level === 3) return [{ dx: -36, dy: 8 }, { dx: 36, dy: 8 }];
    return [{ dx: 0, dy: 32 }];
  },

  spawnEnemy() {
    const u = this.api.util;
    const b = this.bounds();
    const side = u.randInt(0, 3);
    let x, y;
    if (side === 0) { x = u.rand(b.x0 + 10, b.x1 - 10); y = b.y0 - 20; }
    else if (side === 1) { x = u.rand(b.x0 + 10, b.x1 - 10); y = b.y1 + 20; }
    else if (side === 2) { x = b.x0 - 20; y = u.rand(b.y0 + 10, b.y1 - 10); }
    else { x = b.x1 + 20; y = u.rand(b.y0 + 10, b.y1 - 10); }
    const type = this.t < 25 ? (u.rand() < 0.7 ? 'frog' : 'crow') : (u.rand() < 0.45 ? 'frog' : u.rand() < 0.6 ? 'crow' : 'beetle');
    const e = { id: this.eid++, type, x, y, r: 13, hp: 1, flash: 0, seed: u.rand(0, 6.28) };
    if (type === 'frog') {
      e.r = 13;
      e.hp = 1;
      e.spd = 62 + this.t * 0.12;
    } else if (type === 'crow') {
      e.r = 12;
      e.hp = 1;
      e.spd = 82;
      e.shoot = u.rand(2.0, 3.0);
    } else {
      e.r = 15;
      e.hp = 2;
      e.spd = 46;
      e.shoot = u.rand(2.4, 3.4);
    }
    this.enemies.push(e);
  },

  fire() {
    const p = this.player, a = p.angle, u = this.api.util, snd = this.api.sound;
    if (this.level === 1) {
      p.cd = 1.0;
      this.bullets.push({ x: p.x + Math.cos(a) * 16, y: p.y + Math.sin(a) * 16, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, r: 5, dmg: 1, life: 1.1, kind: 'shot' });
      snd.tone(620, 0.07, 'square', 0.22, 420);
    } else if (this.level === 2) {
      p.cd = 0.5;
      for (let k = -1; k <= 1; k++) {
        const aa = a + k * 0.16;
        this.bullets.push({ x: p.x + Math.cos(aa) * 16, y: p.y + Math.sin(aa) * 16, vx: Math.cos(aa) * 430, vy: Math.sin(aa) * 430, r: 4, dmg: 1, life: 1.1, kind: 'shot' });
      }
      snd.tone(880, 0.06, 'square', 0.22, 560);
    } else if (this.level === 3) {
      p.cd = 0.8;
      this.bullets.push({ x: p.x + Math.cos(a) * 14, y: p.y + Math.sin(a) * 14, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 7, dmg: 3, life: 0.5, kind: 'beam', len: 120, hit: [], bossHit: false });
      snd.tone(1300, 0.14, 'sawtooth', 0.2, 500);
    } else {
      p.cd = 1.5;
      for (let k = 0; k < 8; k++) {
        const aa = a + (k / 8) * Math.PI * 2;
        this.bullets.push({ x: p.x + Math.cos(aa) * 18, y: p.y + Math.sin(aa) * 18, vx: Math.cos(aa) * 310, vy: Math.sin(aa) * 310, r: 5, dmg: 2, life: 0.55, kind: 'shot' });
      }
      this.rings.push({ x: p.x, y: p.y, r: 14, max: 100, life: 0.35, maxLife: 0.35, c: '#FFD700' });
      this.shake = Math.max(this.shake, 4);
      this.api.sound.play('explode');
    }
  },

  addParticles(x, y, c, n, spd, life) {
    for (let i = 0; i < n; i++) {
      const a = this.api.util.rand(0, Math.PI * 2), s = this.api.util.rand(spd * 0.3, spd);
      this.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: this.api.util.rand(life * 0.5, life), maxLife: life, r: this.api.util.rand(2, 4.5), c });
    }
    if (this.particles.length > 260) this.particles.splice(0, this.particles.length - 260);
  },

  updateFx(dt) {
    if (this.flash > 0) this.flash -= dt;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 24);

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= (1 - dt * 2);
      pt.vy *= (1 - dt * 2);
      pt.life -= dt;
      if (pt.life <= 0) this.particles.splice(i, 1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const rg = this.rings[i];
      rg.life -= dt;
      rg.r = this.api.util.lerp(rg.r, rg.max, Math.min(1, dt * 10));
      if (rg.life <= 0) this.rings.splice(i, 1);
    }
  },

  hurtPlayer(d) {
    const p = this.player;
    if (p.invuln > 0 || this.over) return;
    p.hp -= d;
    p.invuln = 1.2;
    p.hurt = 0.3;
    this.shake = 7;
    this.api.sound.play('hurt');
    this.addParticles(p.x, p.y, '#FF6347', 12, 180, 0.5);
    if (p.hp <= 0) {
      p.hp = 0;
      this.over = true;
      this.addParticles(p.x, p.y, '#FFFFFF', 26, 260, 0.9);
      this.api.sound.play('over');
      this.api.gameOver();
    }
  },

  killEnemy(e) {
    const idx = this.enemies.indexOf(e);
    if (idx >= 0) this.enemies.splice(idx, 1);
    const c = e.type === 'frog' ? '#32CD32' : e.type === 'crow' ? '#3A3A3A' : '#8B4513';
    this.addParticles(e.x, e.y, c, 12, 190, 0.55);
    this.addParticles(e.x, e.y, '#FFFFFF', 5, 120, 0.4);
    const n = e.type === 'beetle' ? 2 : 1;
    for (let i = 0; i < n; i++) this.acorns.push({ x: e.x + this.api.util.rand(-10, 10), y: e.y + this.api.util.rand(-10, 10), phase: this.api.util.rand(0, 6.28), life: 12 });
    this.api.addScore(e.type === 'beetle' ? 25 : 15);
    this.api.sound.tone(320, 0.12, 'square', 0.25, 140);
    if (this.acorns.length > 40) this.acorns.splice(0, this.acorns.length - 40);
  },

  gainXp(n) {
    this.xp += n;
    while (this.level < 4 && this.xp >= this.xpNeed[this.level]) {
      this.level++;
      this.player.invuln = Math.max(this.player.invuln, 2);
      this.flash = 0.5;
      this.addParticles(this.player.x, this.player.y, '#FFD700', 24, 240, 0.8);
      this.rings.push({ x: this.player.x, y: this.player.y, r: 10, max: 130, life: 0.5, maxLife: 0.5, c: '#FFD700' });
      this.api.sound.tone(520, 0.4, 'square', 0.3, 1040);
      this.api.addScore(50);
    }
  },

  spawnBoss() {
    this.boss = {
      x: 240, y: -70, baseX: 240, ty: 112, r: 38, hp: 100, maxHp: 100,
      t: 0, atk: 2.2, bigT: 8, bigPhase: 0, bigType: 0, bigCd: 0,
      chargeDir: 1, invuln: false, flash: 0
    };
    this.shake = 10;
    this.api.sound.tone(70, 0.6, 'sine', 0.5, 40);
    this.api.sound.tone(160, 0.3, 'sawtooth', 0.25, 60);
  },

  bossAttack() {
    const b = this.boss, p = this.player, u = this.api.util;
    b.bigT = 10;
    b.bigPhase = 1;
    b.bigCd = 1.2;
    b.bigType = u.rand() < 0.5 ? 0 : 1;
    b.invuln = true;
    b.chargeDir = p.x < b.x ? -1 : 1;
    this.api.sound.tone(220, 0.5, 'sawtooth', 0.3, 90);
    if (b.bigType === 0) {
      for (let k = 0; k < 22; k++) {
        const a = (k / 22) * Math.PI * 2 + 0.1;
        this.ebullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 5, life: 4 });
      }
      this.api.sound.play('explode');
    }
  },

  update(dt) {
    if (this.cleared) return;
    const api = this.api, u = api.util, p = this.player;

    if (this.clearT > 0) {
      this.clearT -= dt;
      if (this.clearT <= 0) {
        this.clearT = 0;
        this.cleared = true;
        api.clear();
        return;
      }
      this.updateFx(dt);
      return;
    }

    if (this.over) {
      this.updateFx(dt);
      return;
    }

    this.t += dt;
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.over = true;
      api.sound.play('over');
      api.gameOver();
      return;
    }
    if (p.invuln > 0) p.invuln -= dt;
    if (p.hurt > 0) p.hurt -= dt;

    // ---- 移動 ----
    let mx = api.input.stick.x, my = api.input.stick.y;
    if (api.input.left) mx -= 1;
    if (api.input.right) mx += 1;
    if (api.input.up) my -= 1;
    if (api.input.down) my += 1;
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    const b = this.bounds();
    p.x = u.clamp(p.x + mx * 205 * dt, b.x0 + p.r, b.x1 - p.r);
    p.y = u.clamp(p.y + my * 205 * dt, b.y0 + p.r, b.y1 - p.r);
    if (ml > 0.1) p.angle = Math.atan2(my, mx);

    // ---- 仮想パッド表示用 ----
    if (api.input.pointer.down && api.input.pointer.nx < 0.5) {
      if (!this.padBase) this.padBase = { x: api.input.pointer.x, y: api.input.pointer.y };
      const kx = api.input.pointer.x - this.padBase.x, ky = api.input.pointer.y - this.padBase.y;
      const kl = Math.hypot(kx, ky);
      if (kl > 48) {
        this.padKnob.x = this.padBase.x + (kx / kl) * 48;
        this.padKnob.y = this.padBase.y + (ky / kl) * 48;
      } else {
        this.padKnob.x = api.input.pointer.x;
        this.padKnob.y = api.input.pointer.y;
      }
    } else {
      this.padBase = null;
      this.padKnob.x += (95 - this.padKnob.x) * Math.min(1, dt * 12);
      this.padKnob.y += (400 - this.padKnob.y) * Math.min(1, dt * 12);
    }

    // ---- 射撃 ----
    p.cd -= dt;
    if (api.input.a && p.cd <= 0 && !this.over) this.fire();

    // ---- 敵スポーン ----
    if (!this.boss && this.bossWarn <= 0 && this.t < 90) {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0 && this.enemies.length < 12) {
        this.spawnTimer = (this.t < 60 ? 3.4 : 2.4) * u.rand(0.85, 1.2);
        this.spawnEnemy();
      }
    }

    // ---- ボス出現 ----
    if (!this.bossWarned && this.t >= 88.5) {
      this.bossWarned = true;
      this.bossWarn = 1.6;
      api.sound.tone(120, 0.8, 'sine', 0.45, 50);
    }
    if (this.bossWarn > 0) {
      this.bossWarn -= dt;
      if (this.bossWarn <= 0) this.spawnBoss();
    }

    // ---- 敵更新 ----
    const dmgScale = this.t < 60 ? 1 : 2;
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (e.flash > 0) e.flash -= dt;
      const ang = u.angle(e.x, e.y, p.x, p.y);
      const d = u.dist(e.x, e.y, p.x, p.y);
      if (e.type === 'frog') {
        e.x += Math.cos(ang) * e.spd * dt;
        e.y += Math.sin(ang) * e.spd * dt;
      } else if (e.type === 'crow') {
        const want = 190;
        const dir = d > want + 20 ? 1 : d < want - 20 ? -1 : 0;
        e.x += Math.cos(ang) * e.spd * dir * dt + Math.cos(ang + Math.PI / 2) * Math.sin(this.t * 2 + e.seed) * 55 * dt;
        e.y += Math.sin(ang) * e.spd * dir * dt + Math.sin(ang + Math.PI / 2) * Math.sin(this.t * 2 + e.seed) * 55 * dt;
        e.shoot -= dt;
        if (e.shoot <= 0) {
          e.shoot = u.rand(2.0, 3.0);
          const bs = 115 * (this.t >= 60 ? 1.35 : 1);
          this.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(ang) * bs, vy: Math.sin(ang) * bs, r: 4.5, life: 3.5 });
          api.sound.tone(500, 0.06, 'square', 0.12, 380);
        }
      } else {
        if (d > 135) {
          e.x += Math.cos(ang) * e.spd * dt;
          e.y += Math.sin(ang) * e.spd * dt;
        }
        e.shoot -= dt;
        if (e.shoot <= 0 && d < 300) {
          e.shoot = 3.0;
          for (let k = -1; k <= 1; k++) {
            const aa = ang + k * 0.22;
            this.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(aa) * 105, vy: Math.sin(aa) * 105, r: 5, life: 3.5 });
          }
          api.sound.tone(300, 0.08, 'square', 0.14, 220);
        }
      }
      e.x = u.clamp(e.x, b.x0 + 6, b.x1 - 6);
      e.y = u.clamp(e.y, b.y0 + 6, b.y1 - 6);
      if (p.invuln <= 0 && u.circleHit({ x: p.x, y: p.y, r: p.r }, { x: e.x, y: e.y, r: e.r })) {
        this.hurtPlayer(e.type === 'beetle' ? 1 : dmgScale);
      }
    }

    // ---- ボス更新 ----
    const bo = this.boss;
    if (bo) {
      bo.t += dt;
      if (bo.flash > 0) bo.flash -= dt;
      if (bo.y < bo.ty) {
        bo.y += 70 * dt;
      } else if (bo.bigPhase === 1) {
        bo.bigCd -= dt;
        bo.x = bo.baseX + Math.sin(bo.t * 0.9) * 90;
        if (bo.bigCd <= 0) { bo.bigPhase = 2; bo.bigCd = 1.5; }
      } else if (bo.bigPhase === 2) {
        bo.bigCd -= dt;
        if (bo.bigType === 1) {
          bo.x += bo.chargeDir * 430 * dt;
          if (bo.x < 60 || bo.x > 420) {
            bo.x = u.clamp(bo.x, 60, 420);
            bo.bigPhase = 0;
            bo.bigT = 10;
            bo.invuln = false;
            bo.baseX = u.clamp(bo.x, 140, 340);
          }
        } else {
          bo.x = bo.baseX + Math.sin(bo.t * 0.9) * 90;
          if (bo.bigCd <= 0) { bo.bigPhase = 0; bo.bigT = 10; bo.invuln = false; }
        }
      } else {
        bo.x = bo.baseX + Math.sin(bo.t * 0.9) * 90;
        bo.atk -= dt;
        if (bo.atk <= 0) {
          bo.atk = 1.9;
          const aa = u.angle(bo.x, bo.y, p.x, p.y);
          for (let k = -2; k <= 2; k++) {
            const a2 = aa + k * 0.2;
            this.ebullets.push({ x: bo.x, y: bo.y + 14, vx: Math.cos(a2) * 155, vy: Math.sin(a2) * 155, r: 5, life: 4 });
          }
          api.sound.tone(340, 0.1, 'sawtooth', 0.16, 240);
        }
        bo.bigT -= dt;
        if (bo.bigT <= 0) this.bossAttack();
      }
      if (p.invuln <= 0 && u.circleHit({ x: p.x, y: p.y, r: p.r }, { x: bo.x, y: bo.y, r: bo.r })) this.hurtPlayer(3);
    }

    // ---- 自機弾 ----
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const bl = this.bullets[i];
      bl.x += bl.vx * dt;
      bl.y += bl.vy * dt;
      bl.life -= dt;
      let dead = bl.life <= 0 || bl.x < -140 || bl.x > 620 || bl.y < -140 || bl.y > 620;
      if (!dead) {
        for (let j = this.enemies.length - 1; j >= 0; j--) {
          const e = this.enemies[j];
          if (u.circleHit(bl, e)) {
            if (bl.kind === 'beam') {
              if (bl.hit.indexOf(e.id) < 0) {
                bl.hit.push(e.id);
                e.hp -= bl.dmg;
                e.flash = 0.1;
                this.addParticles(bl.x, bl.y, '#FFF3B0', 3, 120, 0.3);
                if (e.hp <= 0) this.killEnemy(e);
              }
            } else {
              e.hp -= bl.dmg;
              e.flash = 0.1;
              this.addParticles(bl.x, bl.y, '#FFF3B0', 3, 120, 0.3);
              if (e.hp <= 0) this.killEnemy(e);
              dead = true;
              break;
            }
          }
        }
        if (!dead && bo && bo.hp > 0 && !bo.invuln && bo.y > 20) {
          if (bl.kind === 'beam' && bl.bossHit) {
            // ビームはボスに1発だけダメージ
          } else {
            const wps = this.weakPts();
            let hitW = false;
            for (let k = 0; k < wps.length; k++) {
              if (u.dist(bl.x, bl.y, bo.x + wps[k].dx, bo.y + wps[k].dy) < 14 + bl.r) { hitW = true; break; }
            }
            if (hitW || u.circleHit(bl, bo)) {
              const dmg = hitW ? 8 : 2;
              bo.hp -= dmg;
              bo.flash = 0.12;
              this.addParticles(bl.x, bl.y, hitW ? '#FF4500' : '#FFD700', hitW ? 8 : 4, 160, 0.4);
              if (hitW) api.sound.tone(1500, 0.08, 'square', 0.2, 900);
              if (bl.kind === 'beam') bl.bossHit = true;
              else dead = true;
              if (bo.hp <= 0) {
                bo.hp = 0;
                this.boss = null;
                this.over = true;
                this.clearT = 1.1;
                this.api.addScore(500);
                this.addParticles(bo.x, bo.y, '#FFD700', 40, 320, 1.0);
                this.addParticles(bo.x, bo.y, '#1A1A1A', 24, 240, 0.9);
                this.addParticles(bo.x, bo.y, '#FF4500', 24, 280, 0.8);
                this.rings.push({ x: bo.x, y: bo.y, r: 20, max: 200, life: 0.7, maxLife: 0.7, c: '#FFD700' });
                this.shake = 14;
                api.sound.play('explode');
                api.sound.play('clear');
              }
            }
          }
        }
      }
      if (dead) this.bullets.splice(i, 1);
    }

    // ---- 敵弾 ----
    for (let i = this.ebullets.length - 1; i >= 0; i--) {
      const eb = this.ebullets[i];
      eb.x += eb.vx * dt;
      eb.y += eb.vy * dt;
      eb.life -= dt;
      let dead = eb.life <= 0 || eb.x < -30 || eb.x > 510 || eb.y < -30 || eb.y > 510;
      if (!dead && p.invuln <= 0 && u.circleHit({ x: p.x, y: p.y, r: p.r }, { x: eb.x, y: eb.y, r: eb.r })) {
        this.hurtPlayer(this.boss ? 2 : dmgScale);
        dead = true;
      }
      if (dead) this.ebullets.splice(i, 1);
    }

    // ---- ドングリ ----
    for (let i = this.acorns.length - 1; i >= 0; i--) {
      const aco = this.acorns[i];
      aco.life -= dt;
      const d = u.dist(aco.x, aco.y, p.x, p.y);
      if (d < 80) {
        const aa = u.angle(aco.x, aco.y, p.x, p.y);
        aco.x += Math.cos(aa) * 280 * dt;
        aco.y += Math.sin(aa) * 280 * dt;
      }
      if (d < 18) {
        this.acorns.splice(i, 1);
        this.gainXp(10);
        api.addScore(5);
        api.sound.play('coin');
        this.addParticles(p.x, p.y - 10, '#C8873A', 4, 90, 0.35);
      } else if (aco.life <= 0) {
        this.acorns.splice(i, 1);
      }
    }

    this.updateFx(dt);
  },

  draw(ctx) {
    const api = this.api, u = api.util, p = this.player;
    ctx.save();
    if (this.shake > 0) ctx.translate(u.rand(-this.shake, this.shake) * 0.5, u.rand(-this.shake, this.shake) * 0.5);

    // ---- 背景 ----
    ctx.fillStyle = '#90EE90';
    ctx.fillRect(-10, -10, this.W + 20, this.H + 20);
    for (const d of this.decor) {
      if (d.k === 'g') {
        ctx.fillStyle = '#7ED97E';
        ctx.beginPath();
        ctx.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = d.c;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(d.x, d.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (const tr of this.trees) {
      ctx.fillStyle = '#8B5A2B';
      ctx.fillRect(tr.x - 4, tr.y + tr.r * 0.4, 8, tr.r * 0.7);
      ctx.fillStyle = '#2E8B2E';
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3FA33F';
      ctx.beginPath();
      ctx.arc(tr.x - tr.r * 0.25, tr.y - tr.r * 0.25, tr.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    // ---- 壁（90秒で狭まる） ----
    const b = this.bounds();
    if (this.t >= 90) {
      const bush = (x, y, r) => {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      };
      ctx.fillStyle = '#2E8B2E';
      for (let xx = b.x0 - 14; xx <= b.x1 + 14; xx += 34) bush(xx, b.y0, 17);
      for (let xx = b.x0 - 14; xx <= b.x1 + 14; xx += 34) bush(xx, b.y1, 17);
      for (let yy = b.y0; yy <= b.y1; yy += 34) {
        bush(b.x0, yy, 17);
        bush(b.x1, yy, 17);
      }
      ctx.fillStyle = '#3FA33F';
      for (let xx = b.x0 - 2; xx <= b.x1 + 2; xx += 40) bush(xx, b.y0, 8);
      for (let xx = b.x0 - 2; xx <= b.x1 + 2; xx += 40) bush(xx, b.y1, 8);
    }

    // ---- ドングリ ----
    for (const aco of this.acorns) {
      const bob = Math.sin(this.t * 5 + aco.phase) * 3;
      const blink = aco.life < 2 && Math.floor(aco.life * 8) % 2 === 0;
      if (blink) continue;
      ctx.fillStyle = '#C8873A';
      ctx.beginPath();
      ctx.arc(aco.x, aco.y + bob, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#6B4423';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#6B4423';
      ctx.beginPath();
      ctx.arc(aco.x, aco.y + bob - 3, 5.5, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(aco.x - 1.5, aco.y + bob - 9, 3, 4);
    }

    // ---- 敵 ----
    for (const e of this.enemies) {
      const col = e.flash > 0 ? '#FFFFFF' : (e.type === 'frog' ? '#32CD32' : e.type === 'crow' ? '#2B2B2B' : '#8B4513');
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.type === 'frog') {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1E6B1E'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(-5, -e.r + 2, 4.5, 0, Math.PI * 2); ctx.arc(5, -e.r + 2, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1E6B1E'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(-5, -e.r + 2, 4.5, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(5, -e.r + 2, 4.5, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#111111';
        ctx.beginPath(); ctx.arc(-5, -e.r + 2, 2, 0, Math.PI * 2); ctx.arc(5, -e.r + 2, 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1E6B1E'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(0, 2, 5, 0.2, Math.PI - 0.2); ctx.stroke();
      } else if (e.type === 'crow') {
        const flap = Math.sin(this.t * 14 + e.seed) * 6;
        ctx.fillStyle = e.flash > 0 ? '#FFFFFF' : '#2B2B2B';
        ctx.beginPath();
        ctx.moveTo(-e.r + 2, 0); ctx.lineTo(-e.r - 8, -8 - flap); ctx.lineTo(-e.r + 6, -4); ctx.closePath();
        ctx.moveTo(e.r - 2, 0); ctx.lineTo(e.r + 8, -8 - flap); ctx.lineTo(e.r - 6, -4); ctx.closePath();
        ctx.fill();
        ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#000000'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(-4, -3, 3, 0, Math.PI * 2); ctx.arc(4, -3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111111';
        ctx.beginPath(); ctx.arc(-4, -3, 1.5, 0, Math.PI * 2); ctx.arc(4, -3, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFA500';
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(6, 1); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#4A2508'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.strokeStyle = '#4A2508'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, -e.r); ctx.lineTo(0, e.r); ctx.stroke();
        ctx.fillStyle = e.flash > 0 ? '#FFFFFF' : '#4A2508';
        ctx.beginPath();
        ctx.moveTo(-4, -e.r + 1); ctx.lineTo(-7, -e.r - 8); ctx.lineTo(-1, -e.r + 3); ctx.closePath();
        ctx.moveTo(4, -e.r + 1); ctx.lineTo(7, -e.r - 8); ctx.lineTo(1, -e.r + 3); ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFD700';
        ctx.beginPath(); ctx.arc(-6, -2, 2, 0, Math.PI * 2); ctx.arc(6, -2, 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // ---- ボス ----
    const bo = this.boss;
    if (bo) {
      ctx.save();
      ctx.translate(bo.x, bo.y);
      const bodyC = bo.flash > 0 ? '#FFFFFF' : (bo.bigPhase === 1 ? '#3A2A00' : '#1A1A1A');
      // 脚
      ctx.fillStyle = '#2B2B2B';
      for (let k = 0; k < 3; k++) {
        const ly = -12 + k * 14;
        ctx.beginPath(); ctx.arc(-bo.r - 4, ly, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(bo.r + 4, ly, 6, 0, Math.PI * 2); ctx.fill();
      }
      // 本体
      ctx.fillStyle = bodyC;
      ctx.beginPath(); ctx.ellipse(0, 0, bo.r, bo.r * 0.92, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.stroke();
      // 腹
      ctx.fillStyle = bo.flash > 0 ? '#FFFFFF' : '#3A3A3A';
      ctx.beginPath(); ctx.ellipse(0, 12, bo.r * 0.55, bo.r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 2; ctx.stroke();
      // 金の角
      ctx.fillStyle = bo.flash > 0 ? '#FFFFFF' : '#FFD700';
      ctx.strokeStyle = '#B8860B'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, -bo.r + 6);
      ctx.quadraticCurveTo(-16, -bo.r - 22, -2, -bo.r - 30);
      ctx.quadraticCurveTo(-6, -bo.r - 12, -2, -bo.r + 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, -bo.r + 6);
      ctx.quadraticCurveTo(16, -bo.r - 22, 2, -bo.r - 30);
      ctx.quadraticCurveTo(6, -bo.r - 12, 2, -bo.r + 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // 目
      ctx.fillStyle = '#FF4500';
      ctx.beginPath(); ctx.arc(-10, -12, 4, 0, Math.PI * 2); ctx.arc(10, -12, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // 弱点
      const wps = this.weakPts();
      const pulse = 0.5 + 0.5 * Math.sin(this.t * 8);
      const big = bo.bigPhase > 0;
      for (const w of wps) {
        const wx = bo.x + w.dx, wy = bo.y + w.dy;
        ctx.fillStyle = 'rgba(255,69,0,' + (0.25 + 0.3 * pulse + (big ? 0.2 : 0)) + ')';
        ctx.beginPath(); ctx.arc(wx, wy, 15 + pulse * 4 + (big ? 4 : 0), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FF4500';
        ctx.beginPath(); ctx.arc(wx, wy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#8B1E00'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(wx - 2, wy - 2, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // ---- プレイヤー（ウサギ戦士） ----
    const blink = p.invuln > 0 && Math.floor(this.t * 14) % 2 === 0;
    if (!blink) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle + Math.PI / 2);
      const bodyC = p.hurt > 0 ? '#FF9C8A' : '#FFFFFF';
      // 耳
      ctx.fillStyle = p.hurt > 0 ? '#FF9C8A' : '#FF6347';
      ctx.strokeStyle = '#B03A26'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(-6, -18, 4, 10, -0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(6, -18, 4, 10, 0.15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // 体
      ctx.fillStyle = bodyC;
      ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#555555'; ctx.lineWidth = 2.5; ctx.stroke();
      // 顔
      ctx.fillStyle = '#222222';
      ctx.beginPath(); ctx.arc(-4, -3, 2, 0, Math.PI * 2); ctx.arc(4, -3, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FF6347';
      ctx.beginPath(); ctx.arc(0, 1, 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#999999'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, 6); ctx.stroke();
      ctx.restore();
      // 頭上：HP・Lv・武器アイコン
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(p.x - 15, p.y - 34, 30, 5);
      ctx.fillStyle = '#FF4040';
      ctx.fillRect(p.x - 15, p.y - 34, 30 * (p.hp / p.maxHp), 5);
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - 15, p.y - 34, 30, 5);
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      this.outText(ctx, 'Lv' + this.level, p.x - 22, p.y - 38, '#FFD700', 2);
      // 武器アイコン
      const ix = p.x + 24, iy = p.y - 38;
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(ix, iy, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#FF8C00';
      if (this.level === 1) {
        ctx.beginPath(); ctx.arc(ix, iy, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (this.level === 2) {
        ctx.beginPath();
        ctx.arc(ix - 3, iy, 1.8, 0, Math.PI * 2);
        ctx.arc(ix, iy - 1, 1.8, 0, Math.PI * 2);
        ctx.arc(ix + 3, iy, 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (this.level === 3) {
        ctx.fillRect(ix - 5, iy - 1.5, 10, 3);
      } else {
        for (let k = 0; k < 8; k++) {
          const a = (k / 8) * Math.PI * 2;
          ctx.beginPath(); ctx.arc(ix + Math.cos(a) * 4, iy + Math.sin(a) * 4, 1.4, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    // ---- 自機弾 ----
    for (const bl of this.bullets) {
      if (bl.kind === 'beam') {
        const a = Math.atan2(bl.vy, bl.vx);
        ctx.save();
        ctx.translate(bl.x, bl.y);
        ctx.rotate(a);
        ctx.fillStyle = 'rgba(255,243,176,0.45)';
        ctx.fillRect(-bl.len, -7, bl.len, 14);
        ctx.fillStyle = '#FFF3B0';
        ctx.fillRect(-bl.len, -4, bl.len, 8);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(-bl.len, -1.5, bl.len, 3);
        ctx.restore();
      } else {
        ctx.fillStyle = '#FFF3B0';
        ctx.beginPath(); ctx.arc(bl.x, bl.y, bl.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#D4A017'; ctx.lineWidth = 2; ctx.stroke();
      }
    }

    // ---- 敵弾 ----
    for (const eb of this.ebullets) {
      ctx.fillStyle = '#FF4500';
      ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8B1E00'; ctx.lineWidth = 2; ctx.stroke();
    }

    // ---- リング・粒子 ----
    for (const rg of this.rings) {
      ctx.strokeStyle = rg.c;
      ctx.globalAlpha = Math.max(0, rg.life / rg.maxLife);
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    for (const pt of this.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.c;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore(); // shake end

    // ---- レベルアップフラッシュ ----
    if (this.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, this.flash * 2) + ')';
      ctx.fillRect(0, 0, this.W, this.H);
    }

    // ================= HUD =================
    // HP
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(10, 10, 118, 14);
    ctx.fillStyle = '#FF4040';
    ctx.fillRect(12, 12, 114 * (p.hp / p.maxHp), 10);
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
    ctx.strokeRect(10, 10, 118, 14);
    // XP
    const need = this.xpNeed[this.level] || this.xpNeed[3];
    const prev = this.level > 1 ? this.xpNeed[this.level - 1] : 0;
    const xpr = this.level >= 4 ? 1 : u.clamp((this.xp - prev) / (need - prev), 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(10, 27, 118, 8);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(11, 28, 116 * xpr, 6);
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5;
    ctx.strokeRect(10, 27, 118, 8);
    // 時間
    const mm = Math.floor(Math.max(0, this.timeLeft) / 60);
    const ss = Math.floor(Math.max(0, this.timeLeft) % 60);
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    this.outText(ctx, mm + ':' + (ss < 10 ? '0' : '') + ss, 10, 58, this.timeLeft < 30 ? '#FF6347' : '#FFFFFF', 3);
    // スコア
    ctx.font = 'bold 13px sans-serif';
    this.outText(ctx, 'SCORE ' + Math.floor(api.score || 0), 10, 76, '#FFFFFF', 2.5);

    // ミニマップ（右上）
    const mx0 = 402, my0 = 10, mw = 68, mh = 68;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(mx0, my0, mw, mh);
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
    ctx.strokeRect(mx0, my0, mw, mh);
    const mapPt = (x, y) => [mx0 + 4 + (x / 480) * (mw - 8), my0 + 4 + (y / 480) * (mh - 8)];
    for (const e of this.enemies) {
      const mp = mapPt(e.x, e.y);
      ctx.fillStyle = '#228B22';
      ctx.fillRect(mp[0] - 1.5, mp[1] - 1.5, 3, 3);
    }
    if (bo) {
      const mp = mapPt(bo.x, Math.max(0, bo.y));
      ctx.fillStyle = '#FF0000';
      ctx.beginPath(); ctx.arc(mp[0], mp[1], 4, 0, Math.PI * 2); ctx.fill();
    }
    const mp2 = mapPt(p.x, p.y);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(mp2[0], mp2[1], 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; ctx.stroke();

    // ボスHPバー
    if (bo) {
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(90, 8, 300, 18);
      ctx.fillStyle = '#FF4500';
      ctx.fillRect(92, 10, 296 * (bo.hp / bo.maxHp), 14);
      ctx.strokeStyle = '#000000'; ctx.lineWidth = 2.5;
      ctx.strokeRect(90, 8, 300, 18);
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      this.outText(ctx, '大カブトムシ', 240, 36, '#FFFFFF', 2.5);
    }

    // ボス予告
    if (this.bossWarn > 0) {
      const a = 0.5 + 0.5 * Math.sin(this.t * 12);
      ctx.fillStyle = 'rgba(255,69,0,' + (0.15 + 0.2 * a) + ')';
      ctx.fillRect(0, 0, this.W, this.H);
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      this.outText(ctx, '!! 大カブトムシ出現 !!', 240, 200, '#FF4500', 4);
    }

    // ================= 操作部 =================
    // 仮想パッド（1つだけ）
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(this.padKnob.x, this.padKnob.y, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Aボタン
    const ab = { x: 400, y: 402, r: 34 };
    const aDown = api.input.a;
    ctx.fillStyle = aDown ? 'rgba(255,99,71,0.75)' : 'rgba(255,99,71,0.45)';
    ctx.beginPath(); ctx.arc(ab.x, ab.y, ab.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(120,20,10,0.7)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText('A', ab.x, ab.y + 1);
    ctx.textBaseline = 'alphabetic';
    if (!api.isTouch) {
      ctx.font = 'bold 11px sans-serif';
      this.outText(ctx, 'Z = 攻撃', ab.x, ab.y + 50, '#FFFFFF', 2);
    }
  },

  outText(ctx, s, x, y, c, w) {
    ctx.lineWidth = w;
    ctx.strokeStyle = '#000000';
    ctx.lineJoin = 'round';
    ctx.strokeText(s, x, y);
    ctx.fillStyle = c;
    ctx.fillText(s, x, y);
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
</body>
