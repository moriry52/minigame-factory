#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

</div>
<script type="application/json" id="meta">{"id": "20261126-153103-local-llm", "title": "マグマ・レゾナンス", "summary": "火山のマグマ帯を縦に降下し、磁石で敵弾を弾き飛ばすか、周囲の敵弾同士を衝突させて自爆させる。引き寄せすぎると自機が過熱し溶ける恐怖と、弾幕を処理する快感の両立で3分間生き延びろ。", "rules": ["指でドラッグして自機（磁石コア）を移動し、上から降ってくるマグマ弾を避ける。", "長押しで磁石をONにし、周囲の敵弾を自機を中心に円軌道に並べながら引き寄せる（吸引モード）。", "磁石ON中に、引き寄せられた敵弾同士が接触すると爆発し、周囲の敵弾をまとめて破壊できる。", "磁石ONの時間が長すぎると「過熱」し、過熱MAXで自機が溶けてゲームオーバー。", "敵弾を自機に直接当てるとミス（被弾）となる。敵弾同士を衝突させて破壊するとスコア加算。被弾すると過熱がリセットされるがミスカウントが増える。ミス5回でゲームオーバー。"], "controls": {"スマホ": "指でなぞって自機を移動。長押しで磁石ON（吸引力発動）。", "PC": "マウスドラッグで自機を移動。マウスボタン長押しで磁石ON。"}, "cfg": {"mode": "2d", "w": 360, "h": 640, "scheme": "ドラッグ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    const U = api.util;
    this.W = api.W;
    this.H = api.H;
    this.TOTAL = 180;
    this.MAX_BULLETS = 56;

    this.t = 0;
    this.halt = false;
    this.endKind = null;
    this.endTimer = 0;
    this.overCalled = false;

    this.p = { x: this.W / 2, y: this.H * 0.72 };
    this.R = 15;
    this.FIELD_R = 120;
    this.ORBIT_R = 30;
    this.ORBIT_VT = 110;

    this.magnet = false;
    this.magnetOn = 0;
    this.heat = 0;
    this.miss = 0;
    this.MAX_MISS = 5;
    this.kills = 0;
    this.invuln = 0;
    this.pressX = this.W / 2;
    this.pressY = this.H / 2;
    this.holdT = 0;

    this.bullets = [];
    this.parts = [];
    this.rings = [];
    this.floats = [];
    this.embers = [];
    this.veins = [];

    for (let i = 0; i < 36; i++) {
      this.embers.push({
        x: U.rand(0, this.W),
        y: U.rand(0, this.H),
        r: U.rand(0.6, 2.0),
        s: U.rand(14, 42),
        ph: U.rand(0, 6.28)
      });
    }
    for (let i = 0; i < 5; i++) {
      this.veins.push({
        x: U.rand(0, this.W),
        w: U.rand(1.5, 4),
        sp: U.rand(8, 20),
        ph: U.rand(0, 6.28),
        c: U.choice([15, 330, 190])
      });
    }

    this.spawnT = 1.2;
    this.nextPat = 0;
    this.shake = 0;
    this.redFlash = 0;
    this.whiteFlash = 0;
    this.cyanFlash = 0;
    this.heatFlash = 0;
    this.danger = 0;
    this.melting = false;
    this.scoreCache = -1;
  },

  fin(v, fallback) {
    return typeof v === 'number' && isFinite(v) ? v : (fallback || 0);
  },

  progress() {
    return this.api.util.clamp(this.t / this.TOTAL, 0, 1);
  },

  burst(x, y, n, colors, spd, life, grav) {
    const U = this.api.util;
    x = this.fin(x, this.W / 2);
    y = this.fin(y, this.H / 2);
    n = Math.max(0, Math.floor(this.fin(n, 0)));
    spd = Math.max(0, this.fin(spd, 120));
    life = Math.max(0.05, this.fin(life, 0.6));
    grav = this.fin(grav, 0);

    for (let i = 0; i < n; i++) {
      const a = U.rand(0, 6.283);
      const s = spd * U.rand(0.2, 1);
      this.parts.push({
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        r: U.rand(1.4, 3.6),
        life: life * U.rand(0.5, 1),
        max: life,
        c: U.choice(colors),
        g: grav
      });
    }
    if (this.parts.length > 300) this.parts.splice(0, this.parts.length - 300);
  },

  floater(x, y, text, color, size) {
    x = this.fin(x, this.W / 2);
    y = this.fin(y, this.H / 2);
    this.floats.push({
      x,
      y,
      text: String(text || ''),
      c: color || '#FFFFFF',
      life: 1.1,
      max: 1.1,
      size: this.fin(size, 13)
    });
    if (this.floats.length > 12) this.floats.shift();
  },

  ring(x, y, maxR, color) {
    x = this.fin(x, this.W / 2);
    y = this.fin(y, this.H / 2);
    maxR = Math.max(8, this.fin(maxR, 60));
    this.rings.push({ x, y, r: 8, maxR, life: 0.5, max: 0.5, c: color || '#FFFFFF' });
    if (this.rings.length > 16) this.rings.shift();
  },

  addHeat(v) {
    v = this.fin(v, 0);
    this.heat = this.api.util.clamp(this.heat + v, 0, 100);
    if (this.heat >= 100 && !this.halt) this.melt();
  },

  spawnBullet(x, y, vx, vy, curved, amp, freq, ph) {
    const U = this.api.util;
    x = this.fin(x, this.W / 2);
    y = this.fin(y, -14);
    vx = this.fin(vx, 0);
    vy = this.fin(vy, this.bulletSpeed());
    amp = this.fin(amp, 0);
    freq = this.fin(freq, 0);
    ph = this.fin(ph, 0);

    if (this.bullets.length >= this.MAX_BULLETS) {
      this.bullets.shift();
    }

    this.bullets.push({
      x,
      y,
      vx,
      vy,
      r: 10,
      curved: !!curved,
      amp,
      freq,
      ph,
      baseX: x,
      orbitDir: 0,
      dead: false,
      ph2: U.rand(0, 6.28)
    });
  },

  bulletSpeed() {
    return this.api.util.lerp(50, 120, this.progress()) * this.api.util.rand(0.9, 1.12);
  },

  spawnPattern() {
    const U = this.api.util;
    const t = this.t;
    const curvedP = t < 20 ? 0 : Math.min(0.65, (t - 20) * 0.014);
    const roll = U.rand(0, 1);

    if (t > 75 && roll < 0.16) {
      const n = 4 + (t > 130 ? 1 : 0);
      const cx = U.rand(60, this.W - 60);
      for (let i = 0; i < n; i++) {
        const x = U.clamp(cx + (i - (n - 1) / 2) * 34, 14, this.W - 14);
        this.spawnBullet(
          x,
          -14 - (i % 2) * 16,
          0,
          this.bulletSpeed(),
          Math.random() < curvedP,
          U.rand(20, 40),
          U.rand(1.2, 2.2),
          U.rand(0, 6.28)
        );
      }
    } else if (t > 40 && roll < 0.34) {
      const n = 3;
      const cx = U.rand(70, this.W - 70);
      for (let i = 0; i < n; i++) {
        const x = U.clamp(cx + (i - 1) * 36, 14, this.W - 14);
        this.spawnBullet(
          x,
          -14 - i * 14,
          0,
          this.bulletSpeed(),
          Math.random() < curvedP,
          U.rand(20, 40),
          U.rand(1.2, 2.2),
          U.rand(0, 6.28)
        );
      }
    } else if (t > 100 && roll < 0.46) {
      const x = U.rand(20, this.W - 20);
      const a = U.angle(x, -14, this.p.x, this.p.y);
      const sp = this.bulletSpeed() * 1.15;
      this.spawnBullet(x, -14, Math.cos(a) * sp, Math.sin(a) * sp, false, 0, 0, 0);
    } else {
      const x = U.rand(14, this.W - 14);
      this.spawnBullet(
        x,
        -14,
        0,
        this.bulletSpeed(),
        Math.random() < curvedP,
        U.rand(20, 42),
        U.rand(1.1, 2.2),
        U.rand(0, 6.28)
      );
    }
  },

  hitShip(i) {
    const b = this.bullets[i];
    if (!b) return;
    this.bullets.splice(i, 1);
    this.miss++;
    this.heat = 0;
    this.invuln = 1.0;
    this.magnet = false;
    this.holdT = 0;
    this.shake = 14;
    this.redFlash = 0.5;
    this.burst(b.x, b.y, 26, ['#ffffff', '#ff5566', '#ffb3c0', '#ff4500'], 300, 0.9, 120);
    this.ring(this.p.x, this.p.y, 90, '#ff5566');
    this.floater(this.p.x, this.p.y - 34, 'ミス ' + this.miss + '/' + this.MAX_MISS, '#ff8899', 15);
    const s = this.api.sound;
    s.play('hurt');
    s.tone(220, 0.3, 'sawtooth', 0.25, 70);
    if (this.miss >= this.MAX_MISS) this.die();
  },

  melt() {
    if (this.halt) return;
    this.halt = true;
    this.melting = true;
    this.endKind = 'over';
    this.endTimer = 1.5;
    this.shake = 18;
    this.whiteFlash = 0.5;
    this.burst(this.p.x, this.p.y, 60, ['#ffffff', '#ffdd66', '#ff4500', '#ff0055', '#ff8800'], 340, 1.1, 150);
    this.ring(this.p.x, this.p.y, 150, '#ff4500');
    const s = this.api.sound;
    s.play('over');
    s.tone(90, 0.8, 'sawtooth', 0.3, 30);
    s.tone(1400, 0.5, 'square', 0.12, 200);
  },

  die() {
    if (this.halt) return;
    this.halt = true;
    this.endKind = 'over';
    this.endTimer = 1.3;
    this.shake = 16;
    this.redFlash = 0.6;
    this.burst(this.p.x, this.p.y, 46, ['#ffffff', '#ff5566', '#ffb3c0', '#00ffff'], 320, 1, 100);
    this.ring(this.p.x, this.p.y, 120, '#ff5566');
    const s = this.api.sound;
    s.play('over');
    s.tone(150, 0.6, 'sawtooth', 0.3, 40);
  },

  clearGame() {
    if (this.halt) return;
    this.halt = true;
    this.endKind = 'clear';
    this.endTimer = 1.4;
    this.whiteFlash = 0.5;
    this.burst(this.p.x, this.p.y, 60, ['#ffffff', '#7ad7ff', '#ffd700', '#00ffff', '#ff9ad5'], 320, 1.2);
    this.ring(this.p.x, this.p.y, 140, '#ffd700');
    this.floater(this.W / 2, this.H / 2 - 40, '3分間レゾナンス維持！', '#ffd700', 16);
    const s = this.api.sound;
    s.play('clear');
    s.tone(523, 0.15, 'square', 0.16, 660);
    s.tone(784, 0.3, 'square', 0.14, 1046);
  },

  updateFx(dt) {
    dt = this.fin(dt, 0);
    if (dt < 0) dt = 0;

    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += (p.g || 0) * dt;
      p.vx *= Math.exp(-1.5 * dt);
      if (!isFinite(p.x) || !isFinite(p.y) || p.life <= 0) this.parts.splice(i, 1);
    }

    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      r.r += (r.maxR - r.r) * Math.min(1, dt * 9);
      if (r.life <= 0 || !isFinite(r.r)) this.rings.splice(i, 1);
    }

    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.life -= dt;
      f.y -= 26 * dt;
      if (f.life <= 0 || !isFinite(f.y)) this.floats.splice(i, 1);
    }

    for (let i = 0; i < this.embers.length; i++) {
      const e = this.embers[i];
      e.y += e.s * dt;
      e.x += Math.sin(this.t * 0.8 + e.ph) * 8 * dt;
      if (!isFinite(e.x) || !isFinite(e.y) || e.y > this.H + 6) {
        e.y = -6;
        e.x = this.api.util.rand(0, this.W);
      }
    }
  },

  update(rawDt) {
    const api = this.api;
    const U = api.util;
    const inp = api.input;
    const ptr = inp.pointer || {};

    let dt = this.fin(rawDt, 0);
    if (dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;

    if (this.halt) {
      this.endTimer -= dt;
      if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 26);
      if (this.redFlash > 0) this.redFlash -= dt;
      if (this.whiteFlash > 0) this.whiteFlash -= dt;
      if (this.cyanFlash > 0) this.cyanFlash -= dt;
      if (this.heatFlash > 0) this.heatFlash -= dt;
      if (this.melting) {
        if (Math.random() < 0.5) {
          this.burst(
            this.p.x + U.rand(-14, 14),
            this.p.y + U.rand(-14, 14),
            3,
            ['#ffdd66', '#ff4500', '#ff8800'],
            120,
            0.7,
            200
          );
        }
      }
      this.updateFx(dt);
      if (this.endTimer <= 0 && !this.overCalled) {
        this.overCalled = true;
        if (this.endKind === 'clear') api.clear();
        else api.gameOver();
      }
      return;
    }

    this.t += dt;
    if (this.t >= this.TOTAL) {
      this.t = this.TOTAL;
      this.clearGame();
      return;
    }

    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 26);
    if (this.redFlash > 0) this.redFlash -= dt;
    if (this.whiteFlash > 0) this.whiteFlash -= dt;
    if (this.cyanFlash > 0) this.cyanFlash -= dt;
    if (this.heatFlash > 0) this.heatFlash -= dt;
    if (this.invuln > 0) this.invuln -= dt;
    if (this.danger > 0) this.danger -= dt;

    // ---- 磁石ON判定 ----
    if (ptr.pressed) {
      this.pressX = this.fin(ptr.x, this.pressX);
      this.pressY = this.fin(ptr.y, this.pressY);
      this.holdT = 0;
    }

    let holdStill = false;
    if (ptr.down) {
      const px = this.fin(ptr.x, this.pressX);
      const py = this.fin(ptr.y, this.pressY);
      const dPress = U.dist(px, py, this.pressX, this.pressY);
      if (isFinite(dPress) && dPress < 18) this.holdT += dt;
      else this.holdT = 0;
      holdStill = this.holdT > 0.18;
    } else {
      this.holdT = 0;
    }

    const wantMagnet = holdStill || !!inp.a || !!inp.b;
    if (wantMagnet && !this.magnet) {
      this.api.sound.play('powerup');
      this.ring(this.p.x, this.p.y, this.FIELD_R, 'rgba(0,255,255,0.5)');
    }
    this.magnet = wantMagnet;
    if (this.magnet) this.magnetOn += dt;

    // ---- 移動 ----
    const p = this.p;
    let mx = 0;
    let my = 0;

    if (inp.left) mx -= 1;
    if (inp.right) mx += 1;
    if (inp.up) my -= 1;
    if (inp.down) my += 1;

    if (mx !== 0 || my !== 0) {
      const inv = 1 / Math.hypot(mx, my);
      const ks = 420;
      mx = mx * inv * ks * dt;
      my = my * inv * ks * dt;
    }

    if (ptr.down) {
      let pdx = this.fin(ptr.dx, 0);
      let pdy = this.fin(ptr.dy, 0);

      const scale = 1.15;
      const len = Math.hypot(pdx, pdy);
      const maxMove = this.W * 1.5 * dt;
      if (len > maxMove) {
        pdx = pdx / len * maxMove;
        pdy = pdy / len * maxMove;
      }
      mx += pdx * scale;
      my += pdy * scale;
    }

    p.x = U.clamp(p.x + mx, 18, this.W - 18);
    p.y = U.clamp(p.y + my, 18, this.H - 18);
    if (!isFinite(p.x)) p.x = this.W / 2;
    if (!isFinite(p.y)) p.y = this.H * 0.72;

    // ---- 過熱ゲージ ----
    const pr = this.progress();
    if (this.magnet) this.addHeat(U.lerp(5, 11, pr) * dt);
    else this.heat = Math.max(0, this.heat - U.lerp(3, 6, pr) * dt);

    if (this.heat >= 75) this.heatFlash = 0.2;
    if (this.halt) return;

    // ---- 敵弾出現（開始3秒は安全）----
    if (this.t > 3) {
      this.spawnT -= dt;
      if (this.spawnT <= 0) {
        this.spawnPattern();
        const base = U.lerp(0.5, 0.2, pr);
        this.spawnT = base * U.rand(0.8, 1.2);
      }
    }

    // ---- 敵弾更新 ----
    const bs = this.bullets;
    for (let i = bs.length - 1; i >= 0; i--) {
      const b = bs[i];
      if (!b) continue;

      if (b.curved) b.vx = b.amp * b.freq * Math.cos(this.t * b.freq + b.ph);
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (!isFinite(b.x) || !isFinite(b.y)) {
        bs.splice(i, 1);
        continue;
      }

      if (b.x < -30) b.x = -30;
      if (b.x > this.W + 30) b.x = this.W + 30;

      if (this.magnet && this.heat < 100) {
        const dx = p.x - b.x;
        const dy = p.y - b.y;
        const d = Math.hypot(dx, dy) || 0.0001;

        if (isFinite(d) && d < this.FIELD_R) {
          const ux = dx / d;
          const uy = dy / d;
          const tx = -uy;
          const ty = ux;

          let vr = b.vx * ux + b.vy * uy;
          let vt = b.vx * tx + b.vy * ty;

          if (!b.orbitDir) b.orbitDir = (vt >= 0 ? 1 : -1) || 1;

          if (d < this.ORBIT_R) {
            const ix = p.x - ux * this.ORBIT_R;
            const iy = p.y - uy * this.ORBIT_R;
            const nx = ix - b.x;
            const ny = iy - b.y;
            const nd = Math.hypot(nx, ny) || 0.0001;
            const nnx = nx / nd;
            const nny = ny / nd;

            vr = b.vx * nnx + b.vy * nny;
            vt = b.vx * -nny + b.vy * nnx;

            b.x = ix;
            b.y = iy;
            if (vr < 0) vr = 0;

            const ar2 = 30 * (this.ORBIT_R - d) - 6 * vr;
            const at2 = (b.orbitDir * this.ORBIT_VT - vt) * 4.5;

            b.vx = nnx * (vr + ar2 * dt) + (-nny) * (vt + at2 * dt);
            b.vy = nny * (vr + ar2 * dt) + nnx * (vt + at2 * dt);
          } else {
            const ar = 26 * (d - this.ORBIT_R) - 5.5 * vr;
            const at = (b.orbitDir * this.ORBIT_VT - vt) * 4.5;
            const nvr = vr + ar * dt;
            const nvt = vt + at * dt;
            b.vx = ux * nvr + tx * nvt;
            b.vy = uy * nvr + ty * nvt;
          }

          if (!isFinite(b.x) || !isFinite(b.y) || !isFinite(b.vx) || !isFinite(b.vy)) {
            b.x = p.x + (Math.random() * 2 - 1) * this.ORBIT_R;
            b.y = p.y + (Math.random() * 2 - 1) * this.ORBIT_R;
            b.vx = 0;
            b.vy = 0;
          }
        }
      }

      if (
        this.invuln <= 0 &&
        U.circleHit({ x: p.x, y: p.y, r: this.R + 2 }, { x: b.x, y: b.y, r: b.r })
      ) {
        this.hitShip(i);
        if (this.halt) return;
        continue;
      }

      if (b.y - b.r > this.H + 16 || b.y < -140 || b.x < -60 || b.x > this.W + 60) {
        bs.splice(i, 1);
      }
    }

    // ---- 磁石ON中：敵弾同士の衝突→連鎖爆発 ----
    if (this.magnet && this.heat < 100) {
      this.chainExplode(bs);
      if (this.halt) return;
    }

    this.updateFx(dt);

    // ---- スコア ----
    const sc = this.kills * 10 + Math.floor(this.t) * 5;
    if (sc !== this.scoreCache) {
      this.scoreCache = sc;
      api.setScore(sc);
    }
  },

  chainExplode(bs) {
    const U = this.api.util;
    const s = this.api.sound;
    let clusters = 0;
    let safety = 0;

    while (clusters < 4 && safety < 16) {
      safety++;
      let fi = -1;
      let fj = -1;

      outer:
      for (let i = 0; i < bs.length; i++) {
        for (let j = i + 1; j < bs.length; j++) {
          const d = U.dist(bs[i].x, bs[i].y, bs[j].x, bs[j].y);
          if (isFinite(d) && d < bs[i].r + bs[j].r) {
            fi = i;
            fj = j;
            break outer;
          }
        }
      }

      if (fi < 0) break;

      const a = bs[fi];
      const b = bs[fj];
      const cx = (a.x + b.x) / 2;
      const cy = (a.y + b.y) / 2;

      const queue = [];
      const enqueue = (o) => {
        if (o && !o.dead) {
          o.dead = true;
          queue.push(o);
        }
      };

      enqueue(a);
      enqueue(b);

      let destroyed = 0;
      let innerSafety = 0;

      while (queue.length && innerSafety < 512) {
        innerSafety++;
        const c = queue.pop();
        if (!c) continue;
        destroyed++;
        this.kills++;

        this.burst(c.x, c.y, 8, ['#ffffff', '#ffdd66', '#ff4500', '#ff8800'], 200, 0.6, 120);
        if (destroyed <= 8) this.ring(c.x, c.y, 42, '#ff8800');
        if (destroyed <= 3) s.play('explode');

        for (let k = bs.length - 1; k >= 0; k--) {
          const o = bs[k];
          if (!o.dead) {
            const d = U.dist(o.x, o.y, c.x, c.y);
            if (isFinite(d) && d < 50) {
              enqueue(o);
            }
          }
        }
      }

      for (let k = bs.length - 1; k >= 0; k--) {
        if (bs[k].dead) bs.splice(k, 1);
      }

      this.addHeat(4);
      this.shake = Math.min(16, this.shake + 3 + destroyed * 0.5);
      this.cyanFlash = Math.max(this.cyanFlash, 0.15);
      this.floater(cx, cy, '+' + destroyed * 10, '#ffdd66', 14);
      this.ring(cx, cy, 50 + destroyed * 6, '#ff4500');
      s.tone(280 + destroyed * 50, 0.18, 'square', 0.12, 120);

      clusters++;
      if (this.halt) return;
    }
  },

  drawGlowCircle(ctx, x, y, r, core, glow, glowR) {
    x = this.fin(x, this.W / 2);
    y = this.fin(y, this.H / 2);
    glowR = Math.max(1, this.fin(glowR, 20));

    const g = ctx.createRadialGradient(x, y, 0, x, y, glowR);
    g.addColorStop(0, core);
    g.addColorStop(0.4, glow);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, glowR, 0, 6.283);
    ctx.fill();
  },

  draw(ctx) {
    const api = this.api;
    const U = api.util;
    const W = this.W;
    const H = this.H;
    const p = this.p;

    ctx.save();
    if (this.shake > 0) {
      const sx = this.fin(this.shake, 0) * 0.5;
      ctx.translate(U.rand(-sx, sx), U.rand(-sx, sx));
    }

    // ---- 背景 ----
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1A0B2E');
    bg.addColorStop(0.6, '#140822');
    bg.addColorStop(1, '#0F051A');
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    const pulse = 0.5 + 0.5 * Math.sin(this.t * 1.4);
    const vg = ctx.createRadialGradient(W / 2, H + 60, 20, W / 2, H + 60, 320);
    vg.addColorStop(0, 'rgba(255,69,0,' + (0.10 + 0.08 * pulse) + ')');
    vg.addColorStop(1, 'rgba(255,69,0,0)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, H - 340, W, 340);

    for (let i = 0; i < this.veins.length; i++) {
      const v = this.veins[i];
      const a = 0.05 + 0.07 * (0.5 + 0.5 * Math.sin(this.t * 0.7 + v.ph));
      ctx.strokeStyle = U.hsl(v.c, 90, 55, a);
      ctx.lineWidth = v.w;
      ctx.beginPath();
      ctx.moveTo(v.x, 0);
      ctx.bezierCurveTo(v.x + 14, H * 0.33, v.x - 14, H * 0.66, v.x + 6, H);
      ctx.stroke();
    }

    for (let i = 0; i < this.embers.length; i++) {
      const e = this.embers[i];
      const a = 0.25 + 0.3 * (0.5 + 0.5 * Math.sin(this.t * 2 + e.ph));
      ctx.fillStyle = 'rgba(255,140,40,' + a + ')';
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, 6.283);
      ctx.fill();
    }

    // ---- 磁石フィールド ----
    if (this.magnet && !this.halt) {
      const breath = 0.5 + 0.5 * Math.sin(this.t * 6);
      const fg = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, this.FIELD_R);
      fg.addColorStop(0, 'rgba(75,0,130,0.05)');
      fg.addColorStop(0.7, 'rgba(75,0,130,0.16)');
      fg.addColorStop(1, 'rgba(75,0,130,0.02)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.FIELD_R, 0, 6.283);
      ctx.fill();

      ctx.strokeStyle = 'rgba(0,255,255,' + (0.35 + 0.3 * breath) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, this.FIELD_R, 0, 6.283);
      ctx.stroke();

      for (let k = 0; k < 3; k++) {
        const rr = this.FIELD_R * (0.42 + 0.16 * k);
        const rot = this.t * (1.2 + k * 0.5) * (k % 2 ? -1 : 1);
        ctx.strokeStyle = 'rgba(0,255,255,' + (0.16 + 0.1 * breath) + ')';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([10, 14]);
        ctx.lineDashOffset = -rot * 40;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rr, 0, 6.283);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      if (this.bullets.length) {
        ctx.strokeStyle = 'rgba(0,255,255,0.10)';
        ctx.lineWidth = 1;
        for (let i = 0; i < this.bullets.length; i++) {
          const b = this.bullets[i];
          const d = U.dist(p.x, p.y, b.x, b.y);
          if (isFinite(d) && d < this.FIELD_R && d > this.ORBIT_R) {
            ctx.beginPath();
            ctx.moveTo(b.x, b.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
        }
      }
    }

    // ---- 敵弾 ----
    for (let i = 0; i < this.bullets.length; i++) {
      const b = this.bullets[i];
      if (!isFinite(b.x) || !isFinite(b.y)) continue;
      const fl = 0.85 + 0.15 * Math.sin(this.t * 9 + b.ph2);

      this.drawGlowCircle(
        ctx,
        b.x,
        b.y,
        b.r,
        'rgba(255,235,180,' + fl + ')',
        'rgba(255,69,0,0.55)',
        b.r * 2.6
      );

      ctx.fillStyle = 'rgba(255,120,30,0.9)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 0.62, 0, 6.283);
      ctx.fill();

      const sp = Math.hypot(b.vx, b.vy);
      if (isFinite(sp) && sp > 30) {
        const tx = b.x - (b.vx / sp) * 14;
        const ty = b.y - (b.vy / sp) * 14;
        ctx.strokeStyle = 'rgba(255,69,0,0.35)';
        ctx.lineWidth = b.r * 0.9;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(tx, ty);
        ctx.stroke();
        ctx.lineCap = 'butt';
      }
    }

    // ---- 自機 ----
    if (!this.halt || this.endKind === 'clear') {
      const blink = this.invuln > 0 && Math.floor(this.t * 14) % 2 === 0;
      if (!blink) {
        const heatT = this.heat / 100;
        const ringCol = heatT > 0.6
          ? U.hsl(U.lerp(185, 10, (heatT - 0.6) / 0.4), 100, 60, 0.9)
          : '#00FFFF';

        this.drawGlowCircle(ctx, p.x, p.y, this.R, 'rgba(0,255,255,0.25)', 'rgba(0,255,255,0.12)', this.R * 2.4);

        ctx.strokeStyle = ringCol;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, this.R, 0, 6.283);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0,255,255,0.5)';
        ctx.lineWidth = 2;
        for (let k = 0; k < 2; k++) {
          const a0 = this.t * 2.4 + k * Math.PI;
          ctx.beginPath();
          ctx.arc(p.x, p.y, this.R + 5, a0, a0 + 1.1);
          ctx.stroke();
        }

        const coreP = 0.75 + 0.25 * Math.sin(this.t * 5);
        this.drawGlowCircle(ctx, p.x, p.y, 6, 'rgba(255,255,255,0.9)', 'rgba(255,0,85,' + 0.8 * coreP + ')', 16);
        ctx.fillStyle = '#FF0055';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5.5, 0, 6.283);
        ctx.fill();
      }
    } else if (this.melting && this.endTimer > 0.4) {
      const m = 0.5 + 0.5 * Math.sin(this.t * 30);
      this.drawGlowCircle(
        ctx,
        p.x,
        p.y,
        this.R,
        'rgba(255,220,120,0.9)',
        'rgba(255,69,0,' + (0.5 + 0.4 * m) + ')',
        this.R * 2.8
      );
    }

    // ---- 効果 ----
    for (let i = 0; i < this.rings.length; i++) {
      const r = this.rings[i];
      const a = Math.max(0, r.life / r.max);
      ctx.strokeStyle = r.c;
      ctx.globalAlpha = a;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, 6.283);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    for (let i = 0; i < this.parts.length; i++) {
      const pt = this.parts[i];
      const a = Math.max(0, pt.life / pt.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.c;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r * (0.5 + 0.5 * a), 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < this.floats.length; i++) {
      const f = this.floats[i];
      const a = Math.max(0, f.life / f.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = f.c;
      ctx.font = 'bold ' + f.size + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // ---- フラッシュ ----
    if (this.redFlash > 0) {
      ctx.fillStyle = 'rgba(255,0,60,' + Math.min(0.4, this.redFlash * 0.6) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    if (this.whiteFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.5, this.whiteFlash * 0.8) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    if (this.heatFlash > 0 && this.heat >= 75 && !this.halt) {
      const a = Math.min(0.25, this.heatFlash * 1.4) * (0.5 + 0.5 * Math.sin(this.t * 12));
      const hg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
      hg.addColorStop(0, 'rgba(255,0,0,0)');
      hg.addColorStop(1, 'rgba(255,0,0,' + a + ')');
      ctx.fillStyle = hg;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // ---- HUD ----
    ctx.textAlign = 'left';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = '#FFFFFF';
    const scoreNow = this.kills * 10 + Math.floor(this.t) * 5;
    ctx.fillText('SCORE ' + String(Math.max(0, scoreNow)).padStart(6, '0'), 10, 20);

    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    const remain = Math.max(0, this.TOTAL - this.t);
    const mm = Math.floor(remain / 60);
    const ss = Math.floor(remain % 60);
    ctx.fillText('TIME ' + mm + ':' + String(ss).padStart(2, '0'), 10, 36);

    ctx.textAlign = 'right';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = this.miss >= 4 ? '#FF5566' : '#FFFFFF';
    ctx.fillText('ミス: ' + this.miss + '/' + this.MAX_MISS, W - 10, 20);

    const bw = 200;
    const bx = (W - bw) / 2;
    const by = 26;
    ctx.textAlign = 'center';
    ctx.font = '10px monospace';
    ctx.fillStyle = this.heat >= 75 ? '#FF5566' : 'rgba(255,255,255,0.8)';
    ctx.fillText('過熱 HEAT', W / 2, by - 5);

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(bx, by, bw, 8);

    const hw = bw * (this.heat / 100);
    if (hw > 0) {
      const hcol = this.heat >= 75
        ? (Math.floor(this.t * 10) % 2 ? '#FF0000' : '#FF7700')
        : '#FF0000';
      ctx.fillStyle = hcol;
      ctx.fillRect(bx, by, hw, 8);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, 8);

    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.75, by - 2);
    ctx.lineTo(bx + bw * 0.75, by + 10);
    ctx.stroke();

    ctx.font = 'bold 11px monospace';
    if (this.magnet) {
      ctx.fillStyle = '#00FFFF';
      ctx.fillText('磁石ON', W / 2, by + 24);
    } else if (this.holdT > 0.05) {
      ctx.fillStyle = 'rgba(0,255,255,0.6)';
      const ch = Math.min(1, this.holdT / 0.18);
      ctx.fillText('磁石チャージ ' + Math.floor(ch * 100) + '%', W / 2, by + 24);
    }

    if (this.t < 3 && !this.halt) {
      ctx.font = 'bold 14px monospace';
      ctx.fillStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(this.t * 5)) + ')';
      ctx.fillText('マグマ降下まで ' + (3 - this.t).toFixed(1) + 's', W / 2, H * 0.4);
      ctx.font = '11px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('ドラッグで移動 / 長押しで磁石ON', W / 2, H * 0.4 + 20);
    }

    ctx.restore();
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
</body>
