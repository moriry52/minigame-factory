<script type="application/json" id="meta">{"id": "20261124-160004-gemini-flash", "title": "オリガミてんち", "summary": "クラフト紙の世界を傾け、折り紙のコマを滑らせる全方向アクション。タップの重力反転でトラップをすり抜け、全ステージ走破を目指そう！", "rules": ["スワイプで盤面を傾けて重力を上下左右に切り替え、紙のコマを滑らせる", "タップすると重力の向きが真逆に反転！急停止や切り返しに活用しよう", "画鋲やハサミ、台紙の穴に触れるとミスになり、ステージの最初からやり直し", "散らばった金箔シールをすべて回収し、点線の「のりしろゴール」に入ればステージクリア（全5面）"], "controls": {"スマホ": "上下左右スワイプで重力の方向を指定。画面タップで現在の重力を180度反転。", "PC": "矢印キー（またはWASD）で重力方向を指定。画面クリックで重力を180度反転。"}, "cfg": {"mode": "2d", "w": 480, "h": 480, "scheme": "タップ/スワイプ", "buttons": [{"key": "A", "label": "A"}]}}</script>
<script >
"use strict";
// ============================================================
// ミニゲーム共通ランタイム（入力・画面サイズ・音・タイトル/結果画面）
// ゲーム側は `const Game = { init(api), update(dt), draw(ctx) }` を定義するだけ。
// ============================================================
const META = JSON.parse(document.getElementById("meta").textContent);
const CFG = META.cfg;                       // { mode:'2d'|'3d', w, h, scheme, buttons:[{key,label}] }
const IS_TOUCH = (window.matchMedia && matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
const __G = (window.__GAME__ = { state: "boot", frame: 0, score: 0, errors: [], startedAt: 0, endedAt: 0, plays: 0 });
window.addEventListener("error", (e) => __G.errors.push(String(e.message || e)));
window.addEventListener("unhandledrejection", (e) => __G.errors.push(String(e.reason)));

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("screen"), overlay = $("overlay"), hudEl = $("hud"), padEl = $("pad");

// ---------------- ユーティリティ ----------------
const U = {
  rand: (a = 0, b = 1) => a + Math.random() * (b - a),
  randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
  choice: (arr) => arr[Math.floor(Math.random() * arr.length)],
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
  angle: (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1),
  rectHit: (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y,
  circleHit: (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2 < (a.r + b.r) ** 2,
  hsl: (h, s = 80, l = 60, a = 1) => `hsla(${h},${s}%,${l}%,${a})`,
};

// ---------------- 入力 ----------------
// 押しっぱなし: left/right/up/down/a/b   押した瞬間: leftPressed ... aPressed/bPressed
// pointer: {x,y,nx,ny,down,pressed,released,dx,dy}  (x,y はゲーム座標, nx,ny は -1..1)
// swipe: 'left'|'right'|'up'|'down'|null （このフレームでスワイプがあった時だけ）
// tap: このフレームで短いタップ/クリックがあったら true（pointer.x,y がその位置）
const DIRS = ["left", "right", "up", "down"];
const KEYMAP = {
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  KeyZ: "a", Space: "a", Enter: "a", KeyJ: "a", KeyX: "b", ShiftLeft: "b", ShiftRight: "b", KeyK: "b",
};
const Input = {
  left: false, right: false, up: false, down: false, a: false, b: false,
  leftPressed: false, rightPressed: false, upPressed: false, downPressed: false, aPressed: false, bPressed: false,
  pointer: { x: 0, y: 0, nx: 0, ny: 0, down: false, pressed: false, released: false, dx: 0, dy: 0 },
  swipe: null, tap: false,
  _key: {}, _pad: {}, _one: false, _prev: {}, _pulse: {}, _ptrPressed: false, _ptrReleased: false,
  _dx: 0, _dy: 0, _swipe: null, _tap: false, _ignoreUntilUp: false,
  _begin() {
    for (const k of [...DIRS, "a", "b"]) {
      const held = !!(this._key[k] || this._pad[k] || (k === "a" && this._one));
      const pulse = !!this._pulse[k];
      this[k] = held || pulse;
      this[k + "Pressed"] = (held && !this._prev[k]) || pulse;
      this._prev[k] = held;
    }
    this._pulse = {};
    const p = this.pointer;
    p.pressed = this._ptrPressed; p.released = this._ptrReleased; p.dx = this._dx; p.dy = this._dy;
    this.swipe = this._swipe; this.tap = this._tap;
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
  },
  _clear() {
    this._key = {}; this._pad = {}; this._one = false; this._pulse = {};
    this._ptrPressed = this._ptrReleased = false; this._dx = this._dy = 0; this._swipe = null; this._tap = false;
    this.pointer.down = false;
    for (const k of [...DIRS, "a", "b"]) this._prev[k] = false;
    this._ignoreUntilUp = true;
  },
};

window.addEventListener("keydown", (e) => {
  if (e.code === "KeyP" || e.code === "Escape") { togglePause(); e.preventDefault(); return; }
  if (e.code === "KeyM") { Sound.toggle(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Sound.unlock();
  if (__G.state === "title" || __G.state === "over" || __G.state === "clear") {
    if (k === "a" && !e.repeat && (__G.state === "title" || performance.now() - __G.endedAt > 700)) startGame();
    return;
  }
  if (__G.paused) { if (k === "a" && !e.repeat) togglePause(false); return; }
  Input._key[k] = true;
});
window.addEventListener("keyup", (e) => { const k = KEYMAP[e.code]; if (k) Input._key[k] = false; });
window.addEventListener("blur", () => { Input._key = {}; });

// ステージ上のポインタ（タッチ・マウス共通）
let __viewRect = { left: 0, top: 0, width: 1, height: 1 };
let __ptrStart = null;
function __toGame(ev) {
  const r = __viewRect;
  const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
  return { x: u * __G.W, y: v * __G.H, nx: u * 2 - 1, ny: -(v * 2 - 1) };
}
let __activePtr = null;
stage.addEventListener("pointerdown", (ev) => {
  Sound.unlock();
  if (__G.state !== "playing" || __G.paused) return;
  if (__activePtr !== null && __activePtr !== ev.pointerId) return;
  __activePtr = ev.pointerId;
  try { stage.setPointerCapture(ev.pointerId); } catch (_) {}
  Input._ignoreUntilUp = false;
  const g = __toGame(ev);
  Object.assign(Input.pointer, g, { down: true });
  Input._ptrPressed = true;
  __ptrStart = { x: ev.clientX, y: ev.clientY, t: performance.now(), gx: g.x, gy: g.y };
  if (CFG.scheme === "ワンボタン") Input._one = true;
  ev.preventDefault();
});
stage.addEventListener("pointermove", (ev) => {
  if (ev.pointerId !== __activePtr) {
    if (ev.pointerType === "mouse" && __activePtr === null) Object.assign(Input.pointer, __toGame(ev));
    return;
  }
  const g = __toGame(ev);
  Input._dx += g.x - Input.pointer.x; Input._dy += g.y - Input.pointer.y;
  Object.assign(Input.pointer, g);
});
function __ptrEnd(ev) {
  if (ev.pointerId !== __activePtr) return;
  __activePtr = null;
  Input.pointer.down = false;
  Input._ptrReleased = true;
  Input._one = false;
  if (__ptrStart) {
    const dx = ev.clientX - __ptrStart.x, dy = ev.clientY - __ptrStart.y;
    const d = Math.hypot(dx, dy), dt = performance.now() - __ptrStart.t;
    if (d > 28 && dt < 600) {
      const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
      Input._swipe = dir;
      if (CFG.scheme === "タップ/スワイプ") Input._pulse[dir] = true;
    } else if (d <= 28 && dt < 500) {
      Input._tap = true;
      Input.pointer.x = __ptrStart.gx; Input.pointer.y = __ptrStart.gy;
    }
  }
  __ptrStart = null;
}
stage.addEventListener("pointerup", __ptrEnd);
stage.addEventListener("pointercancel", __ptrEnd);
stage.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// 仮想パッド（タッチ端末 かつ 操作=仮想パッド のときだけ表示）
function __buildPad() {
  if (!(IS_TOUCH && CFG.scheme === "仮想パッド")) return;
  padEl.classList.add("show");
  const dirs = [["up", "▲", 66, 14], ["left", "◀", 8, 72], ["right", "▶", 124, 72], ["down", "▼", 66, 130]];
  let html = "";
  for (const [k, s, x, y] of dirs) html += `<div class="pbtn dir" data-btn="${k}" style="left:${x + 10}px;top:${y - 6}px">${s}</div>`;
  const btns = (CFG.buttons && CFG.buttons.length ? CFG.buttons : [{ key: "A", label: "A" }]).slice(0, 2);
  btns.forEach((b, i) => {
    const right = i === 0 ? 18 : 108, top = i === 0 ? 60 : 92;
    html += `<div class="pbtn act" data-btn="${b.key.toLowerCase()}" style="right:${right}px;top:${top - 20}px">${b.label || b.key}</div>`;
  });
  padEl.innerHTML = html;
  const owner = {};
  const refresh = () => {
    const on = {};
    for (const id in owner) if (owner[id]) on[owner[id]] = true;
    Input._pad = on;
    padEl.querySelectorAll(".pbtn").forEach((el) => el.classList.toggle("on", !!on[el.dataset.btn]));
  };
  const hit = (ev) => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    return el && el.dataset && el.dataset.btn ? el.dataset.btn : null;
  };
  padEl.addEventListener("pointerdown", (ev) => {
    Sound.unlock(); ev.preventDefault();
    try { padEl.setPointerCapture(ev.pointerId); } catch (_) {}
    if (__G.state !== "playing") { if (__G.state !== "boot") startGame(); return; }
    if (__G.paused) { togglePause(false); return; }
    owner[ev.pointerId] = hit(ev); refresh();
  });
  padEl.addEventListener("pointermove", (ev) => { if (ev.pointerId in owner) { owner[ev.pointerId] = hit(ev); refresh(); } });
  const up = (ev) => { delete owner[ev.pointerId]; refresh(); };
  padEl.addEventListener("pointerup", up);
  padEl.addEventListener("pointercancel", up);
}

// ---------------- 音（Web Audio で合成。外部ファイル不要） ----------------
const Sound = {
  ctx: null, muted: false,
  unlock() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { this.ctx = null; }
  },
  toggle() {
    this.muted = !this.muted;
    $("muteBtn").textContent = this.muted ? "🔇" : "🔊";
    try { localStorage.setItem("mgf:mute", this.muted ? "1" : "0"); } catch (_) {}
  },
  // tone(周波数Hz, 長さ秒, 波形, 音量0-1, 終わりの周波数)
  tone(freq = 440, dur = 0.1, type = "square", vol = 0.15, slideTo = null) {
    if (!this.ctx || this.muted) return;
    try {
      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (_) {}
  },
  noise(dur = 0.2, vol = 0.2) {
    if (!this.ctx || this.muted) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); g.gain.value = vol;
      s.buffer = buf; s.connect(g).connect(this.ctx.destination); s.start();
    } catch (_) {}
  },
  // 用意済みの効果音: shot hit explode jump coin powerup hurt select clear over
  play(name) {
    const P = {
      shot: () => this.tone(880, 0.07, "square", 0.08, 440),
      hit: () => this.tone(220, 0.08, "square", 0.12, 110),
      explode: () => this.noise(0.35, 0.25),
      jump: () => this.tone(300, 0.15, "triangle", 0.18, 700),
      coin: () => { this.tone(988, 0.06, "square", 0.1); setTimeout(() => this.tone(1319, 0.12, "square", 0.1), 60); },
      powerup: () => this.tone(400, 0.3, "triangle", 0.18, 1200),
      hurt: () => this.tone(200, 0.25, "sawtooth", 0.15, 60),
      select: () => this.tone(660, 0.05, "square", 0.08),
      clear: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, "triangle", 0.18), i * 110)),
      over: () => [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.25, "triangle", 0.18), i * 180)),
    };
    (P[name] || P.select)();
  },
};
try { if (localStorage.getItem("mgf:mute") === "1") Sound.toggle(); } catch (_) {}

// ---------------- 画面サイズ ----------------
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let ctx2d = null, R3 = null;
function __layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  if (CFG.mode === "3d") {
    const ar = CFG.w / CFG.h;
    let w = sw, h = sw / ar;
    if (h > sh) { h = sh; w = sh * ar; }
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
    __G.W = CFG.w; __G.H = CFG.h;
    if (R3) { R3.renderer.setSize(w, h, false); if (api.camera && api.camera.isPerspectiveCamera) { api.camera.aspect = ar; api.camera.updateProjectionMatrix(); } }
  } else {
    const s = Math.min(sw / CFG.w, sh / CFG.h);
    canvas.style.width = CFG.w * s + "px"; canvas.style.height = CFG.h * s + "px";
    canvas.width = Math.round(CFG.w * s * DPR); canvas.height = Math.round(CFG.h * s * DPR);
    __G.W = CFG.w; __G.H = CFG.h;
    if (ctx2d) { ctx2d.setTransform(canvas.width / CFG.w, 0, 0, canvas.height / CFG.h, 0, 0); ctx2d.imageSmoothingEnabled = true; }
  }
  __viewRect = canvas.getBoundingClientRect();
}
window.addEventListener("resize", () => setTimeout(__layout, 50));
window.addEventListener("orientationchange", () => setTimeout(__layout, 200));

// ---------------- ゲームに渡す api ----------------
const api = {
  W: CFG.w, H: CFG.h, input: Input, sound: Sound, util: U, isTouch: IS_TOUCH,
  ctx: null,                               // 2D: CanvasRenderingContext2D
  THREE: null, scene: null, camera: null, renderer: null,   // 3D のみ
  time: 0,                                 // プレイ開始からの秒数
  get score() { return __G.score; },
  setScore(n) { __G.score = Math.floor(n) || 0; },
  addScore(n) { __G.score = Math.floor(__G.score + n) || 0; },
  gameOver() { __endGame("over"); },
  clear() { __endGame("clear"); },
  hud(text) { hudEl.textContent = text == null ? "" : String(text); },
};

// ---------------- 画面（タイトル / 結果 / 一時停止） ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function __best() { try { return +localStorage.getItem("mgf:best:" + META.id) || 0; } catch (_) { return 0; } }
function __saveBest(s) { try { if (s > __best()) localStorage.setItem("mgf:best:" + META.id, s); } catch (_) {} }
const START_HINT = IS_TOUCH ? "画面をタップしてスタート" : "クリック / スペースキーでスタート";

function __showTitle() {
  const ctl = (META.controls || {})[IS_TOUCH ? "スマホ" : "PC"] || "";
  const rules = (META.rules || []).map((r) => `<li>${esc(r)}</li>`).join("");
  overlay.innerHTML = `<div class="panel">
    <h1>${esc(META.title)}</h1><p>${esc(META.summary)}</p>
    <div class="box"><b>ルール</b><ul>${rules}</ul></div>
    <div class="box"><b>操作（${IS_TOUCH ? "スマホ" : "PC"}）</b><p>${esc(ctl)}</p></div>
    ${__best() ? `<p class="best">ベスト: ${__best()}</p>` : ""}
    <p class="blink" style="margin-top:10px;font-weight:700">${START_HINT}</p></div>`;
  overlay.classList.remove("hidden");
  __G.state = "title";
}
function __showResult(kind) {
  const best = __best();
  overlay.innerHTML = `<div class="panel">
    <h2>${kind === "clear" ? "クリア！" : "ゲームオーバー"}</h2>
    <div class="score">${__G.score}</div>
    <p class="best">ベスト: ${best}</p>
    <div><button class="btn" id="retryBtn" type="button">もう一度</button>
    <a class="btn sub" href="../index.html">一覧へ</a></div></div>`;
  overlay.classList.remove("hidden");
  $("retryBtn").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
}
overlay.addEventListener("pointerup", (ev) => {
  if (ev.target.closest && ev.target.closest("a,button")) return;
  Sound.unlock();
  if (__G.state === "title") startGame();
  else if (__G.paused) togglePause(false);
});

function togglePause(force) {

// ===== ここからゲーム固有のコード =====
const Game = {
  init(api) {
    this.api = api;
    this.stage = 1;
    this.maxStage = 5;
    this.lives = 3;
    this.particles = [];
    this.flipAnim = 0; // 反転演出用

  },

  resetStage(stg) {
    this.stage = stg;

    this.player = {
      x: 60,
      y: 60,
      vx: 0,

    };
    this.traps = [];
    this.scissors = [];
    this.holes = [];
    this.tapes = [];
    this.stickers = [];

    // ステージデータ生成

    } else if (stg === 2) {

        { x: 70, y: 410, taken: false },
        { x: 240, y: 240, taken: false },
        { x: 410, y: 410, taken: false }
      ];
      this.holes = [
        { x: 180, y: 150, w: 120, h: 40 },
        { x: 180, y: 290, w: 120, h: 40 }
      ];
      this.tapes = [
        { x: 140, y: 220, w: 200, h: 40 }
      ];
    } else if (stg === 3) {
      this.player.x = 70; this.player.y = 240;
      this.goal = { x: 410, y: 240, w: 36, h: 36, open: false };
      this.stickers = [
        { x: 160, y: 100, taken: false },
        { x: 160, y: 380, taken: false },
        { x: 320, y: 100, taken: false },
        { x: 320, y: 380, taken: false }
      ];
      this.scissors = [
        { x: 160, y: 240, vx: 0, vy: 140, min: 90, max: 390, len: 30 },
        { x: 320, y: 240, vx: 0, vy: -140, min: 90, max: 390, len: 30 }
      ];
      this.traps = [
        { x: 240, y: 240, r: 14 }
      ];
    } else if (stg === 4) {
      this.player.x = 70; this.player.y = 70;
      this.goal = { x: 240, y: 240, w: 36, h: 36, open: false };
      this.stickers = [
        { x: 410, y: 70, taken: false },
        { x: 410, y: 410, taken: false },
        { x: 70, y: 410, taken: false },
        { x: 240, y: 120, taken: false }
      ];
      this.holes = [
        { x: 150, y: 150, w: 70, h: 70 },
        { x: 260, y: 260, w: 70, h: 70 }
      ];
      this.scissors = [
        { x: 240, y: 380, vx: 160, vy: 0, min: 100, max: 380, len: 26 }
      ];
      this.traps = [
        { x: 260, y: 150, r: 12 },
        { x: 150, y: 260, r: 12 }
      ];
    } else {
      // 5面 最終決戦
      this.player.x = 70; this.player.y = 70;
      this.goal = { x: 410, y: 410, w: 36, h: 36, open: false };
      this.stickers = [
        { x: 240, y: 80, taken: false },
        { x: 80, y: 240, taken: false },
        { x: 400, y: 240, taken: false },
        { x: 240, y: 400, taken: false },
        { x: 240, y: 240, taken: false }
      ];
      this.holes = [
        { x: 130, y: 130, w: 60, h: 60 },
        { x: 290, y: 290, w: 60, h: 60 }
      ];
      this.scissors = [
        { x: 240, y: 160, vx: 180, vy: 0, min: 100, max: 380, len: 28 },
        { x: 240, y: 320, vx: -180, vy: 0, min: 100, max: 380, len: 28 }
      ];
      this.traps = [
        { x: 160, y: 240, r: 12 },
        { x: 320, y: 240, r: 12 }

        { x: 200, y: 200, w: 80, h: 80 }
      ];
    }

    this.totalStickers = this.stickers.length;
  },

  triggerFlip() {
    if (this.gravity.x === 0 && this.gravity.y === 0) return;
    this.gravity.x *= -1;
    this.gravity.y *= -1;
    this.flipAnim = 0.25;
    this.api.sound.tone(600, 0.08, 'triangle', 0.4, 250);
    // 反転エフェクト
    for (let i = 0; i < 8; i++) {
      this.particles.push({
        x: this.player.x,
        y: this.player.y,
        vx: (Math.random() - 0.5) * 160,
        vy: (Math.random() - 0.5) * 160,
        size: 5,
        color: '#e74c3c',
        life: 0.3
      });
    }
  },

  update(dt) {
    const inp = this.api.input;
    this.stageTimer += dt;
    if (this.player.invuln > 0) this.player.invuln -= dt;
    if (this.flipAnim > 0) this.flipAnim -= dt;

    // 入力受付（スワイプ/キーで重力指定）
    let dirChanged = false;
    if (inp.swipe === 'left' || inp.leftPressed) {
      this.gravity = { x: -650, y: 0 }; dirChanged = true;
    } else if (inp.swipe === 'right' || inp.rightPressed) {
      this.gravity = { x: 650, y: 0 }; dirChanged = true;
    } else if (inp.swipe === 'up' || inp.upPressed) {
      this.gravity = { x: 0, y: -650 }; dirChanged = true;
    } else if (inp.swipe === 'down' || inp.downPressed) {
      this.gravity = { x: 0, y: 650 }; dirChanged = true;
    }

    if (dirChanged) {
      this.api.sound.tone(440, 0.04, 'sine', 0.2, 580);
    }

    // タップ/クリックで重力反転！
    if (inp.tap || inp.aPressed) {
      this.triggerFlip();
    }

    // ハサミの移動
    for (const sc of this.scissors) {
      sc.x += sc.vx * dt;
      sc.y += sc.vy * dt;
      if (sc.vx > 0 && sc.x > sc.max) { sc.x = sc.max; sc.vx *= -1; }
      if (sc.vx < 0 && sc.x < sc.min) { sc.x = sc.min; sc.vx *= -1; }
      if (sc.vy > 0 && sc.y > sc.max) { sc.y = sc.max; sc.vy *= -1; }
      if (sc.vy < 0 && sc.y < sc.min) { sc.y = sc.min; sc.vy *= -1; }
    }

    // プレイヤーの移動
    if (this.player.alive) {
      // マステ上では速度と加速を減衰
      let inTape = false;
      for (const t of this.tapes) {
        if (this.player.x > t.x && this.player.x < t.x + t.w &&
            this.player.y > t.y && this.player.y < t.y + t.h) {
          inTape = true;
          break;
        }
      }

      const friction = inTape ? 0.88 : 0.96;
      const gScale = inTape ? 0.35 : 1.0;

      this.player.vx += this.gravity.x * gScale * dt;
      this.player.vy += this.gravity.y * gScale * dt;
      this.player.vx *= Math.pow(friction, dt * 60);
      this.player.vy *= Math.pow(friction, dt * 60);

      // 最高速クランプ
      const maxSpeed = inTape ? 140 : 340;
      const spd = Math.hypot(this.player.vx, this.player.vy);
      if (spd > maxSpeed) {
        this.player.vx = (this.player.vx / spd) * maxSpeed;
        this.player.vy = (this.player.vy / spd) * maxSpeed;
      }

      this.player.x += this.player.vx * dt;
      this.player.y += this.player.vy * dt;
      this.player.angle += (this.player.vx * 0.015);

      // 外壁とのバウンド
      const minB = 34;
      const maxB = 446;
      if (this.player.x < minB + this.player.r) {
        this.player.x = minB + this.player.r;
        this.player.vx *= -0.4;
      }
      if (this.player.x > maxB - this.player.r) {
        this.player.x = maxB - this.player.r;
        this.player.vx *= -0.4;
      }
      if (this.player.y < minB + this.player.r) {
        this.player.y = minB + this.player.r;
        this.player.vy *= -0.4;
      }
      if (this.player.y > maxB - this.player.r) {
        this.player.y = maxB - this.player.r;
        this.player.vy *= -0.4;
      }

      // シール回収
      let remaining = 0;
      for (const s of this.stickers) {
        if (!s.taken) {
          if (this.api.util.dist(this.player.x, this.player.y, s.x, s.y) < this.player.r + 10) {
            s.taken = true;
            this.api.addScore(100);
            this.api.sound.play('coin');
            // キラキラ紙吹雪
            for (let i = 0; i < 14; i++) {
              this.particles.push({
                x: s.x,
                y: s.y,
                vx: (Math.random() - 0.5) * 200,
                vy: (Math.random() - 0.5) * 200,
                size: 4 + Math.random() * 4,
                color: this.api.util.choice(['#f1c40f', '#f39c12', '#ffffff', '#e67e22']),
                life: 0.5
              });
            }
          } else {
            remaining++;
          }
        }
      }

      // 全回収でのりしろゴール解禁
      if (remaining === 0 && !this.goal.open) {
        this.goal.open = true;
        this.api.sound.play('powerup');
      }

      // ゴール判定
      if (this.goal.open) {
        const gx = this.goal.x + this.goal.w / 2;
        const gy = this.goal.y + this.goal.h / 2;
        if (this.api.util.dist(this.player.x, this.player.y, gx, gy) < 22) {
          this.api.sound.play('clear');
          this.api.addScore(500);
          if (this.stage < this.maxStage) {
            this.resetStage(this.stage + 1);
          } else {
            this.api.clear();
          }
          return;
        }
      }

      // トラップ判定（画鋲）
      if (this.player.invuln <= 0) {
        for (const tr of this.traps) {
          if (this.api.util.dist(this.player.x, this.player.y, tr.x, tr.y) < this.player.r + tr.r - 2) {
            this.miss();
            break;
          }
        }
      }

      // トラップ判定（ハサミ）
      if (this.player.invuln <= 0) {
        for (const sc of this.scissors) {
          if (this.api.util.dist(this.player.x, this.player.y, sc.x, sc.y) < this.player.r + 14) {
            this.miss();
            break;
          }
        }
      }

      // トラップ判定（穴）
      if (this.player.invuln <= 0) {
        for (const h of this.holes) {
          if (this.player.x > h.x && this.player.x < h.x + h.w &&
              this.player.y > h.y && this.player.y < h.y + h.h) {
            this.miss();
            break;
          }
        }
      }
    }

    // パーティクル更新
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  },

  miss() {
    this.api.sound.play('hurt');
    this.lives--;
    for (let i = 0; i < 20; i++) {
      this.particles.push({
        x: this.player.x,
        y: this.player.y,
        vx: (Math.random() - 0.5) * 260,
        vy: (Math.random() - 0.5) * 260,
        size: 6,
        color: '#e74c3c',
        life: 0.6
      });
    }
    if (this.lives <= 0) {
      this.api.sound.play('over');
      this.api.gameOver();
    } else {
      this.resetStage(this.stage);
    }
  },

  draw(ctx) {
    const W = this.api.W;
    const H = this.api.H;

    // ダンボール縁とクラフトボード背景
    ctx.fillStyle = '#bfa17a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f8f4e6';
    ctx.fillRect(24, 24, W - 48, H - 48);

    // 方眼紙グリッド
    ctx.strokeStyle = 'rgba(74, 144, 226, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 32; x < W - 32; x += 24) {
      ctx.moveTo(x, 24); ctx.lineTo(x, H - 24);
    }
    for (let y = 32; y < H - 32; y += 24) {
      ctx.moveTo(24, y); ctx.lineTo(W - 24, y);
    }
    ctx.stroke();

    // 台紙の切り抜き穴
    for (const h of this.holes) {
      ctx.fillStyle = '#423428';
      ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.strokeStyle = '#2b2118';
      ctx.lineWidth = 2;
      ctx.strokeRect(h.x, h.y, h.w, h.h);
    }

    // マスキングテープ
    for (const t of this.tapes) {
      ctx.fillStyle = 'rgba(26, 188, 156, 0.35)';
      ctx.fillRect(t.x, t.y, t.w, t.h);
      ctx.strokeStyle = 'rgba(22, 160, 133, 0.6)';
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(t.x, t.y, t.w, t.h);
      ctx.setLineDash([]);
    }

    // のりしろゴール
    ctx.save();
    ctx.translate(this.goal.x, this.goal.y);
    if (this.goal.open) {
      ctx.fillStyle = '#ffeaa7';
      ctx.fillRect(0, 0, this.goal.w, this.goal.h);
      ctx.strokeStyle = '#e17055';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, this.goal.w, this.goal.h);
      ctx.fillStyle = '#d63031';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GOAL', this.goal.w / 2, this.goal.h / 2 + 3);
    } else {
      ctx.strokeStyle = '#b2bec3';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(0, 0, this.goal.w, this.goal.h);
      ctx.setLineDash([]);
      ctx.fillStyle = '#b2bec3';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('のりしろ', this.goal.w / 2, this.goal.h / 2 + 3);
    }
    ctx.restore();

    // 金箔シール（星）
    for (const s of this.stickers) {
      if (s.taken) continue;
      ctx.save();
      ctx.translate(s.x, s.y);
      const pulse = 1 + Math.sin(this.stageTimer * 6) * 0.15;
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * 9, -Math.sin((18 + i * 72) * Math.PI / 180) * 9);
        ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * 4.5, -Math.sin((54 + i * 72) * Math.PI / 180) * 4.5);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // トラップ（画鋲）
    for (const tr of this.traps) {
      ctx.save();
      ctx.translate(tr.x, tr.y);
      ctx.fillStyle = '#d35400';
      ctx.beginPath();
      ctx.arc(0, 0, tr.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.arc(0, 0, tr.r * 0.6, 0, Math.PI * 2);
      ctx.fill();
      // 影
      ctx.fillStyle = '#2c3e50';
      ctx.beginPath();
      ctx.arc(2, 2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // トラップ（ハサミ）
    for (const sc of this.scissors) {
      ctx.save();
      ctx.translate(sc.x, sc.y);
      ctx.fillStyle = '#7f8c8d';
      ctx.beginPath();
      ctx.arc(-6, -6, 5, 0, Math.PI * 2);
      ctx.arc(-6, 6, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#bdc3c7';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-6, -6); ctx.lineTo(12, 4);
      ctx.moveTo(-6, 6); ctx.lineTo(12, -4);
      ctx.stroke();
      ctx.restore();
    }

    // プレイヤー（折り紙の風船）
    if (this.player.alive) {
      ctx.save();
      ctx.translate(this.player.x, this.player.y);
      ctx.rotate(this.player.angle);

      // 反転中のスケール演出
      if (this.flipAnim > 0) {
        const sx = Math.cos((1 - this.flipAnim / 0.25) * Math.PI);
        ctx.scale(sx, 1);
      }

      // 点滅（無敵中）
      if (this.player.invuln > 0 && Math.floor(this.stageTimer * 16) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      // 折り紙グラデ
      const grad = ctx.createLinearGradient(-12, -12, 12, 12);
      grad.addColorStop(0, '#ff7675');
      grad.addColorStop(1, '#d63031');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(12, 0);
      ctx.lineTo(0, 12);
      ctx.lineTo(-12, 0);
      ctx.closePath();
      ctx.fill();

      // 折り目ライン
      ctx.strokeStyle = '#fab1a0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
      ctx.moveTo(0, -12); ctx.lineTo(0, 12);
      ctx.stroke();

      ctx.restore();
    }

    // パーティクル
    for (const p of this.particles) {
      ctx.save();
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    }

    // HUD: ステージ、重力インジケータ、残機、スコア
    ctx.fillStyle = '#2d3436';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`STAGE ${this.stage}/${this.maxStage}`, 32, 18);
    ctx.textAlign = 'center';
    let gStr = '重力: なし(スワイプで指定)';
    if (this.gravity.x > 0) gStr = '重力: 右 → (タップで反転)';
    if (this.gravity.x < 0) gStr = '重力: ← 左 (タップで反転)';
    if (this.gravity.y > 0) gStr = '重力: 下 ↓ (タップで反転)';
    if (this.gravity.y < 0) gStr = '重力: ↑ 上 (タップで反転)';
    ctx.fillText(gStr, W / 2, 18);

    ctx.textAlign = 'right';
    let lifeIcons = '';
    for (let i = 0; i < this.lives; i++) lifeIcons += '■ ';
    ctx.fillStyle = '#e74c3c';
    ctx.fillText(`紙: ${lifeIcons}`, W - 32, 18);

    ctx.fillStyle = '#2d3436';
    ctx.fillText(`SCORE: ${this.api.score}`, W - 32, H - 8);
  }
};
// ===== ここまで =====
__boot(typeof Game !== "undefined" ? Game : null);
</script>
