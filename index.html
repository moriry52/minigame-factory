<script>
const GAMES = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { v: null, c: null, m: null, q: "", sort: "new", seed: Math.random() };
GAMES.forEach((g) => { g.label = g.label || g.profile || "（不明）"; });
const MULTI = new Set(GAMES.map((g) => g.label)).size > 1;
try { Object.assign(state, JSON.parse(localStorage.getItem("mgf:index") || "{}"), { seed: Math.random() }); } catch (_) {}
const save = () => { try { localStorage.setItem("mgf:index", JSON.stringify({ v: state.v, c: state.c, m: state.m, sort: state.sort })); } catch (_) {} };
const NEWEST = GAMES.map((g) => g.created).sort().slice(-3);

const val = (g, axis) => axis === "モデル" ? g.label : g.tags[axis];
function chips(el, axis, key) {
  const vals = [...new Set(GAMES.map((g) => val(g, axis)))];
  el.innerHTML = [`<button class="chip ${state[key] ? "" : "on"}" data-v="">すべての${axis}</button>`]
    .concat(vals.map((v) => `<button class="chip ${state[key] === v ? "on" : ""}" data-v="${esc(v)}">${esc(v)} <span style="opacity:.6">${GAMES.filter((g) => val(g, axis) === v).length}</span></button>`)).join("");
  el.onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; state[key] = b.dataset.v || null; save(); render(); };
}
function hash(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return h; }
function render() {
  chips($("f1"), "視点", "v"); chips($("f2"), "核", "c");
  if (MULTI) chips($("f3"), "モデル", "m"); else $("f3").style.display = "none";
  $("sort").value = state.sort;
  const q = state.q.trim().toLowerCase();
  let list = GAMES.filter((g) => (!state.v || g.tags["視点"] === state.v) && (!state.c || g.tags["核"] === state.c) && (!state.m || g.label === state.m)
    && (!q || (g.title + g.summary + Object.values(g.tags).join(" ")).toLowerCase().includes(q)));
  if (state.sort === "new") list.sort((a, b) => b.created.localeCompare(a.created));
  else if (state.sort === "fun") list.sort((a, b) => (b.review?.fun_score || 0) - (a.review?.fun_score || 0));
  else list.sort((a, b) => hash(a.id + state.seed) - hash(b.id + state.seed));
  $("count").textContent = `全 ${GAMES.length} 本` + (list.length !== GAMES.length ? ` ／ 表示中 ${list.length} 本` : "");
  $("list").innerHTML = list.length ? list.map((g) => `
    <article class="card" data-id="${esc(g.id)}" tabindex="0">
      <div class="thumb" style="background-image:url('games/${esc(g.id)}.png')">${NEWEST.includes(g.created) ? '<span class="new">NEW</span>' : ""}</div>
      <div class="body">
        <div class="title">${esc(g.title)}</div>
        <div class="summary">${esc(g.summary)}</div>
        <div class="tags"><span class="tag v">${esc(g.tags["視点"])}</span><span class="tag c">${esc(g.tags["核"])}</span>
          ${g.tags["ひねり"] !== "なし" ? `<span class="tag">${esc(g.tags["ひねり"])}</span>` : ""}<span class="tag">${esc(g.tags["操作"])}</span>${MULTI ? `<span class="tag m">${esc(g.label)}</span>` : ""}</div>
      </div>
    </article>`).join("") : `<div class="empty">${GAMES.length ? "条件に合うゲームがありません" : "まだゲームがありません。run.py を実行するとここに並びます。"}</div>`;
}
function open(id) {
  const g = GAMES.find((x) => x.id === id); if (!g) return;
  const stars = g.review?.fun_score ? "★".repeat(g.review.fun_score) + "☆".repeat(5 - g.review.fun_score) : "";
  $("sheet").innerHTML = `
    <div class="thumb" style="background-image:url('games/${esc(g.id)}.png')"></div>
    <div class="in">
      <h2>${esc(g.title)}</h2>
      <p>${esc(g.summary)}</p>
      <div class="tags" style="margin-top:8px">${Object.entries(g.tags).map(([k, v]) => `<span class="tag" title="${esc(k)}">${esc(v)}</span>`).join("")}</div>
      <div class="sec"><b>ルール</b><ul>${(g.rules || []).map((r) => `<li>${esc(r)}</li>`).join("")}</ul></div>
      <div class="sec"><b>操作</b><ul><li>スマホ：${esc(g.controls?.["スマホ"])}</li><li>PC：${esc(g.controls?.["PC"])}</li></ul></div>
      <div class="meta">プレイ時間 ${esc(g.playTime || "")} ・ 作成 ${esc(g.created.replace("T", " ").slice(0, 16))} ・ モデル ${esc(g.label)}${g.fixes ? `（修正${g.fixes}回）` : ""}${stars ? ` ・ AI評価 ${stars}` : ""}</div>
      ${g.review?.comment ? `<div class="meta">AI講評：${esc(g.review.comment)}</div>` : ""}
      <div class="actions"><a class="btn" href="games/${esc(g.id)}.html">▶ 遊ぶ</a><button class="btn sub" id="closeBtn">閉じる</button></div>
    </div>`;
  $("closeBtn").onclick = () => $("dlg").close();
  $("dlg").showModal();
}
$("list").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) open(c.dataset.id); });
$("list").addEventListener("keydown", (e) => { const c = e.target.closest(".card"); if (c && e.key === "Enter") open(c.dataset.id); });
$("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });
$("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; state.seed = Math.random(); save(); render(); });
render();
</script>
